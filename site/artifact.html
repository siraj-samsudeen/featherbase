ration 0039: \u003ccode>Translation\u003c/code> DocType (language, source_text, translated_text) with a unique (language, source_text) index. \u003ccode>i18n.ts\u003c/code>: \u003ccode>getCatalog(lang)\u003c/code> builds a source→translated map (empty for 'en'); \u003ccode>t(text, catalog)\u003c/code> looks up with source fallback.\u003c/li>\u003cli>Endpoints: \u003ccode>GET /api/translations/:lang\u003c/code> (catalog), \u003ccode>POST /api/set_language\u003c/code> (per-user, validated code); whoami now returns \u003ccode>language\u003c/code>.\u003c/li>\u003cli>Web \u003ccode>lib/i18n.ts\u003c/code>: \u003ccode>useI18n()\u003c/code> reads the user's language from whoami, fetches the catalog, and returns \u003ccode>t()\u003c/code> + \u003ccode>setLanguage\u003c/code>. Wrapped chrome (form Save button, navbar Log out) and FIELD LABELS (FieldControl) in \u003ccode>t()\u003c/code>. A language switcher (EN/FR/ES) sits in the navbar.\u003c/li>\u003cli>Verified: e2e (switch to fr → navbar \"Log out\"→\"Déconnexion\", form Save→ \"Enregistrer\", a field labelled \"Priority\"→\"Priorité\"; switching back to en reverts) + server test (catalog build, en-empty, t() fallback, HTTP catalog, per-user language persistence + bad-code 417). 280 server + 58 web e2e green. 112/126. Unblocks \u003ca class=\"fid-link\" href=\"#/f/I18N-002\">I18N-002\u003c/a>.\u003c/li>\u003cli>Also hardened the \u003ca class=\"fid-link\" href=\"#/f/JOB-005\">JOB-005\u003c/a> progress test to filter events by the specific job name (the shared job queue can hold other files' jobs).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-job-005-passing-long-job-progress-over-realtime\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/JOB-005\">JOB-005\u003c/a> passing: long-job progress over realtime\u003c/h2>\n\u003cul>\u003cli>Job handlers now receive a \u003ccode>JobContext\u003c/code> with \u003ccode>setProgress(percent, message)\u003c/code>; the worker wires it to \u003ccode>publishUserEvent(&lt;job owner&gt;, 'job_progress', {job, method, percent, message})\u003c/code> (percent clamped 0–100, rounded). Existing handlers ignore the new arg (backward-compatible). Demo job \u003ccode>src/jobs/demo-progress.ts\u003c/code> reports 5 steps → 20/40/60/80/100%.\u003c/li>\u003cli>Web JobMonitor: a \"Run demo job\" button enqueues demo_progress and subscribes to the user channel; a live progress bar (\u003ccode>demo-progress\u003c/code>) climbs to 100% as \u003ccode>job_progress\u003c/code> events arrive.\u003c/li>\u003cli>Verified: e2e (click Run demo job → progress bar reaches 100% with the final step message, driven purely by realtime) + server test (setProgress calls arrive as job_progress events on user:Administrator with the right percents; values clamped/rounded). 275 server + 57 web e2e green. 111/126.\u003c/li>\u003cli>Gotcha: after adding a new src/jobs/*.ts file, tsx-watch didn't always reload it cleanly — a stale server kept \"No handler registered\". A hard restart (kill :8000, \u003ccode>pnpm dev\u003c/code>) fixed it; init.sh's clean boot handles this normally.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-job-004-passing-job-monitoring-ui-retry\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/JOB-004\">JOB-004\u003c/a> passing: job monitoring UI + retry\u003c/h2>\n\u003cul>\u003cli>\u003ccode>retryJob(name)\u003c/code> in jobs.ts re-queues a FAILED job (status→queued, attempts→0, error cleared, run_at=now) so the running worker picks it up; returns false for a non-failed/missing job. \u003ccode>POST /api/retry_job\u003c/code> (System-Manager-gated) exposes it (417 for a non-failed job). Added a no-op \u003ccode>ping_job\u003c/code> (src/jobs/ ping.ts) as a benign demo/health job.\u003c/li>\u003cli>Web \u003ccode>JobMonitor\u003c/code> + route \u003ccode>/desk/jobs\u003c/code>: a live table (3s refetch) of Background Jobs (method/status/attempts/error), with a Retry button only on failed rows; clicking it calls retry and refetches.\u003c/li>\u003cli>Verified: e2e (a seeded failed ping_job shows in the monitor with Retry; clicking Retry flips it to done and the button disappears) + server test (retry re-queues and drains to done; non-failed job not retried; HTTP retry 200 then 417 on the now-done job). 273 server + 56 web e2e green. 110/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-cust-004-re-passing-sandbox-escape-closed\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/CUST-004\">CUST-004\u003c/a> re-passing: sandbox escape closed\u003c/h2>\n\u003cul>\u003cli>Rewrote the \u003ccode>node:vm\u003c/code> sandbox to expose NO host objects. All inputs/outputs cross the boundary as JSON string PRIMITIVES: \u003ccode>doc\u003c/code>/\u003ccode>args\u003c/code> are injected as a JSON string and \u003ccode>JSON.parse\u003c/code>d INSIDE the context (context-native), \u003ccode>frappe\u003c/code>/ \u003ccode>console\u003c/code> are defined inside the context, and NO host built-ins are injected (the fresh context has its own). Document-event scripts merge back only the fields they changed (system fields keep native host values). API scripts return their \u003ccode>result\u003c/code> round-tripped through JSON.\u003c/li>\u003cli>Now \u003ccode>Object\u003c/code>, \u003ccode>Function\u003c/code>, \u003ccode>[].constructor.constructor\u003c/code>, \u003ccode>this\u003c/code>, \u003ccode>globalThis\u003c/code> all resolve to context-native values, so \u003ccode>process\u003c/code>/\u003ccode>require\u003c/code>/\u003ccode>fetch\u003c/code> are undefined. Verified every escape vector from the eval is closed: \u003ccode>Object.constructor(\"return process.pid\")()\u003c/code> → \"process is not defined\"; \u003ccode>this.constructor…\u003c/code> → no-this (strict mode); \u003ccode>(function(){}).constructor( \"return typeof process\")()\u003c/code> → \"undefined\"; \u003ccode>globalThis.process\u003c/code> → undefined. Functionality intact: reject-negative → 417, field-set → 'big', API double(21) → 42, runaway loop → timeout. Server test adds explicit escape assertions.\u003c/li>\u003cli>270 server + CUST e2e green. 109/126 (\u003ca class=\"fid-link\" href=\"#/f/CUST-004\">CUST-004\u003c/a> back to passing).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-13-adversarial-cust-004-sandbox-e\">2026-07-16 — Evaluation pass #13 (adversarial) — \u003ca class=\"fid-link\" href=\"#/f/CUST-004\">CUST-004\u003c/a> sandbox ESCAPE\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/CUST-004\">CUST-004\u003c/a> → FAILING.\u003c/strong> The node:vm sandbox is escapable, so it does NOT \"block filesystem/network/process access\" as the verify requires. Reproduction: create an API Server Script with \u003ccode>result = Object.constructor(\"return process.pid\")()\u003c/code> and call it via \u003ccode>POST /api/server_script/&lt;method&gt;\u003c/code> → returns a real host PID (observed 3149). Root cause: \u003ccode>server-scripts.ts\u003c/code> injects HOST built-ins (Object, Array, String, JSON, Math, …) into the vm context; a host built-in's \u003ccode>.constructor\u003c/code> is the HOST \u003ccode>Function\u003c/code>, and \u003ccode>hostFunction(\"return process\")()\u003c/code> executes in the HOST realm, reaching \u003ccode>process\u003c/code> (and from there require/fs/network). Any host object reachable from the script (including \u003ccode>doc\u003c/code>, \u003ccode>frappe\u003c/code>, \u003ccode>console\u003c/code>) leaks the same way via its constructor chain. Expected: process/require/fetch unreachable. Actual: reachable. Fix direction (next coder step): never expose host objects to the script — pass \u003ccode>doc\u003c/code>/\u003ccode>args\u003c/code> in as JSON string primitives, \u003ccode>JSON.parse\u003c/code> them INSIDE the context (context-native), define \u003ccode>frappe\u003c/code>/\u003ccode>console\u003c/code> inside the context, inject NO host built-ins (the fresh context already has its own), and read results back as a JSON string. Then \u003ccode>Object.constructor\u003c/code> resolves to the CONTEXT's Function, which runs in the context where \u003ccode>process\u003c/code> is undefined.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/CUST-003\">CUST-003\u003c/a> (client scripts) and \u003ca class=\"fid-link\" href=\"#/f/CUST-005\">CUST-005\u003c/a> (export/import) held: \u003ca class=\"fid-link\" href=\"#/f/CUST-005\">CUST-005\u003c/a> empty bundle → 0/0, garbage custom field (unknown DocType) → clean 417 (no 500); \u003ca class=\"fid-link\" href=\"#/f/CUST-003\">CUST-003\u003c/a> endpoints reachable and e2e-verified. No other flips.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-cust-005-passing-export-import-customizations-as-\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/CUST-005\">CUST-005\u003c/a> passing: export/import customizations as JSON\u003c/h2>\n\u003cul>\u003cli>\u003ccode>customizations.ts\u003c/code>: \u003ccode>exportCustomizations(doctype)\u003c/code> returns a JSON bundle of the DocType's Custom Fields + Property Setters; \u003ccode>importCustomizations(bundle)\u003c/code> recreates each through saveDoc (so the Custom Field controller re-materializes the column and Property Setters re-apply via getMeta), skipping any that already exist (idempotent). Custom Field / Property Setter are prompt-autoname DocTypes, so import supplies deterministic names (\u003ccode>dt-fieldname\u003c/code>, \u003ccode>doctype-field-property\u003c/code>).\u003c/li>\u003cli>Endpoints (System-Manager-gated): \u003ccode>GET /api/export_customizations/:doctype\u003c/code> and \u003ccode>POST /api/import_customizations\u003c/code>.\u003c/li>\u003cli>Verified: HTTP + server test — export a Select custom field + a reqd property setter, delete both (meta loses them), import (counts 1/1), meta regains the field with its options AND the backing column, title becomes reqd again; re-import is a no-op (0/0); non-System-Manager export → 403. 269 server tests green. 109/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-cust-003-passing-client-scripts-form-event-hooks\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/CUST-003\">CUST-003\u003c/a> passing: Client Scripts (form-event hooks)\u003c/h2>\n\u003cul>\u003cli>Migration 0038: \u003ccode>Client Script\u003c/code> DocType (reference_doctype, script, enabled).\u003c/li>\u003cli>Web \u003ccode>lib/client-scripts.ts\u003c/code>: fetches enabled scripts for a DocType and evaluates each (\u003ccode>new Function('frappe', src)\u003c/code>) against a minimal \u003ccode>frappe.ui.form.on(doctype, handlers)\u003c/code> API, collecting handlers keyed by fieldname / \u003ccode>onload\u003c/code> / \u003ccode>before_save\u003c/code>. Compile errors are captured, not thrown.\u003c/li>\u003cli>FormView wiring: a \u003ccode>valuesRef\u003c/code> mirrors live values so a handler always sees current data; \u003ccode>setField\u003c/code> fires the field's change handler with the updated doc; \u003ccode>onload\u003c/code> fires once when the form is ready; \u003ccode>before_save\u003c/code> fires before validation. Every handler runs in try/catch — an error shows in a dismissible \u003ccode>client-script-error\u003c/code> banner and never crashes the Desk (the form stays usable). \u003ccode>frm.set_value\u003c/code> cascades through setField.\u003c/li>\u003cli>Verified: e2e (a script auto-fills total = qty×10 on qty change, re-running each change; a script that throws surfaces the error while the form/Desk stay interactive). 55 web e2e green.\u003c/li>\u003cli>\u003cstrong>Test-infra fix:\u003c/strong> set \u003ccode>fileParallelism: false\u003c/code> in a new apps/server/vitest.config.ts. All test files share one Postgres DB — hence one \u003ccode>tab_background_job\u003c/code> queue — so parallel files' \u003ccode>drainJobs()\u003c/code> calls stole each other's jobs, flaking email/jobs/webhooks tests non-deterministically (a different one failed each run). Running files sequentially makes the 265-test suite deterministic (~60s). 108/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-cust-004-passing-sandboxed-server-scripts\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/CUST-004\">CUST-004\u003c/a> passing: sandboxed Server Scripts\u003c/h2>\n\u003cul>\u003cli>Migration 0037: \u003ccode>Server Script\u003c/code> DocType (script_type Document Event|API, reference_doctype, event validate|before_save|after_save, api_method, script, enabled).\u003c/li>\u003cli>\u003ccode>server-scripts.ts\u003c/code>: runs scripts in a fresh \u003ccode>node:vm\u003c/code> context whose only globals are \u003ccode>doc\u003c/code>, \u003ccode>frappe\u003c/code> (\u003ccode>.throw\u003c/code>), a no-op console, and the standard JS built-ins — require/process/fetch/Buffer/module are simply out of scope, so a script cannot touch the filesystem, network, or process (they resolve to ReferenceError). Execution is time-boxed to 500ms, so a runaway loop errors instead of hanging the server. \u003ccode>doc\u003c/code> is shared by reference, so a script can set fields; a throw / frappe.throw aborts the save.\u003c/li>\u003cli>\u003ccode>runDocEventScripts\u003c/code> wired into document.ts at validate/before_save/after_save in both save paths — CRUCIALLY it runs on the caller's TRANSACTION connection (\u003ccode>ctx.tx\u003c/code>), not the global pool: the first version queried the global pool inside the save txn and deadlocked under concurrent saves (naming.test's 50 parallel inserts hung). \u003ccode>POST /api/server_script/:method\u003c/code> runs API-type scripts.\u003c/li>\u003cli>Verified: HTTP + server test (validate rejects negatives / allows valid; before_save sets a field; sandbox blocks require/process/fetch; disabled script skipped; API script returns a value; runaway loop times out) + e2e (a form save blocked by a server script shows the error and the Desk stays live; a valid save goes through). 265 server + 53 web e2e green. 107/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-027-passing-workspaces-configurable-shortcut-h\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-027\">UI-027\u003c/a> passing: workspaces (configurable shortcut home pages)\u003c/h2>\n\u003cul>\u003cli>Migration 0036: \u003ccode>Workspace\u003c/code> DocType (label, icon, shortcuts JSON — \u003ccode>[{label, type, link_to}]\u003c/code>, type ∈ doctype/report/dashboard/url).\u003c/li>\u003cli>Web \u003ccode>WorkspaceView\u003c/code> + route \u003ccode>/desk/workspace/$name\u003c/code> renders each shortcut as a card; clicking navigates to the computed route (doctype→list, dashboard→/desk/dashboard, report→/desk/query-report, url→as-is). A \"Workspaces\" section in the Desk sidebar lists all Workspaces (only shows when any exist; DocTypes moved under a \"Doctypes\" heading).\u003c/li>\u003cli>Verified: e2e (open a workspace from the sidebar; its shortcuts list; a doctype shortcut opens that list, a dashboard shortcut opens that dashboard). Frontend-only over the generic doc API. 106/126.\u003c/li>\u003cli>Also hardened test/webhooks.test.ts against a pre-existing shared-job-queue flake (all test files share one Postgres queue, so another file's drainJobs can claim this file's deliver_webhook job — but its fetch still hits this worker's receiver): tests now clean webhooks per-test and poll for the expected hits instead of asserting right after drainJobs. Full suite now 259 server + 52 web e2e green across repeated runs.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-024-passing-dark-mode-with-per-user-preference\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-024\">UI-024\u003c/a> passing: dark mode with per-user preference\u003c/h2>\n\u003cul>\u003cli>Dark theme is pure token overrides: a \u003ccode>[data-theme='dark']\u003c/code> block in index.css redefines the \u003ccode>--color-*\u003c/code> variables, so every generic view re-skins with no per-component work. Switched the two hardcoded \u003ccode>bg-white\u003c/code> spots (fc-input/fc-btn) to \u003ccode>bg-[var(--color-surface)]\u003c/code> so controls adapt.\u003c/li>\u003cli>Migration 0035: \u003ccode>theme\u003c/code> (Select light/dark) on User. whoami now returns the theme; new \u003ccode>POST /api/set_theme\u003c/code> persists it per user (validated).\u003c/li>\u003cli>Web \u003ccode>lib/theme.ts\u003c/code>: applies the saved theme from localStorage at module load (no flash), syncs the authoritative value from whoami, and a navbar toggle (☀️/🌙 in DeskLayout) flips + persists it. localStorage mirrors the server value so a reload stays dark instantly.\u003c/li>\u003cli>Verified: e2e (toggle → html[data-theme=dark] + darker body background; server whoami reflects the choice per-user; survives reload) + server test (default light, per-user persistence not affecting Administrator, invalid value 417). 259 server + 51 web e2e green. 105/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-007-passing-audit-logs-activity-log-access-l\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-007\">PLAT-007\u003c/a> passing: audit logs (Activity Log + Access Log)\u003c/h2>\n\u003cul>\u003cli>Migration 0034: \u003ccode>Activity Log\u003c/code> (user, operation, full_name, ip_address) and \u003ccode>Access Log\u003c/code> (user, operation, reference_doctype/name, method) DocTypes.\u003c/li>\u003cli>\u003ccode>audit.ts\u003c/code>: \u003ccode>logActivity\u003c/code> / \u003ccode>logAccess\u003c/code> write directly (not saveDoc) with the user as owner — so a login can be recorded before a session exists and a user can't mutate the record of their own actions. Both stamp \u003ccode>creation\u003c/code>.\u003c/li>\u003cli>Hooks: \u003ccode>login()\u003c/code> writes an Activity Log 'login' row; the print endpoint (\u003ccode>/api/print\u003c/code>) writes an Access Log 'print' row; a new authed \u003ccode>POST /api/access_log\u003c/code> writes an 'export' row (requires READ on the exported DocType — you can only log an export of data you could read). ReportView's CSV/XLSX export calls it (fire-and-forget).\u003c/li>\u003cli>Verified: e2e (a UI login increments Activity Log 'login' rows; a CSV export from the report view increments Access Log 'export' rows for that DocType) + server test (login row w/ user+timestamp, export via endpoint, 403 for a non-readable DocType, direct writes owned by the user). 256 server + 49 web e2e green. 104/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-12-adversarial-website-platform-b\">2026-07-16 — Evaluation pass #12 (adversarial, website + platform batch)\u003c/h2>\n\u003cul>\u003cli>Re-drove the newest features end-to-end plus regressions. All held; no status flips, no product code changed.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/WEB-002\">WEB-002\u003c/a> (web forms):\u003c/strong> injection is structurally blocked — an anonymous submit with a smuggled \u003ccode>document_type: \"User\"\u003c/code> and \u003ccode>values\u003c/code> carrying \u003ccode>owner\u003c/code>/\u003ccode>docstatus\u003c/code>/\u003ccode>name\u003c/code>/\u003ccode>roles\u003c/code> created a doc in the CONFIGURED DocType (Ev12 Lead), with owner=Administrator, docstatus=0, a generated name; NO User was created and the non-whitelisted fields were dropped. Works on a second DocType generically. Caveats (hardening, not failures): (a) a form that excludes a REQUIRED field of the target DocType can never submit (every submit 417s) — should be validated at Web Form save time; (b) the public /api/web_form endpoints sit before the auth middleware so \u003ca class=\"fid-link\" href=\"#/f/API-007\">API-007\u003c/a> (per-user) doesn't throttle anonymous spam — a future IP-based limit; (c) creates as Administrator, so an admin who whitelists a privileged field on a sensitive DocType could enable escalation (mitigated: only whitelisted fields apply).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/PLAT-005\">PLAT-005\u003c/a> (webhooks):\u003c/strong> after_insert fires with a valid signature; a DISABLED webhook does not fire; a webhook pointing at a dead URL does NOT block the save (201 in ~29ms — delivery is async + retried).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/WEB-001\">WEB-001\u003c/a>:\u003c/strong> published page served publicly (200), flips to 404 on unpublish.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/RPT-005\">RPT-005\u003c/a>:\u003c/strong> run endpoint returns columns+rows.\u003c/li>\u003cli>Regressions: \u003ca class=\"fid-link\" href=\"#/f/RPT-004\">RPT-004\u003c/a> read-only guard blocks a DELETE query (417); \u003ca class=\"fid-link\" href=\"#/f/UI-026\">UI-026\u003c/a> dashboard count works; a bad login → 401.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-web-002-passing-public-web-forms\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/WEB-002\">WEB-002\u003c/a> passing: public web forms\u003c/h2>\n\u003cul>\u003cli>Migration 0033: \u003ccode>Web Form\u003c/code> DocType (title, unique route, document_type, web_fields [JSON whitelist of fieldnames], published, success_message).\u003c/li>\u003cli>\u003ccode>webform.ts\u003c/code>: \u003ccode>getWebFormConfig(route)\u003c/code> returns the whitelisted fields (label/type/reqd from the target DocType meta); \u003ccode>submitWebForm(route, values)\u003c/code> keeps ONLY whitelisted fields and creates the doc via the normal save lifecycle (as Administrator — a trusted server surface — but strictly limited to the configured DocType + fields), so reqd/type validation still applies.\u003c/li>\u003cli>Public endpoints (before auth): \u003ccode>GET /api/web_form/:route\u003c/code> (config) and \u003ccode>POST /api/web_form/:route\u003c/code> (submit). Anonymous.\u003c/li>\u003cli>Web \u003ccode>/form/$route\u003c/code> public page renders typed controls and submits; server validation errors show inline, success shows the configured message.\u003c/li>\u003cli>Verified: e2e (anonymous visitor: blank required field → validation error; full submit → success + the doc exists) + server test (whitelist exposure, non-whitelisted field dropped, required-field validation, unpublished form 404, session-less HTTP submit 201). 252 server + 48 web e2e green. 103/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-web-001-passing-public-server-rendered-web-pages\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/WEB-001\">WEB-001\u003c/a> passing: public server-rendered Web Pages\u003c/h2>\n\u003cul>\u003cli>Migration 0032: \u003ccode>Web Page\u003c/code> DocType (title, unique route, content [Long Text HTML], published). Module 'Website'.\u003c/li>\u003cli>\u003ccode>website.ts\u003c/code> \u003ccode>renderWebPage(route)\u003c/code> returns server-rendered HTML for a PUBLISHED page (title escaped; authored HTML content rendered in the body); unpublished/missing → a 404 page.\u003c/li>\u003cli>Public Hono route \u003ccode>GET /web/:route{.+}\u003c/code> (before the auth middleware) — no session required. Vite proxies \u003ccode>/web\u003c/code> → the server so the page is reachable on the app origin too.\u003c/li>\u003cli>Verified: e2e (a published page renders its content in a session-less browser and never redirects to login; an unpublished route is not served) + server test (render published/unpublished, HTTP 200/404 with no session, title escaping vs authored-HTML content). 247 server + 47 web e2e green. 102/126.\u003c/li>\u003cli>Opens the website block (\u003ca class=\"fid-link\" href=\"#/f/WEB-002\">WEB-002\u003c/a> web forms, \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a> portal).\u003c/li>\u003cli>Gotcha: the /web vite-proxy addition needed a web dev-server restart (vite reloads config automatically but the running instance had to pick it up).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-005-passing-webhooks-signed-retried\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-005\">PLAT-005\u003c/a> passing: webhooks (signed, retried)\u003c/h2>\n\u003cul>\u003cli>Migration 0031: \u003ccode>Webhook\u003c/code> DocType (webhook_doctype, webhook_event [after_insert/on_update/on_submit/on_cancel], request_url, webhook_secret, enabled).\u003c/li>\u003cli>\u003ccode>webhooks.ts\u003c/code>: \u003ccode>evaluateWebhooks(event, doctype, doc)\u003c/code> enqueues a \u003ccode>deliver_webhook\u003c/code> job (with a doc snapshot) per enabled matching webhook. The job POSTs the doc JSON with \u003ccode>X-Webhook-Signature\u003c/code> (HMAC-SHA256 of the body with the secret) + \u003ccode>X-Webhook-Event\u003c/code>; a non-2xx response throws so the job system retries (up to max_attempts) before landing in failed.\u003c/li>\u003cli>Wired post-commit into document.ts at all four lifecycle points (create → after_insert, update → on_update, submit/cancel via setDocstatus). Also awaited loadChildren at those return points (was returning the promise). Existing email-rule firing (submit/cancel only) is unchanged.\u003c/li>\u003cli>Verified: server test with a local HTTP receiver — on_update delivers the doc JSON with a signature that verifies against the body+secret; a receiver that 500s once is retried and then succeeds (job ends 'done'); a doctype with no matching webhook fires nothing. 243 server + 45 web e2e green. 101/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-rpt-005-passing-script-reports-server-side-ts-fil\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RPT-005\">RPT-005\u003c/a> passing: script reports (server-side TS + filters UI)\u003c/h2>\n\u003cul>\u003cli>\u003ccode>script-report.ts\u003c/code>: a registry of server-side report functions (\u003ccode>{ name, filters[], execute(filters,user) → {columns,rows} }\u003c/code>), loaded at boot from \u003ccode>src/reports/*.ts\u003c/code> (mirrors the controller loader). A Report of report_type 'Script Report' names its function in \u003ccode>report_script\u003c/code> (migration 0030 adds the field + the Select option).\u003c/li>\u003cli>Sample \u003ccode>reports/user-report.ts\u003c/code>: lists users via \u003ccode>getList\u003c/code> (permission-scoped) with an \u003ccode>enabled\u003c/code> Select filter.\u003c/li>\u003cli>Endpoints: \u003ccode>GET /api/script_report/:name\u003c/code> (declared filter defs, read-perm on the Report) and \u003ccode>POST /api/run_script_report\u003c/code>. A Report naming an unregistered script fails cleanly (ValidationError).\u003c/li>\u003cli>Web \u003ccode>ScriptReportView\u003c/code> + route \u003ccode>/desk/script-report/$name\u003c/code> renders a typed control per declared filter (Select/Check/Date/Int/Data) and the returned columns+rows; runs on load and on Run.\u003c/li>\u003cli>Verified: e2e (filter control + data columns render; filtering to disabled users changes the rows and drops Administrator) + server test (declared filters exposed, execute runs with filters, file-based sample scoped, unregistered script rejected). 240 server + 45 web e2e green. 100/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-api-007-passing-per-user-rate-limiting\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/API-007\">API-007\u003c/a> passing: per-user rate limiting\u003c/h2>\n\u003cul>\u003cli>\u003ccode>rate-limit.ts\u003c/code>: a fixed-window (60s) per-user counter middleware, wired on \u003ccode>/api/*\u003c/code> right after the auth middleware so it keys by the resolved user. Budget = the User's \u003ccode>api_rate_limit\u003c/code> (migration 0029; 0/unset → a high global default from \u003ccode>RATE_LIMIT_MAX\u003c/code>), cached ~5s to avoid a per-request DB hit.\u003c/li>\u003cli>Exceeding the budget returns \u003cstrong>429\u003c/strong> with a \u003cstrong>Retry-After\u003c/strong> header (seconds until the window resets) and a \u003ccode>RateLimitError\u003c/code> envelope. Other users are unaffected — only the throttled user's window fills.\u003c/li>\u003cli>\u003ccode>resetRateLimit(user?)\u003c/code> exported for tests/maintenance.\u003c/li>\u003cli>Verified: HTTP probe (budget 3 → reqs 1-3 = 200, 4-5 = 429 w/ Retry-After 11; admin unthrottled) + server test (budget exceed → 429 + Retry-After + RateLimitError; a second user stays 200). Global default (100k/min) keeps the 236 server + 44 web e2e suites green. 99/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-set-002-passing-user-management-password-reset\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/SET-002\">SET-002\u003c/a> passing: user management + password reset\u003c/h2>\n\u003cul>\u003cli>Migration 0028: \u003ccode>password_reset\u003c/code> table (token pk, user, expires_at) + a \u003ccode>user_image\u003c/code> (Attach Image) avatar field on User.\u003c/li>\u003cli>\u003ccode>password-reset.ts\u003c/code>: \u003ccode>requestPasswordReset(usr)\u003c/code> mints a single-use, 1-hour token, stores it, and mails a \u003ccode>/reset-password?key=…\u003c/code> link to the dev sink — but ONLY for a real, enabled account (returns null otherwise, so it can't enumerate users or mail disabled accounts). \u003ccode>resetPassword(key,pw)\u003c/code> validates + expiry-checks the token, sets the password, and consumes all of the user's tokens (single-use).\u003c/li>\u003cli>Public endpoints (before the auth middleware): \u003ccode>POST /api/reset_password_request\u003c/code> (always returns ok) and \u003ccode>POST /api/reset_password\u003c/code>.\u003c/li>\u003cli>Disabled login was already enforced (login + resolveToken both check \u003ccode>enabled\u003c/code>), so a disabled user cannot log in and an active session is cut off on its next request.\u003c/li>\u003cli>Web: \u003ccode>/reset-password\u003c/code> page (the emailed-link target — new password + confirm) and a \"Forgot password?\" flow on the login page. User profile/avatar edit through the generic FormView (user_image field).\u003c/li>\u003cli>Verified: e2e (forgot-password from the login UI → open the emailed link → set new password → log in with it; disabled user's login shows an error and stays on /login) + server test (token issue/reset, single-use, expiry, no token/mail for disabled or unknown accounts). 234 server + web e2e green. 98/126. All P2 features now complete.\u003c/li>\u003cli>Gotcha: e2e beforeAll must delete-then-create the test user — save_doc won't re-enable an existing (disabled) user without a modified stamp, which left the account disabled and the reset mail unsent.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-11-adversarial-focused-on-the-p2-\">2026-07-16 — Evaluation pass #11 (adversarial, focused on the P2 batch)\u003c/h2>\n\u003cul>\u003cli>Probed the security-sensitive features shipped this session. All held; no feature regressed to failing, no product code needed.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/RPT-004\">RPT-004\u003c/a> (SQL execution):\u003c/strong> a Query Report whose SQL is a valid \u003ccode>WITH x AS (INSERT … RETURNING …) SELECT\u003c/code> is blocked by the read-only transaction (\"cannot execute SELECT in a read-only transaction\") — the guard is the txn, not just the SELECT/WITH regex — and the injected user is never created. Filter values remain bound params (injection inert).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/FILE-003\">FILE-003\u003c/a> (signed URLs):\u003c/strong> a valid signature for file A pasted onto file B's path → 401 (the HMAC binds the exact path); expired → 401; outsider without read on the linked doc → 403.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/UI-026\">UI-026\u003c/a> (dashboard aggregates):\u003c/strong> an owner-scoped role sees only its own rows in both \u003ccode>countDocs\u003c/code> and \u003ccode>groupCount\u003c/code> (admin count 4, owner-user count 1; the owner-user's chart shows only their single doc) — no cross-owner leak; Guest (no read) → PermissionError.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/SET-003\">SET-003\u003c/a>:\u003c/strong> non-System-Manager → 403 on both read and write of the perm matrix; upsert never duplicates. \u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/SET-004\">SET-004\u003c/a>:\u003c/strong> /api/settings exposes only the display subset (no session_hours/time_zone).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-026-passing-dashboards-number-cards-bar-charts\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-026\">UI-026\u003c/a> passing: dashboards (number cards + bar charts)\u003c/h2>\n\u003cul>\u003cli>Refactored \u003ccode>query.ts\u003c/code> to extract \u003ccode>scopedWhere()\u003c/code> (the permission scope + owner/user-permission narrowing + filter building shared by list/count/ group). New \u003ccode>countDocs()\u003c/code> and \u003ccode>groupCount()\u003c/code> reuse it, so a dashboard widget can never show data the user couldn't list. groupCount returns {label, value} ordered by count desc.\u003c/li>\u003cli>Migration 0027: \u003ccode>Dashboard\u003c/code> DocType (label + JSON \u003ccode>config\u003c/code>: \u003ccode>{ cards:[{label,doctype,filters}], charts:[{label,doctype,group_by,filters}] }\u003c/code>).\u003c/li>\u003cli>Endpoints \u003ccode>POST /api/dashboard/count\u003c/code> and \u003ccode>/api/dashboard/chart\u003c/code>.\u003c/li>\u003cli>Web \u003ccode>DashboardView\u003c/code> + route \u003ccode>/desk/dashboard/$name\u003c/code>: number cards (big count) and CSS bar charts (width ∝ value/max), each fetched live per widget.\u003c/li>\u003cli>Verified: e2e (a board with All=6 / Open=3 cards and an Open3/Closed2/ Pending1 bar chart, all matching the seeded data) + server test (count, filtered count, grouped counts ordered, filter in groups, Guest→403). The getList refactor left all 230 server + 42 web e2e green. 97/126.\u003c/li>\u003cli>Unblocks \u003ca class=\"fid-link\" href=\"#/f/RPT-006\">RPT-006\u003c/a> (report charts pinned to dashboards) and \u003ca class=\"fid-link\" href=\"#/f/UI-027\">UI-027\u003c/a> (workspaces).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-set-003-passing-role-permission-manager-ui\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/SET-003\">SET-003\u003c/a> passing: role &amp; permission manager UI\u003c/h2>\n\u003cul>\u003cli>Endpoints (System-Manager-gated): \u003ccode>GET /api/permissions/:doctype\u003c/code> returns all roles + the DocPerm rows for the doctype at permlevel 0; \u003ccode>POST\u003c/code> upserts a single row per (doctype, role) — finds the existing row and updates through the save lifecycle (or creates one), so toggling never leaves duplicates.\u003c/li>\u003cli>Web \u003ccode>PermissionManager\u003c/code> + route \u003ccode>/desk/permissions/$doctype\u003c/code>: a roles×actions (Read/Write/Create/Delete/Submit/Cancel/Amend) checkbox matrix with a dirty-tracked Save. A \"Permissions\" link appears on every list header for System Managers (new \u003ccode>useIsSystemManager()\u003c/code> hook off /api/whoami).\u003c/li>\u003cli>Because permissionScope reads DocPerm live per request, a revoke takes effect immediately — no cache to bust.\u003c/li>\u003cli>Verified: e2e drives the UI to uncheck Write for a role and Save, then the role's user's update returns 403 (was 200), and the revoked state persists on reload; server test covers the SM gate (non-SM → 403 on read+write) and upsert-no-duplicate. 226 server + 41 web e2e green. 96/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-rpt-004-passing-query-reports-admin-sql-bound-fil\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RPT-004\">RPT-004\u003c/a> passing: query reports (admin SQL, bound filters, gated)\u003c/h2>\n\u003cul>\u003cli>Report DocType gains \u003ccode>report_type\u003c/code> (Report Builder | Query Report) and \u003ccode>query\u003c/code> (migration 0026 — adds both docfields AND the tab_report columns, since Report is a normal doctype; idempotent + repairs a missing column).\u003c/li>\u003cli>\u003ccode>src/query-report.ts\u003c/code>: \u003ccode>runQueryReport(name, filters, user)\u003c/code> loads the Report (read-permission enforced), requires report_type='Query Report', validates the SQL is a single SELECT/WITH, replaces \u003ccode>{name}\u003c/code> placeholders with \u003ccode>$n\u003c/code> BOUND params (never interpolated), and runs inside a \u003ccode>set transaction read only\u003c/code> block so a report can never write. Column names come from the result metadata so headers render even for 0 rows. Any DB/type error (e.g. a bad date filter value) is wrapped as a clean 417, never a 500.\u003c/li>\u003cli>Authoring gate (\u003ccode>controllers/report.ts\u003c/code>): a non-System-Manager — even one with full write on Report — is rejected (PermissionError) when creating a Query Report or changing an existing one's query. Report Builder reports are unaffected.\u003c/li>\u003cli>Endpoints: \u003ccode>POST /api/run_query_report\u003c/code> (run with filters) and \u003ccode>GET /api/query_report/:name\u003c/code> (returns filter names parsed from the SQL — the raw SQL is never sent to the client).\u003c/li>\u003cli>Web: \u003ccode>QueryReportView\u003c/code> + route \u003ccode>/desk/query-report/$name\u003c/code> — fetches filter names, renders an input per filter (date input for \u003cem>date\u003c/em> names), runs on load and on Run, shows a results table.\u003c/li>\u003cli>Verified: server test (bound date filter, future-date→0 rows, injection inert, read-only rejects UPDATE, authoring gate for create+edit) + e2e (date filter runs and renders in the browser; non-System-Manager blocked from authoring SQL). 223 server + 40 web e2e green. 95/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-004-passing-developer-cli-over-the-document-\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-004\">PLAT-004\u003c/a> passing: developer CLI over the document API\u003c/h2>\n\u003cul>\u003cli>\u003ccode>src/cli.ts\u003c/code> (\u003ccode>pnpm --filter server cli &lt;cmd&gt;\u003c/code>) with subcommands: \u003ccode>migrate\u003c/code>, \u003ccode>patches\u003c/code>, \u003ccode>seed\u003c/code>, \u003ccode>create-doctype\u003c/code>, \u003ccode>create-user\u003c/code>, \u003ccode>console\u003c/code>. A tiny flag parser handles \u003ccode>--key value\u003c/code> (repeatable → array), bare \u003ccode>--flags\u003c/code>, and positionals.\u003cul>\u003cli>\u003ccode>create-doctype --name \"X\" --field title:Data --field status:Select:Open|Closed [--single]\u003c/code> (pipe-separated Select options split to newlines).\u003c/li>\u003cli>\u003ccode>create-user &lt;email&gt; &lt;pwd&gt; [--full-name ..] [--roles \"A,B\"]\u003c/code> — creates the User through the normal save lifecycle + sets the password; login works.\u003c/li>\u003cli>\u003ccode>seed\u003c/code> re-applies the idempotent core seed migrations (0005/0006).\u003c/li>\u003cli>\u003ccode>console\u003c/code> — interactive REPL with sql/getDoc/saveDoc/getList/getMeta/ createDocType in scope; when stdin isn't a TTY it runs the piped script as an async function and AWAITS it (scriptable: \u003ccode>cli console &lt; script.js\u003c/code>).\u003c/li>\u003c/ul>\u003c/li>\u003cli>Refactored \u003ccode>migrate.ts\u003c/code> to export \u003ccode>runMigrations()\u003c/code> (no longer closes the connection) with an entry-point guard so importing it (from the CLI) has no side effect; standalone \u003ccode>pnpm migrate\u003c/code> (init.sh) still works.\u003c/li>\u003cli>Verified: all six commands run against the dev DB (create-user login confirmed via /api/login; console script prints Administrator); server test spawns the CLI as a subprocess and asserts DB effects for create-doctype, create-user, and console. 218 server tests green. 94/126.\u003c/li>\u003cli>Unblocks \u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a> (multi-tenancy per-site migrate/CLI).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-003-passing-ordered-recorded-patch-runner\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-003\">PLAT-003\u003c/a> passing: ordered, recorded patch runner\u003c/h2>\n\u003cul>\u003cli>New patch system distinct from the doctype-seed migrations: \u003ccode>src/patches.ts\u003c/code> (\u003ccode>runPatches\u003c/code>, \u003ccode>appliedPatches\u003c/code>, \u003ccode>ensurePatchLog\u003c/code>) records applied patches in a \u003ccode>patch_log\u003c/code> table and runs each unapplied patch — in registry order — inside a single transaction that also writes its log row, so a patch's changes and its \"applied\" record commit together or not at all.\u003c/li>\u003cli>A failing patch throws, rolling back its partial work AND its log entry, and aborts the run — prior patches stay applied, the failing one stays un-recorded so the next run retries it (verified: partial insert before a thrown error leaves no row and no log entry; re-run applies it once).\u003c/li>\u003cli>Registry: \u003ccode>patches/index.ts\u003c/code> (Frappe's patches.txt equivalent, append-only, names are stable). First real patch \u003ccode>0001_file_ref_index\u003c/code> adds a \u003ccode>tab_file (ref_doctype, ref_name)\u003c/code> index (speeds \u003ca class=\"fid-link\" href=\"#/f/FILE-002\">FILE-002\u003c/a>/003 lookups).\u003c/li>\u003cli>CLI \u003ccode>pnpm --filter server patches\u003c/code> (\u003ccode>src/run-patches.ts\u003c/code>), wired into init.sh after \u003ccode>migrate\u003c/code>. Verified: first run applies, second run is a no-op, index present; server test covers run-once/idempotency/clean-abort.\u003c/li>\u003cli>Unblocks \u003ca class=\"fid-link\" href=\"#/f/PLAT-004\">PLAT-004\u003c/a> (CLI) and \u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a> (multi-tenancy). 215 server tests green. 93/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-file-003-passing-private-files-gated-by-linked-do\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/FILE-003\">FILE-003\u003c/a> passing: private files gated by linked-doc permission + signed URLs\u003c/h2>\n\u003cul>\u003cli>Private files (\u003ccode>/private/files/:stored\u003c/code>) now enforce a permission check on the document they are attached to: \u003ccode>serveFile\u003c/code> looks up the File row's \u003ccode>ref_doctype\u003c/code>/\u003ccode>ref_name\u003c/code> and calls \u003ccode>getDoc(...)\u003c/code> as the requesting user, so a user without read on that document gets a 403 (previously any signed-in user could read any private file). Standalone private files (no ref) require read on the File doc itself.\u003c/li>\u003cli>Signed URLs (\u003ccode>storage.ts\u003c/code>): \u003ccode>signFileUrl()\u003c/code> mints a short-lived HMAC signature bound to the exact path + expiry (\u003ccode>?expires=..&amp;signature=..\u003c/code>); \u003ccode>verifyFileSignature()\u003c/code> timing-safe-compares and rejects expired/tampered sigs. New \u003ccode>GET /api/signed_url?file_url=..\u003c/code> checks the caller's permission on the linked doc, then returns a signed URL that serves with NO session header (usable in &lt;img&gt;/&lt;a&gt;). Public files return their plain URL.\u003c/li>\u003cli>\u003ccode>serveFile\u003c/code> accepts EITHER a valid signature (skips auth — the grant was proven at mint time) OR a session that passes the linked-doc read check.\u003c/li>\u003cli>Verified end-to-end (HTTP + test/signed-files.test.ts): outsider → 403 on both serve and mint; permitted non-admin reader → mints a signed URL that serves anonymously with the right bytes; tampered/expired signature → 401. The Desk's attachment links keep working (token-auth now permission-checked).\u003c/li>\u003cli>Full suite: 213 server + 38 web e2e green. 92/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-set-004-passing-system-settings-applied-globally\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/SET-004\">SET-004\u003c/a> passing: System Settings applied globally\u003c/h2>\n\u003cul>\u003cli>Migration 0025: System Settings single gains \u003ccode>currency\u003c/code> (Select, USD/EUR/ GBP/INR/JPY, default USD), \u003ccode>currency_precision\u003c/code> (Int, 2), \u003ccode>float_precision\u003c/code> (Int, 2) — added idempotently as docfields (singles have no table).\u003c/li>\u003cli>Server: \u003ccode>settings.ts\u003c/code> \u003ccode>getSystemSettings()\u003c/code> reads the single's EAV values with typed defaults. New \u003ccode>/api/settings\u003c/code> endpoint exposes only the display subset (app_name, date_format, currency, currency_precision, float_precision) to any signed-in user. \u003ccode>login()\u003c/code> now derives JWT lifetime from \u003ccode>session_hours\u003c/code> (clamped 1–720h) instead of a hardcoded constant.\u003c/li>\u003cli>Web: \u003ccode>lib/settings.ts\u003c/code> — \u003ccode>useSettings()\u003c/code> (cached fetch) + \u003ccode>formatValue()\u003c/code> (Date→date_format, Currency→symbol+precision, Float→precision). ListView cells format by field type via these; FormView shows a formatted preview under each Date/Currency/Float input (native inputs can't honor a custom format). \u003ccode>listColumns()\u003c/code> now carries \u003ccode>fieldtype\u003c/code> so cells know how to render. Zero per-DocType code — one formatter drives every list and form.\u003c/li>\u003cli>Verified end-to-end: e2e/system-settings-global.spec.ts (dd-mm-yyyy date + $1,234.50 currency render in list AND form previews; switching the global format to mm-dd-yyyy re-renders the same list to 03-09-2026; bumping precision to 3 → $1,234.500) + server settings.test.ts (defaults, typed overrides, endpoint subset). Full suite: 209 server + 38 web e2e green.\u003c/li>\u003cli>91/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-10-adversarial-single-list-harden\">2026-07-16 — Evaluation pass #10 (adversarial) + single-list hardening\u003c/h2>\n\u003cul>\u003cli>Ran the every-~3rd-wakeup adversarial pass over the newest features (\u003ca class=\"fid-link\" href=\"#/f/EML-001\">EML-001\u003c/a>..006, \u003ca class=\"fid-link\" href=\"#/f/UI-017\">UI-017\u003c/a>/020/021, \u003ca class=\"fid-link\" href=\"#/f/SET-001\">SET-001\u003c/a>, plus the eval-#9 realtime channel authorization fix). Probed: permlevel field-stripping on single reads, view-move (Kanban/Calendar) permission enforcement, email-rule condition matching / disabled rules / no-condition rules, tag add/list/remove, and a normal non-single doc lifecycle with child tables. \u003cstrong>All held — no feature regressed to failing.\u003c/strong>\u003c/li>\u003cli>\u003cstrong>One robustness gap found and fixed (coder follow-up):\u003c/strong> \u003ccode>getList\u003c/code> on a Single DocType returned a 500 (it queried the nonexistent \u003ccode>tab_*\u003c/code> table). Singles have no table, so \u003ccode>getList\u003c/code> now short-circuits with a clean \u003ccode>ValidationError\u003c/code> (417: \"… is a Single DocType and has no list …\") right after the read-permission check, so auth still takes precedence. Verified live: single list → 417 (was 500), normal-doctype list → 200, direct single open → 200. Added a server test asserting the guard.\u003c/li>\u003cli>No status flips. 90/126 unchanged.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-set-001-passing-single-doctypes\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/SET-001\">SET-001\u003c/a> passing: Single DocTypes\u003c/h2>\n\u003cul>\u003cli>Migration 0024: \u003ccode>single_value\u003c/code> EAV table (doctype, field, value) + a seeded 'System Settings' single (app_name, time_zone, date_format, session_hours, allow_signup). Singles have NO generated table.\u003c/li>\u003cli>Engine: getDoc routes issingle → getSingle (loads EAV values, applies field defaults, coerces Int/Float/Check back to JS types, name = the DocType name); saveDoc routes issingle → saveSingle (upserts changed fields into single_value, permission + validation enforced). Router: navigating to a single DocType renders its FormView directly (no list).\u003c/li>\u003cli>Verified: e2e/single-doctype.spec.ts (System Settings opens as a form, no list-view; edit+save persists across reload; API confirms one instance named after the doctype) + test/single-doctype.test.ts (no table created; defaults before save; typed round-trip; update-in-place = one instance).\u003c/li>\u003cli>205 server + 37 web e2e green. 90/126.\u003c/li>\u003cli>De-flaked: single test uses a unique app_name per run (System Settings is a persistent global — a repeated value left save disabled); \u003ca class=\"fid-link\" href=\"#/f/RT-002\">RT-002\u003c/a> waits ~1s for B's socket before A saves (parallel-load WS race).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-021-passing-calendar-view-with-drag-to-resched\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-021\">UI-021\u003c/a> passing: Calendar view with drag-to-reschedule\u003c/h2>\n\u003cul>\u003cli>\u003ccode>CalendarView.tsx\u003c/code> at /desk/:doctype/view/calendar — a 6-week month grid (defaults to the current month, prev/next nav) for DocTypes with a Date field. Documents render as events on their date cell; pointer-based DnD (same pattern as Kanban) drops an event on another day and PUTs the date field to that cell's YYYY-MM-DD. \"Calendar\" link on lists whose DocType has a Date field.\u003c/li>\u003cli>Verified: e2e/calendar.spec.ts (event on the 10th of the current month → drag to the 20th → moves on screen AND doc.due updates in the DB). Full web suite 3× green (36).\u003c/li>\u003cli>89/126. View block progressing (Kanban + Calendar done; \u003ca class=\"fid-link\" href=\"#/f/UI-022\">UI-022\u003c/a> Gantt, \u003ca class=\"fid-link\" href=\"#/f/UI-026\">UI-026\u003c/a> dashboards remain).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-020-passing-kanban-board-with-drag-and-drop\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-020\">UI-020\u003c/a> passing: Kanban board with drag-and-drop\u003c/h2>\n\u003cul>\u003cli>\u003ccode>KanbanView.tsx\u003c/code> at /desk/:doctype/view/kanban — groups docs by a Select field into columns (one per option), cards per doc. Pointer-based DnD (onPointerDown marks the dragged card; root onPointerUp uses document.elementFromPoint → closest [data-column] to find the drop column), then PUTs the grouping field to the target value and refetches. Group-by picker over Select fields; the list shows a \"Kanban\" link only when the DocType has a Select field. Route via kanbanRoute (?group_by).\u003c/li>\u003cli>Pointer events (not HTML5 draggable) so Playwright's mouse API drives it reliably.\u003c/li>\u003cli>Verified: e2e/kanban.spec.ts (drag Card A Todo→Done: card moves on screen AND doc.stage='Done' in the DB). Full web suite 2× green (35).\u003c/li>\u003cli>88/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/UI-021\">UI-021\u003c/a> (Calendar) is the sibling view; both depend only on \u003ca class=\"fid-link\" href=\"#/f/UI-002\">UI-002\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-017-passing-form-sidebar-assignments-tags-atta\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-017\">UI-017\u003c/a> passing: form sidebar (assignments + tags + attachments)\u003c/h2>\n\u003cul>\u003cli>Migration 0023: \u003ccode>tag_link\u003c/code> table (ref_doctype, ref_name, tag). Endpoints GET/POST/DELETE /api/tags gated by document read permission (dup insert is a no-op, missing doc → 404, blank tag → 417). \u003ccode>Tags.tsx\u003c/code> panel added to the FormView sidebar alongside the existing Assignments and Attachments panels.\u003c/li>\u003cli>Verified: e2e/form-sidebar.spec.ts (assign Administrator, add tag 'urgent', attach spec.txt → reload → all three persist; remove tag persists) + test/tags.test.ts (add/list[sorted]/remove, dup no-op, 404, 417).\u003c/li>\u003cli>202 server + 34 web e2e green. 87/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-eml-006-passing-assignments-todo-notification\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/EML-006\">EML-006\u003c/a> passing: assignments (ToDo + notification)\u003c/h2>\n\u003cul>\u003cli>Migration 0022: ToDo DocType (allocated_to, reference_doctype/name, description, status, priority). POST /api/assign creates a ToDo for the assignee (through the normal save lifecycle), writes a Notification Log row, and publishes a realtime user event so the assignee's unread badge pops live (\u003ca class=\"fid-link\" href=\"#/f/RT-003\">RT-003\u003c/a>). Assigner must be able to read the doc; unknown assignee → 404. FormView sidebar gained an Assignments panel (assigned-to list + assign input).\u003c/li>\u003cli>Verified: e2e/assign.spec.ts (two contexts — admin assigns to user B; B's unread badge pops live and the ToDo appears in B's ToDo list) + test/assign.test.ts (ToDo+notification created, 404 unknown user, 417 missing args, 401 unauth).\u003c/li>\u003cli>199 server + 33 web e2e green. 86/126. Email block COMPLETE (\u003ca class=\"fid-link\" href=\"#/f/EML-001\">EML-001\u003c/a>..006).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-eml-004-passing-email-rules-on-lifecycle-events\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/EML-004\">EML-004\u003c/a> passing: email rules on lifecycle events\u003c/h2>\n\u003cul>\u003cli>Migration 0021: Email Rule DocType (document_type, event [on_create/save/submit/cancel], optional condition_field+condition_value, recipient, subject, message, enabled). \u003ccode>src/email-rules.ts\u003c/code> evaluateEmailRules(event, doctype, doc) loads enabled rules for the doctype+event, checks the equality condition (blank field = always), and queues a rendered email per match. Wired post-commit into setDocstatus (fires on on_submit/on_cancel) so a rolled-back submit sends nothing. Table-existence guarded for early-migration getMeta safety.\u003c/li>\u003cli>Verified: test/email-rules.test.ts (fires for priority=High on submit, NOT for Low, exactly once per matching submit) + live (submit a High Live Task via API → rule → queue → worker delivers to sink).\u003c/li>\u003cli>195 server tests green. 85/126.\u003c/li>\u003cli>GOTCHA: document.ts→email-rules→email→document is an import cycle; resolves because all cross-refs are runtime calls, not module-init.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-eml-003-eml-005-passing-pdf-attachments-templates\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/EML-003\">EML-003\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/EML-005\">EML-005\u003c/a> passing: PDF attachments + templates\u003c/h2>\n\u003cul>\u003cli>queueEmail gained render/attach_pdf/print_format options, stored on the Email Queue row (in the attachments JSON) so the send_email job is self-contained. At send time, if a reference doc is set: \u003ca class=\"fid-link\" href=\"#/f/EML-005\">EML-005\u003c/a> renders {{ doc.field }} in subject+body against the doc; \u003ca class=\"fid-link\" href=\"#/f/EML-003\">EML-003\u003c/a> renders the document to PDF (renderPrintHtml+renderPdf, honoring a print format) and attaches it (base64) to the sink message. /api/queue_email exposes the flags.\u003c/li>\u003cli>Verified: test/email.test.ts (+2 — templated queued mail lands rendered in the sink; attach_pdf delivers inv-1.pdf whose extracted text contains the doc's field value) + live (subject \"Re: Live Report\", attachment \"e1.pdf\").\u003c/li>\u003cli>192 server tests green. 84/126.\u003c/li>\u003cli>Remaining email: \u003ca class=\"fid-link\" href=\"#/f/EML-004\">EML-004\u003c/a> (submit rule), \u003ca class=\"fid-link\" href=\"#/f/EML-006\">EML-006\u003c/a> (assignment→ToDo).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-eml-001-002-passing-outbound-email-queue-dev-sink\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/EML-001\">EML-001\u003c/a>/002 passing: outbound email + queue + dev sink\u003c/h2>\n\u003cul>\u003cli>Migration 0020: Email Account (email_id, smtp_*, is_default), Email Queue (recipient, subject, body, status queued/sent/error, error, reference_*, attachments JSON), Email Sink (the local dev mailbox — mail_from/to, subject, body, attachment_names/b64). \u003ccode>src/email.ts\u003c/code>: deliverToSink (dev transport), sendTestEmail (\u003ca class=\"fid-link\" href=\"#/f/EML-001\">EML-001\u003c/a>), queueEmail → enqueues a \u003ccode>send_email\u003c/code> JOB that atomically claims the row (queued→sent, idempotent so no double-send) and delivers (\u003ca class=\"fid-link\" href=\"#/f/EML-002\">EML-002\u003c/a>). renderTemplate for {{ doc.field }} (\u003ca class=\"fid-link\" href=\"#/f/EML-005\">EML-005\u003c/a> groundwork). Endpoints /api/send_test_email + /api/queue_email (System Manager).\u003c/li>\u003cli>Verified: live (account → test mail lands in sink; queue → worker flips queued→sent, sink gets exactly one copy, job execution logged) + test/email.test.ts (4: test send, queued→sent single delivery, re-drain no double-send, template render).\u003c/li>\u003cli>190 server tests green. 82/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/EML-005\">EML-005\u003c/a> (template in queued mail), \u003ca class=\"fid-link\" href=\"#/f/EML-003\">EML-003\u003c/a> (PDF attachment), \u003ca class=\"fid-link\" href=\"#/f/EML-004\">EML-004\u003c/a> (submit rule), \u003ca class=\"fid-link\" href=\"#/f/EML-006\">EML-006\u003c/a> (assignment→ToDo+notification).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-rt-channel-authorization-fixed-rt-001-002-003-pas\">2026-07-16 — RT channel authorization fixed: \u003ca class=\"fid-link\" href=\"#/f/RT-001\">RT-001\u003c/a>/002/003 passing again\u003c/h2>\n\u003cul>\u003cli>\u003ccode>canSubscribe(user, channel)\u003c/code> in realtime.ts gates every subscribe frame: user:&lt;name&gt; only for the connecting user; list:&lt;DocType&gt; / doc:&lt;DocType&gt;:* only if the user has READ permission on that DocType; anything else rejected. The socket message handler now awaits authorization and silently drops unpermitted channels. Connection auth (no/bad token → close 4001) was already fine.\u003c/li>\u003cli>Verified: two-user WS repro now leaks NOTHING (attacker subscribing to user:Administrator / list:User / doc:User:Administrator receives zero events); a permitted user (admin) still receives list:User + own notification. test/realtime.test.ts +4 authz cases. RT e2e green 3×.\u003c/li>\u003cli>186 server + 32 web e2e green. 80/126 restored.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-9-adversarial-rt-block-failed-cha\">2026-07-16 — Evaluation pass #9 (adversarial): RT block FAILED (channel auth leak)\u003c/h2>\n\u003cp>Re-drove the 6 newest (\u003ca class=\"fid-link\" href=\"#/f/JOB-001\">JOB-001\u003c/a>/002/003, \u003ca class=\"fid-link\" href=\"#/f/UI-013\">UI-013\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/RT-001\">RT-001\u003c/a>/002/003) on a second DocType + a restricted non-admin, plus 2 regressions. Verdicts:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/JOB-001\">JOB-001\u003c/a>/002/003 HOLD\u003c/strong>: non-admin enqueue → 403; no-method → 417; queue drains; retries/failed states correct (already covered, re-confirmed enqueue authz).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/UI-013\">UI-013\u003c/a> HOLDS\u003c/strong>: user_settings is per-user — a non-admin reading /api/user_settings/User sees their own null, NOT the admin's saved {sort,hiddenCols}; admin reads back own.\u003c/li>\u003cli>\u003cstrong>Regressions HOLD\u003c/strong>: REST CRUD round-trip (create/update/delete + 404-after-delete) works through the now-event-publishing endpoints; permission denial still 403s a role-less user on list + create.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/RT-001\">RT-001\u003c/a>/002/003 → FAILING\u003c/strong>: the WebSocket layer performs NO authorization on channel subscription. \u003ccode>for (const ch of msg.subscribe) client.channels.add(ch)\u003c/code> accepts any channel. REPRO: attacker logs in as a low-priv user, opens /ws?token=&lt;their jwt&gt;, sends {subscribe:[\"user:Administrator\"]}; when Administrator is @mentioned, the attacker's socket receives {channel:\"user:Administrator\", event:\"notification\", payload:{subject:\"Administrator mentioned you in a comment\"}} — a cross-user confidentiality leak. Same gap lets any user subscribe to list:&lt;AnyDocType&gt; / doc:&lt;AnyDocType&gt;:&lt;name&gt; without read permission and learn doc names/changes. Connection auth itself is fine (no/garbage token → close 4001); only per-channel authz is missing. FIX (next, this session): authorize each subscribe — user:&lt;name&gt; only for the connecting user; list:/doc: only if the user can read that DocType.\u003c/li>\u003c/ul>\n\u003cp>80 → 77 passing. Fixing RT channel authz next in coder mode.\u003c/p>\n\u003ch2 id=\"2026-07-16-rt-001-002-003-passing-realtime-over-websockets\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RT-001\">RT-001\u003c/a>/002/003 passing: realtime over WebSockets\u003c/h2>\n\u003cul>\u003cli>\u003ccode>src/realtime.ts\u003c/code>: a WS server (ws) attached to the shared HTTP server at /ws?token=&lt;jwt&gt;. Clients subscribe to channels; the personal user:&lt;name&gt; channel is auto-subscribed. Channels: list:&lt;DocType&gt;, doc:&lt;DocType&gt;:&lt;name&gt;, user:&lt;name&gt;. publish() also feeds an in-process EventBus (onEvent) for tests. Mutation endpoints (save_doc, resource POST/PUT/DELETE) emit publishDocEvent; the Comment controller emits publishUserEvent per @mention (\u003ca class=\"fid-link\" href=\"#/f/RT-003\">RT-003\u003c/a>). New GET /api/unread_count and POST /api/set_password (self, or any user for a System Manager — enables second-user e2e).\u003c/li>\u003cli>Web: \u003ccode>lib/realtime.ts\u003c/code> — one shared auto-reconnecting socket + useRealtime hook. ListView invalidates its list query on list: events (\u003ca class=\"fid-link\" href=\"#/f/RT-001\">RT-001\u003c/a>). FormView shows a \"changed in another session\" refresh banner on doc: events, suppressed for ~2s after the user's own save (\u003ca class=\"fid-link\" href=\"#/f/RT-002\">RT-002\u003c/a>). DeskLayout shows a live unread badge, refetched on user notification events (\u003ca class=\"fid-link\" href=\"#/f/RT-003\">RT-003\u003c/a>). Vite proxies /ws (ws:true).\u003c/li>\u003cli>Verified: e2e/realtime.spec.ts — two browser contexts: (1) create in A appears in B's list; (2) A's save pops B's refresh banner (not A's own), refresh loads the new value; (3) A's @mention of user B pops B's unread badge live. Ran 3× green. Server: test/realtime.test.ts (event bus channels) + direct WS probe.\u003c/li>\u003cli>GOTCHA: startup race — if the mutation fires before the other context's socket has subscribed, the event is missed; the e2e waits for the list to render + ~1s before mutating. Real users only hit a sub-second window on first open (the list already shows current data; realtime keeps it fresh).\u003c/li>\u003cli>182 server + 32 web e2e green. 80/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-013-passing-saved-list-settings-per-user\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-013\">UI-013\u003c/a> passing: saved list settings per user\u003c/h2>\n\u003cul>\u003cli>Migration 0019: \u003ccode>user_settings\u003c/code> table (user, doctype, settings jsonb, PK (user,doctype)). Endpoints GET/PUT /api/user_settings/:doctype — per-user, only the caller's own row.\u003c/li>\u003cli>ListView: a Columns picker (hide/show any list column) + column sort now persist to the user's settings and restore on next load (per DocType). Filters stay URL-driven (\u003ca class=\"fid-link\" href=\"#/f/UI-003\">UI-003\u003c/a>) and are deliberately NOT persisted here — auto-restoring saved filters double-handled the URL mechanism and made list tests non-idempotent (a filter saved in one run narrowed the next).\u003c/li>\u003cli>Verified: e2e/list-settings.spec.ts (hide City + sort asc by Rank → logout → login → both restored). Full web suite 3× green (29).\u003c/li>\u003cli>179 server + 29 web e2e green. 77/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-job-001-002-003-passing-background-job-queue-work\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/JOB-001\">JOB-001\u003c/a>/002/003 passing: background job queue + worker\u003c/h2>\n\u003cul>\u003cli>Migration 0018: Background Job (method, payload JSON, status, attempts, max_attempts, run_at, error, repeat_every) + Job Execution (per-attempt audit) DocTypes — durable, queryable via the API/UI.\u003c/li>\u003cli>\u003ccode>src/jobs.ts\u003c/code>: registerJob registry, enqueue, runOneJob (atomic claim via \u003ccode>update … where name = (select … for update skip locked)\u003c/code>), drainJobs, startWorker/stopWorker (in-process setInterval poll, JOB_POLL_MS), loadJobs (src/jobs/*.ts self-register at boot). \u003ca class=\"fid-link\" href=\"#/f/JOB-002\">JOB-002\u003c/a> retries until max_attempts then → failed with the error; \u003ca class=\"fid-link\" href=\"#/f/JOB-003\">JOB-003\u003c/a> recurring jobs re-enqueue at run_at+repeat_every after each success. Worker starts at boot (off under NODE_ENV=test; tests drive runOneJob/drainJobs directly). Endpoint POST /api/enqueue_job (System Manager).\u003c/li>\u003cli>Verified: test/jobs.test.ts (enqueue→drain→row written→done, queue drains; flaky job 3 attempts error/error/success; always-fails → failed after 3 with error + 3 error execs; unknown method fails cleanly), test/jobs-recurring.test.ts (1s cadence fires ≥2 with executions logged, a queued job always waiting; future re-enqueue not picked up early) + LIVE: enqueued demo_write_row via HTTP → the real in-process worker processed it (status done), row written, queue drained to 0.\u003c/li>\u003cli>Interval note: production cadence is minutely; the recurring test uses a 1s interval to exercise the identical re-enqueue path in seconds.\u003c/li>\u003cli>GOTCHA: Int columns come back as bigint STRINGS from postgres.js — Number()-coerce attempts/max_attempts/repeat_every before arithmetic (a raw \u003ccode>+1\u003c/code> concatenates).\u003c/li>\u003cli>179 server tests green. 76/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-8-adversarial-all-held-no-finding\">2026-07-16 — Evaluation pass #8 (adversarial): all held, no findings\u003c/h2>\n\u003cp>Re-drove the 5 newest (\u003ca class=\"fid-link\" href=\"#/f/WF-001\">WF-001\u003c/a>/002/003, \u003ca class=\"fid-link\" href=\"#/f/CUST-001\">CUST-001\u003c/a>/002) on a SECOND DocType (Ev8 Doc, never the demo) as Administrator + a restricted non-admin (Ev8 Role), plus 2 regressions on the riskiest recent core changes. Verdicts — all HOLD:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/CUST-001\">CUST-001\u003c/a>\u003c/strong>: custom Select field (with options) added to Ev8 Doc appears in meta + saves; an invalid enum value → 417 with the enum message; a custom field over an existing base field → 409 ConflictError.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/CUST-002\">CUST-002\u003c/a>\u003c/strong>: hidden=1 setter hides the field in meta (base row untouched = f); a DocType-level setter (empty field_name) overrode sort_field; removing both reverted cleanly.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/WF-001\">WF-001\u003c/a>\u003c/strong>: workflow created on the second DocType.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/WF-002\">WF-002\u003c/a>/003\u003c/strong>: role-holding user drove New→Review; a non-existent action → 417; a valid action from the wrong state → 417; after stripping the user's role, the SAME user's transition → 403 PermissionError with state unchanged (Review→Review).\u003c/li>\u003cli>\u003cstrong>Regression — child tables (document.ts hook change)\u003c/strong>: save with 2 child rows round-trips; update replacing the rows persists correctly.\u003c/li>\u003cli>\u003cstrong>Regression — \u003ca class=\"fid-link\" href=\"#/f/PRN-003\">PRN-003\u003c/a>\u003c/strong>: PDF still generates (200, application/pdf, 17KB, %PDF- magic) on a doc carrying a custom field.\u003c/li>\u003c/ul>\n\u003cp>No status changes. 73/126 unchanged. Cleaned all Ev8 fixtures + any property setters (they are global on shared doctypes).\u003c/p>\n\u003ch2 id=\"2026-07-16-cust-002-passing-property-setters\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/CUST-002\">CUST-002\u003c/a> passing: property setters\u003c/h2>\n\u003cul>\u003cli>Migration 0017: 'Property Setter' DocType (doc_type, field_name [empty = DocType-level], property, value). getMeta now overlays property setters onto the effective meta after loading base rows — booleans (hidden/reqd/ read_only/in_list_view/unique) coerced from '1'/'true'. Base docfield rows are NEVER mutated; the override lives only in the loaded object. controllers/property-setter.ts invalidates the target meta on save/trash.\u003c/li>\u003cli>Table-existence guarded (cached flag) so early bootstrap migrations that call getMeta before 0017 don't hit a missing table.\u003c/li>\u003cli>Verified: test/property-setter.test.ts (label override in meta / base row unchanged; reqd coercion; removal restores) + e2e/property-setter.spec.ts (form shows 'Headline', reverts to 'Title' when removed) + live curl.\u003c/li>\u003cli>173 server + 28 web e2e green. 73/126.\u003c/li>\u003cli>GOTCHA: property setters on CORE doctypes (User) are global — a probe that set User.full_name reqd=true broke 26 tests until deleted. Always clean up property-setter probes on shared doctypes.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-cust-001-passing-custom-fields\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/CUST-001\">CUST-001\u003c/a> passing: custom fields\u003c/h2>\n\u003cul>\u003cli>Migration 0016: \u003ccode>custom\u003c/code> boolean on tab_docfield + 'Custom Field' DocType (dt, fieldname, label, fieldtype, options, reqd, in_list_view).\u003c/li>\u003cli>\u003ccode>src/custom-fields.ts\u003c/code>: applyCustomField (ALTER add column if the fieldtype has one + upsert a docfield row marked custom, guards against clobbering a base field), removeCustomField (drops the docfield, KEEPS the column/data — non-destructive), reapplyCustomFields (re-materializes every Custom Field record). controllers/custom-field.ts wires after_insert/on_trash. reapplyCustomFields() runs at boot + via POST /api/reapply_custom_fields (System Manager).\u003c/li>\u003cli>Stored separately from the base definition, so a core re-seed (which rewrites base docfields) doesn't remove them — boot re-applies.\u003c/li>\u003cli>Verified: test/custom-field.test.ts (meta+custom flag, API round-trip, docfield-wipe → reapply restores + value preserved, delete keeps column data) + live curl + e2e/custom-field.spec.ts (field in form with value, column in list).\u003c/li>\u003cli>170 server + 27 web e2e green. 72/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/CUST-002\">CUST-002\u003c/a> (Property Setters — override label/hidden/reqd) builds on this.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-wf-001-002-003-passing-workflow-engine-definition\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/WF-001\">WF-001\u003c/a>/002/003 passing: workflow engine (definition, execution, enforcement)\u003c/h2>\n\u003cul>\u003cli>Migration 0015: Workflow (+ child Workflow Document State, Workflow Transition) and Workflow Action (audit log) DocTypes.\u003c/li>\u003cli>\u003ccode>src/workflow.ts\u003c/code>: getActiveWorkflow, validateWorkflow (\u003ca class=\"fid-link\" href=\"#/f/WF-001\">WF-001\u003c/a>: rejects transitions to/from undefined states — no orphans), ensureStateField (adds a read-only \u003ccode>workflow_state\u003c/code> field to the target DocType, on-demand ALTER + docfield insert + invalidateMeta), applyWorkflowAction (\u003ca class=\"fid-link\" href=\"#/f/WF-002\">WF-002\u003c/a>/003: resolves the transition from the doc's current state, enforces the \u003ccode>allowed\u003c/code> role — Administrator/System Manager bypass — then updates workflow_state + docstatus and logs a Workflow Action with who/when), availableActions (privileged users see all).\u003c/li>\u003cli>controllers/workflow.ts: validate hook (orphan check) + after_save hook (ensureStateField when active). Endpoints GET /api/workflow/:dt/:name (state + permitted actions) and POST /api/apply_workflow_action.\u003c/li>\u003cli>FormView: WorkflowActions in the header — state pill + transition buttons.\u003c/li>\u003cli>\u003cstrong>Core change\u003c/strong>: saveDoc/updateDoc now attach child-table rows to \u003ccode>ctx.doc\u003c/code> under their fieldnames before running validate/before_save hooks (columnValues ignores non-scalar keys), so controllers can validate child grids. All 167 server tests still green — no regression.\u003c/li>\u003cli>Verified: test/workflow.test.ts (5: persist+field-added, orphan 417, role-less 403 state-unchanged, admin drives Draft→Pending→Approved with docstatus 0→0→1 + audit trail, invalid-from-state 417) + live curl + e2e/workflow.spec.ts (Approve button flips Draft→Approved, audit row).\u003c/li>\u003cli>De-flaked: workflow/timeline specs use per-run doc names (a submitted doc can't be API-deleted; versions accumulate). Web suite 3× green (26).\u003c/li>\u003cli>167 server + 26 web e2e green. 71/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-prn-003-passing-server-side-pdf-generation\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PRN-003\">PRN-003\u003c/a> passing: server-side PDF generation\u003c/h2>\n\u003cul>\u003cli>\u003ccode>src/print.ts\u003c/code>: renderPrintHtml builds the same HTML the browser print view shows (interpolated Print Format template, or metadata auto-layout, server-side {{ field }} + HTML-escaping) → renderPdf drives headless Chromium (page.setContent + page.pdf A4). Browser launched lazily and reused. GET /api/print/:doctype/:name?format= returns application/pdf.\u003c/li>\u003cli>Chromium resolution: PLAYWRIGHT_BROWSERS_PATH isn't exported to the server process, so resolveChromium() globs /opt/pw-browsers/chromium-*/ chrome-linux/chrome (newest first). Added playwright to apps/server.\u003c/li>\u003cli>Verified: test/print-pdf.test.ts (auto-layout PDF contains Umbrella Corp/9876; a Print Format template interpolates RECEIPT + values; %PDF- header asserted; text via pdf-parse v2 PDFParse) + live curl (200 application/pdf 16KB; 401 unauthenticated).\u003c/li>\u003cli>162 server + web e2e green. 68/126. Printing block (\u003ca class=\"fid-link\" href=\"#/f/PRN-001\">PRN-001\u003c/a>/002/003) COMPLETE.\u003c/li>\u003cli>GOTCHA: pdf-parse v2 exports a { PDFParse } class (new + getText()), not a default function; pypdf is unusable here (broken cryptography native dep). Chromium PDFs font-subset text, so raw stream grep fails — must use a real extractor.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-prn-002-passing-print-formats-interpolation\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PRN-002\">PRN-002\u003c/a> passing: print formats + interpolation\u003c/h2>\n\u003cul>\u003cli>Migration 0014: 'Print Format' DocType (doc_type Link, is_default Check, template Text). PrintView loads formats for the doctype; {{ field }} tokens interpolate from the doc (admin-authored templates are trusted → dangerouslySetInnerHTML, like Frappe Jinja). Selection: ?format=&lt;name&gt; wins, ?format=standard forces the auto layout, no param → the DocType's is_default format. Picker in the header; the auto metadata layout extracted to &lt;AutoLayout&gt;.\u003c/li>\u003cli>Verified by e2e/print-formats.spec.ts: Invoice(default)+Receipt formats; no param → Invoice interpolated (Bill to: Stark Industries / Total 500), no RECEIPT; switch → Receipt output, no Invoice; ?format= URL restores; Standard(auto) → metadata layout.\u003c/li>\u003cli>160 server + 24 web e2e green. 67/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-prn-001-passing-print-view\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PRN-001\">PRN-001\u003c/a> passing: print view\u003c/h2>\n\u003cul>\u003cli>\u003ccode>PrintView.tsx\u003c/code> at /print/:doctype/:name — a ROOT route (outside the Desk layout, so no navbar/sidebar/awesomebar). Metadata-driven: scalar fields as a label/value grid, each Table field as a bordered child-table (framework columns hidden), a print-hidden \"Print\" button calling window.print(). Form gained a Print link.\u003c/li>\u003cli>Verified by e2e/print-view.spec.ts: reach via form Print button; app chrome absent (awesomebar/doctype-nav count 0); labels+values shown; child table renders 2 rows (Widget/Gadget).\u003c/li>\u003cli>160 server + 23 web e2e green. 66/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/PRN-002\">PRN-002\u003c/a> (print formats/templates) then \u003ca class=\"fid-link\" href=\"#/f/PRN-003\">PRN-003\u003c/a> (server PDF) build on this.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-019-passing-activity-timeline\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-019\">UI-019\u003c/a> passing: activity timeline\u003c/h2>\n\u003cul>\u003cli>\u003ccode>ActivityTimeline.tsx\u003c/code> in the form sidebar merges Comment + Version docs for the document, sorted by creation. Comments show author + text; versions show author + the field diff (field: old → new) from \u003ca class=\"fid-link\" href=\"#/f/DOC-009\">DOC-009\u003c/a>'s data.changed. Workflow actions will slot in once WF lands (recorded as versions/comments). FormView save() now also invalidates ['versions', doctype, name] so the timeline updates live after an edit.\u003c/li>\u003cli>Verified by e2e/timeline.spec.ts: edit title → version entry with diff (title: original → revised title); add comment → entry after it; the two render in chronological order (version then comment).\u003c/li>\u003cli>160 server + 22 web e2e green. 65/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-018-passing-comments-mentions-notifications\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-018\">UI-018\u003c/a> passing: comments + @mentions + notifications\u003c/h2>\n\u003cul>\u003cli>\u003ccode>Comments.tsx\u003c/code> in the FormView sidebar (existing docs): comment stream (author avatar/initials + timestamp + content) filtered by ref_doctype/ref_name, a textarea with @-triggered mention autocomplete from the user list, @mentions rendered highlighted. Posts create Comment docs through save_doc.\u003c/li>\u003cli>Migration 0013: 'Notification Log' DocType (for_user, subject, ref_doctype, ref_name, read). controllers/comment.ts after_insert hook parses @handles, resolves them to real users, inserts a Notification Log row per mentioned user (inside the comment's txn). Unknown handles ignored.\u003c/li>\u003cli>Verified: e2e/comments.spec.ts (post, @mention autocomplete → \"@Administrator \", highlighted render, persist across reload, + Notification Log row created); server test/comments.test.ts (real+Guest notified, ghost ignored, no-mention → no notifications).\u003c/li>\u003cli>GOTCHA: tsx watch didn't hot-load the NEW controller file — a stale server on :8000 (EADDRINUSE after a prior crash) served without it. Always \u003ccode>bash init.sh\u003c/code> (kills by port) after adding a controller/method module, not just edit-in-place.\u003c/li>\u003cli>160 server + 22 web e2e green. 64/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-7-adversarial-all-held-1-robustne\">2026-07-16 — Evaluation pass #7 (adversarial): all held, 1 robustness fix\u003c/h2>\n\u003cp>Checked the 3 newest (\u003ca class=\"fid-link\" href=\"#/f/DOC-012\">DOC-012\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/API-003\">API-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/API-005\">API-005\u003c/a>) + regressions (PERM scope, credential leak sweep, link search) as Administrator AND a read-only non-admin ('Ev7 Role', read-only on Ev7 Cust). Verdicts:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/DOC-012\">DOC-012\u003c/a> HOLDS\u003c/strong>: read-only user rename → 403 and NO cascade (Acme in
