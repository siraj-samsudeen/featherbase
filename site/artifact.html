li>\u003cstrong>BV2!:\u003c/strong> An update writes only mapped columns present in the payload. (critical: CLI-owned columns must survive Desk edits untouched.)\u003c/li>\u003cli>\u003cstrong>BV3:\u003c/strong> A DocType is bound at creation or not at all; no conversion either way.\u003c/li>\u003cli>\u003cstrong>BV4:\u003c/strong> A bound DocType with no mapped \u003ccode>docstatus\u003c/code> cannot be submittable.\u003c/li>\u003cli>\u003cstrong>BV5:\u003c/strong> A bound DocType with no mapped \u003ccode>owner\u003c/code> cannot carry an \u003ccode>if_owner\u003c/code> DocPerm.\u003c/li>\u003cli>\u003cstrong>BV6:\u003c/strong> A table without a single-column primary key cannot be bound.\u003c/li>\u003cli>\u003cstrong>BV7!:\u003c/strong> Credentials are read from the environment at connect time and never persisted or echoed. (critical: a source's URL grants access to production data the Desk does not own.)\u003c/li>\u003c/ul>\n\u003ch2 id=\"permissions\">Permissions\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>P1:\u003c/strong> Permissions on bound DocTypes come from the same DocPerm/permlevel/ role machinery as local DocTypes; there is no separate model.\u003c/li>\u003cli>\u003cstrong>P2:\u003c/strong> Postgres RLS (\u003ca class=\"fid-link\" href=\"#/f/PERM-004\">PERM-004\u003c/a>) covers control-DB tables only. Foreign rows are protected by the server layer alone — acceptable because clients never reach a database directly (invariant 2), but it must be stated, not assumed.\u003c/li>\u003cli>\u003cstrong>P3:\u003c/strong> Only the System Manager role may create, edit or test a \u003ccode>Data Source\u003c/code>, or bind a DocType to one.\u003c/li>\u003cli>\u003cstrong>P4:\u003c/strong> \u003ccode>if_owner\u003c/code> scoping requires a mapped \u003ccode>owner\u003c/code> column (see BV5).\u003c/li>\u003c/ul>\n\u003ch2 id=\"input-validation\">Input Validation\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>IV1:\u003c/strong> Source name matches \u003ccode>^[a-z][a-z0-9-]*$\u003c/code>.\u003c/li>\u003cli>\u003cstrong>IV2:\u003c/strong> Schema, table and column identifiers are validated against the introspected catalog and always emitted quoted — never string-interpolated from user input.\u003c/li>\u003cli>\u003cstrong>IV3:\u003c/strong> \u003ccode>pool_max\u003c/code> between 1 and 20; \u003ccode>statement_timeout_ms\u003c/code> between 100 and 60000.\u003c/li>\u003cli>\u003cstrong>IV4:\u003c/strong> Every filter value is a bound parameter; operators come from the existing allowlist.\u003c/li>\u003c/ul>\n\u003ch2 id=\"state-rules\">State Rules\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>S1:\u003c/strong> Saving a \u003ccode>Data Source\u003c/code> resets its status to \u003ccode>untested\u003c/code> and drops its pool, so the next request reconnects with current settings.\u003c/li>\u003cli>\u003cstrong>S2:\u003c/strong> A successful \u003cem>Sync from source\u003c/em> invalidates that DocType's meta cache and the source's introspection cache.\u003c/li>\u003cli>\u003cstrong>S3:\u003c/strong> Flipping a source to \u003ccode>read_only\u003c/code> immediately blocks writes on every DocType bound to it, without a restart.\u003c/li>\u003c/ul>\n\u003ch2 id=\"data-model\">Data Model\u003c/h2>\n\u003cp>\u003cstrong>T1: Data Source\u003c/strong> (control DB)\u003c/p>\n\u003cul>\u003cli>name (short identifier)\u003c/li>\u003cli>engine (Postgres)\u003c/li>\u003cli>url env var (name of the environment variable holding the connection string)\u003c/li>\u003cli>default schema\u003c/li>\u003cli>access (read-only | read-write)\u003c/li>\u003cli>pool max (number)\u003c/li>\u003cli>statement timeout ms (number)\u003c/li>\u003cli>table allowlist (list, optional)\u003c/li>\u003cli>status (untested | ok | error), last checked at, last error\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>T2: DocType\u003c/strong> — new fields\u003c/p>\n\u003cul>\u003cli>data source (link to Data Source; empty means the control database)\u003c/li>\u003cli>external schema, external table, external pk (column name)\u003c/li>\u003cli>conflict check (modified | row | none)\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>T3: DocField\u003c/strong> — new field\u003c/p>\n\u003cul>\u003cli>column name (defaults to the fieldname)\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>T4: Reconciliation Log\u003c/strong> (control DB)\u003c/p>\n\u003cul>\u003cli>doctype, document name, operation, source, detected at, resolved (yes/no), detail\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-this-requires-of-the-foreign-schema\">What this requires of the foreign schema\u003c/h2>\n\u003cp>The direct answer to \"does this require any change to that schema?\" — with the control-schema case as the worked example.\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Featherbase capability\u003c/th>\u003cth>Needs a column?\u003c/th>\u003cth>If the column is absent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>List, filter, sort, paginate\u003c/td>\u003ctd>No\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Open a record, edit, save\u003c/td>\u003ctd>No — only a single-column PK\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Create, delete\u003c/td>\u003ctd>No\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Comments, attachments, tags, assignments, versions\u003c/td>\u003ctd>No — stored control-side\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Roles, DocType and permlevel permissions\u003c/td>\u003ctd>No\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Audit line (\"created / last modified\")\u003c/td>\u003ctd>\u003ccode>created_at\u003c/code>, \u003ccode>updated_at\u003c/code> (any names)\u003c/td>\u003ctd>Line is blank\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Optimistic locking\u003c/td>\u003ctd>a \u003ccode>modified\u003c/code>-equivalent the \u003cstrong>CLIs also update\u003c/strong>\u003c/td>\u003ctd>Falls back to whole-row comparison (\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-8\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>if_owner\u003c/code> row scoping\u003c/td>\u003ctd>an owner column holding a Featherbase user\u003c/td>\u003ctd>\u003ccode>if_owner\u003c/code> perms rejected as misconfiguration\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Submit / cancel workflow\u003c/td>\u003ctd>a \u003ccode>docstatus\u003c/code> integer column\u003c/td>\u003ctd>DocType cannot be submittable\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Realtime push to open Desk views\u003c/td>\u003ctd>a \u003ccode>LISTEN/NOTIFY\u003c/code> trigger, or polling\u003c/td>\u003ctd>Views refresh on navigation only\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>So: \u003cstrong>a table with a single-column primary key can be managed as-is.\u003c/strong> Every row in the lower half is an opt-in enhancement, and each one degrades loudly rather than silently.\u003c/p>\n\u003ch2 id=\"verification-definition-of-done\">Verification (definition of done)\u003c/h2>\n\u003cp>Unit tests alone do not count (session protocol step 5). To call this built:\u003c/p>\n\u003col>\u003cli>A second Postgres — a \u003ccode>featherbase_external\u003c/code> database with a \u003ccode>control\u003c/code> schema created by a fixture script that mimics a CLI, \u003cem>not\u003c/em> by a Featherbase migration — is bound as a source.\u003c/li>\u003cli>HTTP against the running server: list with filter+sort+paginate, get one, create, update, delete, and a rejected write on a read-only source.\u003c/li>\u003cli>A concurrent write applied directly to the foreign table (bypassing the server) produces a conflict error on the next save under both \u003ccode>modified\u003c/code> and \u003ccode>row\u003c/code> modes.\u003c/li>\u003cli>A column dropped directly on the foreign table produces the drift error, and \u003cem>Sync from source\u003c/em> resolves it.\u003c/li>\u003cli>Playwright: the generic list and form render the bound DocType, the source badge shows, and a comment posted on a foreign record persists in the control DB.\u003c/li>\u003cli>The foreign database's schema is byte-identical before and after the run except for row data — proof of BV1.\u003c/li>\u003cli>\u003ccode>pnpm test\u003c/code> green with the second sandbox in place; typecheck clean.\u003c/li>\u003c/ol>\n\u003ch2 id=\"out-of-scope\">Out of Scope\u003c/h2>\n\u003cul>\u003cli>Joins spanning two databases, or reports over a mix of sources.\u003c/li>\u003cli>Two-phase commit; any promise of cross-database atomicity.\u003c/li>\u003cli>Writing to views, or to tables without a single-column primary key.\u003c/li>\u003cli>Child tables (\u003ccode>istable\u003c/code>) stored on a source.\u003c/li>\u003cli>Creating or migrating the foreign schema from Featherbase.\u003c/li>\u003cli>Engines other than Postgres — see \u003ccode>docs/specs/0002-virtual-doctypes.md\u003c/code>.\u003c/li>\u003cli>\u003ccode>postgres_fdw\u003c/code> as the transport (allowed later as an invisible optimisation).\u003c/li>\u003c/ul>"},{"group":"Specs","slug":"spec-0002","title":"Spec 0002 — Virtual DocTypes","path":"docs/specs/0002-virtual-doctypes.md","mins":5,"html":"\u003ch1 id=\"feature-virtual-doctypes-controller-supplied-storage\">Feature: Virtual DocTypes — controller-supplied storage\u003c/h1>\n\u003cp>Status: \u003cstrong>Proposed\u003c/strong> — not implemented. Written 2026-07-26. Decision record: \u003ccode>docs/adr/0007-app-and-database-topology.md\u003c/code>. Background: \u003ccode>docs/research/frappe-multi-app-and-multi-db.md\u003c/code> (Frappe's \u003ccode>frappe/model/virtual_doctype.py\u003c/code> protocol).\u003c/p>\n\u003ch2 id=\"workflow-context\">Workflow Context\u003c/h2>\n\u003cp>\u003ccode>docs/specs/0001-external-data-sources.md\u003c/code> covers the common case: the foreign data is a Postgres table, so Featherbase can generate SQL against it and keep filters, sorting, pagination and counting. That leaves everything that is \u003cem>not\u003c/em> a Postgres table — a REST API, a queue's admin endpoint, a CLI's JSON state file, a warehouse behind an HTTP query service.\u003c/p>\n\u003cp>Frappe's answer is the Virtual DocType: a DocType with no table, whose controller implements the storage protocol. It is the right shape to copy, because it is the only escape hatch an app author needs to learn.\u003c/p>\n\u003ch2 id=\"goal\">Goal\u003c/h2>\n\u003cp>Let an app back a DocType with an arbitrary store by implementing a small, enforced protocol, and get the resource API, permissions and generic Desk for free.\u003c/p>\n\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003cstrong>In:\u003c/strong> an \u003ccode>is_virtual\u003c/code> DocType flag; a controller protocol enforced at registration; routing of read, write and delete through the controller; permission and Desk parity; explicit, enumerated limitations.\u003c/p>\n\u003cp>\u003cstrong>Out:\u003c/strong> SQL pushdown of any kind (the controller owns filtering); child-table persistence; link-integrity protection over virtual data; report builder over virtual DocTypes; Postgres sources (use spec 0001 — richer and cheaper).\u003c/p>\n\u003ch2 id=\"dependencies\">Dependencies\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Requires:\u003c/strong> controller registry (\u003ca class=\"fid-link\" href=\"#/f/DOC-004\">DOC-004\u003c/a>), document engine (\u003ca class=\"fid-link\" href=\"#/f/DOC-001\">DOC-001\u003c/a>…011), permissions (PERM-*), app system (\u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Blocked by:\u003c/strong> nothing. Independent of spec 0001; either may ship first.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"vdt-1-declare-a-virtual-doctype\">\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-1\u003c/a>: Declare a virtual DocType\u003c/h2>\n\u003cul>\u003cli>WHEN a DocType is saved with \u003ccode>is_virtual\u003c/code> set, THE SYSTEM SHALL create no table, emit no DDL, generate no RLS policy, and skip it in the migration runner.\u003c/li>\u003cli>WHEN a virtual DocType is saved without a registered controller, THE SYSTEM SHALL reject the save naming the missing controller.\u003c/li>\u003cli>THE SYSTEM SHALL still store the DocType and its fields in the control DB, so metadata, permissions and the generic Desk work unchanged.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DocType \u003ccode>Deploy Log\u003c/code>, \u003ccode>is_virtual\u003c/code>, controller registered\u003c/td>\u003ctd>Saved; no \u003ccode>tab_deploy_log\u003c/code>; appears in the Desk sidebar\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DocType \u003ccode>Deploy Log\u003c/code>, \u003ccode>is_virtual\u003c/code>, no controller\u003c/td>\u003ctd>Rejected: \"No virtual controller registered for Deploy Log\"\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"vdt-2-the-controller-protocol\">\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-2\u003c/a>: The controller protocol\u003c/h2>\n\u003cul>\u003cli>THE SYSTEM SHALL require a virtual controller to implement \u003ccode>load(name)\u003c/code>, \u003ccode>insert(doc)\u003c/code>, \u003ccode>update(doc)\u003c/code>, \u003ccode>remove(name)\u003c/code>, \u003ccode>list(args)\u003c/code> and \u003ccode>count(args)\u003c/code>.\u003c/li>\u003cli>WHEN a controller is registered, THE SYSTEM SHALL validate that all six are present and are functions, and SHALL refuse the registration otherwise — mirroring Frappe's \u003ccode>validate_controller()\u003c/code>, which is the difference between a clear boot error and a 500 on first use.\u003c/li>\u003cli>THE SYSTEM SHALL pass \u003ccode>list\u003c/code> and \u003ccode>count\u003c/code> the same argument shape the query layer builds (filters, fields, order_by, limit, offset) and SHALL accept the returned rows as-is.\u003c/li>\u003cli>THE SYSTEM SHALL type the protocol in \u003ccode>packages/shared\u003c/code> so controllers are checked at compile time as well as at registration.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Controller with 6 methods\u003c/td>\u003ctd>Registered\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Controller missing \u003ccode>count\u003c/code>\u003c/td>\u003ctd>Registration throws at boot: \"Deploy Log: virtual controller missing count()\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>list({filters:[[\"status\",\"=\",\"failed\"]], limit:20})\u003c/code>\u003c/td>\u003ctd>Controller returns ≤20 rows; the framework does not re-filter\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"vdt-3-reading-and-writing-through-the-controller\">\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-3\u003c/a>: Reading and writing through the controller\u003c/h2>\n\u003cul>\u003cli>WHEN a client calls \u003ccode>get_doc\u003c/code>, \u003ccode>get_list\u003c/code> or a count on a virtual DocType, THE SYSTEM SHALL apply permissions first and then delegate to the controller.\u003c/li>\u003cli>WHEN a client saves, THE SYSTEM SHALL run \u003ccode>validate\u003c/code> / \u003ccode>before_save\u003c/code> / \u003ccode>after_save\u003c/code> around \u003ccode>insert\u003c/code> or \u003ccode>update\u003c/code>, so app hooks behave identically to a stored DocType.\u003c/li>\u003cli>IF the controller throws, THEN THE SYSTEM SHALL surface it as a document error with the controller's message, and the control-DB transaction SHALL roll back.\u003c/li>\u003cli>THE SYSTEM SHALL NOT promise atomicity between the controller's store and the control DB (same boundary as \u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-12\u003c/a>).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Before\u003c/th>\u003cth>Action\u003c/th>\u003cth>After\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>—\u003c/td>\u003ctd>Save \u003ccode>Deploy Log\u003c/code>\u003c/td>\u003ctd>\u003ccode>validate\u003c/code> runs, \u003ccode>insert\u003c/code> called once, \u003ccode>after_save\u003c/code> runs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Controller's API returns 502\u003c/td>\u003ctd>Save\u003c/td>\u003ctd>Save fails with the controller's message; no version row, no comment\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"vdt-4-honest-limitations\">\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-4\u003c/a>: Honest limitations\u003c/h2>\n\u003cul>\u003cli>THE SYSTEM SHALL reject a \u003ccode>Table\u003c/code> (child table) field on a virtual DocType rather than accept it and drop the rows, which is Frappe's documented in-memory-only behaviour and a recurring source of confusion.\u003c/li>\u003cli>THE SYSTEM SHALL reject \u003ccode>unique\u003c/code> and database-enforced constraints on virtual fields, since nothing enforces them.\u003c/li>\u003cli>THE SYSTEM SHALL exclude virtual DocTypes from link-integrity checks on delete and from cross-DocType SQL reports, and SHALL say so in the DocType form.\u003c/li>\u003cli>WHERE a local DocType links to a virtual DocType, THE SYSTEM SHALL validate the link by calling \u003ccode>load\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Add a \u003ccode>Table\u003c/code> field to \u003ccode>Deploy Log\u003c/code>\u003c/td>\u003ctd>Rejected: \"Child tables are not supported on virtual DocTypes\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Delete a doc a virtual DocType \"links\" to\u003c/td>\u003ctd>Not blocked; documented on the DocType form\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"vdt-5-desk-parity\">\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-5\u003c/a>: Desk parity\u003c/h2>\n\u003cul>\u003cli>THE SYSTEM SHALL render virtual DocTypes with the same generic \u003ccode>ListView\u003c/code> and \u003ccode>FormView\u003c/code>, with a badge marking them virtual (invariant 3).\u003c/li>\u003cli>WHERE the controller cannot sort or filter on a field, THE SYSTEM SHALL let it declare that in its registration, and the Desk SHALL disable those controls rather than issue a request that silently ignores them.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Open \u003ccode>Deploy Log\u003c/code> list\u003c/td>\u003ctd>Generic list, badge \"virtual\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Controller declares \u003ccode>sortable: ['started_at']\u003c/code>\u003c/td>\u003ctd>Column sort offered on \u003ccode>started_at\u003c/code> only\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"business-validation\">Business Validation\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>BV1!:\u003c/strong> A virtual DocType never causes DDL. (critical: the whole point is that Featherbase owns no storage here.)\u003c/li>\u003cli>\u003cstrong>BV2:\u003c/strong> Protocol completeness is validated at registration, not at first use.\u003c/li>\u003cli>\u003cstrong>BV3:\u003c/strong> Features that cannot be honoured (child tables, unique constraints, link protection) are rejected at configuration time, never silently ignored.\u003c/li>\u003c/ul>\n\u003ch2 id=\"permissions\">Permissions\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>P1:\u003c/strong> Identical to any other DocType — DocPerm, roles, permlevels — applied before delegation. \u003ccode>if_owner\u003c/code> requires the controller to return an \u003ccode>owner\u003c/code> value.\u003c/li>\u003c/ul>\n\u003ch2 id=\"data-model\">Data Model\u003c/h2>\n\u003cp>\u003cstrong>T1: DocType\u003c/strong> — new field\u003c/p>\n\u003cul>\u003cli>is virtual (yes/no)\u003c/li>\u003cli>sortable fields, filterable fields (declared by the controller at registration, cached in meta)\u003c/li>\u003c/ul>\n\u003ch2 id=\"verification-definition-of-done\">Verification (definition of done)\u003c/h2>\n\u003col>\u003cli>A sample app registers a virtual DocType backed by a fixture HTTP service.\u003c/li>\u003cli>HTTP against the running server: list with filters and paging, get one, create, update, delete — all observably hitting the fixture service.\u003c/li>\u003cli>A controller missing a method fails registration at boot with a named error.\u003c/li>\u003cli>Adding a child-table field to the virtual DocType is rejected.\u003c/li>\u003cli>Playwright: the generic list and form render it, with the virtual badge.\u003c/li>\u003cli>No \u003ccode>tab_*\u003c/code> table exists for it after the run.\u003c/li>\u003c/ol>\n\u003ch2 id=\"out-of-scope\">Out of Scope\u003c/h2>\n\u003cul>\u003cli>Any SQL pushdown, joins, or report-builder support.\u003c/li>\u003cli>Child tables and unique constraints on virtual DocTypes.\u003c/li>\u003cli>Postgres-backed sources — spec 0001 handles those far better.\u003c/li>\u003c/ul>"},{"group":"ADRs","slug":"adr-0007","title":"ADR 0007 — App & database topology","path":"docs/adr/0007-app-and-database-topology.md","mins":4,"html":"\u003ch1 id=\"adr-0007-app-and-database-topology-one-control-db-foreign-da\">ADR 0007: App and database topology — one control DB, foreign data bound per DocType\u003c/h1>\n\u003cul>\u003cli>\u003cstrong>Status:\u003c/strong> Proposed (2026-07-26)\u003c/li>\u003cli>\u003cstrong>Context docs:\u003c/strong> \u003ccode>docs/research/frappe-multi-app-and-multi-db.md\u003c/code>\u003c/li>\u003cli>\u003cstrong>Specs that implement this:\u003c/strong> \u003ccode>docs/specs/0001-external-data-sources.md\u003c/code>, \u003ccode>docs/specs/0002-virtual-doctypes.md\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>Featherbase already runs many apps in one instance the way Frappe does: an app is a manifest (\u003ccode>apps/server/src/apps.ts\u003c/code>) that owns DocTypes and hooks, and every installed app shares one Postgres database, one schema, and one flat \u003ccode>tab_*\u003c/code> namespace. That much is settled and matches the original.\u003c/p>\n\u003cp>Two questions are not settled:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Can different apps use different databases?\u003c/strong> Today every query in the process goes through the single \u003ccode>sql\u003c/code> pool in \u003ccode>apps/server/src/db.ts\u003c/code>, built from \u003ccode>config.databaseUrl\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Can an app be put on top of a database Featherbase did not create?\u003c/strong> The motivating case: a control schema on a managed remote Postgres (Railway), already carrying real data, written continuously by CLIs that are not going away. The ask is a management Desk over that schema, ideally with no schema change at all.\u003c/li>\u003c/ol>\n\u003cp>Frappe answers (1) with \"only per site\" and (2) with \"Virtual DocTypes or migrate the data in\" — see the research note. Featherbase does not have to copy either limitation verbatim, but it does have to protect two invariants:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Invariant 2\u003c/strong> — every mutation runs the full hook chain in \u003cem>one transaction\u003c/em>. A transaction cannot span two Postgres servers without 2PC.\u003c/li>\u003cli>\u003cstrong>Referential integrity\u003c/strong> — \u003ccode>Link\u003c/code> validation, delete protection and rename cascades are single-database SQL today.\u003c/li>\u003c/ul>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003cp>\u003cstrong>1. Apps never get their own database or their own schema.\u003c/strong> One control database per site holds all metadata (\u003ccode>tab_doctype\u003c/code>, \u003ccode>tab_docfield\u003c/code>, \u003ccode>tab_user\u003c/code>, permissions, versions, comments, files, jobs) and all Featherbase-owned document tables, for every installed app. App identity stays metadata, exactly as in Frappe.\u003c/p>\n\u003cp>**2. Foreign data is reached per \u003cem>DocType\u003c/em>, not per app.** A \u003ccode>Data Source\u003c/code> registry holds connections; an individual DocType may be \u003cem>bound\u003c/em> to \u003ccode>{data_source, schema, table}\u003c/code> with a per-field column mapping. One app can therefore mix local and remote DocTypes, and two apps can share one remote source — a finer and more useful granularity than \"app X lives on DB Y\".\u003c/p>\n\u003cp>\u003cstrong>3. Featherbase never issues DDL against a foreign source.\u003c/strong> Bound tables are introspected, never created, altered or dropped. Migrations, \u003ccode>createDocType\u003c/code> DDL, and the RLS policy generator all skip bound DocTypes.\u003c/p>\n\u003cp>\u003cstrong>4. A bound DocType is usable with no change to the foreign schema\u003c/strong>, provided the table has a stable single-column primary key. Featherbase's standard columns are \u003cem>mapped when a matching column exists and synthesised when it does not\u003c/em>. Features that genuinely need a column (owner-scoped permissions, optimistic locking) degrade explicitly and are opt-in, not silently broken.\u003c/p>\n\u003cp>\u003cstrong>5. Cross-source atomicity is not offered.\u003c/strong> A save touching both the control DB and a foreign source is two transactions, ordered foreign-last, with the failure mode documented at the API. We do not implement 2PC.\u003c/p>\n\u003cp>\u003cstrong>6. Non-Postgres sources go through a Virtual DocType controller protocol\u003c/strong>, mirroring Frappe's, so there is one well-trodden escape hatch instead of a family of ad-hoc integrations.\u003c/p>\n\u003ch2 id=\"alternatives-considered\">Alternatives considered\u003c/h2>\n\u003cp>\u003cstrong>Per-app database routing (\u003ccode>app → connection\u003c/code>).\u003c/strong> Rejected. It sounds like the natural reading of \"can one app use a remote PG\", but it breaks both invariants at once: a hook chain spanning two apps could not be one transaction, and \u003ccode>Link\u003c/code> fields between apps would need cross-database validation on every save. It also solves the wrong problem — the motivating case is \u003cem>one schema of foreign data\u003c/em>, not \u003cem>one app's worth of Featherbase tables living elsewhere\u003c/em>.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>postgres_fdw\u003c/code> / foreign tables in the control DB.\u003c/strong> Attractive because the existing query builder would work unmodified. Rejected as the \u003cem>primary\u003c/em> mechanism: it needs superuser/extension rights on the control database, moves credentials into the database, makes network failures look like local query failures, and pushes down predicates unpredictably. It stays available as a later per-source optimisation, invisible to the spec.\u003c/p>\n\u003cp>\u003cstrong>ETL the control schema into local tables.\u003c/strong> Rejected outright: the CLIs keep writing, so any copy is stale by construction and a management app over stale data is misleading.\u003c/p>\n\u003cp>\u003cstrong>Copy Frappe exactly — Virtual DocTypes only.\u003c/strong> Rejected as the \u003cem>only\u003c/em> mechanism. For a plain Postgres table it throws away everything Featherbase already generates (filters, sort, pagination, count) and makes the app author reimplement them by hand, which is precisely the class of bug frappe#17282 tracks. Virtual DocTypes remain, but as the fallback for non-SQL sources.\u003c/p>\n\u003ch2 id=\"consequences\">Consequences\u003c/h2>\n\u003cul>\u003cli>\u003ccode>apps/server/src/db.ts\u003c/code> grows a resolver: \"give me the client for this DocType\", defaulting to the control pool. Every call site that hardcodes the \u003ccode>sql\u003c/code> import for \u003cem>document data\u003c/em> (\u003ccode>document.ts\u003c/code>, \u003ccode>query.ts\u003c/code>) must route through it; metadata call sites stay on the control pool deliberately.\u003c/li>\u003cli>\u003ccode>tableName()\u003c/code> stops being the single source of truth for where a DocType's rows live; it becomes the default when no binding exists.\u003c/li>\u003cli>Postgres RLS (\u003ca class=\"fid-link\" href=\"#/f/PERM-004\">PERM-004\u003c/a>) protects control-DB tables only. Bound DocTypes are protected by the server's permission layer alone — which is already the only path clients have (invariant 2), but it must be stated, because the \u003ccode>desk_client\u003c/code> role guarantee does not extend to a foreign server.\u003c/li>\u003cli>The test harness (\u003ccode>feather-testing-postgres\u003c/code>) rolls back one transaction on one connection. Tests touching a bound DocType need a second sandbox against the source, or a fixture source; the spec pins this down.\u003c/li>\u003cli>Sites (\u003ccode>tenancy.ts\u003c/code>, schema-per-site) and data sources are orthogonal axes and must not be conflated: a site is \u003cem>ours\u003c/em>, a source is \u003cem>theirs\u003c/em>.\u003c/li>\u003c/ul>"},{"group":"ADRs","slug":"adr-0006","title":"ADR 0006 — React + Hono + Postgres","path":"docs/adr/0006-stack-react-hono-postgres.md","mins":2,"html":"\u003ch1 id=\"adr-0006-react-hono-postgres\">ADR 0006: React + Hono + Postgres\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Accepted · \u003cstrong>Date:\u003c/strong> 2026-07-21 · \u003cstrong>Supersedes:\u003c/strong> 0001, 0002, 0003, 0004\u003c/p>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>ADR 0001 chose Convex, and ADRs 0002–0004 built storage, definition, and materialization decisions on top of it. That line of work reached capability 4 (sign-in) before a parallel experiment — a from-scratch implementation on React + Hono + Postgres, developed under the working name \u003ccode>frappe-clone\u003c/code> — overtook it.\u003c/p>\n\u003cp>The parallel implementation is further along on every axis that matters:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Frappe wire-format compatibility.\u003c/strong> Sessions ride an HttpOnly \u003ccode>sid\u003c/code> cookie alongside a Bearer token, \u003ccode>POST /api/method/login\u003c/code> and \u003ccode>/logout\u003c/code> are Frappe-shaped, error bodies carry Frappe's \u003ccode>exc_type\u003c/code>, and the \u003ccode>frappe.client.*\u003c/code> RPC namespace is implemented. Replicating Frappe means matching its wire format, which is far more natural against a SQL backend.\u003c/li>\u003cli>\u003cstrong>A real test story.\u003c/strong> A 320-test server suite and a component suite run against actual Postgres using per-test transaction rollback, extracted as \u003ca href=\"https://github.com/siraj-samsudeen/feather-testing-postgres\" target=\"_blank\" rel=\"noopener\">feather-testing-postgres\u003c/a>. This delivers the deterministic-testing requirement from ADR 0001 without depending on a vendor-specific in-memory backend.\u003c/li>\u003cli>\u003cstrong>Metadata-driven storage on SQL.\u003c/strong> DocTypes map onto Postgres tables directly, which is what Frappe does and what ADR 0002's per-DocType tables plus a \u003ccode>fieldIndex\u003c/code> sidecar were approximating on a document store.\u003c/li>\u003c/ul>\n\u003cp>The decisive point is that Featherbase's goal is to replicate Frappe's core ideas. Frappe is built on a relational database, and its metadata engine, query builder, and permission model all assume one. Reimplementing that on a document store meant paying translation costs on every feature.\u003c/p>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003cp>Featherbase is built on \u003cstrong>React + Hono + Postgres\u003c/strong>, as a pnpm workspace:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Workspace\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>apps/server\u003c/code>\u003c/td>\u003ctd>Hono API — DocType engine, Frappe-compatible REST/RPC, auth\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apps/web\u003c/code>\u003c/td>\u003ctd>React Desk UI — metadata-driven grid, form, and detail views\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>packages/shared\u003c/code>\u003c/td>\u003ctd>Types and contracts shared across server and web\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>packages/feather-testing-postgres\u003c/code>\u003c/td>\u003ctd>SQL Sandbox test harness (also published standalone)\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote>\u003cp>\u003cem>Update 2026-07-22:\u003c/em> \u003ccode>packages/feather-testing-postgres\u003c/code> was extracted to \u003ca href=\"https://github.com/siraj-samsudeen/feather-testing-postgres\" target=\"_blank\" rel=\"noopener\">its own repo\u003c/a> and is now consumed as a published npm dependency; it is no longer a workspace package.\u003c/p>\u003c/blockquote>\n\u003cp>The Convex implementation is retired. Its history is preserved on the \u003ccode>archive/convex-v1\u003c/code> tag, and its capability specs live under docs/archive/convex-capabilities/.\u003c/p>\n\u003ch2 id=\"consequences\">Consequences\u003c/h2>\n\u003cp>\u003cstrong>Gained.\u003c/strong> Direct Frappe parity on wire format and data model; a test approach that exercises the production code path against a real database; no vendor lock-in on the backend; SQL as an escape hatch for anything the metadata engine does not yet cover.\u003c/p>\n\u003cp>\u003cstrong>Lost.\u003c/strong> Convex's built-in reactivity, which ADR 0001 valued for Glide-style computed data. Reactive/computed fields must now be designed explicitly rather than inherited from the platform, and durable workflow execution — ADR 0001's third requirement — is unsolved on this stack and remains open.\u003c/p>\n\u003cp>\u003cstrong>Retained.\u003c/strong> ADR 0005 (the name) is unaffected, as is the vision in VISION.md and the research in research/, all of which are stack-independent.\u003c/p>"},{"group":"ADRs","slug":"adr-0005","title":"ADR 0005 — Naming: Featherbase","path":"docs/adr/0005-naming-featherbase.md","mins":1,"html":"\u003ch1 id=\"adr-0005-name-featherbase\">ADR 0005: Name — Featherbase\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Accepted · \u003cstrong>Date:\u003c/strong> 2026-07-08\u003c/p>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>The project needed a name fitting Siraj's existing \u003cstrong>feather\u003c/strong> ecosystem (feather-testing-core, feather-testing-convex, the feather-skills tooling). Constraint discovered during the check: \u003cstrong>FeathersJS\u003c/strong> is a long-established Node.js framework (\u003ccode>feathers\u003c/code> on npm), so the bare word \"feather\" was never safe for a JS framework; bare \u003ccode>feather\u003c/code> is also a taken npm package.\u003c/p>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003cp>\u003cstrong>Featherbase.\u003c/strong> npm-available at check time (2026-07-08), packages scoped as \u003ccode>@featherbase/*\u003c/code> (e.g. \u003ccode>@featherbase/core\u003c/code>, \u003ccode>@featherbase/flows\u003c/code>).\u003c/p>\n\u003ch2 id=\"why\">Why\u003c/h2>\n\u003cp>The only candidate that both extends the existing feather brand and describes the category (\u003ccode>-base\u003c/code> signals the Airtable/Supabase-adjacent data platform). Clearly distinct from FeathersJS. The promotion ladder gets a natural vocabulary for free: a runtime table _fledges_ into code.\u003c/p>\n\u003ch2 id=\"alternatives-considered\">Alternatives considered\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Name\u003c/th>\u003cth>npm at check\u003c/th>\u003cth>Rejected because\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Featherstack\u003c/td>\u003ctd>available\u003c/td>\u003ctd>Accurate but generic\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Calamus (a feather's quill shaft)\u003c/td>\u003ctd>available\u003c/td>\u003ctd>Elegant but obscure; abandons feather brand equity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Quillbase\u003c/td>\u003ctd>available\u003c/td>\u003ctd>Diverges from the feather-* ecosystem name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Feather / Fledge / Plume / Pluma\u003c/td>\u003ctd>taken\u003c/td>\u003ctd>npm collisions; FeathersJS adjacency\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>"},{"group":"ADRs","slug":"adr-0004","title":"ADR 0004 — Materialization (superseded)","path":"docs/adr/0004-materialization-admin-triggered.md","mins":3,"html":"\u003ch1 id=\"adr-0004-index-materialization-is-admin-triggered-stats-sugg\">ADR 0004: Index materialization is admin-triggered (stats-suggested later)\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Superseded by ADR 0006 · \u003cstrong>Date:\u003c/strong> 2026-07-08 · \u003cstrong>Amended:\u003c/strong> 2026-07-08 (staged indexes — see below)\u003c/p>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>Runtime (site-source) DocTypes filter through the fieldIndex sidecar (ADR 0002) — functional, but below native-index performance, with per-field write amplification. When a runtime table proves popular, it should be able to gain real Convex indexes. Developer-mode DocTypes always have native indexes via codegen (ADR 0003); the question is the upgrade path for runtime tables, and who triggers it.\u003c/p>\n\u003cp>Because records already live in per-DocType tables, materialization is \u003cstrong>adding the table to the generated \u003ccode>schema.ts\u003c/code> and deploying\u003c/strong> — Convex validates and backfills indexes in place, blocking the push until indexes are usable. To be risk-free for tables with messy legacy rows, the generated entry starts as \u003ccode>defineTable(v.any()).index(...)\u003c/code> — indexes without strict validation — tightened to a full generated validator later if promoted to a package.\u003c/p>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003cp>\u003cstrong>Admin-triggered materialization (Option 2), with stats-driven batch suggestions (Option 3) added later on the same plumbing.\u003c/strong>\u003c/p>\n\u003cp>The admin opens a DocType's performance panel → picks fields to index → the platform regenerates \u003ccode>schema.ts\u003c/code> from package JSONs + a materialization registry → a deploy runs (self-hosted: CLI \u003ccode>materialize\u003c/code> + \u003ccode>convex deploy\u003c/code>; managed: one click triggering CI or the Convex deploy API) → repository metadata flips that DocType's filter path from sidecar to native → a cleanup job drops its sidecar rows.\u003c/p>\n\u003cp>The resulting ladder — each rung a metadata/codegen change, zero data movement, independently reversible, round-trip tested:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Tier\u003c/th>\u003cth>Definition lives\u003c/th>\u003cth>Query path\u003c/th>\u003cth>How you get here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Runtime\u003c/td>\u003ctd>DB row\u003c/td>\u003ctd>Sidecar\u003c/td>\u003ctd>User creates it in the UI\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Materialized\u003c/td>\u003ctd>DB row\u003c/td>\u003ctd>Native indexes\u003c/td>\u003ctd>Admin one-click + deploy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Package\u003c/td>\u003ctd>JSON in git\u003c/td>\u003ctd>Native indexes + typed validator + code hooks\u003c/td>\u003ctd>Developer writes it, or promotes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Later (same mechanics): a scheduled \"schema sync\" that batches pending materializations and _suggests_ candidates from sidecar query statistics.\u003c/p>\n\u003ch2 id=\"consequences\">Consequences\u003c/h2>\n\u003cul>\u003cli>\u003ccode>schema.ts\u003c/code> is a \u003cstrong>fully generated artifact\u003c/strong> — deterministic output of (package JSONs + materialization registry), committed, never hand-edited.\u003c/li>\u003cli>Deploy credentials must be reachable from the admin flow (a deploy key in CI) — a real but manageable security surface.\u003c/li>\u003cli>Index backfill on huge tables takes time; bounded and automatic — and no longer deploy-blocking (see amendment).\u003c/li>\u003c/ul>\n\u003ch2 id=\"amendment-staged-indexes-2026-07-08\">Amendment — staged indexes (2026-07-08)\u003c/h2>\n\u003cp>Convex now supports \u003cstrong>staged indexes\u003c/strong>: \u003ccode>.index(\"...\", [...], { staged: true })\u003c/code> backfills asynchronously \u003cstrong>without blocking the deploy\u003c/strong>, monitored in the dashboard, and a follow-up deploy removes the flag to enable the index (\u003ca href=\"https://docs.convex.dev/database/reading-data/indexes/\" target=\"_blank\" rel=\"noopener\">docs\u003c/a>, verified 2026-07-08; revalidation report). This refines the mechanism, not the decision:\u003c/p>\n\u003col>\u003cli>Materialization deploy emits the new index entries \u003cstrong>staged\u003c/strong> — the deploy returns immediately even on huge tables.\u003c/li>\u003cli>The platform monitors backfill state; when ready, a second generated deploy enables the index.\u003c/li>\u003cli>Only then does repository metadata flip the DocType's filter path from sidecar to native, and the sidecar-cleanup job runs.\u003c/li>\u003c/ol>\n\u003cp>The \"blocking the push until indexes are usable\" behavior described in Context remains the default for non-staged indexes and is still fine for small tables; the codegen should choose staged automatically above a row-count threshold.\u003c/p>\n\u003ch2 id=\"alternatives-rejected\">Alternatives rejected\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Sidecar forever:\u003c/strong> leaves the explicit requirement (admin upgrade path) unmet.\u003c/li>\u003cli>\u003cstrong>Instant auto-deploy on every runtime table creation:\u003c/strong> production deploys triggered by arbitrary user actions — latency on the user's click, blast radius, deploy-key on the hot path.\u003c/li>\u003cli>\u003cstrong>Pre-provisioned index slots:\u003c/strong> promotion without deploys, but requires migrating rows into a shared table — the Frappe failure mode this architecture exists to eliminate.\u003c/li>\u003c/ul>"},{"group":"ADRs","slug":"adr-0003","title":"ADR 0003 — Definitions as JSON, two sources","path":"docs/adr/0003-definitions-as-json-two-sources.md","mins":2,"html":"\u003ch1 id=\"adr-0003-definitions-are-json-with-two-sources-package-site\">ADR 0003: Definitions are JSON with two sources (package | site)\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Superseded by ADR 0006 · \u003cstrong>Date:\u003c/strong> 2026-07-08\u003c/p>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>Two authoring modes are required. \u003cstrong>Mode 1 (developer):\u003c/strong> DocTypes defined as config files in a git-tracked app package, applied on deploy — plus Excel-drop and AI-chat generation targeting the same files. \u003cstrong>Mode 2 (runtime):\u003c/strong> production users create master/lookup tables at user level through the UI, no developer skills expected.\u003c/p>\n\u003cp>The critical failure to avoid, learned from Frappe: users start runtime tables, hit complexity, need to \"convert to code\" — and Frappe's export machinery (module assignment, fixtures, Custom Field/Property Setter overlays) was buggy and unreliable.\u003c/p>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003col>\u003cli>\u003cstrong>One canonical artifact format: JSON.\u003c/strong> Every DocType is a JSON document validated against a published JSON Schema. (JSON over YAML: round-trip fidelity and schema validation matter more than hand-editability, since files are mostly written by the UI, the Excel importer, or the AI agent — the same call Frappe made.)\u003c/li>\u003cli>Each definition carries \u003ccode>source: \"package\"\u003c/code> (file in git, synced to the site on deploy, with drift detection) or \u003ccode>source: \"site\"\u003c/code> (row in the database, created at runtime).\u003c/li>\u003cli>\u003cstrong>Package mode gets full codegen:\u003c/strong> DocType JSON → generated \u003ccode>schema.ts\u003c/code> entry (typed validator + native indexes) + TypeScript types + typed repository accessors + lifecycle-hook stubs (\u003ccode>validate\u003c/code>, \u003ccode>beforeSave\u003c/code>, …). Applied hot by \u003ccode>convex dev\u003c/code> on save; by \u003ccode>convex deploy\u003c/code> in production. Generated files are never hand-edited.\u003c/li>\u003cli>\u003cstrong>Site mode gets declarative power only:\u003c/strong> validations + Flows, no code hooks. Attaching code requires promotion to a package.\u003c/li>\u003cli>\u003cstrong>Promotion = serialize the same JSON to a package file, flip \u003ccode>source\u003c/code>, run codegen.\u003c/strong> Demotion is the reverse. Zero data movement (ADR 0002). The round-trip (DB → file → DB) must be byte-identical — enforced as a property test, forever.\u003c/li>\u003cli>An \u003cstrong>app package\u003c/strong> is a folder: \u003ccode>doctypes/*.json\u003c/code>, \u003ccode>flows/*.json\u003c/code>, \u003ccode>layouts/*.json\u003c/code>, \u003ccode>seeds/*\u003c/code>, \u003ccode>hooks/*.ts\u003c/code>. This is the unit the AI agent reads and writes — the agent edits validated JSON artifacts, never raw framework code.\u003c/li>\u003c/ol>\n\u003ch2 id=\"consequences\">Consequences\u003c/h2>\n\u003cul>\u003cli>Definition-to-git promotion and index materialization (ADR 0004) are \u003cstrong>independent axes\u003c/strong> — a table can gain native indexes while remaining site-owned, or move to git without materializing, or both.\u003c/li>\u003cli>The AI authoring loop becomes machine-checkable end-to-end: generate → JSON-schema validate → apply to ephemeral in-memory test site (\u003ccode>convex-test\u003c/code>) → run generated tests → preview → approve → commit.\u003c/li>\u003cli>Excel import is an _authoring input_, not a storage concern: infer columns → types/enums/relation suggestions → preview → approve → emits a DocType JSON (+ seed data) into whichever source the actor is working in.\u003c/li>\u003c/ul>\n\u003ch2 id=\"alternatives-rejected\">Alternatives rejected\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Everything-is-code-always\u003c/strong> (GlideOS/Chef pattern: runtime edits trigger programmatic deploys via Convex's Management API): maximal git purity, but a production ERP user adding a lookup table must not trigger a code deployment, and mode 2 would disappear. We keep its _agent loop_ at the artifact level only.\u003c/li>\u003cli>\u003cstrong>YAML canonical:\u003c/strong> worse round-trip guarantees, no benefit for machine-authored files.\u003c/li>\u003c/ul>"},{"group":"ADRs","slug":"adr-0002","title":"ADR 0002 — Per-DocType tables + sidecar","path":"docs/adr/0002-storage-per-doctype-tables-plus-fieldindex-sidecar.md","mins":2,"html":"\u003ch1 id=\"adr-0002-per-doctype-tables-fieldindex-sidecar\">ADR 0002: Per-DocType tables + fieldIndex sidecar\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Superseded by ADR 0006 · \u003cstrong>Date:\u003c/strong> 2026-07-08\u003c/p>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>Frappe creates a \u003cstrong>real database table per DocType\u003c/strong> — including user-created custom DocTypes at runtime (\u003ccode>DocType.on_update\u003c/code> → \u003ccode>frappe.db.updatedb\u003c/code> → \u003ccode>CREATE TABLE\u003c/code>, with real columns and indexes; custom fields become \u003ccode>ALTER TABLE\u003c/code>). That symmetry — developer-defined and user-defined tables get identical physical treatment — is a property worth preserving.\u003c/p>\n\u003cp>Convex allows \u003cstrong>runtime table creation\u003c/strong> (tables auto-create on first insert) but \u003cstrong>not runtime index creation\u003c/strong> (indexes exist only in the deploy-time \u003ccode>schema.ts\u003c/code>). Copying Frappe's layout naively would give runtime tables whose user-defined fields can only be filtered by full scan (32k documents-scanned cap per transaction).\u003c/p>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Every DocType gets its own Convex table\u003c/strong>, auto-created on first insert, holding full records with Frappe-style system fields (\u003ccode>name\u003c/code>, \u003ccode>owner\u003c/code>, \u003ccode>creation\u003c/code>, \u003ccode>modified\u003c/code>, \u003ccode>docstatus\u003c/code>).\u003c/li>\u003cli>\u003cstrong>One fixed sidecar table\u003c/strong> \u003ccode>fieldIndex: {doctype, field, value, docId}\u003c/code> with a composite index on \u003ccode>[doctype, field, value]\u003c/code> serves filter/sort for fields that don't have native indexes. Because the sidecar is fixed, its deploy-time indexes serve arbitrary user-defined fields forever.\u003c/li>\u003cli>The repository layer maintains sidecar rows on write — \u003cstrong>only for fields marked filterable/sortable in DocType metadata\u003c/strong> (Frappe's \u003ccode>in_standard_filter\u003c/code> concept), so write amplification is opt-in per field.\u003c/li>\u003cli>Reads by id and grid views hit the DocType's own table directly; the sidecar exists purely to answer \"filter/sort by any user field\" without scans.\u003c/li>\u003c/ol>\n\u003ch2 id=\"consequences\">Consequences\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Promotion never moves data\u003c/strong> — a runtime table's records already live in their own table; every rung of the ladder (ADR 0004) is a metadata/codegen change.\u003c/li>\u003cli>Both modes are physically symmetric, like Frappe.\u003c/li>\u003cli>Per-table inspectability in the Convex dashboard, per-table export.\u003c/li>\u003cli>A future Postgres port maps 1:1 onto Frappe/Baserow's real-DDL model; the sidecar dissolves into native \u003ccode>CREATE INDEX\u003c/code>.\u003c/li>\u003cli>Aggregations over large tables use the Convex Aggregate component or denormalized counters — free-form aggregation is not a goal of this layer (computed columns, capability 8, own that).\u003c/li>\u003c/ul>\n\u003ch2 id=\"alternatives-rejected\">Alternatives rejected\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Single generic \u003ccode>documents\u003c/code> table (pure EAV):\u003c/strong> loses Frappe symmetry, dashboard inspectability, and per-table operations; no compensating benefit since the sidecar carries indexed queries either way.\u003c/li>\u003cli>\u003cstrong>Shared \"hot records\" table with pre-provisioned indexed slot fields:\u003c/strong> promotion without deploys, but reintroduces data migration on promotion (the exact Frappe failure mode this design eliminates), slot ceilings, and type coercion.\u003c/li>\u003c/ul>"},{"group":"ADRs","slug":"adr-0001","title":"ADR 0001 — Convex stack (superseded)","path":"docs/adr/0001-stack-convex-react-vite.md","mins":2,"html":"\u003ch1 id=\"adr-0001-convex-react-vite-tanstack-router\">ADR 0001: Convex + React + Vite + TanStack Router\u003c/h1>\n\u003cp>\u003cstrong>Status:\u003c/strong> Superseded by ADR 0006 · \u003cstrong>Date:\u003c/strong> 2026-07-08\u003c/p>\n\u003ch2 id=\"context\">Context\u003c/h2>\n\u003cp>Featherbase needs a backend for a metadata-driven platform with four hard requirements, in priority order: (1) runtime user-defined schema, (2) Glide-style reactive computed data, (3) durable workflow execution (retries, waits, human-in-the-loop), (4) deterministic automated testing. Candidates: Convex, InstantDB, Supabase. Full analysis: research/stack-comparison.md.\u003c/p>\n\u003cp>An existing asset weighs on the decision: \u003ca href=\"https://github.com/siraj-samsudeen/feather-testing-convex\" target=\"_blank\" rel=\"noopener\">feather-testing-convex\u003c/a> + a proven testing philosophy built around \u003ccode>convex-test\u003c/code>'s in-memory backend and fake-timer control.\u003c/p>\n\u003ch2 id=\"decision\">Decision\u003c/h2>\n\u003cp>\u003cstrong>Convex\u003c/strong> backend; \u003cstrong>React + Vite + TanStack Router\u003c/strong> frontend.\u003c/p>\n\u003ch2 id=\"why\">Why\u003c/h2>\n\u003cul>\u003cli>Criterion 1 is _solvable by design_ on Convex (see ADR 0002); criteria 2–4 are _not solvable well_ anywhere else:\u003cul>\u003cli>\u003cstrong>InstantDB\u003c/strong> has no server-side execution at all (no functions, jobs, cron, queues) — disqualifying for the workflow pillar — and no test harness.\u003c/li>\u003cli>\u003cstrong>Supabase\u003c/strong> has no query-level reactivity (row events only) — Glide-style live computed columns would mean hand-building a reactivity layer — and durable workflows require bolting on a second platform (Trigger.dev/Inngest).\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003ccode>@convex-dev/workflow\u003c/code> provides journaled, exactly-once, restart-surviving execution with \u003ccode>step.sleep()\u003c/code> and \u003ccode>step.awaitEvent()\u003c/code> — the human-in-the-loop primitive — for free.\u003c/li>\u003cli>The testing asset transfers 1:1. On InstantDB the in-memory backend would have to be built from scratch (~10× the library's size); on Supabase testing drops to Docker-grade.\u003c/li>\u003cli>React over Svelte: the builder-critical ecosystem is React-first or React-only (Glide Data Grid, React Flow, dnd-kit, TanStack suite), Convex's React bindings are first-class, and LLM codegen is strongest at React.\u003c/li>\u003c/ul>\n\u003ch2 id=\"the-counterargument-we-accepted\">The counterargument we accepted\u003c/h2>\n\u003cp>Supabase is boring, unkillable Postgres where user tables are real tables and runtime \u003ccode>CREATE INDEX\u003c/code> is trivial — and Supabase ($5B, 4M devs) will outlive Convex (~11 people, Series A, FSL-licensed). We accept this because Featherbase's essence is _live computed data + workflows_, the two things Supabase gives least of, and the risk is hedged three layers deep: Convex Cloud → self-hosted Convex (FSL converts each release to Apache-2.0 after two years; runs on Postgres) → a Postgres port through the repository seam.\u003c/p>\n\u003ch2 id=\"consequences\">Consequences\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Invariant:\u003c/strong> DocType metadata and flow definitions are portable JSON, never Convex-specific artifacts.\u003c/li>\u003cli>\u003cstrong>Invariant:\u003c/strong> all record access goes through one repository layer — the only seam a future Postgres port would re-implement.\u003c/li>\u003cli>No runtime index creation on Convex → the storage design of ADR 0002.\u003c/li>\u003cli>Rejected: hybrid Convex-for-app + Supabase-for-data (two reactivity and permission models is unaffordable complexity now).\u003c/li>\u003c/ul>"},{"group":"Research","slug":"frappe-architecture","title":"Frappe architecture study (v17)","path":"docs/research/frappe-architecture.md","mins":12,"html":"\u003ch1 id=\"frappe-framework-architecture-study\">Frappe Framework Architecture Study\u003c/h1>\n\u003cblockquote>\u003cp>\u003cstrong>Provenance:\u003c/strong> research agent report, 2026-07-08, from a study of a fresh shallow clone of frappe/frappe (v17.0.0-dev, develop branch). \u003ccode>$REPO\u003c/code> refers to the reference clone kept at \u003ccode>NonDropBoxProjects/frappe_clone/frappe\u003c/code>. Preserved verbatim; the original goal framing (\"we plan to fork it\") predates the decision to rewrite in JS — the architecture map and gap analysis remain the canonical reference for which Frappe concepts Featherbase re-creates.\u003c/p>\u003c/blockquote>\n\u003chr>\n\u003ch1 id=\"frappe-framework-v17-0-0-dev-develop-branch-architecture-map\">Frappe Framework (v17.0.0-dev, develop branch) — Architecture Map &amp; Glide-Style Workflow Gap Analysis\u003c/h1>\n\u003cp>All paths below are under \u003ccode>$REPO = /Users/siraj/Desktop/NonDropBoxProjects/frappe_clone/frappe\u003c/code>.\u003c/p>\n\u003chr>\n\u003ch2 id=\"1-core-architecture-map\">1. Core Architecture Map\u003c/h2>\n\u003ch3 id=\"1-1-doctype-metadata-system-schema-ui-as-data\">1.1 DocType metadata system (schema + UI as data)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>DocType controller\u003c/strong>: \u003ccode>$REPO/frappe/core/doctype/doctype/doctype.py\u003c/code> — a DocType is itself a document; \u003ccode>on_update\u003c/code> syncs the DB table, validates fields (incl. \u003ccode>validate_fetch_from\u003c/code>, \u003ccode>validate_virtual_doctype_methods\u003c/code>), builds global search config.\u003c/li>\u003cli>\u003cstrong>Field definitions\u003c/strong>: \u003ccode>$REPO/frappe/core/doctype/docfield/docfield.json\u003c/code> — each field carries schema (\u003ccode>fieldtype\u003c/code>, \u003ccode>options\u003c/code>) _and_ UI metadata (\u003ccode>depends_on\u003c/code>, \u003ccode>read_only_depends_on\u003c/code>, \u003ccode>mandatory_depends_on\u003c/code>, \u003ccode>in_list_view\u003c/code>, \u003ccode>fetch_from\u003c/code>, \u003ccode>is_virtual\u003c/code>, \u003ccode>default\u003c/code>). Schema and UI are one artifact.\u003c/li>\u003cli>\u003cstrong>Meta loading\u003c/strong>: \u003ccode>$REPO/frappe/model/meta.py\u003c/code> — \u003ccode>frappe.get_meta(doctype)\u003c/code> returns cached, processed metadata (fields, permissions, table fields, workflow state field via \u003ccode>get_workflow_name\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Customization without forking doctypes\u003c/strong>: \u003ccode>$REPO/frappe/custom/doctype/custom_field/\u003c/code>, \u003ccode>property_setter/\u003c/code>, \u003ccode>customize_form/\u003c/code> — layered overrides stored as data. The Workflow engine itself uses this (auto-creates a hidden Custom Field for the state, \u003ccode>workflow.py:create_custom_field_for_workflow_state\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Sync\u003c/strong>: \u003ccode>$REPO/frappe/model/sync.py\u003c/code> — doctype JSON files on disk ⇄ DB on migrate; this is how an app ships doctypes.\u003c/li>\u003c/ul>\n\u003ch3 id=\"1-2-document-orm\">1.2 Document ORM\u003c/h3>\n\u003cul>\u003cli>\u003ccode>$REPO/frappe/model/document.py\u003c/code> + \u003ccode>base_document.py\u003c/code> — \u003ccode>Document\u003c/code> lifecycle: \u003ccode>insert → before_validate → validate → before_save → (db write) → on_update → on_change\u003c/code>; submittable docs add \u003ccode>before_submit/on_submit\u003c/code>, \u003ccode>before_cancel/on_cancel\u003c/code>, \u003ccode>on_update_after_submit\u003c/code>; plus rename/trash/discard events. \u003ccode>docstatus\u003c/code> (0 draft / 1 submitted / 2 cancelled, \u003ccode>$REPO/frappe/model/docstatus.py\u003c/code>).\u003c/li>\u003cli>\u003cstrong>\u003ccode>run_method\u003c/code> is the universal event bus\u003c/strong> (\u003ccode>document.py:1638\u003c/code>): every lifecycle method runs → (a) the controller method, (b) all \u003ccode>doc_events\u003c/code> hooks from every installed app (\u003ccode>Document.hook\u003c/code> composer at \u003ccode>document.py:2005-2055\u003c/code>, resolved via \u003ccode>frappe.get_doc_hooks()\u003c/code> in \u003ccode>$REPO/frappe/__init__.py:985\u003c/code>), then (c) \u003ccode>run_notifications\u003c/code> (Notification doctype), (d) \u003ccode>run_webhooks\u003c/code> (Webhook doctype), (e) \u003ccode>run_server_script_for_doc_event\u003c/code> (Server Script doctype). \u003cstrong>This one function is the natural attach point for any new trigger engine.\u003c/strong>\u003c/li>\u003cli>Query layer: \u003ccode>$REPO/frappe/model/db_query.py\u003c/code> (list queries with permission filtering), \u003ccode>$REPO/frappe/query_builder/\u003c/code> (pypika-based).\u003c/li>\u003c/ul>\n\u003ch3 id=\"1-3-hooks-system\">1.3 Hooks system\u003c/h3>\n\u003cul>\u003cli>Per-app \u003ccode>hooks.py\u003c/code> (frappe's own: \u003ccode>$REPO/frappe/hooks.py\u003c/code>) aggregated across installed apps by \u003ccode>frappe.get_hooks()\u003c/code> (\u003ccode>$REPO/frappe/__init__.py:1035\u003c/code>, \u003ccode>_load_app_hooks\u003c/code>).\u003c/li>\u003cli>Key hook families: \u003ccode>doc_events\u003c/code> (doctype → event → dotted handler paths, \u003ccode>\"*\"\u003c/code> wildcard supported), \u003ccode>scheduler_events\u003c/code> (\u003ccode>cron\u003c/code>/\u003ccode>all\u003c/code>/\u003ccode>hourly\u003c/code>/\u003ccode>daily\u003c/code>/...), \u003ccode>override_whitelisted_methods\u003c/code>, \u003ccode>permission_query_conditions\u003c/code>, \u003ccode>has_permission\u003c/code>, \u003ccode>before_request/after_request\u003c/code>, \u003ccode>before_job/after_job\u003c/code>, \u003ccode>extend_bootinfo\u003c/code>, and (new in v17) \u003cstrong>\u003ccode>workflow_methods\u003c/code>\u003c/strong> — app-registered named tasks selectable in workflow transitions.\u003c/li>\u003cli>Frappe wires its own automations through wildcard doc_events (\u003ccode>$REPO/frappe/hooks.py:163-212\u003c/code>): workflow action processing, assignment rules, milestone tracking all listen on \u003ccode>\"*\"\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"1-4-permission-model\">1.4 Permission model\u003c/h3>\n\u003cul>\u003cli>\u003ccode>$REPO/frappe/permissions.py\u003c/code> — 14 rights (\u003ccode>select, read, write, create, delete, submit, cancel, amend, print, email, report, import, export, share\u003c/code>).\u003c/li>\u003cli>Layers: \u003cstrong>Role permissions\u003c/strong> (DocPerm rows in the doctype JSON / Custom DocPerm, with \u003ccode>permlevel\u003c/code> for field-level), \u003cstrong>\u003ccode>if_owner\u003c/code>\u003c/strong> (row-level \"own documents only\", \u003ccode>get_doc_permissions:254-268\u003c/code>), \u003cstrong>User Permissions\u003c/strong> (\u003ccode>$REPO/frappe/core/doctype/user_permission/\u003c/code> — restrict a user to specific link values, applied as filters in \u003ccode>db_query.py\u003c/code>), \u003cstrong>DocShare\u003c/strong> (\u003ccode>$REPO/frappe/share.py\u003c/code>, per-document grants), plus programmable \u003ccode>permission_query_conditions\u003c/code> / \u003ccode>has_permission\u003c/code> hooks and \u003cstrong>Permission Query Server Scripts\u003c/strong> (row-level SQL conditions written in the UI).\u003c/li>\u003cli>Enforced both per-document (\u003ccode>has_permission\u003c/code>) and in list queries (\u003ccode>db_query.py\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"1-5-rest-api\">1.5 REST API\u003c/h3>\n\u003cul>\u003cli>\u003ccode>$REPO/frappe/api/__init__.py\u003c/code> — versioned werkzeug URL map. \u003cstrong>v1\u003c/strong> (\u003ccode>v1.py\u003c/code>): \u003ccode>/api/resource/{doctype}[/{name}]\u003c/code> CRUD + \u003ccode>/api/method/{dotted.path}\u003c/code> RPC to \u003ccode>@frappe.whitelist()\u003c/code> functions. \u003cstrong>v2\u003c/strong> (\u003ccode>v2.py\u003c/code>): \u003ccode>/api/v2/document/{doctype}[/{name}]\u003c/code>, doc method execution, bulk update/delete, \u003ccode>/api/v2/meta/{doctype}\u003c/code>, and \u003ccode>/api/v2/discovery\u003c/code> (API discovery). Auth: session, API key/secret, OAuth2 (\u003ccode>$REPO/frappe/oauth.py\u003c/code>, \u003ccode>integrations/doctype/oauth_*\u003c/code>).\u003c/li>\u003cli>Realtime push to clients: \u003ccode>$REPO/frappe/realtime/__init__.py\u003c/code> (\u003ccode>publish_realtime\u003c/code>, \u003ccode>publish_progress\u003c/code>) → Node socket.io server (\u003ccode>$REPO/realtime/\u003c/code>, \u003ccode>socketio.js\u003c/code>); \u003ccode>doc.notify_update()\u003c/code> pushes doc refresh events.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2-existing-workflow-automation-inventory\">2. Existing Workflow + Automation Inventory\u003c/h2>\n\u003ch3 id=\"2-1-workflow-module-state-machine-for-approvals\">2.1 Workflow module (state machine for approvals)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Engine\u003c/strong>: \u003ccode>$REPO/frappe/model/workflow.py\u003c/code>. One active Workflow per doctype (\u003ccode>get_workflow_name\u003c/code>, cached). States live in a (custom) Link field on the target doctype pointing to Workflow State.\u003c/li>\u003cli>\u003cstrong>Doctypes\u003c/strong> (\u003ccode>$REPO/frappe/workflow/doctype/\u003c/code>):\u003cul>\u003cli>\u003ccode>workflow/\u003c/code> — parent: \u003ccode>document_type\u003c/code>, \u003ccode>is_active\u003c/code>, \u003ccode>send_email_alert\u003c/code>, \u003ccode>workflow_state_field\u003c/code>, \u003ccode>states[]\u003c/code>, \u003ccode>transitions[]\u003c/code>, and \u003cstrong>\u003ccode>workflow_data\u003c/code> (JSON)\u003c/strong> — persisted node/edge canvas positions for the visual builder.\u003c/li>\u003cli>\u003ccode>workflow_document_state/\u003c/code> (child \"states\") — \u003ccode>state\u003c/code>, \u003ccode>doc_status\u003c/code>, \u003ccode>allow_edit\u003c/code> (role that may edit in this state), \u003ccode>update_field\u003c/code>/\u003ccode>update_value\u003c/code> (+\u003ccode>evaluate_as_expression\u003c/code>), \u003ccode>is_optional_state\u003c/code>, \u003ccode>send_email\u003c/code>, \u003ccode>next_action_email_template\u003c/code>, \u003ccode>workflow_builder_id\u003c/code>.\u003c/li>\u003cli>\u003ccode>workflow_transition/\u003c/code> (child) — \u003ccode>state → action → next_state\u003c/code>, \u003ccode>allowed\u003c/code> (role), \u003ccode>allow_self_approval\u003c/code>, \u003ccode>condition\u003c/code> (safe-eval'd Python against \u003ccode>doc\u003c/code> + a tiny whitelist: \u003ccode>get_workflow_safe_globals\u003c/code> gives only \u003ccode>frappe.db.get_value/get_list\u003c/code>, session, date utils), \u003ccode>send_email_to_creator\u003c/code>, \u003cstrong>\u003ccode>transition_tasks\u003c/code>\u003c/strong> (link to Workflow Action Master task list).\u003c/li>\u003cli>\u003ccode>workflow_state/\u003c/code>, \u003ccode>workflow_action_master/\u003c/code> — masters (state names/styles; action names).\u003c/li>\u003cli>\u003cstrong>New in v17\u003c/strong>: \u003ccode>workflow_transition_task/\u003c/code> + \u003ccode>workflow_transition_tasks/\u003c/code> — per-transition task lists. \u003ccode>apply_workflow\u003c/code> (\u003ccode>workflow.py:152-203\u003c/code>) executes tasks \u003cstrong>sync (same transaction) or async (\u003ccode>frappe.enqueue\u003c/code>)\u003c/strong>; built-in task types are \u003ccode>Webhook\u003c/code> and \u003ccode>Server Script\u003c/code> (\u003ccode>DEFAULT_WORKFLOW_TASKS\u003c/code>), plus any app-defined \u003ccode>workflow_methods\u003c/code> hook entries. This is a nascent trigger-action seed already in core.\u003c/li>\u003cli>\u003ccode>workflow_action/\u003c/code> — the approval inbox: on every \u003ccode>on_update/on_cancel/on_trash\u003c/code> of any doc (\u003ccode>hooks.py\u003c/code> wildcard → \u003ccode>process_workflow_actions\u003c/code>), Workflow Action rows are created per permitted role for the next possible transitions, emails with \u003cstrong>guest-accessible approve/reject links\u003c/strong> are sent (\u003ccode>apply_action\u003c/code> is \u003ccode>@frappe.whitelist(allow_guest=True)\u003c/code>), and completed/stale actions are updated.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>State machine semantics\u003c/strong>: \u003ccode>get_transitions\u003c/code> filters by current state + user roles + condition; \u003ccode>apply_workflow\u003c/code> sets the state field, applies \u003ccode>update_field\u003c/code>, runs transition tasks, then saves/submits/cancels per target \u003ccode>doc_status\u003c/code>; \u003ccode>validate_workflow\u003c/code> blocks illegal state jumps on ordinary saves. Bulk approval supported (\u003ccode>bulk_workflow_approval\u003c/code>, ≤500 docs).\u003c/li>\u003cli>\u003cstrong>Visual builder — YES, one exists\u003c/strong>: Desk page \u003ccode>workflow-builder\u003c/code> (\u003ccode>$REPO/frappe/workflow/page/workflow_builder/workflow_builder.js\u003c/code>) lazily loads a \u003cstrong>Vue 3 + Pinia + @vue-flow\u003c/strong> canvas app (\u003ccode>$REPO/frappe/public/js/workflow_builder/\u003c/code> — \u003ccode>WorkflowBuilder.vue\u003c/code>, \u003ccode>store.js\u003c/code>, \u003ccode>components/{StateNode,ActionNode,TransitionEdge,ConnectionLine,Properties,Sidebar}.vue\u003c/code>). It edits states/transitions as draggable nodes/edges, persisting layout into \u003ccode>Workflow.workflow_data\u003c/code>. Still flagged \u003cstrong>\"Beta\"\u003c/strong> in the UI.\u003c/li>\u003cli>\u003cstrong>Limitations\u003c/strong>: one workflow per doctype; states must map onto the 3-value docstatus model; triggers only fire on _manual human transition actions_ (not on arbitrary field changes, schedules, or external events); no branching/parallel approval paths, no multi-step sequential logic beyond the linear state graph, no per-transition wait/delay, conditions are single Python expressions (no visual condition builder), transition tasks have no ordering UI/retry/error surface beyond logs, and the builder edits only the state machine — not the tasks/automation side.\u003c/li>\u003c/ul>\n\u003ch3 id=\"2-2-automation-module-repo-frappe-automation-doctype\">2.2 Automation module (\u003ccode>$REPO/frappe/automation/doctype/\u003c/code>)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Assignment Rule\u003c/strong> (\u003ccode>assignment_rule/\u003c/code>) — auto-assign docs (ToDo-based) via \u003ccode>assign_condition\u003c/code>/\u003ccode>unassign_condition\u003c/code>/\u003ccode>close_condition\u003c/code> (Python), strategies: Round Robin, Load Balancing, Based on Field, Weighted Distribution; due-date field mapping; runs on wildcard \u003ccode>on_update\u003c/code>/\u003ccode>on_cancel\u003c/code> doc_events.\u003c/li>\u003cli>\u003cstrong>Auto Repeat\u003c/strong> (\u003ccode>auto_repeat/\u003c/code>) — recurring document creation from a reference doc (frequency incl. day-of-month rules, end date, optional auto-submit, notification email); driven by daily scheduler (\u003ccode>make_auto_repeat_entry\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Milestone / Milestone Tracker\u003c/strong> (\u003ccode>milestone_tracker/\u003c/code>) — logs a Milestone row whenever a tracked field changes (\u003ccode>on_change\u003c/code> wildcard hook).\u003c/li>\u003cli>\u003cstrong>Reminder\u003c/strong> (\u003ccode>reminder/\u003c/code>) — user reminders, 15-min scheduler.\u003c/li>\u003c/ul>\n\u003ch3 id=\"2-3-server-script-client-script\">2.3 Server Script / Client Script\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Server Script\u003c/strong> (\u003ccode>$REPO/frappe/core/doctype/server_script/server_script.py\u003c/code>) — script types: \u003ccode>DocType Event\u003c/code>, \u003ccode>Scheduler Event\u003c/code> (auto-creates a Scheduled Job Type, incl. cron), \u003ccode>Permission Query\u003c/code>, \u003ccode>API\u003c/code> (custom REST endpoint with rate limiting/guest option), and \u003cstrong>\u003ccode>Workflow Task\u003c/code>\u003c/strong> (new). DocType events cover 24 hooks (\u003ccode>server_script_utils.py:EVENT_MAP\u003c/code> — before/after insert/save/submit/cancel/delete/rename/discard, update-after-submit, before_print, payment events). Dispatched from \u003ccode>run_method\u003c/code> via a cached \u003ccode>server_script_map\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Sandboxing — yes, RestrictedPython\u003c/strong>: \u003ccode>$REPO/frappe/utils/safe_exec.py\u003c/code> — \u003ccode>compile_restricted\u003c/code> with a custom \u003ccode>FrappeTransformer\u003c/code> policy, guarded getattr/iteration, and a large curated \u003ccode>get_safe_globals()\u003c/code> (whitelisted \u003ccode>frappe.*\u003c/code> API, no imports, no dunder access); \u003ccode>restrict_commit_rollback=True\u003c/code> for doc events. Site must opt in (\u003ccode>is_safe_exec_enabled\u003c/code>, \u003ccode>server_script_enabled\u003c/code> in site config). Same sandbox powers workflow/webhook/notification conditions (\u003ccode>frappe.safe_eval\u003c/code>) and \u003cstrong>virtual field expressions\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Client Script\u003c/strong> (\u003ccode>$REPO/frappe/custom/doctype/client_script/\u003c/code>) — per-doctype JS injected into Form or List view; no sandbox (runs in browser as the user).\u003c/li>\u003c/ul>\n\u003ch3 id=\"2-4-notification-doctype-repo-frappe-email-doctype-notificat\">2.4 Notification doctype (\u003ccode>$REPO/frappe/email/doctype/notification/notification.py\u003c/code>)\u003c/h3>\n\u003cul>\u003cli>Events: \u003ccode>New, Save, Submit, Cancel, Value Change, Method (custom doc event), Days Before/After, Minutes Before/After\u003c/code> (date-based ones run via 5-min offset and daily scheduler jobs).\u003c/li>\u003cli>Conditions: Python (\u003ccode>safe_eval\u003c/code>) \u003cstrong>or declarative Filters\u003c/strong> (\u003ccode>condition_type\u003c/code>, \u003ccode>evaluate_filters\u003c/code>) — a precedent for no-code conditions.\u003c/li>\u003cli>Channels: Email, Slack (incoming webhook), System Notification (in-app), SMS; Jinja-templated subject/message, print-format attachments, recipients by field/role/assignees; \u003cstrong>\u003ccode>set_property_after_alert\u003c/code>\u003c/strong> — can write a field value back after firing (a mini \"action\").\u003c/li>\u003cli>Dispatched from \u003ccode>Document.run_notifications\u003c/code> inside \u003ccode>run_method\u003c/code>.\u003c/li>\u003c/ul>\n\u003ch3 id=\"2-5-webhook-doctype-repo-frappe-integrations-doctype-webhook\">2.5 Webhook doctype (\u003ccode>$REPO/frappe/integrations/doctype/webhook/\u003c/code>)\u003c/h3>\n\u003cul>\u003cli>Outgoing HTTP on doc events: \u003ccode>after_insert, on_update, on_submit, on_cancel, on_trash, on_update_after_submit, on_change\u003c/code>, plus \u003cstrong>\u003ccode>workflow_transition\u003c/code>\u003c/strong> (as a workflow transition task). Python condition, key-value or Jinja-JSON body, Jinja dynamic URL, custom headers, HMAC-SHA256 signature header, per-webhook RQ queue, 3 retries, \u003ccode>Webhook Request Log\u003c/code>. Deduplication: only the last state of a doc per request is sent (\u003ccode>__init__.py\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"2-6-scheduling-background-jobs\">2.6 Scheduling / background jobs\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>RQ (Redis Queue)\u003c/strong> workers: \u003ccode>$REPO/frappe/utils/background_jobs.py\u003c/code> — \u003ccode>frappe.enqueue\u003c/code>/\u003ccode>enqueue_doc\u003c/code>, named queues (short/default/long + custom), \u003ccode>enqueue_after_commit\u003c/code>, dedup via \u003ccode>job_id\u003c/code>, worker pools.\u003c/li>\u003cli>\u003cstrong>Scheduler\u003c/strong>: \u003ccode>$REPO/frappe/utils/scheduler.py\u003c/code> tick loop → enqueues all due \u003ccode>Scheduled Job Type\u003c/code> docs (\u003ccode>$REPO/frappe/core/doctype/scheduled_job_type/\u003c/code>), which are synced from every app's \u003ccode>scheduler_events\u003c/code> hook + Server Scripts. Cron supported. Execution logged in Scheduled Job Log.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"3-ui-stack\">3. UI Stack\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Desk (main app)\u003c/strong>: legacy-but-solid \u003cstrong>jQuery + Bootstrap 4 class-based JS\u003c/strong> (\u003ccode>$REPO/frappe/public/js/frappe/\u003c/code>), built with a custom \u003cstrong>esbuild\u003c/strong> pipeline (\u003ccode>$REPO/esbuild/esbuild.js\u003c/code>, \u003ccode>*.bundle.js\u003c/code> entry convention, \u003ccode>esbuild-plugin-vue3\u003c/code> for embedded Vue). \u003cstrong>Vue 3 + Pinia is the established pattern for all new builder UIs\u003c/strong>, mounted inside Desk pages.\u003c/li>\u003cli>\u003cstrong>Views\u003c/strong>: Form (\u003ccode>views/formview.js\u003c/code> + \u003ccode>form/\u003c/code>), List, Report (frappe-datatable), \u003cstrong>Kanban\u003c/strong> (\u003ccode>$REPO/frappe/public/js/frappe/views/kanban/\u003c/code> + \u003ccode>Kanban Board\u003c/code> doctype with drag-drop column = field value), Calendar (FullCalendar), Gantt (frappe-gantt), Tree, Map, Image, Dashboard (frappe-charts, Number Card).\u003c/li>\u003cli>\u003cstrong>Existing drag-drop builders in-repo\u003c/strong> (all Vue 3 + Pinia):\u003cul>\u003cli>\u003cstrong>Form Builder\u003c/strong> — \u003ccode>$REPO/frappe/public/js/form_builder/\u003c/code> (drag-drop DocType field/layout editing; also used by Customize Form and Web Form).\u003c/li>\u003cli>\u003cstrong>Workflow Builder\u003c/strong> — \u003ccode>$REPO/frappe/public/js/workflow_builder/\u003c/code> (\u003cstrong>@vue-flow node/edge canvas\u003c/strong> — the exact widget class a Glide-style automation canvas needs; \u003ccode>@vue-flow/core\u003c/code> + \u003ccode>@vue-flow/background\u003c/code> already in \u003ccode>$REPO/package.json\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Layout Builder\u003c/strong> — \u003ccode>$REPO/frappe/public/js/layout_builder/\u003c/code>; \u003cstrong>Print Format Builder\u003c/strong> — \u003ccode>print_format_builder/\u003c/code>.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Web Forms\u003c/strong>: \u003ccode>$REPO/frappe/website/doctype/web_form/\u003c/code> — public/portal forms over doctypes, with the form-builder editing experience.\u003c/li>\u003cli>\u003cstrong>Customize Form\u003c/strong>: \u003ccode>$REPO/frappe/custom/doctype/customize_form/\u003c/code> — per-site field/property overrides without touching app code.\u003c/li>\u003cli>\u003cstrong>Emerging new UI layer\u003c/strong>: \u003ccode>$REPO/ui/\u003c/code> — \u003ccode>@framework/ui\u003c/code>, a \u003cstrong>Vue 3 + TypeScript + Vite shared component library\u003c/strong> (FormLayout, ListView, Filter, SortBy, ColumnSettings…), extracted from Frappe CRM; plus \u003ccode>app_home = \"/app/build\"\u003c/code> and \u003ccode>/desk/*\u003c/code> routing in hooks — v17 is mid-transition toward an SPA-style desk. A fork adding big new UI surface should watch/lean on this.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"4-data-layer-features-vs-glide\">4. Data-Layer Features vs Glide\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Glide concept\u003c/th>\u003cth>Frappe equivalent\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Tables/columns\u003c/td>\u003ctd>DocType/DocField\u003c/td>\u003ctd>Richer: 40+ fieldtypes, child tables, submittable docs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Relations\u003c/td>\u003ctd>\u003ccode>Link\u003c/code>, \u003ccode>Dynamic Link\u003c/code>, \u003ccode>Table\u003c/code>, \u003ccode>Table MultiSelect\u003c/code> fields\u003c/td>\u003ctd>First-class, with integrity checks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lookup columns\u003c/td>\u003ctd>\u003cstrong>\u003ccode>fetch_from\u003c/code>\u003c/strong> (\u003ccode>base_document.py:1085-1170\u003c/code>)\u003c/td>\u003ctd>Copies value from linked doc \u003cstrong>at save time\u003c/strong> (denormalized; \u003ccode>fetch_if_empty\u003c/code> optional). Not live like Glide lookups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Computed/formula columns\u003c/td>\u003ctd>\u003cstrong>Virtual DocFields\u003c/strong> (\u003ccode>is_virtual\u003c/code> + Python expression in \u003ccode>options\u003c/code>, evaluated via \u003ccode>safe_eval\u003c/code> with safe globals + \u003ccode>doc\u003c/code>; or a \u003ccode>@property\u003c/code> on the controller) — \u003ccode>base_document.py:539-555\u003c/code>\u003c/td>\u003ctd>Computed on read, not stored, not filterable/sortable in SQL queries. Expression is Python, not a spreadsheet formula language; no dependency graph/recalc\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Rollups\u003c/td>\u003ctd>\u003cstrong>None built-in\u003c/strong>\u003c/td>\u003ctd>Done manually via controller code, Server Scripts, or virtual fields calling \u003ccode>frappe.db.get_value\u003c/code>; no declarative aggregate-over-children/links column\u003c/td>\u003c/tr>\u003ctr>\u003ctd>External data sources\u003c/td>\u003ctd>\u003cstrong>Virt
