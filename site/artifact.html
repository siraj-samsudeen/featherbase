ual DocTypes\u003c/strong> (\u003ccode>$REPO/frappe/model/virtual_doctype.py\u003c/code>)\u003c/td>\u003ctd>Full protocol (\u003ccode>get_list/get_count/db_insert/load_from_db/db_update/delete\u003c/code>) to back a doctype with any external store/API — ideal for Glide-style \"connected sheets\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Client-side computed visibility\u003c/td>\u003ctd>\u003ccode>depends_on\u003c/code> / \u003ccode>read_only_depends_on\u003c/code> / \u003ccode>mandatory_depends_on\u003c/code> JS-ish expressions\u003c/td>\u003ctd>Evaluated in the browser form\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Gap summary (data layer)\u003c/strong>: no formula language, no live lookups, no rollups, no automatic recalculation graph. \u003ccode>fetch_from\u003c/code> + virtual fields + Virtual DocTypes are the raw ingredients; a Glide-like experience would need a declarative formula/rollup field type with server-side evaluation and invalidation.\u003c/p>\n\u003chr>\n\u003ch2 id=\"5-gap-analysis-vs-a-glide-style-visual-trigger-action-builde\">5. Gap Analysis vs a Glide-Style Visual Trigger-Action Builder\u003c/h2>\n\u003cp>\u003cstrong>What frappe already has (surprisingly much):\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Every trigger primitive exists\u003c/strong>: doc lifecycle events (\u003ccode>run_method\u003c/code> fan-out), value-change detection (\u003ccode>on_change\u003c/code> + \u003ccode>doc_before_save\u003c/code>, used by Milestone/Notification \"Value Change\"), date-relative triggers (Notification Days/Minutes Before/After), cron/schedules (Scheduled Job Type), inbound API/webhook receivers (whitelisted methods / API Server Scripts), manual approval actions (Workflow), payment events.\u003c/li>\u003cli>\u003cstrong>Every action primitive exists\u003c/strong>: send email/Slack/SMS/in-app (Notification), call HTTP (Webhook), run sandboxed code (Server Script), create documents on schedule (Auto Repeat), assign users (Assignment Rule), set field (\u003ccode>set_property_after_alert\u003c/code>, workflow \u003ccode>update_field\u003c/code>), enqueue background jobs, realtime UI push.\u003c/li>\u003cli>\u003cstrong>A visual canvas\u003c/strong> (workflow builder, @vue-flow) and \u003cstrong>the transition-task mechanism\u003c/strong> (v17) that already chains Webhook/Server Script actions to a trigger.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>What's missing for Glide-style automations:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>No unified \"Automation\" object.\u003c/strong> Triggers and actions are scattered across five doctypes (Notification, Webhook, Server Script, Assignment Rule, Workflow) each with its own condition syntax, UI, and logs. There is no doctype that says \"WHEN X happens IF C THEN do A1, A2, A3.\"\u003c/li>\u003cli>\u003cstrong>No multi-step sequences\u003c/strong> — no ordered action lists (outside workflow transition tasks), no data piping between steps, no branching (if/else), no loops over child rows, no delays/waits (\"wait 3 days then…\"), no human-in-the-loop step inside an automation (that's only in Workflow).\u003c/li>\u003cli>\u003cstrong>No visual editor for triggers/actions\u003c/strong> — the workflow builder draws only approval state machines; Notifications/Webhooks/Server Scripts are plain forms with Python condition strings.\u003c/li>\u003cli>\u003cstrong>No unified run history\u003c/strong> — logs are fragmented (Webhook Request Log, Scheduled Job Log, Error Log, Email Queue); no per-automation execution timeline with step status/retry/replay.\u003c/li>\u003cli>\u003cstrong>Conditions are code-first\u003c/strong> — Python \u003ccode>safe_eval\u003c/code> strings everywhere; only Notification has a declarative Filters alternative. A no-code condition builder (field/operator/value rows → \u003ccode>evaluate_filters\u003c/code>) is needed.\u003c/li>\u003cli>\u003cstrong>No templated variable picker\u003c/strong> — Jinja is available but there's no UI for inserting \u003ccode>{{ doc.field }}\u003c/code> tokens from a schema-aware picker.\u003c/li>\u003cli>\u003cstrong>Data layer\u003c/strong>: no formulas/rollups (Section 4).\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"6-where-new-code-would-live-integration-points\">6. Where New Code Would Live (Integration Points)\u003c/h2>\n\u003cblockquote>\u003cp>_Note: this section answered the original \"fork frappe\" question, which was later superseded by the JS-rewrite decision (see ADR 0001). Kept for the record — its analysis of frappe's extension points informed the Featherbase event-bus and hooks design._\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>Recommended shape: a new module inside the fork's frappe core, OR a separate frappe app.\u003c/strong> Trade-off:\u003c/p>\n\u003cul>\u003cli>_Separate app_ (scaffolded by \u003ccode>bench new-app\u003c/code> → \u003ccode>$REPO/frappe/utils/boilerplate.py\u003c/code>: \u003ccode>hooks.py\u003c/code>, \u003ccode>modules.txt\u003c/code>, \u003ccode>&lt;app&gt;/&lt;module&gt;/doctype/…\u003c/code>, \u003ccode>public/js\u003c/code>) keeps the fork rebaseable against upstream frappe — strongly preferable if you intend to track upstream (v17 is a fast-moving develop branch mid-UI-transition). Everything needed (doc_events \u003ccode>\"*\"\u003c/code> hooks, scheduler_events, pages, bundles) is available to any app; frappe's own automation module uses no private APIs.\u003c/li>\u003cli>_In-core module_ (add \u003ccode>Visual Automation\u003c/code> to \u003ccode>$REPO/frappe/modules.txt\u003c/code>, create \u003ccode>$REPO/frappe/visual_automation/\u003c/code>) only buys you the ability to modify \u003ccode>run_method\u003c/code> itself — which you don't need, and it makes upstream merges painful. Only fork core if you also plan to add formula/rollup fields (those _do_ require touching \u003ccode>base_document.py\u003c/code>/\u003ccode>meta.py\u003c/code>/\u003ccode>db_query.py\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Concrete slots for a trigger-action engine:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Trigger subscription\u003c/strong> — register a wildcard hook in your app's \u003ccode>hooks.py\u003c/code>, mirroring \u003ccode>$REPO/frappe/hooks.py:163\u003c/code>: \u003ccode>doc_events = {\"*\": {\"after_insert\": \"...\", \"on_update\": \"...\", \"on_change\": \"...\", \"on_submit\": ...}}\u003c/code> — this rides \u003ccode>Document.run_method\u003c/code>, sees \u003ccode>doc._doc_before_save\u003c/code> for field-change detection, and runs in-transaction. Enqueue actual action execution via \u003ccode>frappe.enqueue(..., enqueue_after_commit=True)\u003c/code> (pattern: webhook \u003ccode>__init__.py\u003c/code> and workflow async tasks).\u003c/li>\u003cli>\u003cstrong>Scheduled triggers\u003c/strong> — create \u003ccode>Scheduled Job Type\u003c/code> docs programmatically (pattern: \u003ccode>ServerScript.sync_scheduled_job_type\u003c/code>, \u003ccode>$REPO/frappe/core/doctype/server_script/server_script.py:121\u003c/code>) or use \u003ccode>scheduler_events\u003c/code> hooks.\u003c/li>\u003cli>\u003cstrong>Inbound-event triggers\u003c/strong> — \u003ccode>@frappe.whitelist(allow_guest=True)\u003c/code> endpoints (pattern: \u003ccode>workflow_action.apply_action\u003c/code>) or API-type Server Scripts.\u003c/li>\u003cli>\u003cstrong>New doctypes\u003c/strong> — e.g. \u003ccode>Automation\u003c/code> (parent: trigger doctype/event/filters), \u003ccode>Automation Step\u003c/code> (child: ordered actions), \u003ccode>Automation Run\u003c/code> + \u003ccode>Automation Run Step\u003c/code> (execution log; register in \u003ccode>default_log_clearing_doctypes\u003c/code>). Reuse: \u003ccode>evaluate_filters\u003c/code> (\u003ccode>$REPO/frappe/utils/data.py\u003c/code>) for no-code conditions, \u003ccode>frappe.safe_eval\u003c/code>/\u003ccode>safe_exec\u003c/code> for escape-hatch code steps, \u003ccode>enqueue_webhook\u003c/code>, Notification's send machinery, \u003ccode>assign_to\u003c/code> (\u003ccode>$REPO/frappe/desk/form/assign_to.py\u003c/code>).\u003c/li>\u003cli>\u003cstrong>Visual editor\u003c/strong> — a Desk Page + lazy-loaded Vue bundle, copying the workflow-builder pattern exactly: page def like \u003ccode>$REPO/frappe/workflow/page/workflow_builder/\u003c/code> (loads via \u003ccode>frappe.require(\"&lt;name&gt;.bundle.js\")\u003c/code>), Vue 3 + Pinia + \u003cstrong>@vue-flow\u003c/strong> app like \u003ccode>$REPO/frappe/public/js/workflow_builder/\u003c/code>, canvas layout persisted in a JSON field on the parent doctype (pattern: \u003ccode>Workflow.workflow_data\u003c/code>). All build tooling (esbuild + Vue plugin) already handles \u003ccode>*.bundle.js\u003c/code> in any app's \u003ccode>public/js\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Extensibility\u003c/strong> — expose your own hook (pattern: \u003ccode>workflow_methods\u003c/code> in \u003ccode>$REPO/frappe/model/workflow.py:170\u003c/code> and \u003ccode>get_workflow_methods\u003c/code> whitelisted endpoint) so other apps can register named action types that appear in the visual builder.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Key files to study first when implementing\u003c/strong> (highest signal): \u003ccode>$REPO/frappe/model/document.py\u003c/code> (run_method/hook composer), \u003ccode>$REPO/frappe/model/workflow.py\u003c/code> (apply_workflow + transition tasks), \u003ccode>$REPO/frappe/public/js/workflow_builder/store.js\u003c/code> + \u003ccode>utils.js\u003c/code> (canvas ⇄ doctype serialization), \u003ccode>$REPO/frappe/utils/safe_exec.py\u003c/code> (sandbox), \u003ccode>$REPO/frappe/email/doctype/notification/notification.py\u003c/code> (condition_type Filters precedent), \u003ccode>$REPO/frappe/integrations/doctype/webhook/__init__.py\u003c/code> (event fan-out + dedup + queueing).\u003c/p>\n\u003chr>\n\u003ch2 id=\"addendum-verified-2026-07-08-during-the-storage-design-discu\">Addendum (verified 2026-07-08, during the storage-design discussion)\u003c/h2>\n\u003cp>Frappe creates a \u003cstrong>real MariaDB table per DocType\u003c/strong> — including user-created custom DocTypes at runtime: \u003ccode>DocType.on_update\u003c/code> (\u003ccode>doctype.py:540\u003c/code>) → \u003ccode>frappe.db.updatedb\u003c/code> → \u003ccode>MariaDBTable.create()\u003c/code> (\u003ccode>database/mariadb/schema.py\u003c/code>) runs \u003ccode>CREATE TABLE tab&lt;Name&gt;\u003c/code> with real columns and real indexes; custom fields become \u003ccode>ALTER TABLE ADD COLUMN\u003c/code>. The EAV-ish exception is Single DocTypes, stored as key-value rows in \u003ccode>tabSingles\u003c/code> (\u003ccode>database/database.py:728\u003c/code>). This symmetry (developer-defined and user-created tables get identical physical treatment) is preserved in Featherbase via ADR 0002.\u003c/p>"},{"group":"Research","slug":"multi-app-1","title":"Frappe: multi-app & multi-DB (note 1)","path":"docs/research/frappe-multi-app-multi-db.md","mins":8,"html":"\u003ch1 id=\"frappe-multiple-apps-one-instance-and-external-databases\">Frappe: Multiple Apps, One Instance — and External Databases\u003c/h1>\n\u003cblockquote>\u003cp>\u003cstrong>Provenance:\u003c/strong> research session, 2026-07-26. Sources: the Frappe architecture study already in this repo (\u003ccode>docs/research/frappe-architecture.md\u003c/code>, from a v17.0.0-dev clone), Frappe documentation and forum threads (linked at the end), and a full sweep of the Featherbase codebase on the same date. Written to answer four concrete questions and to ground the external-database requirements. Research only — no code changed.\u003c/p>\n\u003cp>\u003cstrong>Companion note:\u003c/strong> \u003ccode>frappe-multi-app-and-multi-db.md\u003c/code> — independent parallel research from another session (merged 2026-07-26), deeper on Frappe's code-level mechanics (\u003ccode>frappe.database.get_db\u003c/code> signature, \u003ccode>validate_controller()\u003c/code>'s staticmethod protocol, \u003ccode>Module Def.app_name\u003c/code> ownership, the \u003ccode>Installed Application\u003c/code> ledger). This note adds the Featherbase codebase audit (§5) and the source links. The requirements both notes ground now live in ADR 0007 and \u003ccode>docs/specs/0001-external-data-sources.md\u003c/code> / \u003ccode>0002-virtual-doctypes.md\u003c/code>.\u003c/p>\u003c/blockquote>\n\u003cp>The four questions this answers:\u003c/p>\n\u003col>\u003cli>How does Frappe support multiple apps in one instance?\u003c/li>\u003cli>Do those apps share the same database — same schema or different schemas?\u003c/li>\u003cli>Can one app use a remote Postgres while others use a local one?\u003c/li>\u003cli>Can you put a Frappe(-like) management app \u003cem>on top of\u003c/em> an existing schema that is already being populated by other tools (CLIs), without changing that schema — is it transparent?\u003c/li>\u003c/ol>\n\u003chr>\n\u003ch2 id=\"1-how-frappe-supports-multiple-apps-in-one-instance\">1. How Frappe supports multiple apps in one instance\u003c/h2>\n\u003cp>Frappe has a three-level structure:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Bench\u003c/strong> — one installation: a Python virtualenv, a set of app checkouts, Redis, workers, and a \u003ccode>sites/\u003c/code> directory. \u003ccode>bench\u003c/code> is the CLI that manages it.\u003c/li>\u003cli>\u003cstrong>App\u003c/strong> — a Python package on the bench (\u003ccode>frappe\u003c/code>, \u003ccode>erpnext\u003c/code>, \u003ccode>hrms\u003c/code>, your custom app). An app is a \u003cem>code\u003c/em> artifact: DocType definitions as JSON files on disk, controller classes, a \u003ccode>hooks.py\u003c/code> declaring doc_events, scheduler jobs, overrides, fixtures. Apps have no storage of their own.\u003c/li>\u003cli>\u003cstrong>Site\u003c/strong> — one \u003cem>tenant\u003c/em>: a directory under \u003ccode>sites/\u003c/code> with a \u003ccode>site_config.json\u003c/code> naming exactly one database (\u003ccode>db_name\u003c/code>, \u003ccode>db_host\u003c/code>, \u003ccode>db_password\u003c/code>, \u003ccode>db_type\u003c/code>). A bench serves many sites; requests are routed to a site by host name (DNS multi-tenancy) or port.\u003c/li>\u003c/ul>\n\u003cp>\"Multiple apps in one instance\" means \u003cstrong>installing several apps onto the same site\u003c/strong>. \u003ccode>bench --site mysite install-app erpnext\u003c/code> runs the app's sync: every DocType JSON the app ships is inserted into the site's \u003ccode>tabDocType\u003c/code> / \u003ccode>tabDocField\u003c/code> metadata tables, and a physical table \u003ccode>tab&lt;DocType Name&gt;\u003c/code> is created for each one — \u003cem>in that site's single database\u003c/em>. The app's hooks are aggregated at boot (\u003ccode>frappe.get_hooks()\u003c/code> merges every installed app's \u003ccode>hooks.py\u003c/code>), so any app can listen to any DocType's lifecycle events, including wildcard \u003ccode>\"*\"\u003c/code> hooks.\u003c/p>\n\u003cp>Because everything lands in one database, cross-app integration is trivial and is the whole point: ERPNext links to \u003ccode>tabUser\u003c/code> (from frappe), HR links to \u003ccode>tabEmployee\u003c/code>, one permission system and one events bus span all apps.\u003c/p>\n\u003ch3 id=\"where-featherbase-already-mirrors-this\">Where Featherbase already mirrors this\u003c/h3>\n\u003cp>Featherbase has the same shape, minus the filesystem packaging: \u003ccode>apps/server/src/apps.ts\u003c/code> (\u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002) — an \u003ccode>AppManifest\u003c/code> (name, doctypes, doc_events, scheduler_events, method overrides), \u003ccode>installApp\u003c/code> runs each declared DocType through the normal engine, \u003ccode>tab_installed_app\u003c/code> is the install ledger, and hooks coexist with core controllers. All of it targets the one shared database, exactly like Frappe.\u003c/p>\n\u003ch2 id=\"2-same-db-different-schemas-no-same-db-same-namespace\">2. Same DB, different schemas? No — same DB, \u003cem>same\u003c/em> namespace\u003c/h2>\n\u003cp>This is the part most people guess wrong. Apps installed on a site do \u003cstrong>not\u003c/strong> get their own schema. All tables from all apps live flat in the site's one database:\u003c/p>\n\u003cul>\u003cli>On \u003cstrong>MariaDB\u003c/strong> (Frappe's default), \"database\" and \"schema\" are the same thing; every \u003ccode>tab*\u003c/code> table from every app sits side by side in the site DB.\u003c/li>\u003cli>On the \u003cstrong>Postgres backend\u003c/strong>, everything goes into the default schema (\u003ccode>public\u003c/code>). Frappe never issues \u003ccode>CREATE SCHEMA\u003c/code> per app.\u003c/li>\u003c/ul>\n\u003cp>The \u003ccode>module\u003c/code> field on a DocType — the thing that looks like a namespace — is an organizational label (it decides which app's folder the JSON lives in and how the Desk sidebar groups things). It has zero effect on storage, naming, or connections. Table names are globally unique per site (\u003ccode>tab&lt;DocType&gt;\u003c/code>), so two apps cannot both define a \u003ccode>Customer\u003c/code> DocType.\u003c/p>\n\u003cp>**The isolation boundary in Frappe is the \u003cem>site\u003c/em>, never the app.** One site = one database = one shared namespace for all its apps. Two sites on the same bench share code but have fully separate databases.\u003c/p>\n\u003cp>(Featherbase again mirrors this: \u003ccode>module\u003c/code> is a sidebar label (\u003ccode>DeskLayout.tsx\u003c/code>), tables are \u003ccode>tab_&lt;name&gt;\u003c/code> in \u003ccode>public\u003c/code>, and its multi-tenancy (\u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a>, \u003ccode>tenancy.ts\u003c/code>) is schema-per-*site* within the one Postgres — sites are isolated by \u003ccode>search_path\u003c/code>, apps are not isolated at all.)\u003c/p>\n\u003ch2 id=\"3-can-one-app-use-a-remote-postgres-while-others-use-a-local\">3. Can one app use a remote Postgres while others use a local one?\u003c/h2>\n\u003cp>\u003cstrong>Not natively.\u003c/strong> A site has exactly one database connection, declared in \u003ccode>site_config.json\u003c/code>. There is no per-app or per-DocType connection setting anywhere in the framework; every ORM call, query builder call, and report runs on that single connection. (The whole site's DB can be remote — e.g. a managed Postgres — but it is still \u003cem>one\u003c/em> DB for all apps.)\u003c/p>\n\u003cp>The sanctioned escape hatch is the \u003cstrong>Virtual DocType\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>A DocType flagged \u003ccode>is_virtual = 1\u003c/code> gets \u003cstrong>no table\u003c/strong> in the site database.\u003c/li>\u003cli>Its controller class implements the data protocol itself: \u003ccode>db_insert\u003c/code>, \u003ccode>load_from_db\u003c/code>, \u003ccode>db_update\u003c/code>, \u003ccode>delete\u003c/code> (instance methods), and \u003ccode>get_list\u003c/code>, \u003ccode>get_count\u003c/code>, \u003ccode>get_stats\u003c/code> (statics).\u003c/li>\u003cli>The data source can be anything — a second/remote database, a REST API, CSV/JSON files. Frappe's own engineering blog demonstrates MongoDB-backed DocTypes this way.\u003c/li>\u003cli>To the Desk UI and the \u003ccode>/api/resource\u003c/code> REST surface, a virtual DocType is indistinguishable from a normal one: list view, form view, filters, and permissions all work, because they go through the same Document/Meta layer.\u003c/li>\u003c/ul>\n\u003cp>So the honest Frappe answer to \"app A on Railway PG, app B on local PG\" is: app B's DocTypes are normal; app A's DocTypes are all virtual, and app A ships controller code that opens its own connection to the remote Postgres and maps rows ⇄ documents. It works, it is used in production, but it is \u003cstrong>hand-written glue per DocType\u003c/strong>, and framework features that assume a local table degrade: no automatic DDL/migrations for the external store, no SQL reports over those tables, no cross-DB joins/link-field queries, backups don't cover the external data.\u003c/p>\n\u003ch2 id=\"4-putting-a-management-app-on-top-of-an-existing-live-schema\">4. Putting a management app on top of an existing, live schema\u003c/h2>\n\u003cp>The scenario: a \"control schema\" in a Railway-hosted Postgres, with real tables and real data being written continuously by CLIs. Can Frappe (or Featherbase) sit on top as a management UI?\u003c/p>\n\u003cp>\u003cstrong>Does the existing schema need to change? No.\u003c/strong> The Virtual DocType route requires \u003cem>zero\u003c/em> changes to the external schema. Frappe never runs DDL against the external store, never adds columns, and doesn't demand its \u003ccode>tab\u003c/code> naming or standard columns (\u003ccode>name\u003c/code>, \u003ccode>creation\u003c/code>, \u003ccode>modified\u003c/code>, \u003ccode>owner\u003c/code>, \u003ccode>docstatus\u003c/code>, …) there — those conventions apply only to tables Frappe itself creates. The CLIs keep writing exactly as before; the framework is just another client of that database.\u003c/p>\n\u003cp>\u003cstrong>Is it \"immediately transparent — I can just put it on top\"? Not in Frappe.\u003c/strong> Two gaps stand between \"point it at my schema\" and a working Desk:\u003c/p>\n\u003col>\u003cli>\u003cstrong>No reflection.\u003c/strong> Frappe cannot generate DocType metadata from an existing table (\u003ccode>information_schema\u003c/code> → DocFields). This is a long-standing community ask with no built-in answer; people write one-off scripts. You must define the DocType (fields, types, labels) yourself so it mirrors the table.\u003c/li>\u003cli>\u003cstrong>No declarative external connection.\u003c/strong> The virtual DocType controller is Python you write: open the connection, implement the six protocol methods, map the external primary key to Frappe's \u003ccode>name\u003c/code>, fake \u003ccode>modified\u003c/code>/\u003ccode>creation\u003c/code> if the table lacks timestamps. One controller per DocType (though a shared base class per external DB is the usual pattern).\u003c/li>\u003c/ol>\n\u003cp>Once that glue exists, it \u003cem>is\u003c/em> transparent in the ways that matter: the generic UI, REST API, permissions, and hooks all treat the external rows as ordinary documents, and CLI-written rows appear in the Desk on the next read because nothing is copied or cached — every read goes to the source.\u003c/p>\n\u003cp>One operational caveat for shared-writer tables: Frappe's optimistic-lock (\"document has been modified\") protection leans on a \u003ccode>modified\u003c/code> timestamp. If the external table has an updated-at column, the controller can honor it; if not, concurrent CLI/Desk writes can silently last-write-win.\u003c/p>\n\u003ch2 id=\"5-featherbase-today-none-of-this-exists-yet\">5. Featherbase today: none of this exists yet\u003c/h2>\n\u003cp>Verified against the codebase on 2026-07-26:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>One connection string, everywhere.\u003c/strong> \u003ccode>config.databaseUrl\u003c/code> is a scalar (\u003ccode>apps/server/src/config.ts\u003c/code>); the \u003ccode>sql\u003c/code> export in \u003ccode>db.ts\u003c/code> is a module-level singleton imported by ~40 modules. The only other production \u003ccode>postgres()\u003c/code> call is \u003ccode>tenancy.ts\u003c/code>, which dials the \u003cem>same\u003c/em> database with a different \u003ccode>search_path\u003c/code>. No connection registry, no FDW, no dblink.\u003c/li>\u003cli>\u003cstrong>No virtual/external DocType concept.\u003c/strong> \u003ccode>doctypeDefSchema\u003c/code> (\u003ccode>doctype-engine.ts\u003c/code>) has no \u003ccode>is_virtual\u003c/code>, no table-name override, no connection field. \u003ccode>createTableDDL\u003c/code> unconditionally emits \u003ccode>create table \"tab_x\"\u003c/code> (not even \u003ccode>IF NOT EXISTS\u003c/code> — a pre-existing table fails with raw PG \u003ccode>42P07\u003c/code>), and every generated table gets the standard columns. Nothing can map a DocType onto a table the engine didn't create.\u003c/li>\u003cli>\u003cstrong>Schema sync is metadata-diff only.\u003c/strong> \u003ccode>updateDocType\u003c/code> compares old vs new DocField rows; it never inspects \u003ccode>information_schema\u003c/code> — so there is no reflection primitive to build on yet either.\u003c/li>\u003cli>\u003cstrong>Apps share the one DB by construction.\u003c/strong> \u003ccode>installApp\u003c/code> calls the same \u003ccode>createDocType\u003c/code>; an app cannot bring its own connection.\u003c/li>\u003cli>No harness feature, ADR, or roadmap item covers multi-database or external data sources (checked \u003ccode>harness/features.json\u003c/code>, \u003ccode>docs/adr/*\u003c/code>, \u003ccode>docs/ROADMAP.md\u003c/code>, \u003ccode>PROGRESS.md\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Conclusion:\u003c/strong> the requirement — a management app over the Railway control schema, alongside apps on the local Postgres — is not supported in Featherbase today, and in Frappe it is supported only via hand-coded Virtual DocTypes. Featherbase can do one better than Frappe here precisely because it is metadata-driven end-to-end: make the external mapping \u003cem>declarative\u003c/em> (connection registry + table adoption by reflection) instead of per-DocType controller code. That is what ADR 0007 decides and \u003cstrong>\u003ccode>docs/specs/0001-external-data-sources.md\u003c/code>\u003c/strong> (declarative Postgres binding) plus \u003cstrong>\u003ccode>0002-virtual-doctypes.md\u003c/code>\u003c/strong> (controller protocol for everything else) specify.\u003c/p>\n\u003chr>\n\u003ch2 id=\"sources\">Sources\u003c/h2>\n\u003cul>\u003cli>\u003ccode>docs/research/frappe-architecture.md\u003c/code> (this repo) — §4 \"External data sources → Virtual DocTypes\", virtual DocType protocol, \u003ccode>tabSingles\u003c/code>, per-DocType \u003ccode>CREATE TABLE\u003c/code> behavior.\u003c/li>\u003cli>\u003ca href=\"https://docs.frappe.io/framework/v15/user/en/basics/sites\" target=\"_blank\" rel=\"noopener\">Frappe docs — Sites (multitenancy, one DB per site)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://docs.frappe.io/framework/v14/user/en/basics/doctypes/virtual-doctype\" target=\"_blank\" rel=\"noopener\">Frappe docs — Virtual DocTypes\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://frappe.io/blog/engineering/mongodb-powered-doctypes\" target=\"_blank\" rel=\"noopener\">Frappe blog — MongoDB-powered DocTypes\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://discuss.frappe.io/t/are-there-any-possibilities-of-generating-doctype-from-existing-database/94340\" target=\"_blank\" rel=\"noopener\">Frappe forum — \"Generating DocType from existing database?\"\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://discuss.frappe.io/t/how-to-pull-and-store-data-in-external-database/101264\" target=\"_blank\" rel=\"noopener\">Frappe forum — \"How to pull and store data in external database\"\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://discuss.frappe.io/t/using-external-cloud-postgresql-instance/140590\" target=\"_blank\" rel=\"noopener\">Frappe forum — \"Using external cloud PostgreSQL instance\"\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://github.com/frappe/frappe/blob/develop/frappe/model/virtual_doctype.py\" target=\"_blank\" rel=\"noopener\">frappe/frappe — \u003ccode>frappe/model/virtual_doctype.py\u003c/code>\u003c/a>\u003c/li>\u003c/ul>"},{"group":"Research","slug":"multi-app-2","title":"Frappe: multi-app & multi-DB (note 2)","path":"docs/research/frappe-multi-app-and-multi-db.md","mins":6,"html":"\u003ch1 id=\"frappe-many-apps-in-one-instance-and-what-it-does-about-othe\">Frappe: many apps in one instance, and what it does about other databases\u003c/h1>\n\u003cp>Research note, 2026-07-26. Written to answer four questions before speccing the Featherbase equivalent:\u003c/p>\n\u003col>\u003cli>How does Frappe support multiple apps in one instance?\u003c/li>\u003cli>Do apps share one database? One schema, or a schema each?\u003c/li>\u003cli>Can one app talk to a remote Postgres while others use the local one?\u003c/li>\u003cli>What does Frappe do when the data already exists in someone else's schema, maintained by something other than Frappe?\u003c/li>\u003c/ol>\n\u003cp>Short answers: \u003cstrong>apps share one database and one schema per site\u003c/strong>; app boundaries are metadata only; a \u003cem>site\u003c/em> can live on a remote database server but an \u003cem>app\u003c/em> cannot; and the only supported way to sit on top of foreign data is the \u003cstrong>Virtual DocType\u003c/strong> protocol, which trades away every SQL-level feature of the framework.\u003c/p>\n\u003ch2 id=\"the-three-units-bench-app-site\">The three units: bench, app, site\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Bench\u003c/strong> — a directory holding \u003ccode>apps/\u003c/code> (one git repo per app), \u003ccode>sites/\u003c/code> (one directory per site), one Python virtualenv, and the shared Redis/worker/ scheduler processes. Installing an app with \u003ccode>bench get-app\u003c/code> installs it into the virtualenv, so its \u003cem>code\u003c/em> is available to every site on the bench.\u003c/li>\u003cli>\u003cstrong>App\u003c/strong> — a Python package with \u003ccode>hooks.py\u003c/code>, \u003ccode>modules.txt\u003c/code>, and a folder per module containing DocType JSON. Scaffolded by \u003ccode>bench new-app\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Site\u003c/strong> — one database plus \u003ccode>sites/&lt;site&gt;/site_config.json\u003c/code> plus that site's files. Requests are routed to a site by \u003ccode>Host\u003c/code> header.\u003c/li>\u003c/ul>\n\u003cp>Code availability and installation are separate steps: \u003ccode>bench --site x install-app y\u003c/code> runs the app's install hooks against site \u003ccode>x\u003c/code>, creates its DocType tables there, and records the app in the \u003ccode>Installed Application\u003c/code> child table. So one bench, N apps in the venv, M sites, and each site picks its own subset of the N.\u003c/p>\n\u003ch2 id=\"do-apps-share-a-database-yes-one-database-per-site-not-per-a\">Do apps share a database? Yes — one database per \u003cem>site\u003c/em>, not per app\u003c/h2>\n\u003cp>Every app installed on a site writes into the \u003cstrong>same database and the same schema\u003c/strong>. There is no schema-per-app and no schema-per-site: on Postgres, Frappe uses the default \u003ccode>public\u003c/code> schema, and site isolation comes from using a separate \u003cem>database\u003c/em> (usually with its own DB user).\u003c/p>\n\u003cp>Consequences worth internalising:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>The table namespace is flat and global.\u003c/strong> Every DocType becomes \u003ccode>tab&lt;DocType Name&gt;\u003c/code>, so DocType names must be unique across \u003cem>all\u003c/em> installed apps. This is why real apps prefix: \u003ccode>HD Ticket\u003c/code> (Helpdesk), \u003ccode>CRM Lead\u003c/code>.\u003c/li>\u003cli>\u003cstrong>App ownership is metadata, not physics.\u003c/strong> \u003ccode>DocType.module\u003c/code> links to \u003ccode>Module Def\u003c/code>, and \u003ccode>Module Def.app_name\u003c/code> names the owning app. Uninstalling an app finds its tables by walking modules. Nothing at the storage layer knows which app a row belongs to.\u003c/li>\u003cli>\u003cstrong>Cross-app joins, links and transactions are free\u003c/strong>, precisely because there is no boundary. This is the main reason the flat namespace survives: an ERPNext Sales Invoice can \u003ccode>Link\u003c/code> to an HR Employee with no plumbing.\u003c/li>\u003c/ul>\n\u003ch2 id=\"can-one-app-use-a-remote-postgres-while-others-use-local-not\">Can one app use a remote Postgres while others use local? Not at the app level\u003c/h2>\n\u003cp>The database connection is resolved \u003cstrong>per site, per request\u003c/strong>, into the thread-local \u003ccode>frappe.db\u003c/code>. The keys come from \u003ccode>site_config.json\u003c/code> (which overrides \u003ccode>common_site_config.json\u003c/code>): \u003ccode>db_type\u003c/code>, \u003ccode>db_host\u003c/code>, \u003ccode>db_port\u003c/code>, \u003ccode>db_name\u003c/code>, \u003ccode>db_user\u003c/code>, \u003ccode>db_password\u003c/code>.\u003c/p>\n\u003cp>So: site A can sit on a managed remote Postgres while site B on the same bench sits on a local one. But \u003cem>within\u003c/em> a site, every app shares one connection, and the framework offers no per-app or per-DocType routing.\u003c/p>\n\u003cp>The escape hatches, in increasing order of framework integration:\u003c/p>\n\u003col>\u003cli>\u003cstrong>\u003ccode>frappe.database.get_db(socket=None, host=None, user=None, password=None, port=None, cur_db_name=None)\u003c/code>\u003c/strong> — an ad-hoc second connection to an arbitrary host. This is a raw handle: you write the SQL, you manage the lifetime. Nothing about the document engine, permissions, or the Desk applies. Note that \u003ccode>setup_database()\u003c/code>/\u003ccode>bootstrap_database()\u003c/code> deliberately do \u003cem>not\u003c/em> accept this — DDL is only ever aimed at the site's own database.\u003c/li>\u003cli>\u003cstrong>Virtual DocType\u003c/strong> (\u003ccode>is_virtual = 1\u003c/code>) — a DocType with no \u003ccode>tab\u003c/code> table whose controller supplies the storage. \u003ccode>frappe/model/virtual_doctype.py\u003c/code> \u003ccode>validate_controller()\u003c/code> enforces the protocol: instance methods \u003ccode>load_from_db\u003c/code>, \u003ccode>db_insert\u003c/code>, \u003ccode>db_update\u003c/code>, \u003ccode>delete\u003c/code> must be \u003cem>overridden\u003c/em>, and \u003ccode>get_list\u003c/code>, \u003ccode>get_count\u003c/code>, \u003ccode>get_stats\u003c/code> must exist as \u003cstrong>staticmethods\u003c/strong>. In return, the REST resource API, the Desk list and form views, and roles and permissions all work unchanged; the docs state the source \"can be anything: an external API, a secondary database, JSON or CSV files\".\u003c/li>\u003cli>\u003cstrong>Product-level connectors\u003c/strong> — Frappe Insights and Data Migration keep external connections as first-class documents, but those are read/ETL paths, not the document engine.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>What the Virtual DocType route costs.\u003c/strong> The framework stops being able to generate SQL for you, so the controller must implement filtering, sorting and pagination itself. \u003ccode>frappe.db.*\u003c/code> helpers return nothing for virtual data (\"database APIs will not return virtual values since they don't live in the Site Database\"), the report builder and joins don't apply, and virtual child rows are in-memory only — the parent never persists them. GitHub issue #17282 tracks a long tail of CRUD/display bugs in exactly this area.\u003c/p>\n\u003cp>\u003cstrong>And there is no way to bind a normal DocType to a pre-existing table.\u003c/strong> Frappe's table name is derived from the DocType name (\u003ccode>tab&lt;Name&gt;\u003c/code>) with no override, and its engine assumes its own standard columns (\u003ccode>name\u003c/code>, \u003ccode>owner\u003c/code>, \u003ccode>creation\u003c/code>, \u003ccode>modified\u003c/code>, \u003ccode>modified_by\u003c/code>, \u003ccode>docstatus\u003c/code>, \u003ccode>idx\u003c/code>). Sitting on top of a schema that some other tool created and keeps writing to is, in Frappe, either a Virtual DocType or a data migration. There is no third option.\u003c/p>\n\u003ch2 id=\"what-this-means-for-featherbase\">What this means for Featherbase\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Concern\u003c/th>\u003cth>Frappe\u003c/th>\u003cth>Featherbase today\u003c/th>\u003cth>Verdict\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>App code registry\u003c/td>\u003ctd>Python package in the bench venv, \u003ccode>hooks.py\u003c/code>\u003c/td>\u003ctd>\u003ccode>AppManifest\u003c/code> registered in-process (\u003ccode>apps/server/src/apps.ts\u003c/code>)\u003c/td>\u003ctd>parity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Installed-app record\u003c/td>\u003ctd>\u003ccode>Installed Application\u003c/code> child table\u003c/td>\u003ctd>\u003ccode>tab_installed_app\u003c/code> (name + owned doctypes)\u003c/td>\u003ctd>parity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Site\u003c/td>\u003ctd>one database + \u003ccode>site_config.json\u003c/code>\u003c/td>\u003ctd>one Postgres \u003cstrong>schema\u003c/strong> + \u003ccode>tab_site\u003c/code> registry (\u003ccode>tenancy.ts\u003c/code>)\u003c/td>\u003ctd>divergent but defensible\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Apps sharing storage\u003c/td>\u003ctd>one DB, one schema, flat \u003ccode>tab*\u003c/code> namespace\u003c/td>\u003ctd>one DB, one schema, flat \u003ccode>tab_*\u003c/code> namespace\u003c/td>\u003ctd>parity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>App → owning module\u003c/td>\u003ctd>\u003ccode>Module Def.app_name\u003c/code>\u003c/td>\u003ctd>\u003ccode>tab_installed_app.doctypes\u003c/code>\u003c/td>\u003ctd>parity\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Per-site remote DB\u003c/td>\u003ctd>\u003ccode>db_host\u003c/code> in \u003ccode>site_config.json\u003c/code>\u003c/td>\u003ctd>none — one \u003ccode>config.databaseUrl\u003c/code> pool in \u003ccode>db.ts\u003c/code>\u003c/td>\u003ctd>\u003cstrong>gap\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Second/arbitrary connection\u003c/td>\u003ctd>\u003ccode>frappe.database.get_db(...)\u003c/code>\u003c/td>\u003ctd>none\u003c/td>\u003ctd>\u003cstrong>gap\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DocType over a foreign store\u003c/td>\u003ctd>Virtual DocType protocol\u003c/td>\u003ctd>none (no \u003ccode>is_virtual\u003c/code>)\u003c/td>\u003ctd>\u003cstrong>gap\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DocType over an \u003cem>existing table\u003c/em>\u003c/td>\u003ctd>impossible\u003c/td>\u003ctd>impossible (\u003ccode>tableName()\u003c/code> derives the name)\u003c/td>\u003ctd>\u003cstrong>gap, and an opportunity\u003c/strong>\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>The last row is where Featherbase can beat the original rather than copy it. Frappe has to be conservative because it supports MariaDB and Postgres and runs its own DDL. Featherbase targets Postgres only, already routes 100% of reads and writes through the server (invariant 2), and already generates its SQL from metadata — so binding a DocType to \u003ccode>{connection, schema, table}\u003c/code> with a column-to-fieldname map is a \u003cem>smaller\u003c/em> change here than it would be there, and it preserves list views, filters, sorting and pagination as real SQL instead of handing them to a controller.\u003c/p>\n\u003cp>Both mechanisms are specified:\u003c/p>\n\u003cul>\u003cli>\u003ccode>docs/specs/0001-external-data-sources.md\u003c/code> — connections plus DocTypes bound to existing Postgres tables (the SQL-native path).\u003c/li>\u003cli>\u003ccode>docs/specs/0002-virtual-doctypes.md\u003c/code> — the controller protocol for sources that are not Postgres tables (the escape hatch, mirroring Frappe).\u003c/li>\u003cli>\u003ccode>docs/adr/0007-app-and-database-topology.md\u003c/code> — why apps still share one control database, and why binding is per-DocType rather than per-app.\u003c/li>\u003c/ul>\n\u003ch2 id=\"sources\">Sources\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://docs.frappe.io/framework/v14/user/en/basics/doctypes/virtual-doctype\" target=\"_blank\" rel=\"noopener\">Frappe: Virtual DocTypes\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://github.com/frappe/frappe/blob/develop/frappe/model/virtual_doctype.py\" target=\"_blank\" rel=\"noopener\">\u003ccode>frappe/model/virtual_doctype.py\u003c/code>\u003c/a> — the enforced controller protocol\u003c/li>\u003cli>\u003ca href=\"https://github.com/frappe/frappe/blob/develop/frappe/database/__init__.py\" target=\"_blank\" rel=\"noopener\">\u003ccode>frappe/database/__init__.py\u003c/code>\u003c/a> — \u003ccode>get_db()\u003c/code> and \u003ccode>setup_database()\u003c/code>\u003c/li>\u003cli>\u003ca href=\"https://github.com/frappe/frappe/blob/develop/frappe/core/doctype/module_def/module_def.json\" target=\"_blank\" rel=\"noopener\">\u003ccode>frappe/core/doctype/module_def/module_def.json\u003c/code>\u003c/a> — \u003ccode>app_name\u003c/code> on \u003ccode>Module Def\u003c/code>\u003c/li>\u003cli>\u003ca href=\"https://docs.frappe.io/framework/v14/user/en/basics/site_config\" target=\"_blank\" rel=\"noopener\">Frappe: site configuration\u003c/a> — \u003ccode>db_name\u003c/code>, \u003ccode>db_host\u003c/code>, \u003ccode>db_password\u003c/code>; site vs common config\u003c/li>\u003cli>\u003ca href=\"https://www.mintlify.com/frappe/frappe/deployment/configuration\" target=\"_blank\" rel=\"noopener\">Frappe: deployment configuration options\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://github.com/frappe/frappe/issues/17282\" target=\"_blank\" rel=\"noopener\">frappe/frappe#17282 — virtual doctype CRUD/display issues\u003c/a>\u003c/li>\u003c/ul>"},{"group":"Log & harness","slug":"harness","title":"The agent harness — how this was built","path":"harness/README.md","mins":2,"html":"\u003ch1 id=\"agent-harness\">Agent Harness\u003c/h1>\n\u003cp>This directory implements the long-running-agent harness described in Anthropic's engineering posts (\u003ca href=\"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents\" target=\"_blank\" rel=\"noopener\">Effective harnesses for long-running agents\u003c/a>, \u003ca href=\"https://www.anthropic.com/engineering/harness-design-long-running-apps\" target=\"_blank\" rel=\"noopener\">Harness design for long-running application development\u003c/a>), applied to building a Frappe Framework clone.\u003c/p>\n\u003ch2 id=\"why-a-harness\">Why a harness\u003c/h2>\n\u003cp>Long-running agents work in discrete sessions with no memory between them. Left alone they declare victory early, leave the app broken mid-session, and burn context rediscovering state. The harness fixes this with durable, structured state in the repo and a strict per-session protocol.\u003c/p>\n\u003ch2 id=\"the-pieces\">The pieces\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Artifact\u003c/th>\u003cth>Role\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>features.json\u003c/code>\u003c/td>\u003ctd>The full feature inventory (126 features). Ground truth for \"what's done\". Agents may ONLY flip \u003ccode>status\u003c/code> between \u003ccode>failing\u003c/code>/\u003ccode>passing\u003c/code> — never edit entries. Each feature carries its own end-to-end verification criteria and dependencies.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>../CLAUDE.md\u003c/code>\u003c/td>\u003ctd>Standing rules loaded every session: architecture invariants + the session protocol.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>../PROGRESS.md\u003c/code>\u003c/td>\u003ctd>Session-to-session handoff notes (the \"structured handoff\" replacing context compaction).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>../init.sh\u003c/code>\u003c/td>\u003ctd>One command to boot database + server + web and smoke-test them. Sessions verify the app works BEFORE coding.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prompts/initializer.md\u003c/code>\u003c/td>\u003ctd>One-time environment setup agent (scaffold, DB, init.sh, smoke test).\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prompts/coder.md\u003c/code>\u003c/td>\u003ctd>The per-session generator: orient → boot → one feature → verify end-to-end → record → commit.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>prompts/evaluator.md\u003c/code>\u003c/td>\u003ctd>Adversarial verifier (generator/evaluator pattern): re-drives recently-passed features via the public interface and flips false claims back to \u003ccode>failing\u003c/code>.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>run.sh\u003c/code>\u003c/td>\u003ctd>The outer loop: initializer once, then coder sessions with an evaluator pass every N sessions, pushing after each.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"running-it\">Running it\u003c/h2>\n\u003cpre>\u003ccode># one-time: authenticate the claude CLI, then\nharness/run.sh 50            # up to 50 coding sessions\nEVAL_EVERY=2 harness/run.sh  # stricter evaluation cadence\u003c/code>\u003c/pre>\n\u003cp>Progress is measured by \u003ccode>failing\u003c/code> counts in \u003ccode>features.json\u003c/code>; history and rationale live in git log and \u003ccode>PROGRESS.md\u003c/code>.\u003c/p>\n\u003ch2 id=\"design-notes\">Design notes\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Fresh context per session, state in the repo\u003c/strong> — full context resets with structured handoffs outperform compaction for multi-day builds.\u003c/li>\u003cli>\u003cstrong>One feature per session\u003c/strong> — small, complete, verified increments beat broad half-done sweeps.\u003c/li>\u003cli>\u003cstrong>The feature list is immutable except for status\u003c/strong> — otherwise agents \"simplify the spec\" instead of finishing it.\u003c/li>\u003cli>\u003cstrong>Verification is end-to-end by construction\u003c/strong> — every feature's \u003ccode>verify\u003c/code> field describes user-visible behavior against the running app, and the evaluator re-drives it adversarially (works for non-admin users, works on a second DocType, survives edge cases).\u003c/li>\u003c/ul>"},{"group":"Log & harness","slug":"progress","title":"Progress log — every session, newest first","path":"PROGRESS.md","mins":119,"html":"\u003ch1 id=\"progress-log\">Progress Log\u003c/h1>\n\u003ch2 id=\"visual-identity-standing-directive-for-all-ui-work\">Visual identity (standing directive for all UI work)\u003c/h2>\n\u003cp>The Desk is reskinned to look like Frappe. Every new UI feature MUST inherit this look — do not introduce ad-hoc colors/spacing:\u003c/p>\n\u003cul>\u003cli>Design tokens live in \u003ccode>apps/web/src/index.css\u003c/code> (\u003ccode>@theme\u003c/code>): canvas \u003ccode>#f4f5f6\u003c/code>, brand \u003ccode>#2490ef\u003c/code> (Frappe blue), ink \u003ccode>#1c2126\u003c/code>, hairline borders \u003ccode>#ebeef0\u003c/code>/\u003ccode>#d1d8dd\u003c/code>, Inter (self-hosted via \u003ccode>@fontsource-variable/inter\u003c/code>, NO network fonts — offline is a hard requirement for the test browser).\u003c/li>\u003cli>Reuse the shared component classes: \u003ccode>.fc-card\u003c/code>, \u003ccode>.fc-input\u003c/code>, \u003ccode>.fc-btn\u003c/code>, \u003ccode>.fc-btn-primary\u003c/code>, \u003ccode>.fc-label\u003c/code>, \u003ccode>.fc-pill\u003c/code>. Prefer these over raw Tailwind.\u003c/li>\u003cli>Shell (navbar + workspace sidebar + awesomebar + avatar) is in \u003ccode>DeskLayout.tsx\u003c/code>; new pages render inside its \u003ccode>&lt;Outlet/&gt;\u003c/code> canvas.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-26-v11-featherbase-explorer-site-todo-learning-path\">2026-07-26 (v11) — Featherbase Explorer site + todo learning path\u003c/h2>\n\u003cp>Built the owner's phone-readable learning/navigation surface:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>site/\u003c/code>\u003c/strong> — a zero-dependency builder (\u003ccode>node site/build.mjs\u003c/code>) that emits one self-contained \u003ccode>index.html\u003c/code> (769 KB): all 126 harness features (search + category filters; per-feature page with the verify contract, deps/dependents, and \u003cem>scanned\u003c/em> links to the test and source files that literally name the ID — 124/126 have direct test mentions), a Map page (save-lifecycle in 8 steps, the 7 axes, milestones, category grid with per-category \"how it works\" explanations + key files), the full 39-document library rendered from markdown with feature IDs auto-linked, the learning path, and a Questions tab — notes saved to localStorage with JSON download/copy for feeding back into agent sessions. Desk visual identity (PROGRESS tokens), light + dark, mobile-first. Also emits \u003ccode>artifact.html\u003c/code> for Claude-artifact publishing; GitHub Pages option documented in \u003ccode>site/README.md\u003c/code>.\u003c/li>\u003cli>\u003cstrong>\u003ccode>docs/LEARNING-PATH.md\u003c/code>\u003c/strong> — the staged todo app: Stage 1 plain CRUD \u003ccode>Todo Item\u003c/code>, then Projects (Link/integrity/rename), Subtasks (child table atomicity), Checklists (Select/flags/first controller hooks), a second user (permissions over raw HTTP), optional live stage (series/jobs/email/web form). Each stage names the feature IDs it exercises, a verify checklist, and questions to answer before moving on.\u003c/li>\u003cli>Verified: built and screenshotted at phone viewport (light + dark, home/map/features/feature-detail/doc/questions) via headless Chromium — zero console errors. Fixed the design doc's stale \"v3\" status label caught in the screenshot. Docs+tooling only; app untouched.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-26-v10-execution-plan-resequenced-per-owner-harness-\">2026-07-26 (v10) — execution plan resequenced per owner; harness lineage documented\u003c/h2>\n\u003cp>Owner feedback: start with the concrete slices, refactor later. Plan updated: \u003cstrong>M1\u003c/strong> dbt seeds → native DocTypes + PR-based CSV egress (zero framework change), \u003cstrong>M2\u003c/strong> the external CRUD manager's tables move into DocTypes and the tool retires, \u003cstrong>M3\u003c/strong> MotherDuck warehouse browser — which is where the storage seam arrives, but only its \u003cstrong>read-only half\u003c/strong> (getList/getDoc/count/introspect), explicitly citing \u003ccode>tenancy.ts\u003c/code> as the bolt-on anti-pattern the browser must not repeat, \u003cstrong>M4\u003c/strong> full seam + D2 table_name migration, now informed by a real second backend, \u003cstrong>M5\u003c/strong> egress config generation (byte-match) + reassess. Added §3b: the harness (\u003ccode>harness/\u003c/code> — frozen features.json, coder/evaluator prompts, run.sh loop) is the \u003cem>lineage\u003c/em>, not extended: milestone feather-specs in docs/specs/ are the successor artifact (capability IDs = feature IDs, EARS criteria = verify fields, DoD = evaluator checklist; CLAUDE.md protocol unchanged). Docs only. Rides PR #60.\u003c/p>\n\u003ch2 id=\"2026-07-26-v9-execution-plan-main-merged-in\">2026-07-26 (v9) — execution plan; main merged in\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Merged \u003ccode>origin/main\u003c/code>\u003c/strong> (PR #58 app-platform gaps) into the docs branch — notable: main's entry records a report server POSTing feedback over REST as Featherbase's \u003cem>first external consumer\u003c/em>, i.e. one of the three target use cases is already live and battle-testing the engine.\u003c/li>\u003cli>\u003cstrong>\u003ccode>docs/design/execution-plan.md\u003c/code>\u003c/strong> — the how-to-build-without- disappointment answer (4–5 prior attempts failed on oversized units of promise). Rules: product slices not framework layers; one feature per session with pre-written verify; spec → validate-against-D1–D21 → build; refactor only at the seam under green tests; visible NOT-NOW list. Milestones: \u003cstrong>M0\u003c/strong> seam refactor (D2 table_name + D5/D7 adapter seam, zero behavior change), \u003cstrong>M1\u003c/strong> MotherDuck warehouse browser (read-only, spec-0001 slice), \u003cstrong>M2\u003c/strong> dbt seeds → MDM DocTypes with PR-based CSV egress, \u003cstrong>M3\u003c/strong> egress config generation (byte-match the hand-written configs), \u003cstrong>M4\u003c/strong> reassess. Agent workflow per milestone: plan session produces spec+features, validated before build; build sessions are one-feature; owner does an ownership pass per milestone.\u003c/li>\u003c/ul>\n\u003cp>Docs only. Rides PR #60.\u003c/p>\n\u003ch2 id=\"2026-07-26-v8-layer-economics-d21-the-motherduck-warehouse-b\">2026-07-26 (v8) — layer economics (D21) + the MotherDuck warehouse browser\u003c/h2>\n\u003cp>Clarifications from the user: \"who do\" meant \u003cstrong>Odoo\u003c/strong> (already studied); Hudi kept as a welcome accident. DLT-META checked: not abandoned but thinly active (last release 2025-09) and a no-SLA Labs project — caveat added to the study; verdict: adopt the Dataflowspec \u003cem>idea\u003c/em>, generate our own spec, never depend on the project. Design doc → v7:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>§3.3 layer economics (D21)\u003c/strong> — answering \"does a clean SoR need bronze/silver?\": bronze's jobs (replay, audit-of-source, decoupling, uniformity) are already done by Axis E when Featherbase is the SoR, so bronze collapses to a thin generated landing (kept only for compute isolation + pipeline uniformity) and silver is emitted directly from DocType metadata; human modeling starts at gold. Full medallion stays justified for messy foreign sources (SAP). Warehouse mapping/seed tables — currently homeless hand-edited seeds in the warehouse — are master data and become MDM DocTypes.\u003c/li>\u003cli>\u003cstrong>§3.3 warehouse browser\u003c/strong> — new reverse-direction use case: Desk over MotherDuck (bronze/silver/gold currently SQL-only). Maps onto existing machinery verbatim: \u003ccode>duckdb\u003c/code> driver + foreign read-only mode + spec 0001's read-only sources/allowlists + reflection; schemas-per-system surface as Desk modules; saved views give analysts a Datasette-for-the-lakehouse. Featherbase fronts both ends of the pipe.\u003c/li>\u003c/ul>\n\u003cp>Commits ride open PR #60. No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-v7-analytics-egress-etl-story-d20-hudi-lakehouse-\">2026-07-26 (v7) — analytics egress / ETL story (D20) + Hudi-lakehouse study\u003c/h2>\n\u003cp>The forgotten dimension: how master data flows OUT into the bronze/silver medallion layers — the MDM app's whole strategic purpose. Added \u003ccode>docs/research/studies/hudi-lakehouse.md\u003c/code> (Apache Hudi: record keys + precombine + timeline + incremental queries; Debezium CDC; dbt; and Databricks \u003cstrong>DLT-META\u003c/strong> — the direct precedent for metadata-driven bronze/silver pipelines driven by an onboarding spec). Design doc → v6 with \u003cstrong>D20\u003c/strong>: analytics egress is a declared push binding (transport by capability: logical replication &gt; outbox &gt; snapshot), and the warehouse artifacts — the existing bronze/silver CSV config, dbt sources/staging models with tests, HoodieStreamer/Dataflowspec configs — are \u003cstrong>generated from DocType metadata\u003c/strong> as one-way D19 artifacts, regenerated on metadata promotion; D16 history/effectivity maps to SCD2; Featherbase emits configs and streams, never runs lake infrastructure. Sequencing: the CSV-config generator joins the MDM now/next bucket (cheap, replaces hand-maintained config immediately). Commits ride open PR #60.\u003c/p>\n\u003ch2 id=\"2026-07-26-v6-three-more-studies-react-admin-avo-nocodb-pr-o\">2026-07-26 (v6) — three more studies (react-admin, Avo, NocoDB); PR opened\u003c/h2>\n\u003cp>Added on request to \u003ccode>docs/research/studies/\u003c/code>: \u003cstrong>react-admin\u003c/strong> (frontend dataProvider adapter ecosystem; \u003cstrong>guessers\u003c/strong> = generation as one-way copyable suggestion — the cleanest D19 UX, adopt as the Desk's \"eject this view\"; headless ra-core split; optimistic-with-undo), \u003cstrong>Avo\u003c/strong> (the modern Rails admin — the \u003cstrong>escape-hatch ladder\u003c/strong> \"designed so you can't get stuck\" as a testable product property for D11/D14; custom fields as generatable component packages; actions as scoped first-class objects), \u003cstrong>NocoDB\u003c/strong> (spreadsheet UI over existing DBs — distinct from NocoBase; adopt \u003cstrong>saved views\u003c/strong> as first-class shareable objects, form views as the portal intake primitive, and lookup/rollup/formula virtual columns tied into drift detection; reject UI-direct writes that bypass the lifecycle). Studies README index/reading-order updated. Research-only session series ends here — \u003cstrong>PR opened\u003c/strong> for the whole branch (research notes, ADR 0007 + specs 0001/0002, design framework v5 with 7 axes / D1–D19, 12 study documents). No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-v5-system-study-series-generation-vs-interpretati\">2026-07-26 (v5) — system study series + generation-vs-interpretation (docs only)\u003c/h2>\n\u003cp>Requested reading material: one document per inspiration system (four questions each: key dimensions / what it enables / downsides / what to adopt). Created \u003cstrong>\u003ccode>docs/research/studies/\u003c/code>\u003c/strong>: README (rubric + the two-families framing), JHipster, generator-family (ScaffoldHub, Rails scaffolding/ActiveAdmin/Administrate, the author's ~2006 XML→EJB MDM generator — five answers to the round-trip problem tabulated), NocoBase, Salesforce, Jira, Directus, Odoo, ServiceNow. Adopt-verdicts reference D-decisions; notable new lessons captured: permission sets over monolithic roles (Salesforce), schemes-as-named-objects + never fork the config paradigm (Jira), snapshot/diff/apply not update-sets for promotion (Directus vs ServiceNow), auto-install bridge capabilities + extensions must target declared contracts (Odoo), task-table inheritance at scale (ServiceNow).\u003c/p>\n\u003cp>Design doc → v5: new §6.6 \u003cstrong>generation vs interpretation\u003c/strong> and \u003cstrong>D19\u003c/strong> (runtime interpretation is the source of truth; codegen one-way derived only — types/stubs/tests/seeds; DocType eject as one-way off-ramp, re-entry via adoption). Survey §8 now indexes into the studies dir.\u003c/p>\n\u003cp>No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-v4-parallel-branch-merged-three-missed-axes-added\">2026-07-26 (v4) — parallel branch merged; three missed axes added (docs only)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Merged\u003c/strong> \u003ccode>claude/frappe-multi-app-db-866jdv\u003c/code> (a parallel session's take on the same research task): ADR 0007 (foreign data bound per DocType, never per app; no DDL against sources; no 2PC — with rejected alternatives incl. postgres_fdw), spec 0001 External Data Sources (\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-1\u003c/a>…13 — far more rigorous than this branch's one-pager: standard- column map-or-synthesize contract, permission-before-query, constraint→ field error mapping, optimistic locking with whole-row fallback, drift detection, definition-of-done), spec 0002 Virtual DocTypes (\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-1\u003c/a>…5), specs README + CLAUDE.md pointer, and its research note (deeper Frappe code-level mechanics). \u003cstrong>Retired\u003c/strong> this branch's thinner \u003ccode>docs/specs/external-database-doctypes.md\u003c/code> in favour of 0001/0002; updated all XDB references in the design doc and research note. The two research notes now cross-link. Its PR was closed after the merge.\u003c/li>\u003cli>\u003cstrong>Design doc → v4\u003c/strong>, answering \"any axis missed?\": \u003cstrong>Axis E — time\u003c/strong> (audit trail, append-only versions, effectivity dating for MDM, as-of reads; git driver gets history free, sync needs replay), \u003cstrong>Axis F — change lifecycle\u003c/strong> (environments, promote-with-plan-preview, layer rollback — the Salesforce sandbox lesson, Frappe's known weak spot), \u003cstrong>Axis G — actors &amp; identity\u003c/strong> (internal/portal/machine/AI-agent principals, on-behalf-of chains, identity propagation declared per driver/sync binding). Cross-cutting non-axes named (observability, compliance, surfaces, i18n, offline, perf). New decisions \u003cstrong>D16–D18\u003c/strong>; MDM \"now\" bucket gains audit+versions+effectivity from day one.\u003c/li>\u003c/ul>\n\u003cp>No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-v3-design-framework-axis-d-extensibility-plugin-e\">2026-07-26 (v3) — design framework: Axis D, extensibility &amp; plugin ecosystem (docs only)\u003c/h2>\n\u003cp>More requirements: Salesforce's design admired; WordPress-style contribution loop + VS Code-style extensions (tables, workflows, UI elements as plugins); micro-apps where you can take \u003cem>only parts\u003c/em> (unlike VS Code's all-or-nothing); survey leading OSS (Strapi-class systems). Updated \u003ccode>docs/design/data-and-admin-topology.md\u003c/code> to v3 with a fourth axis:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>§6 Axis D\u003c/strong>: microkernel/dogfooding rule (NocoBase model — platform features use the same public plugin API); typed contribution points (VS Code static declaration + Directus's nine-type extension taxonomy); \u003cstrong>package ≠ capability\u003c/strong> — capability-level dependency graph so subsets of a macro app are installable (Medusa modules precedent; fixes VS Code's all-or-nothing); upgrade-safe layered metadata (Salesforce 2GP manageability → N package layers + site overlay, extending ADR 0003's package|site sources); trust tiers (reviewed npm packages / sandboxed site scripts / out-of-process driver services).\u003c/li>\u003cli>Survey extended: NocoBase, Directus extensions, Salesforce 2GP, Medusa, Strapi/Payload, WordPress, VS Code.\u003c/li>\u003cli>New decisions \u003cstrong>D10–D15\u003c/strong>; sequencing note: D10/D11 are disciplines to adopt immediately (AppManifest evolves into contribution points as features are built); D13 designed together with D2; marketplace later.\u003c/li>\u003c/ul>\n\u003cp>No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-v2-design-framework-reworked-for-pluggable-backen\">2026-07-26 (v2) — design framework reworked for pluggable backends (docs only)\u003c/h2>\n\u003cp>Further requirements: apps on Convex or InstantDB, legacy-app mirroring (a doctor's clinical system — mirror, then adapt on top while part of the team stays on legacy), future backends (SQLite, DuckDB, REST, filesystem), and a proposed rule \"different database ⇒ different app\". Rewrote \u003ccode>docs/design/data-and-admin-topology.md\u003c/code> (v2):\u003c/p>\n\u003cul>\u003cli>Axis B decomposed: five v1 \"storage classes\" → \u003cstrong>driver × ownership mode (owned/adopted/foreign) × sync bindings\u003c/strong> (separate first-class objects). Adapter interface with per-driver \u003cstrong>declared capabilities\u003c/strong> and explicit degradation (Hasura NDC / Trino connector model); capability matrix for postgres/sqlite/duckdb/convex/instantdb/rest/git-files.\u003c/li>\u003cli>Engine-level laws: cross-backend links reference-only, transactions never span backends, permissions/series/hooks always on core Postgres.\u003c/li>\u003cli>Legacy coexistence = strangler fig with the per-field ownership map as the migration dial (mirror → co-write → extend → retire).\u003c/li>\u003cli>\"Different DB = different app\" resolved as \u003cstrong>policy, not constraint\u003c/strong> (D9): per-DocType descriptor stays (strangler + sync cases demand it); one \u003cem>primary\u003c/em> backend per app is a flagged default.\u003c/li>\u003cli>New decisions D7 (ship the adapter seam + conformance suite now, postgres-only driver first) through D9; sequencing unchanged — MDM foundation first, git-files driver as first non-SQL proof.\u003c/li>\u003c/ul>\n\u003cp>No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-later-design-framework-storage-classes-scoped-adm\">2026-07-26 (later) — design framework: storage classes &amp; scoped admin (docs only)\u003c/h2>\n\u003cp>Follow-up discussion moved past Frappe's design to Featherbase's own requirements (multi-tenancy explicitly NOT key). Wrote \u003ccode>docs/design/data-and-admin-topology.md\u003c/code>, organizing the requirement space into three orthogonal axes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Axis A — organization/delegation\u003c/strong>: module = admin delegation boundary (module admins author \u003cem>types/field-sets\u003c/em> of shared base entities, never DDL); helpdesk generic→routed ticket case solved as base DocType + scoped Type registry (Salesforce record-types / JSM request-types pattern); generalizes to ERP as subtypes + config + dimensions + row partitions.\u003c/li>\u003cli>\u003cstrong>Axis B — storage/system-of-record\u003c/strong>: five storage classes behind one adapter — native, adopted, external-live (= existing XDB spec), mirrored (push/pull/bidirectional sync engine: outbox, key crosswalk, per-field survivorship, reconciliation), git-backed (UI edits become commits/PRs, diffability preserved — the medallion-config CSV case). Single DB/single schema stays the default; multi-DB-per-instance rejected.\u003c/li>\u003cli>\u003cstrong>Axis C — naming/reflection/augmentation\u003c/strong>: \u003ccode>table_name\u003c/code> moves into DocType metadata (kills derived \u003ccode>tab_\u003c/code> — configurable policy, none for adopted tables), reflection API, opt-in audit-column augmentation ladder.\u003c/li>\u003c/ul>\n\u003cp>Six candidate ADRs (D1–D6) + sequencing: MDM app first (reflection + adoption + audit columns + module admin), then push-mode sync, then git-backed class; type/field-sets and XDB later. No code, no features.json changes.\u003c/p>\n\u003ch2 id=\"2026-07-26-research-multi-app-external-db-support-docs-only-\">2026-07-26 — research: multi-app / external-DB support (docs only, no code)\u003c/h2>\n\u003cp>Question from the user: how does Frappe run multiple apps in one instance, do they share one DB, can one app use a remote Postgres (Railway control schema, live CLI writers) while others stay local — and can Featherbase do it?\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Findings\u003c/strong> (full write-up: \u003ccode>docs/research/frappe-multi-app-multi-db.md\u003c/code>): Frappe apps on a site share ONE database and one flat namespace — no per-app schema, no per-app connection; the isolation unit is the \u003cem>site\u003c/em>. Remote/external data is only reachable via hand-coded Virtual DocTypes (\u003ccode>is_virtual\u003c/code> + db_insert/load_from_db/db_update/delete/get_list protocol), which need zero changes to the external schema but are not code-free.\u003c/li>\u003cli>\u003cstrong>Featherbase audit\u003c/strong>: not supported today. Single scalar \u003ccode>DATABASE_URL\u003c/code> through the \u003ccode>sql\u003c/code> singleton (\u003ccode>db.ts\u003c/code>), no \u003ccode>is_virtual\u003c/code>/external-table concept in \u003ccode>doctypeDefSchema\u003c/code>, \u003ccode>createTableDDL\u003c/code> assumes it owns every table (no \u003ccode>IF NOT EXISTS\u003c/code>), \u003ccode>updateDocType\u003c/code> never reads \u003ccode>information_schema\u003c/code>. \u003ccode>tenancy.ts\u003c/code> (\u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a>) is same-DB schema-per-site, not a multi-connection abstraction.\u003c/li>\u003cli>\u003cstrong>Spec written\u003c/strong> (feather-spec): \u003ccode>docs/specs/external-database-doctypes.md\u003c/code> — XDB-1 connection registry (env-var creds, never DDL), XDB-2 table adoption by reflection (read-only when no PK), XDB-3 live Desk/API reads, XDB-4 hooked writes + conflict detection, XDB-5 app↔connection binding.\u003c/li>\u003cli>Verified: docs-only session; no code, no \u003ccode>harness/features.json\u003c/code> changes, app untouched.\u003c/li>\u003cli>\u003cstrong>Next session\u003c/strong>: review/approve the XDB spec, then implement XDB-1+XDB-2 first (registry + reflection) — they unlock read-only value before the write path.\u003c/li>\u003cli>Gotchas: docs.frappe.io and discuss.frappe.io block the container's fetch proxy (HTTP 403); research had to lean on web-search summaries plus the in-repo Frappe study.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-26-multi-app-multi-database-topology-researched-and-\">2026-07-26 — multi-app / multi-database topology researched and specced (parallel session, merged into this branch)\u003c/h2>\n\u003cp>Question raised: how does Frappe run many apps in one instance, do they share a database or a schema, can one app sit on a \u003cem>remote\u003c/em> Postgres while others stay local — and specifically, can a management app be put on top of an existing control schema in a Railway-hosted Postgres that CLIs keep writing to, without changing that schema?\u003c/p>\n\u003cp>Answered from the upstream source, then written up as requirements. \u003cstrong>No code changed this session\u003c/strong> — everything here is documentation.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>docs/research/frappe-multi-app-and-multi-db.md\u003c/code>\u003c/strong> — the corollary research. Frappe: bench/app/site; one database \u003cem>per site\u003c/em>, shared by every installed app, in one schema, with a flat \u003ccode>tab&lt;DocType&gt;\u003c/code> namespace (hence \u003ccode>HD Ticket\u003c/code>, \u003ccode>CRM Lead\u003c/code> prefixes); app ownership is metadata only (\u003ccode>Module Def.app_name\u003c/code>). A \u003cem>site\u003c/em> can point at a remote host via \u003ccode>db_host\u003c/code> in \u003ccode>site_config.json\u003c/code>, but an \u003cem>app\u003c/em> cannot — the connection is per site, per request. Foreign data is reached only through \u003ccode>frappe.database.get_db(host=…)\u003c/code> (a raw handle) or the \u003cstrong>Virtual DocType\u003c/strong> protocol (\u003ccode>load_from_db\u003c/code>/\u003ccode>db_insert\u003c/code>/\u003ccode>db_update\u003c/code>/\u003ccode>delete\u003c/code> + static \u003ccode>get_list\u003c/code>/\u003ccode>get_count\u003c/code>/\u003ccode>get_stats\u003c/code>, enforced by \u003ccode>frappe/model/virtual_doctype.py\u003c/code>). Frappe has \u003cem>no\u003c/em> way to bind a normal DocType to a pre-existing table. Featherbase already matches Frappe on apps and app ownership; the gaps are the second connection, the virtual protocol, and table binding.\u003c/li>\u003cli>\u003cstrong>\u003ccode>docs/adr/0007-app-and-database-topology.md\u003c/code>\u003c/strong> (Proposed) — decision: apps keep sharing one control DB; foreign data is bound \u003cstrong>per DocType\u003c/strong>, not per app; Featherbase never issues DDL against a source; cross-source saves are explicitly not atomic. Records why per-app DB routing, \u003ccode>postgres_fdw\u003c/code> as the primary transport, and ETL were all rejected.\u003c/li>\u003cli>\u003cstrong>\u003ccode>docs/specs/0001-external-data-sources.md\u003c/code>\u003c/strong> (\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-1\u003c/a>…13) — the answer to the Railway case. A \u003ccode>Data Source\u003c/code> registry (credentials by env-var \u003cem>name\u003c/em>, never stored), introspection, DocTypes bound to \u003ccode>{source, schema, table}\u003c/code> with a column map, SQL-pushdown reads, guarded writes, read-only sources, conflict detection with a whole-row fallback when there is no \u003ccode>modified\u003c/code> column, drift detection, control-side comments/attachments/versions, failure semantics, and the transaction boundary. Carries a \u003cstrong>\"what this requires of the foreign schema\"\u003c/strong> table: a single-column primary key is the only hard requirement; audit line, optimistic locking, \u003ccode>if_owner\u003c/code> scoping and submit/cancel each need one column and degrade loudly without it.\u003c/li>\u003cli>\u003cstrong>\u003ccode>docs/specs/0002-virtual-doctypes.md\u003c/code>\u003c/strong> (\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-1\u003c/a>…5) — the escape hatch for non-Postgres sources, mirroring Frappe's protocol but validating it at registration and \u003cem>rejecting\u003c/em> what it cannot honour (child tables, unique constraints) instead of silently dropping rows the way Frappe does.\u003c/li>\u003cli>\u003ccode>docs/specs/README.md\u003c/code> indexes both; \u003ccode>CLAUDE.md\u003c/code> gained a pointer under \"Where decisions live\". \u003ccode>harness/features.json\u003c/code> untouched — capability IDs live in the specs.\u003c/li>\u003c/ul>\n\u003cp>Verification: documentation only, so no runtime verification applies and nothing was marked passing. Each spec carries its own \"definition of done\" section listing the end-to-end checks the implementation must pass (second Postgres seeded by a fixture that mimics a CLI, HTTP CRUD against it, an out-of-band concurrent write, a dropped column, Playwright on the generic list/form, and a before/after schema comparison proving no DDL was issued).\u003c/p>\n\u003cp>Next: implement spec 0001, smallest slice first — \u003ccode>Data Source\u003c/code> + introspection + \u003cstrong>read-only\u003c/strong> bound DocTypes (\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-1\u003c/a>, 2, 3, 4, 5, 7, 13). That alone makes the Railway control schema browsable in the Desk and needs no write-path or conflict-detection machinery. Gotcha for whoever picks it up: \u003ccode>apps/server/src/ db.ts\u003c/code> exports one \u003ccode>sql\u003c/code> proxy used for both metadata and document data, and the sandbox seam swaps its delegate — the per-DocType client resolver has to keep metadata on the control pool, or the test harness will try to roll back a transaction on the wrong connection.\u003c/p>\n\u003ch2 id=\"2026-07-26-the-app-platform-closes-its-four-gaps-54-55-56-57\">2026-07-26 — the app platform closes its four gaps (#54, #55, #56, #57)\u003c/h2>\n\u003cp>Featherbase's first external consumer (a report server POSTing feedback rows over REST) proved the engine sound but exposed four framework gaps. All four closed, one commit each, nothing application-specific added to the framework:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>#54 — manifests declare roles + permissions.\u003c/strong> \u003ccode>AppManifest\u003c/code> gains \u003ccode>roles?: string[]\u003c/code> and \u003ccode>permissions?: AppPermission[]\u003c/code> (doctype, role, optional permlevel/if_owner, seven \u003ccode>can_*\u003c/code> flags); a grant may target a DocType the app doesn't own (same latitude as \u003ccode>doc_events\u003c/code>). Install creates roles before perms; an existing role or same-identity DocPerm (doctype, role, permlevel) is \u003cstrong>adopted, never redefined\u003c/strong>. The install ledger (\u003ccode>tab_installed_app.roles\u003c/code>/\u003ccode>perms\u003c/code>, migration 0053) records only what was genuinely created, so uninstall removes exactly that; a role is dropped only when no DocPerm links to it and no user holds it. A \u003ccode>can_create\u003c/code>-without-\u003ccode>can_write\u003c/code> grant warns at install — inserts strip to WRITE permlevels (the #45 trap) — and a test pins the empty-document behaviour. \u003ccode>test/app-grants.test.ts\u003c/code>, 7 tests.\u003c/li>\u003cli>\u003cstrong>#55 — declarative apps over the API.\u003c/strong> \u003ccode>POST /api/install_app\u003c/code> accepts \u003ccode>{ manifest }\u003c/code> (DocTypes + roles + permissions as pure data) alongside the unchanged \u003ccode>{ name }\u003c/code>. The manifest persists (\u003ccode>manifest\u003c/code> jsonb, migration 0054); uninstall tears everything down from stored data; boot has nothing to wire and neither warns nor fails. \u003ccode>doc_events\u003c/code> / \u003ccode>scheduler_events\u003c/code> / \u003ccode>override_whitelisted_methods\u003c/code> in a manifest are rejected with an error pointing at \u003ccode>registerApp()\u003c/code> — functions don't survive JSON. A declarative name owned by a code-registered app is refused (no shadowing). Still System-Manager-only, asserted by test — \u003ccode>{ manifest }\u003c/code> is a define-schema surface. \u003ccode>test/declarative-apps.test.ts\u003c/code>, 7 tests.\u003c/li>\u003cli>\u003cstrong>#56 — slug URLs.\u003c/strong> \u003ccode>/api/resource/report-feedback\u003c/code> and \u003ccode>report_feedback\u003c/code> resolve to \u003ccode>Report Feedback\u003c/code>; the exact name (encoded or not) always wins; ambiguity is a 409, never a silent pick; unknown slugs fall through to the usual 404. The slug map lives in \u003ccode>meta.ts\u003c/code> and dies with every \u003ccode>invalidateMeta()\u003c/code>. Spaces in DocType names stay legal. Gotcha: two \u003cem>table-backed\u003c/em> DocTypes can never share a slug — \u003ccode>tableName()\u003c/code> collapses the same variants, so the second create collides on its table; genuine ambiguity is only reachable via singles, which is how the test builds it. \u003ccode>test/slug-resolution.test.ts\u003c/code>, 6 tests.\u003c/li>\u003cli>\u003cstrong>#57 — production boot.\u003c/strong> \u003ccode>pnpm --filter server start\u003c/code> (tsx, no watcher; tsx moved to dependencies), \u003ccode>PORT\u003c/code>/\u003ccode>DATABASE_URL\u003c/code> from the environment as before. \u003ccode>pnpm --filter server release\u003c/code> runs migrations + patches inside one \u003ccode>pg_advisory_xact_lock(hashtext('featherbase-release'))\u003c/code> so N booting instances serialize — documented as the once-per-deploy step that runs before new code serves. Vendor-neutral \u003ccode>apps/server/Dockerfile\u003c/code> (no browser downloads; Chromium still resolves from the environment) and \u003ccode>docs/DEPLOY.md\u003c/code> runbook, which supersedes the deployment half of issue #25. \u003ccode>prepare: false\u003c/code> and the \u003ccode>DATABASE_URL\u003c/code> default are untouched. \u003ccode>./init.sh\u003c/code> unchanged — it uses none of the new scripts.\u003c/li>\u003c/ul>\n\u003cp>Verified: \u003ccode>pnpm test\u003c/code> (382 server / 9 web) green \u003cstrong>before and after\u003c/strong> the e2e run; \u003ccode>pnpm smoke\u003c/code> 2/2; full e2e 77 passed, 2 skipped (pre-existing conditional skips); both typechecks clean. Production path exercised live: \u003ccode>release\u003c/code> twice concurrently (serialized cleanly), \u003ccode>start\u003c/code> on \u003ccode>PORT=8010\u003c/code>, ping + smoke + Frappe-shape login. Live HTTP transcript against :8000: a declarative feedback app installed from a manifest, admin-minted API key for a scoped user, slug-URL insert + filtered list, 401/403/417 refusals all correct, uninstall dropping doctype + grant + (once unheld) role — and the shared-role-survives rule observed live when uninstalling while a user still held the role.\u003c/p>\n\u003cp>Next: QA the four PR-mapped commits from the branch; the owner decides issue #25's disposition (docs/DEPLOY.md is written as its replacement). Gotcha for future declarative work: \u003ccode>save_doc\u003c/code> updates require the loaded \u003ccode>modified\u003c/code> timestamp (optimistic concurrency) — a bare role-strip on User 417s, which is what turned transcript step 16 into a live demo of the shared-role rule.\u003c/p>\n\u003ch2 id=\"2026-07-24-one-ticketing-system-hd-ticket-promoted-to-a-migr\">2026-07-24 — one ticketing system: HD Ticket promoted to a migration, \u003ccode>Ticket\u003c/code> retired (issue #45)\u003c/h2>\n\u003cp>The repo carried two parallel ticketing demos (audit #44): the migration-seeded \u003ccode>Ticket\u003c/code> (TICK-, tested everywhere, basic) and the script-seeded \u003ccode>HD Ticket\u003c/code> (HDT-, the richer helpdesk — status-field workflow, SLA, assignment, web form, portal — but guarded by nothing). Consolidated onto HD Ticket:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>0051_helpdesk.ts\u003c/code>\u003c/strong> seeds the helpdesk \u003cem>structure\u003c/em>
