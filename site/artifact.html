 (roles, DocType — now with proper field labels — DocPerms, \u003ccode>HD Ticket Flow\u003c/code> on \u003ccode>state_field: 'status'\u003c/code>, Email Account/Rule, Server Script, SLA, Web Form). Skips cleanly on databases the old seed script already populated. Demo \u003cem>content\u003c/em> stays out of the migration chain (audit #49): \u003ccode>seed-helpdesk.ts\u003c/code> now seeds only demo users, the round-robin Assignment Rule (it links those users), and five sample tickets filed through the public web form; \u003ccode>reset-helpdesk.ts\u003c/code> removes exactly that content and leaves the structure.\u003c/li>\u003cli>\u003cstrong>\u003ccode>0052_drop_ticketing.ts\u003c/code>\u003c/strong> removes \u003ccode>Ticket\u003c/code>/\u003ccode>Ticket Comment\u003c/code> (workflow, roles, perms, tables) from existing databases; \u003ccode>0047_ticketing.ts\u003c/code> is deleted so fresh databases never create them.\u003c/li>\u003cli>\u003cstrong>Tests ported and strengthened:\u003c/strong> \u003ccode>test/helpdesk.test.ts\u003c/code> (9 tests: HDT series, SLA stamping, server-script defaults, if_owner scoping, workflow role gates + resolution condition + status save-protection, resolved-email queueing, web-form owner attribution), \u003ccode>web/test/helpdesk.test.tsx\u003c/code> (5 MECE component states), \u003ccode>e2e/ticketing.spec.ts\u003c/code> (self-seeding, cleans up after itself). Tests create their own documents — nothing relies on demo content.\u003c/li>\u003cli>\u003cstrong>Two framework findings while porting.\u003c/strong> (1) A \u003ccode>can_create\u003c/code>-without- \u003ccode>can_write\u003c/code> DocPerm can never populate fields on insert — \u003ccode>stripUnwritableFields\u003c/code> strips to WRITE permlevels — so the Comment/File collab grants now include \u003ccode>can_write\u003c/code> (the old seed's create-only grants were silently broken for agents). (2) \u003ccode>tab_email_queue\u003c/code> stores the raw template; rendering happens at delivery, so queue-level assertions must expect \u003ccode>{{ doc.name }}\u003c/code> unrendered.\u003c/li>\u003cli>\u003ccode>verify-helpdesk.ts\u003c/code>'s \"customer sees only own tickets\" check now asserts scoping membership, not an exact count (sample tickets are owned by the demo customers).\u003c/li>\u003c/ul>\n\u003cp>Verified: fresh migrations applied on the dev DB (0051 built the structure, 0052 dropped the old system); \u003ccode>pnpm test\u003c/code> → e2e (78) → \u003ccode>pnpm test\u003c/code> green both times; \u003ccode>seed:helpdesk\u003c/code> then \u003ccode>verify:helpdesk\u003c/code> — \u003cstrong>all 32 checks pass\u003c/strong>; typecheck clean.\u003c/p>\n\u003cp>Next: merge the CI (#46) and newcomer-docs (#47) branches; then the test reorganization (#48) can drop its ticket-file references.\u003c/p>\n\u003ch2 id=\"2026-07-22-follow-up-5-the-e2e-suite-no-longer-poisons-pnpm-\">2026-07-22 (follow-up 5) — the e2e suite no longer poisons \u003ccode>pnpm test\u003c/code> (issue #42)\u003c/h2>\n\u003cp>\u003ccode>pnpm test\u003c/code> was order-dependent: green on a clean database, four failures in \u003ccode>test/i18n.test.ts\u003c/code> after any e2e run. Reproduced before fixing — 5/5, run the two i18n specs, 4 failed — and the same cycle is now green.\u003c/p>\n\u003cp>\u003ccode>tab_translation\u003c/code> carries a unique index on \u003ccode>(language, source_text)\u003c/code>. The two i18n e2e specs seed French strings through the running server, so those rows are \u003cstrong>committed, not sandboxed\u003c/strong>, and they were never deleted. The sandboxed server test then tried to seed \u003ccode>(fr, 'Save')\u003c/code> under its own \u003ccode>name\u003c/code> and hit the index — rollback cannot help, because the row blocking it belongs to a different, already-committed transaction.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>apps/web/e2e/translations.ts\u003c/code>\u003c/strong> (new) owns seeding and cleanup for both specs. It clears whoever currently occupies \u003ccode>(language, source_text)\u003c/code> rather than just the name the spec uses, derives the name from the pair so only one row per pair can exist, and deletes what it created in \u003ccode>afterAll\u003c/code>.\u003c/li>\u003cli>\u003cstrong>The seeds were also failing silently.\u003c/strong> Both specs ignored the \u003ccode>save_doc\u003c/code> status, so a seed rejected by the index looked like successful setup — \u003ccode>i18n.spec.ts\u003c/code> was in fact running with two of its three translations missing and passing only because \u003ccode>i18n-login.spec.ts\u003c/code>'s leftovers happened to carry the same strings. The helper now throws on a bad status.\u003c/li>\u003cli>\u003cstrong>\u003ccode>mapDbError\u003c/code> blamed the wrong field.\u003c/strong> It derived the field from the constraint name, which only works for our generated \u003ccode>tab_x_field_uq\u003c/code> singles; a plain unique index, a composite, or the primary key all fell back to reporting \u003ccode>name\u003c/code>. So this collision surfaced as \"Duplicate value for \u003cstrong>name\u003c/strong>\" while \u003ccode>name\u003c/code> was fine — the single biggest reason it was hard to diagnose. It now parses the columns out of Postgres's error \u003ccode>detail\u003c/code> (\u003ccode>Key (language, source_text)=(fr, Save) already exists\u003c/code>) and falls back to the old constraint-name logic only when \u003ccode>detail\u003c/code> is absent.\u003c/li>\u003c/ul>\n\u003cp>Verified: both new tests confirmed \u003cstrong>red before the fix and green after\u003c/strong>, not merely green — the mapper test asserts the message names \u003ccode>language, source_text\u003c/code>, and \u003ccode>flags.test.ts\u003c/code> still passes, so the single-column \u003ccode>_uq\u003c/code> path is unchanged. Full sequence \u003ccode>pnpm test\u003c/code> → e2e → \u003ccode>pnpm test\u003c/code>: 359/359 server and 10/10 web \u003cstrong>both times\u003c/strong>, e2e 78/78, zero \u003ccode>tab_translation\u003c/code> rows left behind, both typechecks clean.\u003c/p>\n\u003cp>Next: nothing outstanding from #42. #38 (verify the container path) is still open.\u003c/p>\n\u003ch2 id=\"2026-07-22-follow-up-4-init-sh-can-no-longer-report-success-\">2026-07-22 (follow-up 4) — \u003ccode>init.sh\u003c/code> can no longer report success for someone else's server\u003c/h2>\n\u003cp>Two bugs found while verifying #33, both of which had been quietly producing wrong results rather than failures.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>./init.sh\u003c/code> reported \u003ccode>init OK\u003c/code> while its own server was dead.\u003c/strong> A dev server from a \u003cem>different checkout\u003c/em> held \u003ccode>:8000\u003c/code>; this run's server died with \u003ccode>EADDRINUSE\u003c/code>, but the health check passed because the other process answered. The script then ran the smoke suite — and an e2e suite — against a tree whose code was not the one under test. Three separate defects fed this:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>The port kill matched clients, not just listeners.\u003c/strong> \u003ccode>lsof -ti tcp:8000\u003c/code> also returns processes merely \u003cem>connected\u003c/em> to 8000, so cleaning the API port would have killed the web dev server, whose proxy holds a client connection to it. Verified directly: \u003ccode>lsof -ti tcp:8000\u003c/code> returned the vite pid. Now uses \u003ccode>-sTCP:LISTEN\u003c/code>.\u003c/li>\u003cli>\u003cstrong>A single SIGTERM with a fixed \u003ccode>sleep 2\u003c/code> was assumed to work.\u003c/strong> Now waits for the port to actually clear, escalates to SIGKILL, and \u003cem>fails loudly\u003c/em> if the port is still held rather than starting a server that cannot bind.\u003c/li>\u003cli>\u003cstrong>A responding port was treated as proof of our own server.\u003c/strong> After boot the script now asserts the process listening on each port is a descendant of the one it started, naming the intruder if not.\u003c/li>\u003c/ul>\n\u003cp>Also scoped the leftover-process cleanup: \u003ccode>pkill -f vite\u003c/code> killed the dev servers of every other worktree on the machine. It now matches \u003ccode>$PWD/apps/*\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>\u003ccode>getBrowser()\u003c/code> cached a dead Chromium forever.\u003c/strong> \u003ccode>browserPromise\u003c/code> was memoized unconditionally, so once the browser died under a long-lived server — killed with a process group, OOM, crash — every later call got the dead handle. PDFs would 500 and thumbnails would come back \u003ccode>null\u003c/code> \u003cem>silently\u003c/em>, because \u003ccode>makeThumbnailDataUrl\u003c/code> swallows the error, until someone restarted the server. This is what made \u003ccode>thumbnail.spec.ts\u003c/code> fail reproducibly against a long-running server while passing against a fresh one. \u003ccode>getBrowser()\u003c/code> now checks \u003ccode>isConnected()\u003c/code> before reuse and does not cache a failed launch.\u003c/p>\n\u003cp>Verified: the new test in \u003ccode>thumbnails.test.ts\u003c/code> closes the browser and asserts the next thumbnail still renders — confirmed failing without the fix and passing with it, not just passing after. \u003ccode>descends_from\u003c/code> was exercised both ways against the live process tree (accepts the real ancestor, rejects the web server and pid 1). \u003ccode>./init.sh\u003c/code> boots clean with no \u003ccode>EADDRINUSE\u003c/code> and both ports owned by this worktree. Suites: server 359/359, web 10/10, e2e 78/78, typecheck clean.\u003c/p>\n\u003cp>Gotcha for the next session — \u003cstrong>the e2e suite poisons \u003ccode>pnpm test\u003c/code>\u003c/strong>, filed separately as issue #42. \u003ccode>tab_translation\u003c/code> carries a unique index on \u003ccode>(language, source_text)\u003c/code>; \u003ccode>apps/web/e2e/i18n.spec.ts\u003c/code> and \u003ccode>i18n-login.spec.ts\u003c/code> commit rows there and never delete them, so the sandboxed \u003ccode>i18n.test.ts\u003c/code> cannot seed \u003ccode>(fr, 'Save')\u003c/code> afterwards and four tests fail.\u003c/p>\n\u003ch2 id=\"2026-07-22-follow-up-3-the-database-is-called-featherbase-is\">2026-07-22 (follow-up 3) — the database is called \u003ccode>featherbase\u003c/code> (issue #32)\u003c/h2>\n\u003cp>The Postgres database kept the project's former working name. Renamed to \u003ccode>featherbase\u003c/code> across the three places that name it, plus the existing database.\u003c/p>\n\u003cul>\u003cli>\u003ccode>init.sh\u003c/code> — the \u003ccode>DATABASE_URL\u003c/code> default (one site now, since follow-up 2 consolidated the two \u003ccode>su postgres\u003c/code> calls into it)\u003c/li>\u003cli>\u003ccode>apps/server/src/config.ts\u003c/code> — the \u003ccode>DATABASE_URL\u003c/code> fallback, which must stay in sync with \u003ccode>init.sh\u003c/code>\u003c/li>\u003cli>\u003ccode>apps/server/test/rls.test.ts\u003c/code> — the \u003ccode>RLS_TEST_URL\u003c/code> fallback. The \u003ccode>desk_client\u003c/code> \u003cstrong>role\u003c/strong> name is unchanged; only the database moved.\u003c/li>\u003cli>the live database, via \u003ccode>ALTER DATABASE frappe_clone RENAME TO featherbase\u003c/code> — instant, copies no data, so nothing was reseeded\u003c/li>\u003c/ul>\n\u003cp>Deliberately not touched: \u003ccode>docs/research/frappe-architecture.md\u003c/code>, where \u003ccode>frappe_clone\u003c/code> is a \u003cem>filesystem path\u003c/em> to an upstream Frappe checkout, and the dated entries in this file, which are historical records.\u003c/p>\n\u003cp>CLAUDE.md's \"Known rough edges\" section is gone — this was the last real entry in it, and the remaining Chromium note describes correct behaviour, so it moved to Environment.\u003c/p>\n\u003cp>\u003cstrong>Verified on macOS 15 / Homebrew postgresql@17:\u003c/strong> \u003ccode>./init.sh\u003c/code> to \u003ccode>init OK\u003c/code>, \u003ccode>pnpm test\u003c/code> 358/358 server + 10/10 web, e2e 78/78.\u003c/p>\n\u003cp>\u003cstrong>Gotcha found while verifying — not caused by this change.\u003c/strong> The first \u003ccode>pnpm test\u003c/code> failed 4/358 in \u003ccode>i18n.test.ts\u003c/code> with \u003ccode>417 ValidationError: Duplicate value for name\u003c/code> from \u003ccode>seedFrench\u003c/code>. The cause is that the \u003cstrong>e2e suite commits \u003ccode>tab_translation\u003c/code> rows that outlive the run\u003c/strong> (\u003ccode>fr-e2e-Save\u003c/code>, \u003ccode>fr-e2e-Priority\u003c/code>, \u003ccode>fr2-Log-out\u003c/code>), so any \u003ccode>pnpm test\u003c/code> after an e2e run fails. Reproduced deterministically: clear the table, unit suite is 358/358; run e2e, three rows come back. This is the same \"state outlives the run\" family as the job queue in #35 and the portal tickets fixed in #37 — tracked separately. \u003cstrong>Fixed in follow-up 5 above (issue #42).\u003c/strong>\u003c/p>\n\u003ch2 id=\"2026-07-22-follow-up-2-the-repo-boots-outside-the-container-\">2026-07-22 (follow-up 2) — the repo boots outside the container (issue #33)\u003c/h2>\n\u003cp>\u003ccode>./init.sh\u003c/code> was Debian-only and the Playwright config pointed at a container-only binary, so the documented \"run \u003ccode>./init.sh\u003c/code> first, every session\" protocol was impossible on macOS. Both are now environment-driven. Verified on macOS 15 with Homebrew \u003ccode>postgresql@17\u003c/code> (login user \u003ccode>siraj\u003c/code>, trust auth, port 5432) — the Debian container path is unverified, see the caveat at the end.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>init.sh\u003c/code> no longer manages Postgres it does not need to.\u003c/strong> \u003ccode>DATABASE_URL\u003c/code> is the single source of truth (default unchanged: \u003ccode>frappe_clone\u003c/code>, matching \u003ccode>apps/server/src/config.ts\u003c/code> — #32 has not landed). The script probes that URL with \u003ccode>psql\u003c/code> and does nothing at all if it answers, so an already-up container is a no-op. Only on failure does it (a) start a cluster, branching \u003ccode>pg_ctlcluster\u003c/code> (Debian) vs \u003ccode>brew services\u003c/code> (macOS), then (b) create the role and database over whichever superuser connection the host accepts — the current login user first, \u003ccode>su postgres\u003c/code> when running as root. \u003ccode>pg_lsclusters\u003c/code>, the hardcoded \u003ccode>16\u003c/code>, and the unconditional \u003ccode>su postgres\u003c/code> are gone.\u003c/li>\u003cli>\u003cstrong>Port cleanup used \u003ccode>fuser \"$port/tcp\"\u003c/code>, which silently did nothing on macOS.\u003c/strong> BSD \u003ccode>fuser\u003c/code> exists but rejects that syntax (\u003ccode>'5173/tcp' does not exist\u003c/code>), so stale dev servers were never killed and the \"idempotent restart\" was a no-op. Now prefers \u003ccode>lsof -ti tcp:$port\u003c/code>, falling back to \u003ccode>fuser\u003c/code>.\u003c/li>\u003cli>\u003cstrong>\u003ccode>( … &amp; )\u003c/code> around the dev servers hung the script on macOS.\u003c/strong> The subshell outlives the script holding its stdout, so \u003ccode>./init.sh | tee\u003c/code> never saw EOF and appeared to hang forever after printing nothing. Now \u003ccode>( … exec … ) &amp;\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Chromium is resolved, not hardcoded.\u003c/strong> \u003ccode>playwright.config.ts\u003c/code> sets \u003ccode>executablePath\u003c/code> only when \u003ccode>CHROMIUM_PATH\u003c/code> is set, otherwise letting Playwright find its own install. \u003ccode>print.ts\u003c/code> keeps its \u003ccode>PLAYWRIGHT_BROWSERS_PATH\u003c/code> scan but no longer assumes the Linux-only \u003ccode>chrome-linux/chrome\u003c/code> layout (mac and win layouts added), and still falls through to the default launch.\u003c/li>\u003cli>\u003cstrong>Playwright now runs \u003ccode>workers: 1\u003c/code>.\u003c/strong> It defaults to half the host's cores — 1 on the container, 6 here — and the specs share one server and one database, several mutating global state (System Settings, active language, client scripts). Parallel runs failed a \u003cem>different\u003c/em> 1–5 specs every time. Same rationale as the suites' existing \u003ccode>fileParallelism: false\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>Two pre-existing bugs surfaced, both invisible until a database was built from scratch or a suite run twice:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>getActiveWorkflow\u003c/code> broke every fresh-database migration.\u003c/strong> It queries \u003ccode>tab_workflow\u003c/code> (created in 0015) and its \u003ccode>state_field\u003c/code> column (added in 0048), but bootstrap migrations from 0005 on save documents, and every save asks for the active workflow. So \u003ccode>pnpm --filter server migrate\u003c/code> could never complete on an empty database — it died at 0005, then at 0047. Guarded with the probe idiom \u003ccode>meta.ts\u003c/code> already uses for \u003ccode>tab_property_setter\u003c/code>, checking the newest column so one probe covers both cases; only the positive is cached, so the schema completing mid-process is picked up.\u003c/li>\u003cli>\u003cstrong>\u003ccode>portal.spec.ts\u003c/code> was not idempotent.\u003c/strong> \u003ccode>beforeAll\u003c/code> recreates its users but never deleted their tickets, so Alice accumulated one more per run and the \u003ccode>toHaveCount(1)\u003c/code> assertion failed on every run after the first (6 rows after 6 runs). Now clears leftovers first, like \u003ccode>dashboard.spec.ts\u003c/code> and \u003ccode>calendar.spec.ts\u003c/code> already do.\u003c/li>\u003c/ul>\n\u003cp>Verified end-to-end on macOS: \u003ccode>./init.sh\u003c/code> from an empty database through all 50 migrations to \u003ccode>init OK\u003c/code> (exit 0, both smoke suites green); \u003ccode>pnpm test\u003c/code> 358/358 server + 10/10 web; the full e2e suite 78/78, \u003cstrong>twice consecutively\u003c/strong> — the repeat run is the point, since it is what caught the portal bug. Both typechecks clean. \u003ccode>print-pdf.test.ts\u003c/code> passes, which exercises the real Chromium launch through the new resolution path.\u003c/p>\n\u003cp>Caveat: the Debian/container path could not be exercised from this machine. The container branch is reached only when \u003ccode>DATABASE_URL\u003c/code> does not answer, and it keeps \u003ccode>pg_ctlcluster\u003c/code>/\u003ccode>su postgres\u003c/code>, but it is unverified — worth one run inside the container before trusting it.\u003c/p>\n\u003cp>Next: #32 (rename \u003ccode>frappe_clone\u003c/code> → \u003ccode>featherbase\u003c/code>) now touches a much smaller surface — \u003ccode>init.sh\u003c/code> reads the name from \u003ccode>DATABASE_URL\u003c/code>, so only \u003ccode>apps/server/src/config.ts\u003c/code> and \u003ccode>apps/server/test/rls.test.ts\u003c/code> hardcode it.\u003c/p>\n\u003ch2 id=\"2026-07-22-follow-up-an-interrupted-test-run-no-longer-poiso\">2026-07-22 (follow-up) — an interrupted test run no longer poisons the next one (issue #35)\u003c/h2>\n\u003cp>\u003ccode>tab_background_job\u003c/code> was the one piece of state surviving a run. Test bodies are transaction-isolated by the sandbox and roll back on their own, but a run killed partway through (Ctrl-C, crash, restart) leaves \u003ccode>queued\u003c/code> rows committed by tests that DID finish and never got drained. The next run then failed \u003ccode>jobs-recurring.test.ts\u003c/code> with \u003ccode>expected 2 to be 1\u003c/code> — \u003ccode>drainJobs()\u003c/code> counts any job it runs, and \u003ca class=\"fid-link\" href=\"#/f/JOB-003\">JOB-003\u003c/a>'s \u003ccode>setup()\u003c/code> only clears its own \u003ccode>demo_heartbeat\u003c/code> rows, so an orphan of any other method inflated the count. Nothing in that failure pointed at stale state, so it read as a real bug or as flake.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>apps/server/test/global-setup.ts\u003c/code>\u003c/strong> empties the queue once per run, wired in as \u003ccode>globalSetup\u003c/code> in both vitest configs. It runs in the main Vitest process, outside any sandbox transaction, so the delete actually commits. Guarded with \u003ccode>to_regclass\u003c/code> so an unmigrated database is a no-op rather than a confusing hard failure.\u003c/li>\u003cli>Global rather than per-file on purpose: the queue is shared across files, which is also why both suites set \u003ccode>fileParallelism: false\u003c/code>. This closes the same hole at run scope.\u003c/li>\u003cli>\u003cstrong>\u003ccode>postgres\u003c/code> added as an \u003ccode>apps/web\u003c/code> devDependency.\u003c/strong> The web config reuses the server's setup file, but Vite resolves that file's bare imports from the web root, and pnpm's isolated layout will not supply \u003ccode>postgres\u003c/code> transitively via the \u003ccode>server\u003c/code> dependency.\u003c/li>\u003c/ul>\n\u003cp>Verified by reproducing the bug, not just by re-running a green suite: injected an orphaned \u003ccode>queued\u003c/code> row, confirmed the old config fails (\u003ccode>expected 4 to be 1\u003c/code>), then confirmed the same state passes with the fix. Full suite run from a deliberately polluted queue: server 358/358, web 10/10, both typechecks clean, \u003ccode>pnpm install --frozen-lockfile\u003c/code> passes.\u003c/p>\n\u003cp>Next: nothing outstanding from #31/#35. \u003ccode>./init.sh\u003c/code> is still Debian-only and cannot boot on macOS — see the gotchas in the entry below for the local Postgres 17 setup that replaces it.\u003c/p>\n\u003ch2 id=\"2026-07-22-feather-testing-postgres-is-now-a-published-npm-d\">2026-07-22 — feather-testing-postgres is now a published npm dependency (issue #31)\u003c/h2>\n\u003cp>The harness existed twice — \u003ccode>packages/feather-testing-postgres\u003c/code> here and its own public repo — with byte-identical \u003ccode>src/\u003c/code>. Deleted the workspace copy and consumed the published package, so the two can no longer drift.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Published \u003ccode>feather-testing-postgres@0.1.0\u003c/code> to npm.\u003c/strong> The public repo was packaging-ready but had never been published. Added the missing \u003ccode>types\u003c/code> field upstream (commit \u003ccode>620da8c\u003c/code>); the \u003ccode>peerDependencies\u003c/code> fix issue #31 called for was already done upstream, so only \u003ccode>types\u003c/code> was outstanding.\u003c/li>\u003cli>**Swapped \u003ccode>workspace:*\u003c/code> → \u003ccode>^0.1.0\u003c/code>** in \u003ccode>apps/server\u003c/code> and \u003ccode>apps/web\u003c/code>, deleted \u003ccode>packages/feather-testing-postgres\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Added \u003ccode>test.server.deps.inline: ['feather-testing-postgres']\u003c/code>\u003c/strong> to both vitest configs. Required: the package ships raw TypeScript (\u003ccode>main: src/index.ts\u003c/code>, no build step), and Vitest does not transform \u003ccode>node_modules\u003c/code> by default. It only worked before because pnpm symlinks workspace packages.\u003c/li>\u003cli>\u003cstrong>Verified the risky part.\u003c/strong> A testing library must share the consumer's React instance; a nested copy causes \"invalid hook call\" or silently broken hooks. \u003ccode>node_modules/.pnpm\u003c/code> holds exactly one \u003ccode>react@19.2.7\u003c/code> and one \u003ccode>react-dom@19.2.7\u003c/code>, and the lockfile resolves every peer to those same instances. \u003ccode>apps/web/vitest.config.ts\u003c/code>'s existing \u003ccode>resolve.dedupe\u003c/code> stays.\u003c/li>\u003c/ul>\n\u003cp>Verified: green baseline captured BEFORE the swap, then again after — server 358/358 (88 files), web 10/10 (2 files), both typechecks clean. The swap was first validated against an \u003ccode>npm pack\u003c/code> tarball, whose shasum (\u003ccode>acc3cfe…\u003c/code>) matches what the registry now serves, so the tested bytes and the published bytes are identical.\u003c/p>\n\u003cp>Gotchas:\u003c/p>\n\u003cul>\u003cli>\u003ccode>./init.sh\u003c/code> is Debian-only (\u003ccode>pg_lsclusters\u003c/code>/\u003ccode>pg_ctlcluster\u003c/code>) and cannot boot on macOS. Ran against Homebrew Postgres 17 instead, creating the \u003ccode>postgres\u003c/code> and \u003ccode>desk_client\u003c/code> roles and an empty \u003ccode>frappe_clone\u003c/code> that \u003ccode>pnpm --filter server migrate\u003c/code> filled (50 migrations). Stayed on 17 rather than 18 to avoid changing two variables at once; 17 is also Supabase's current default.\u003c/li>\u003cli>\u003cstrong>An interrupted test run poisons the next one.\u003c/strong> Orphaned \u003ccode>queued\u003c/code> rows survive in the shared \u003ccode>tab_background_job\u003c/code> table and fail \u003ccode>jobs-recurring.test.ts\u003c/code> with \u003ccode>expected 2 to be 1\u003c/code> — nothing in the failure points at stale state. \u003ccode>delete from tab_background_job\u003c/code> clears it. Worth fixing in global test setup; not done here to keep this change single-purpose.\u003c/li>\u003c/ul>\n\u003cp>Next: consider the queue-contamination fix above, and note the package is source-only — if a non-Vitest consumer ever appears, give it a real \u003ccode>tsc\u003c/code> build with declarations instead of relying on \u003ccode>deps.inline\u003c/code>.\u003c/p>\n\u003ch2 id=\"2026-07-18-adopted-pr-2-s-genuinely-better-pieces-merged-the\">2026-07-18 — Adopted PR 2's genuinely-better pieces + merged the testing library (beyond the 126)\u003c/h2>\n\u003cp>A deliberate best-of-both pass after the PR 1 vs PR 2 verdict: PR 2 loses the architecture war but four of its ideas were superior and are now adopted here.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Frappe wire-format compat (additive)\u003c/strong>: sessions ride an HttpOnly \u003ccode>sid\u003c/code> cookie alongside the Bearer token; Frappe-shaped \u003ccode>POST /api/method/login\u003c/code> ('Logged In' + cookie) and \u003ccode>/api/method/logout\u003c/code>; error bodies carry Frappe's \u003ccode>exc_type\u003c/code> (NotFound → DoesNotExistError); and the \u003ccode>frappe.client.*\u003c/code> RPC namespace (get_list/get/get_count/get_value/insert/ set_value/delete/get_doctype + frappe.ping) as thin engine adapters. A frappe-js-sdk-style client works unchanged. \u003ccode>test/frappe-compat.test.ts\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Lifecycle + hooks.py parity\u003c/strong>: new controller events in Frappe's exact order — before_validate, on_update (fires on insert, update, submit, cancel), before_submit/before_cancel (pre-write, abortable); \u003ccode>doc_events['*']\u003c/code> wildcard controllers; app manifests gained \u003ccode>scheduler_events\u003c/code> (guarded recurring job, dropped on uninstall) and \u003ccode>override_whitelisted_methods\u003c/code> (restored on uninstall). \u003ccode>test/hook-parity.test.ts\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Desk affordance pack\u003c/strong>: Frappe-style standard filter bar (typed per-column inputs; Selects as dropdowns) feeding the same URL filter list as the advanced builder; colored indicator pills for Select values; module-grouped sidebar (app modules first, Core under System — reordering, not hiding); Cmd/Ctrl+K focuses the awesomebar which now also surfaces command actions; breadcrumbs + monospace names. Playwright e2e: 77 passed.\u003c/li>\u003cli>\u003cstrong>Harness upgrade (PR 2's best idea)\u003c/strong>: \u003ccode>harness/evaluation/\u003c/code> brings the default-FAIL contract (\u003ccode>enhancements.json\u003c/code> + \u003ccode>results.json\u003c/code> — build sessions never self-approve; only the fresh-context evaluator in \u003ccode>.claude/agents/evaluator.md\u003c/code> flips a result after reading evidence) and the differential oracle (\u003ccode>diff-request.sh\u003c/code> + \u003ccode>normalize.jq\u003c/code> — same request to a real Frappe at $FRAPPE_REF and the clone, normalized deep-diff). \u003ccode>features.json\u003c/code> stays frozen; this governs everything after the 126.\u003c/li>\u003cli>\u003cstrong>Merged the testing agent's main\u003c/strong>: feather-testing-postgres (Ecto-style per-test rollback sandbox) + their 74-file suite migration + their migration-seeded \u003ccode>Ticket\u003c/code> demo app. My helpdesk was renamed \u003cstrong>HD Ticket\u003c/strong> (real Frappe Helpdesk's name) on its own HDT-.##### series so both metadata apps coexist; my migrations renumbered 0048-0050; my new tests rewritten onto the sandbox (incl. the frozen-now() job nudge).\u003c/li>\u003cli>\u003cstrong>Coverage\u003c/strong>: touched modules driven to 99.2% statements / 100% functions (\u003ccode>test/coverage-gaps.test.ts\u003c/code>); remaining lines are defensive guards (early-migration table checks, readdir catch).\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: server suite 358 green ×2 consecutive runs, web component suite 10 green, Playwright 77 green, \u003ccode>verify:helpdesk\u003c/code> 32/32.\u003c/li>\u003cli>\u003cstrong>Gotchas\u003c/strong>: (1) the shared dev DB couples suites — a Playwright i18n run leaves tab_translation rows that collide with the sandboxed i18n unit test; clean tab_translation if it flakes. (2) The 0047 demo Ticket tests assert absolute TICK-000N names — don't seed other apps onto the TICK- prefix (HD Ticket uses HDT-). (3) \u003ccode>/api/method/login\u003c/code> must stay registered BEFORE the generic /api/method dispatcher.\u003c/li>\u003cli>\u003cstrong>Not adopted, on purpose\u003c/strong>: PR 2's JSONB single-table store (generated DDL is the more faithful + indexable clone), the NestJS/Drizzle stack swap, and Supabase (was aspirational in PR 2's docs, never in its code).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-17-pr-1-vs-pr-2-verdict-helpdesk-built-from-metadata\">2026-07-17 — PR 1 vs PR 2 verdict + Helpdesk built from metadata (beyond the 126)\u003c/h2>\n\u003cp>\u003cstrong>Verdict\u003c/strong>: both parallel implementations were booted and driven over HTTP against a 16-point ticketing checklist. PR 1 (this codebase) wins decisively — PR 2 (NestJS/Drizzle/JSONB) has a solid, honestly-reported metadata core but no workflow/assignments/email/comments/attachments/web-forms/realtime, plus an owner-stamping bug that breaks if_owner. Full write-up: \u003ccode>docs/archive/PR-COMPARISON.md\u003c/code>. Features missing in BOTH (now built here): Assignment Rules, SLAs, workflow state binding. Still open in both: inbound email → ticket.\u003c/p>\n\u003cp>\u003cstrong>Framework additions\u003c/strong> (all beyond the 126 — \u003ccode>features.json\u003c/code> untouched):\u003c/p>\n\u003cul>\u003cli>\u003ccode>state_field\u003c/code> on Workflow (migration 0047): binds the workflow to an existing field (e.g. \u003ccode>status\u003c/code>) instead of the parallel \u003ccode>workflow_state\u003c/code>; validated on save; inserts are forced to the initial state; direct saves cannot change the bound field (transitions only via the workflow endpoint, so role gates can't be bypassed).\u003c/li>\u003cli>Email Rules: \u003ccode>on_create\u003c/code>/\u003ccode>on_save\u003c/code> events now fire (they existed in the UI but were never called); conditional on_save rules fire only on the transition into the match (old-doc snapshot); recipients support \u003ccode>{{doc.field}}\u003c/code>; workflow transitions count as saves (rules + realtime \u003ccode>updated\u003c/code> events fire from \u003ccode>applyWorkflowAction\u003c/code>).\u003c/li>\u003cli>Assignment Rules (migration 0048): condition + user pool, round-robin ToDo/ notification per matching creation, optional \u003ccode>assign_to_field\u003c/code> stamps the document. Shared \u003ccode>createAssignment\u003c/code> helper also backs \u003ccode>/api/assign\u003c/code>.\u003c/li>\u003cli>Service Level Agreements (migration 0049): per-priority response/resolution windows stamp \u003ccode>response_by\u003c/code>/\u003ccode>resolution_by\u003c/code>/\u003ccode>sla_status\u003c/code> on insert (fields are declared by the target DocType); recurring \u003ccode>check_sla\u003c/code> job (60s) flips overdue open docs to \u003ccode>Overdue\u003c/code> once and emails the escalation role.\u003c/li>\u003cli>Web-form owner attribution: a logged-in submitter owns the created doc (saveDoc \u003ccode>skipPermissions\u003c/code> — web form only), closing the if_owner portal loop. Anonymous submits still create as Administrator.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/PERM-005\">PERM-005\u003c/a> fix: user-permission list narrowing passes NULL links (\u003ccode>IN\u003c/code> excluded them, emptying agents' lists and disagreeing with detail reads).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Helpdesk app\u003c/strong> (pure metadata over HTTP — the concrete proof): \u003ccode>pnpm --filter server reset:helpdesk &amp;&amp; pnpm --filter server seed:helpdesk\u003c/code> seeds roles/users/Ticket DocType/DocPerms/workflow/email rule/server script/ assignment rule/SLA/web form. \u003ccode>pnpm --filter server verify:helpdesk\u003c/code> exercises the whole flow as customer → agent → manager over HTTP: \u003cstrong>32/32 checks pass\u003c/strong> (intake+attribution+round-robin+SLA stamps, if_owner portal, role-gated + conditional transitions on the bound \u003ccode>status\u003c/code> field, save-protection, resolved email to requester, comments, ToDos, Overdue escalation email). Server suite: \u003cstrong>324 tests green\u003c/strong> (16 new). Desk renders it all with zero frontend changes (list/kanban/form screenshots verified via Playwright).\u003c/p>\n\u003cp>\u003cstrong>Gotchas\u003c/strong>:\u003c/p>\n\u003cul>\u003cli>Demo logins: agents \u003ccode>agent1|agent2@helpdesk.test\u003c/code>, manager \u003ccode>manager@helpdesk.test\u003c/code>, customers \u003ccode>cust1@acme.test\u003c/code>/\u003ccode>cust2@globex.test\u003c/code>, all \u003ccode>demo1234\u003c/code>; intake at \u003ccode>/form/new-ticket\u003c/code>, portal at \u003ccode>/portal/Ticket\u003c/code>.\u003c/li>\u003cli>The bound \u003ccode>status\u003c/code> Select still renders editable in the form; a direct save is refused server-side (417) — making the form render it read-only when a workflow binds it would be a nice follow-up.\u003c/li>\u003cli>\u003ccode>workflow.test.ts\u003c/code> updated: docs under a workflow now START at the initial state (was NULL), per \u003ca class=\"fid-link\" href=\"#/f/WF-003\">WF-003\u003c/a> semantics.\u003c/li>\u003cli>Next up: inbound email → ticket (the one ticketing gap still open in both implementations), and PR 2 can be closed (see docs/archive/PR-COMPARISON.md).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-17-legacy-server-suite-migrated-to-the-sql-sandbox-7\">2026-07-17 — Legacy server suite migrated to the SQL sandbox (74/79 files)\u003c/h2>\n\u003cp>The entire pre-existing server test suite now runs on feather-testing-postgres: every migrated test executes inside its own rolled-back transaction — all manual DELETE/DROP/\u003ccode>sql.end()\u003c/code> cleanup is gone. Full suite \u003cstrong>320/320\u003c/strong>, web 10/10, typechecks clean, browser smoke + ticketing e2e green.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Migrated in 7 verified batches\u003c/strong> (each independently re-run before commit): document-engine (11 files), meta/DDL (11), permissions (10), misc endpoints (14), features/workflow/reports (11), jobs/email/webhooks (9), special files (realtime, files, signed-files, print-pdf, thumbnails).\u003c/li>\u003cli>\u003cstrong>5 files stay legacy BY DESIGN\u003c/strong>, each annotated in-file: \u003ccode>cli\u003c/code> (subprocess opens its own PG connection), \u003ccode>tenancy\u003c/code> (per-site pools bypass the db.ts seam), \u003ccode>patches\u003c/code> (tests the runner's real commit semantics), \u003ccode>rls\u003c/code> (verifies native RLS via a second desk_client connection that cannot see an uncommitted tx), \u003ccode>schema-sync-stale-plan\u003c/code> (needs multiple warm pooled connections; the sandbox pins one).\u003c/li>\u003cli>\u003cstrong>Gotchas discovered, for future test authors\u003c/strong>:\u003cul>\u003cli>\u003ccode>now()\u003c/code> freezes at BEGIN inside the sandbox but \u003ccode>enqueue()\u003c/code> stamps wall-clock \u003ccode>run_at\u003c/code> — drain-based job tests must nudge due jobs onto the tx clock (\u003ccode>run_at &lt;= clock_timestamp()\u003c/code> → \u003ccode>now()\u003c/code>) before \u003ccode>drainJobs()\u003c/code>. Candidate for lifting into pg-test as a helper.\u003c/li>\u003cli>Process-global state does NOT roll back: controller registrations (\u003ccode>clearControllers\u003c/code> in finally), installed apps (uninstall in finally), \u003ccode>stopWorker()\u003c/code> in finally; job/script-report registries have no unregister — unique names keep leaks benign.\u003c/li>\u003cli>A failing RAW SQL statement authored in a test body aborts the whole sandbox tx (no savepoint) — only safe as the test's last DB op; errors raised through the API always roll back to a savepoint.\u003c/li>\u003cli>\u003ccode>SET TRANSACTION READ ONLY\u003c/code> works under a savepoint (PG only forbids read-write after queries) but leaves the OUTER test tx read-only — order writes before \u003ccode>runQueryReport\u003c/code> calls.\u003c/li>\u003cli>Legacy suites with order-dependent tests need per-test \"replay helpers\" that re-execute earlier tests' mutations as setup.\u003c/li>\u003cli>Disk state (file uploads) does not roll back — file tests keep \u003ccode>deleteStored\u003c/code> cleanup in finally blocks.\u003c/li>\u003c/ul>\u003c/li>\u003cli>\u003cstrong>Infra note\u003c/strong>: mid-migration the system Postgres AND both dev servers were killed (no crash log — likely resource pressure from concurrent agent runs); \u003ccode>pg_ctlcluster 16 main start\u003c/code> + \u003ccode>./init.sh\u003c/code> recovered, no data loss. Full suite re-verified afterwards.\u003c/li>\u003cli>\u003cstrong>Next\u003c/strong>: consider lifting the job-clock nudge into the library; evaluate per-file parallelism for the sandboxed majority (needs the 5 legacy files quarantined to a sequential project and shared naming-series row locks assessed).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-17-feather-testing-postgres-phoenix-style-testing-li\">2026-07-17 — feather-testing-postgres: Phoenix-style testing library + ticketing demo (beyond the 126)\u003c/h2>\n\u003cp>New net-new infrastructure (no features.json changes): a testing library in \u003ccode>packages/feather-testing-postgres\u003c/code> that brings the Ecto SQL Sandbox model to this stack, proven end-to-end by a metadata-only ticketing app.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>SQL sandbox (Ecto pattern)\u003c/strong>: \u003ccode>db.ts\u003c/code> now exports \u003ccode>sql\u003c/code> through a delegating Proxy with a test-only seam (\u003ccode>_setSqlDelegate\u003c/code>). \u003ccode>withSandbox\u003c/code> opens a real transaction, swaps the delegate, runs the test, ALWAYS rolls back; while sandboxed, app-level \u003ccode>sql.begin\u003c/code> calls are intercepted into \u003ccode>SAVEPOINT\u003c/code>s (a real BEGIN/COMMIT would commit the outer test txn). The proxy is transparent when unsandboxed — the pre-existing suite is unaffected.\u003c/li>\u003cli>\u003cstrong>Fixtures\u003c/strong>: \u003ccode>createPgTest(bindings)\u003c/code> → vitest \u003ccode>test.extend\u003c/code> with \u003ccode>db\u003c/code> (auto — every test sandboxed), \u003ccode>api\u003c/code>/\u003ccode>admin\u003c/code>/\u003ccode>client\u003c/code> (in-process \u003ccode>app.request\u003c/code> clients with real JWTs), \u003ccode>seed\u003c/code> (real save lifecycle), \u003ccode>createUser\u003c/code> (real User rows + roles, rolled back). Bindings per app: \u003ccode>apps/server/test/pg-test.ts\u003c/code>, \u003ccode>apps/web/test/pg-test.ts\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Web component testing (NEW - there was none)\u003c/strong>: vitest+jsdom+RTL in \u003ccode>apps/web\u003c/code>; \u003ccode>installFetchBridge\u003c/code> routes the app's relative \u003ccode>fetch('/api/…')\u003c/code> to the in-process Hono app; \u003ccode>renderDesk(path, client)\u003c/code> mounts the REAL routeTree on a memory history with a fresh QueryClient. Component → fetch → Hono → sandboxed Postgres in milliseconds. Fluent Session DSL (\u003ccode>fillIn/selectOption/clickButton/assertText/within…\u003c/code>) with chain-trace errors; \u003ccode>clickButton\u003c/code> refuses disabled buttons.\u003c/li>\u003cli>\u003cstrong>Ticketing demo (migration 0047)\u003c/strong>: Ticket + Ticket Comment DocTypes (TICK-.#### series, child comments), Ticket Manager/Reporter roles (if_owner), 4-state workflow (Open→In Progress→Resolved→Closed, Resolve requires a resolution via WF condition), 5 DW-flavored seed tickets. Zero frontend code — the generic Desk renders all of it.\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: server \u003ccode>test/sandbox.test.ts\u003c/code> (4 — incl. root-connection proof the DB is untouched after the file) + \u003ccode>test/ticket.test.ts\u003c/code> (8 — twin tests both get TICK-0006 proving series rollback; child-table round-trip; if_owner scoping; role-gated workflow with condition), full server suite \u003cstrong>320/320\u003c/strong>; web \u003ccode>test/infra.test.tsx\u003c/code> + \u003ccode>test/ticket.test.tsx\u003c/code> \u003cstrong>10/10\u003c/strong> (list/empty/create/validation/workflow through the real UI, with cross-test rollback assertions); typechecks clean; live-browser \u003ccode>e2e/ticketing.spec.ts\u003c/code> + smoke green.\u003c/li>\u003cli>\u003cstrong>Gotchas\u003c/strong>: (1) a thenable whose \u003ccode>then\u003c/code> resolves with \u003ccode>this\u003c/code> makes \u003ccode>await\u003c/code> recurse to heap exhaustion — resolve chains with \u003ccode>undefined\u003c/code>; (2) migrations run WITHOUT the controller registry, so a migration that saves a Workflow must call \u003ccode>initDocState\u003c/code> itself for \u003ccode>workflow_state\u003c/code>; (3) FormView's Save is dirty-gated — a pristine form can't be saved, so the validation-error state needs a dirty form with the required field empty; (4) \u003ccode>assertText\u003c/code> reads textContent — input VALUES are not text; (5) web tests keep \u003ccode>fileParallelism: false\u003c/code>: parallel FILES are safe transactionally but contend on the shared naming-series row lock.\u003c/li>\u003cli>\u003cstrong>Next\u003c/strong>: migrate legacy server tests to the sandboxed \u003ccode>test\u003c/code> (drops all manual cleanup + could re-enable file parallelism for converted files); optional \u003ccode>Ticket Reporter\u003c/code> portal flow; extract the package to its own repo/npm once the API settles.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-17-enhancement-conditional-workflow-transitions-beyo\">2026-07-17 — Enhancement: conditional workflow transitions (beyond the 126)\u003c/h2>\n\u003cp>Closes the workflow gap called out in the Frappe comparison. This ENHANCES \u003ca class=\"fid-link\" href=\"#/f/WF-001\">WF-001\u003c/a>/002/003 — it is not a new harness feature, so \u003ccode>features.json\u003c/code> is untouched.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Schema\u003c/strong>: \u003ccode>Workflow Transition\u003c/code> gains a \u003ccode>condition\u003c/code> field (\u003ccode>0046_workflow_condition.ts\u003c/code>) — a boolean expression over \u003ccode>doc\u003c/code>. Because it's a normal child docfield, it renders as an editable \u003cstrong>Condition column in the Workflow form's transitions grid\u003c/strong> — i.e. the Frappe-style workflow builder (Frappe's Workflow form is also just states/transitions child tables, not a visual graph).\u003c/li>\u003cli>\u003cstrong>Safe evaluator\u003c/strong>: \u003ccode>evalCondition(expr, doc)\u003c/code> in \u003ccode>server-scripts.ts\u003c/code> reuses the \u003cstrong>hardened node:vm sandbox\u003c/strong> — the context carries only the doc's JSON (parsed inside), no host object is exposed, so a condition can read \u003ccode>doc\u003c/code> but cannot reach \u003ccode>process\u003c/code>/\u003ccode>require\u003c/code>/\u003ccode>fetch\u003c/code>. Blank condition = always true.\u003c/li>\u003cli>\u003cstrong>Engine\u003c/strong>: \u003ccode>WorkflowTransition.condition\u003c/code> is loaded in \u003ccode>getActiveWorkflow\u003c/code>; \u003ccode>availableActions(wf, state, roles, doc?)\u003c/code> filters out transitions whose condition is false; \u003ccode>applyWorkflowAction\u003c/code> \u003cstrong>enforces the condition for everyone — Administrator included\u003c/strong> (a condition is a property of the document, not the user) and independently of the UI. The status endpoint passes the doc so the form's buttons auto-hide.\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>test/workflow-condition.test.ts\u003c/code> (4 — sandbox reads doc but process/require are undefined; per-doc availability; apply refused when the condition fails even for admin; the holding branch applies) and \u003ccode>e2e/workflow-condition.spec.ts\u003c/code> (2 — the form offers only the action whose condition holds for that doc; the builder grid exposes the editable Condition column). Live HTTP: a doc with amount 500 is offered only \"Auto Approve\" and gets 417 on \"Approve\"; amount 5000 is offered only \"Approve\". Existing workflow unit + e2e green; full server suite \u003cstrong>308/308\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-008-passing-multi-tenancy-schema-per-site-al\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a> passing: multi-tenancy (schema-per-site) — ALL 126 DONE\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>tenancy.ts\u003c/code>\u003c/strong>: each site is an isolated Postgres \u003cstrong>schema\u003c/strong> (\u003ccode>site_&lt;name&gt;\u003c/code>) holding its own \u003ccode>tab_*\u003c/code> tables. A per-site pooled client sets \u003ccode>search_path\u003c/code> to \u003cstrong>only\u003c/strong> that schema, so a query physically cannot reach another site's tables — isolation is enforced by Postgres, not app-level filters (verified directly: two clients each see only their own rows).\u003c/li>\u003cli>\u003cstrong>Site resolver (Host header)\u003c/strong>: a \u003ccode>public.tab_site\u003c/code> registry (\u003ccode>0045_site_registry.ts\u003c/code>) maps host → site/schema. \u003ccode>resolveSite(host)\u003c/code> matches the full host, then the leading subdomain label (\u003ccode>alpha.example.com\u003c/code> → \u003ccode>alpha\u003c/code>), else 404 — no cross-site fallback.\u003c/li>\u003cli>\u003cstrong>Per-site migrate\u003c/strong>: \u003ccode>createSite\u003c/code> creates the schema and runs \u003ccode>siteMigrate\u003c/code> (its own \u003ccode>tab_doctype\u003c/code>/\u003ccode>tab_docfield\u003c/code>/\u003ccode>tab_user\u003c/code>). Site-scoped ops (\u003ccode>siteCreateDoctype\u003c/code> — real per-site \u003ccode>tab_&lt;name&gt;\u003c/code> table + metadata, \u003ccode>siteCreateUser\u003c/code>, and the list counterparts) all run on the site's schema.\u003c/li>\u003cli>\u003cstrong>Endpoints\u003c/strong>: provisioning \u003ccode>POST/GET /api/tenancy/sites\u003c/code> (System Manager); data endpoints \u003ccode>/api/tenancy/{doctype,doctypes,user,users}\u003c/code> resolve the site from the request \u003cstrong>Host header\u003c/strong>. Kept self-contained — the existing global \u003ccode>public\u003c/code>-schema app is untouched, so nothing regressed.\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>test/tenancy.test.ts\u003c/code> (4 — two sites with independent DocTypes+users; Host resolves by exact host and by subdomain label; unknown host → 404; each site's \u003ccode>tab_widget\u003c/code> lives only in its own schema) + a live HTTP run with real \u003ccode>Host:\u003c/code> headers (acme sees only Invoice/ceo@acme.test, globex only Shipment/no-users, unknown host → 404). Full server suite 304/304.\u003c/li>\u003cli>\u003cstrong>This completes all 126 features.\u003c/strong>\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-006-passing-google-oauth-mocked-in-dev\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-006\">PLAT-006\u003c/a> passing: Google OAuth (mocked in dev)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>oauth.ts\u003c/code>\u003c/strong>: a provider abstraction. With no \u003ccode>GOOGLE_CLIENT_ID\u003c/code>, a \u003cstrong>mock provider\u003c/strong> stands in for Google: \u003ccode>googleAuthorizeUrl\u003c/code> points at a local consent page, and \u003ccode>exchangeCode\u003c/code> decodes a signed authorization code. Real Google's authorize URL + token/userinfo exchange live behind the same interface (used only when credentials are set). State + mock code are stateless \u003cstrong>HMAC-signed\u003c/strong> tokens with a 10-min expiry.\u003c/li>\u003cli>\u003cstrong>Flow\u003c/strong> (all public, before the auth middleware): \u003ccode>GET /api/oauth/google/login\u003c/code> → \u003ccode>GET /api/oauth/mock/consent\u003c/code> (a small consent page) → \u003ccode>GET /api/oauth/mock/approve\u003c/code> (verifies state, issues a signed code) → \u003ccode>GET /api/oauth/google/callback\u003c/code> (verifies state, exchanges the code, find-or-creates the User, issues a session) → 302 to the SPA \u003ccode>/oauth-callback?token=…\u003c/code>, which stores the token, hydrates via whoami, and lands in the Desk.\u003c/li>\u003cli>\u003cstrong>Mapped to the User DocType\u003c/strong>: \u003ccode>findOrCreateGoogleUser\u003c/code> links an existing account by email (case-insensitive) or creates one, re-enables it, and stamps the new read-only \u003ccode>User.social_login = 'google'\u003c/code> (\u003ccode>0044_user_social_login.ts\u003c/code>, set with a direct write since read-only fields are ignored by save). The Login page gained a \"Sign in with Google\" link.\u003c/li>\u003cli>\u003cstrong>Same-origin in dev\u003c/strong>: the mock flow uses \u003cstrong>relative\u003c/strong> redirect URLs so the Vite \u003ccode>/api\u003c/code> proxy keeps the browser on the SPA origin end to end (real Google needs an absolute redirect_uri, so that path stays absolute).\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>e2e/oauth.spec.ts\u003c/code> (3 — mock sign-in creates the User, stamps \u003ccode>social_login=google\u003c/code>, lands in the Desk; a second sign-in links the same User (no duplicate); a \u003cstrong>tampered state → 401\u003c/strong>) + a full HTTP walk of the redirect chain. Full server suite 300; login/user-mgmt e2e unaffected.\u003c/li>\u003cli>Gotcha: an HTML GET form \u003cstrong>discards its action URL's query string\u003c/strong> — carry \u003ccode>state\u003c/code>/\u003ccode>redirect_uri\u003c/code> as hidden inputs, not in the action.\u003c/li>\u003cli>Next: 1 P3 remains (\u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a> multi-tenancy).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-plat-001-plat-002-passing-app-system-doc-events\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/PLAT-002\">PLAT-002\u003c/a> passing: app system + doc_events\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>apps.ts\u003c/code>\u003c/strong>: an app is a code-defined \u003ccode>AppManifest { name, doctypes?, doc_events? }\u003c/code>. \u003ccode>registerApp\u003c/code> adds it to the in-process registry; \u003ccode>installApp\u003c/code> creates its DocTypes (via the engine → real tables) and \u003cstrong>wires its doc_events\u003c/strong> as controllers, recording owned DocTypes in \u003ccode>tab_installed_app\u003c/code> (\u003ccode>0043_installed_app.ts\u003c/code>); \u003ccode>uninstallApp\u003c/code> unwires the hooks and drops the owned DocTypes + record; \u003ccode>loadInstalledApps\u003c/code> re-wires installed apps' hooks at boot (their tables persist). App code lives in the process; the DB only holds installed-state.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/PLAT-002\">PLAT-002\u003c/a> mechanism\u003c/strong>: \u003ccode>doc_events\u003c/code> register as normal controllers, and the controller registry is a \u003cstrong>list per DocType\u003c/strong>, so an app hook on a DocType it doesn't own (e.g. Task) runs \u003cem>alongside\u003c/em> the core controller. Added \u003ccode>unregisterController(ref)\u003c/code> so uninstall removes exactly the app's hooks without disturbing the core one.\u003c/li>\u003cli>Endpoints (System-Manager only): \u003ccode>GET /api/apps\u003c/code>, \u003ccode>POST /api/install_app\u003c/code>, \u003ccode>POST /api/uninstall_app\u003c/code>. Ships a sample app \u003cstrong>hello-crm\u003c/strong> (a \u003ccode>CRM Lead\u003c/code> DocType + a \u003ccode>before_save\u003c/code> hook that normalizes the lead email).\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>test/apps.test.ts\u003c/code> (3 — install creates the DocType + fires its hook + records state; uninstall drops the DocType/table/record; \u003cstrong>an app hook on a foreign DocType fires alongside the core controller → \u003ccode>['core','app']\u003c/code>, and after uninstall only \u003ccode>['core']\u003c/code>\u003c/strong>). Live HTTP: install hello-crm → create a \u003ccode>CRM Lead\u003c/code> (email normalized \u003ccode>  Bob@ACME.COM \u003c/code> → \u003ccode>bob@acme.com\u003c/code> by the app hook) → uninstall → the DocType 404s. Full server suite 300/300.\u003c/li>\u003cli>Gotchas: (1) hooks run \u003cstrong>after\u003c/strong> schema validation, so a \u003ccode>before_save\u003c/code> hook can't fix a value the field's own constraints already rejected (the sample hook normalizes a free-text field, not the Select). (2) jsonb columns: passing a JSON \u003cem>string\u003c/em> double-encodes — use \u003ccode>sql.json(value)\u003c/code> and parse defensively on read.\u003c/li>\u003cli>Next: 2 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/PLAT-006\">PLAT-006\u003c/a> Google OAuth [mocked], \u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a> multi-tenancy).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-web-003-passing-customer-portal\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a> passing: customer portal\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>Portal.tsx\u003c/code>\u003c/strong> with two routes outside the Desk shell: \u003ccode>/portal/$doctype\u003c/code> (list) and \u003ccode>/portal/$doctype/$name\u003c/code> (read-only detail), each gated on a token (redirect to \u003ccode>/login\u003c/code> otherwise). A minimal portal chrome (brand + user + log out), no Desk sidebar.\u003c/li>\u003cli>The list reads \u003ccode>/api/resource/:doctype\u003c/code>, which is already \u003cstrong>if_owner-scoped\u003c/strong> (\u003ca class=\"fid-link\" href=\"#/f/PERM-007\">PERM-007\u003c/a>), so a website user sees only the documents they own. The detail page fetches the doc and, on a \u003cstrong>403/404\u003c/strong> \u003ccode>ApiError\u003c/code>, renders an access-denied panel (\u003ccode>portal-forbidden\u003c/code>) instead of the fields.\u003c/li>\u003cli>No new server code — the whole feature rides the existing permission-scoped resource API. \"Website user\" = any User holding a role with an if_owner grant on the DocType.\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>e2e/portal.spec.ts\u003c/code> (3 — Alice sees only her own ticket (1 row, not Bob's); Alice opening Bob's ticket URL shows the forbidden panel; Bob CAN open his own) plus a direct API check (Alice lists 1 own doc; \u003ccode>GET\u003c/code> Bob's doc → \u003cstrong>403\u003c/strong>). Existing web-form/web-page/desk routing e2e unaffected.\u003c/li>\u003cli>Next: 4 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-file-004-passing-image-thumbnails\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/FILE-004\">FILE-004\u003c/a> passing: image thumbnails\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>thumbnails.ts\u003c/code>\u003c/strong>: \u003ccode>makeThumbnailDataUrl(content, mime, maxDim=128)\u003c/code> decodes a raster image and canvas-downscales it \u003cstrong>in Chromium\u003c/strong> (reusing the exported \u003ccode>getBrowser()\u003c/code> singleton already used for PDFs — no new dependency; \u003ccode>sharp\u003c/code> isn't installed), returning a self-contained \u003ccode>data:image/jpeg;base64,…\u003c/code> thumbnail. \u003ccode>isThumbnable\u003c/code> gates to png/jpeg/webp/gif (svg excluded).\u003c/li>\u003cli>\u003cstrong>File DocType\u003c/strong> gains a read-only \u003ccode>thumbnail_url\u003c/code> (Long Text) via \u003ccode>0042_file_thumbnail.ts\u003c/code>. On upload (\u003ccode>/api/upload_file\u003c/code>), images get a thumbnail generated best-effort (a decode failure never blocks the upload).\u003c/li>\u003cli>\u003cstrong>Persistence gotcha\u003c/strong>: \u003ccode>thumbnail_url\u003c/code> is \u003ccode>read_only\u003c/code>, and the save lifecycle deliberately ignores client values for read_only fields (\u003ccode>pickFieldValues\u003c/code>) — so the server sets it with a \u003cstrong>direct \u003ccode>update tab_file\u003c/code> after \u003ccode>saveDoc\u003c/code>\u003c/strong> (the same pattern naming/workflow use) and reflects it on the returned doc. Storing it as a data URI avoids any extra storage object or signed-URL handling (works for private images too).\u003c/li>\u003cli>\u003cstrong>Attachments UI\u003c/strong> shows the thumbnail (\u003ccode>&lt;img src={thumbnail_url}&gt;\u003c/code>) beside image rows; non-images render as before.\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>test/thumbnails.test.ts\u003c/code> (4 — recognizes raster types; 300×200→128×85 aspect-preserved; no upscaling of small images; null for non-image, all measured back in Chromium) + \u003ccode>e2e/thumbnail.spec.ts\u003c/code> (attach a real 240×160 PNG → an \u003ccode>attachment-thumb\u003c/code> with a JPEG data URI ≤128px renders; a .txt gets none). Live HTTP confirmed an 87KB PNG → 1.3KB thumbnail, private images included. Full server suite 297/297; attachments e2e unaffected.\u003c/li>\u003cli>Two infra notes: (1) the Chromium instance is a process-wide singleton — tests must NOT close it (it's shared with the PDF tests); (2) a stale dev server can keep port 8000 (EADDRINUSE on restart silently routes requests to old code) — verify \u003ccode>server listening\u003c/code> after a restart.\u003c/li>\u003cli>Next: 5 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-025-passing-responsive-desk\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-025\">UI-025\u003c/a> passing: responsive Desk\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>DeskLayout\u003c/strong> shell is now responsive. On \u003ccode>md+\u003c/code> the workspace sidebar is a static \u003ccode>w-60\u003c/code> column as before; below \u003ccode>md\u003c/code> it becomes a slide-in \u003cstrong>drawer\u003c/strong> (\u003ccode>fixed … -translate-x-full\u003c/code> → \u003ccode>translate-x-0\u003c/code>) toggled by a \u003cstrong>hamburger\u003c/strong> (\u003ccode>data-testid=sidebar-toggle\u003c/code>, \u003ccode>md:hidden\u003c/code>) with a tap-to-close backdrop. Clicking any link inside the drawer closes it (delegated \u003ccode>closest('a')\u003c/code>).\u003c/li>\u003cli>Navbar tightened on small screens (brand text \u003ccode>hidden sm:inline\u003c/code>, smaller gaps/padding); canvas padding \u003ccode>p-4 sm:p-6\u003c/code>. FormView already stacked to one column (\u003ccode>grid-cols-1 md:grid-cols-2\u003c/code>) and ListView tables already scroll in their own \u003ccode>overflow-x-auto\u003c/code> container, so no page-level horizontal scroll.\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>e2e/responsive.spec.ts\u003c/code> at 375px — sidebar starts off-screen, hamburger opens it (backdrop appears), tapping a DocType navigates + closes the drawer, the list view shows with \u003cstrong>no horizontal page overflow\u003c/strong>, and the new-form fields \u003cstrong>stack\u003c/strong> (qty below title) with no overflow; a second test at 1280px confirms the sidebar stays static and the hamburger is hidden. Broad DeskLayout e2e (desk/awesomebar/workspace/keyboard/dark-mode) still green.\u003c/li>\u003cli>Next: 6 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/FILE-004\">FILE-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-022-passing-gantt-view\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-022\">UI-022\u003c/a> passing: Gantt view\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>GanttView.tsx\u003c/code>\u003c/strong> (route \u003ccode>/desk/$doctype/view/gantt\u003c/code>): for any DocType with ≥2 Date fields, uses the first as start and the second as end. Renders a day grid (40px/day) with one horizontal bar per document spanning [start, end]. Bars carry \u003ccode>data-start\u003c/code>/\u003ccode>data-end\u003c/code>/\u003ccode>data-days\u003c/code> for precise assertions.\u003c/li>\u003cli>\u003cstrong>Resize\u003c/strong>: each bar has a right-edge handle; dragging it snaps to whole day columns (\u003ccode>round(Δx / 40)\u003c/code>), previews live, and on release PUTs the new end date back (carrying the loaded \u003ccode>modified\u003c/code> stamp, like the calendar's drag). Only forward/backward of the end date; clamped so end ≥ start.\u003c/li>\u003cli>Date math is done in UTC whole-day numbers (\u003ccode>Date.UTC(...) / 86_400_000\u003c/code>) to stay timezone-independent. The timeline range is the data's min-start..max-end padded one day each side.\u003c/li>\u003cli>\u003cstrong>View switcher\u003c/strong>: the ListView shows a \u003cstrong>Gantt\u003c/strong> link only when the DocType has ≥2 Date fields (Calendar still needs just one).\u003c/li>\u003cli>\u003cstrong>Verified\u003c/strong>: \u003ccode>e2e/gantt.spec.ts\u003c/code> (2) — a task dated Mar 2→5 renders \u003ccode>data-days=4\u003c/code> and a 160px-wide bar; dragging the handle +80px moves the end Mar 5→7 (\u003ccode>data-days=6\u003c/code>) and the new date is persisted server-side. Existing ListView/calendar/desk e2e unaffected.\u003c/li>\u003cli>Next: 7 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/FILE-004\">FILE-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008, \u003ca class=\"fid-link\" href=\"#/f/UI-025\">UI-025\u003c/a>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-rpt-006-passing-report-charts-pinned-to-dashboard\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RPT-006\">RPT-006\u003c/a> passing: report charts pinned to dashboards\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>report-chart.ts\u003c/code>\u003c/strong>: \u003ccode>runReportChart(spec, user)\u003c/code> derives a \u003ccode>{label,value}[]\u003c/code> series from a saved report's rows (reusing \u003ccode>runReportRows\u003c/code>) — with \u003ccode>group_by\u003c/code> it returns per-group counts, otherwise one bar per row via \u003ccode>label_field\u003c/code>/\u003ccode>value_field\u003c/code> (sensible defaults: first non-\u003ccode>name\u003c/code> column for labels, first numeric column for values). \u003ccode>pinChartToDashboard(dashboard, chart, user)\u003c/code> appends/updates (idempotent on chart label) a report-driven chart in the Dashboard's \u003ccode>config.charts\u003c/code> and saves it. Endpoints: \u003ccode>POST /api/report_chart\u003c/code>, \u003ccode>POST /api/pin_chart_to_dashboard\u003c/code>.\u003c/li>\u003cli>\u003cstrong>DashboardView\u003c/strong> now renders report-driven charts: a chart config with a \u003ccode>report\u003c/code> field queries \u003ccode>/api/report_chart\u003c/code> (recomputed from live report data) instead of \u003ccode>/api/dashboard/chart\u003c/code>. Existing DocType+group_by charts unchanged.\u003c/li>\u003cli>\u003cstrong>ReportView\u003c/strong> gained a Chart panel: bars derived from the on-screen rows (grouped → per-group counts, matching the table; ungrouped → a selectable numeric value field), plus a dashboard picker + \u003cstrong>Pin to dashboard\u003c/strong> button (enabled once the report is saved). The client derivation mirrors the server so the pinned dashboard chart reproduces the preview.\u003c/li>\u003cli>\u003cstrong>Verified end-to-end\u003c/strong>: \u003ccode>test/report-chart.test.ts\u003c/code> (4 — per-row, grouped, default-field, and idempotent pin) and \u003ccode>e2e/report-chart.spec.ts\u003c/code> (group the report by region → chart shows North 2 / South 1 → pin → the dashboard shows the same chart from live data). Existing dashboard/report e2e + full server suite (293) all green.\u003c/li>\u003cli>Gotcha: \u003ccode>saveDoc\u003c/code> updates enforce optimistic concurrency on \u003ccode>modified\u003c/code>; a bare \u003ccode>Date\u003c/code> stringifies without milliseconds and spuriously conflicts — pass the loaded stamp back as a full-precision ISO string.\u003c/li>\u003cli>Next: 8 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/FILE-004\">FILE-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008, \u003ca class=\"fid-link\" href=\"#/f/UI-022\">UI-022\u003c/a>/025).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-eml-007-passing-auto-email-report\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/EML-007\">EML-007\u003c/a> passing: Auto Email Report\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Auto Email Report\u003c/strong> is a new Core DocType (\u003ccode>0041_auto_email_report.ts\u003c/code>): \u003ccode>report\u003c/code> (Link→Report), \u003ccode>recipients\u003c/code> (Text, comma/space/semicolon list), \u003ccode>file_format\u003c/code> (CSV|HTML), \u003ccode>frequency\u003c/code> (Daily|Weekly|Monthly), \u003ccode>enabled\u003c/code>, \u003ccode>last_sent\u003c/code> (read-only stamp). It's a normal DocType, so the generic Desk ListView/FormView already create + edit it — no bespoke UI.\u003c/li>\u003cli>\u003cstrong>\u003ccode>auto-email-report.ts\u003c/code>\u003c/strong>: \u003ccode>runReportRows(report, user)\u003c/code> runs any saved report server-side — Query Report via \u003ccode>runQueryReport\u003c/code>, Report Builder via a permission-scoped \u003ccode>getList\u003c/code> over \u003ccode>ref_doctype\u003c/code> with the saved columns/filters — returning uniform \u003ccode>{columns, rows}\u003c/code>. \u003ccode>toCsv\u003c/code> (RFC-4180 quoting) / \u003ccode>toHtmlTable\u003c/code> render the attachment. \u003ccode>deliverAutoEmailReport(name)\u003c/code> runs the report, builds the attachment, and queues one email per recipient referencing the Report; stamps \u003ccode>last_sent\u003c/code>. \u003ccode>runDueAutoEmailReports(now)\u003c/code> is the scheduler pass — delivers every enabled report whose cadence (Daily/Weekly/Monthly) has elapsed since \u003ccode>last_sent\u003c/code>.\u003c/li>\u003cli>\u003cstrong>Attachments now survive the email queue\u003c/strong>: \u003ccode>queueEmail\u003c/code> persists \u003ccode>msg.attachments\u003c/code> as \u003ccode>attachments.files\u003c/code> in the queue row, and the \u003ccode>send_email\u003c/code> job prepends them to the delivered attachments — so the CSV reaches the Email Sink (\u003ca class=\"fid-link\" href=\"#/f/EML-002\">EML-002\u003c/a>/003 path). Existing email tests unaffected.\u003c/li>\u003cli>\u003cstrong>Scheduler\u003c/strong>: \u003ccode>jobs/auto-email-report.ts\u003c/code> registers the \u003ccode>auto_email_reports\u003c/code> handler → \u003ccode>runDueAutoEmailReports\u003c/code>; boot seeds it once with \u003ccode>repeatEvery\u003c/code> daily (guarded against duplicate recurring jobs across restarts). Manual trigger endpoint \u003ccode>POST /api/run_auto_email_report\u003c/code> (System Manager only).\u003c/li>\u003cli>\u003cstrong>Verified end-to-end\u003c/strong>: \u003ccode>test/auto-email-report.test.ts\u003c/code> (3 — CSV quoting; deliver → queued email with CSV attached → \u003cstrong>worker delivers to sink with the CSV intact\u003c/strong> → \u003ccode>last_sent\u003c/code> stamped; cadence skip/elapse) plus a live HTTP run: \u003ccode>run_auto_email_report\u003c/code> → \u003ccode>{recipients:1,rows:2}\u003c/code>, the sink received \u003ccode>Aer Http Report.csv\u003c/code> with correctly comma-quoted rows, and a non-SM caller got \u003cstrong>403\u003c/strong>. Full server suite 289/289.\u003c/li>\u003cli>Next: 9 P3 remain (\u003ca class=\"fid-link\" href=\"#/f/RPT-006\">RPT-006\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/FILE-004\">FILE-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008, \u003ca class=\"fid-link\" href=\"#/f/UI-022\">UI-022\u003c/a>/025).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-wf-004-passing-workflow-action-notifications\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/WF-004\">WF-004\u003c/a> passing: workflow action notifications\u003c/h2>\n\u003cul>\u003cli>After a successful transition, \u003ccode>applyWorkflowAction\u003c/code> calls \u003ccode>notifyPendingApprovers\u003c/code> (\u003ccode>workflow.ts\u003c/code>): a document that lands in a state \u003cstrong>with outgoing transitions\u003c/strong> is now pending someone's action, so the holders of those transitions' \u003ccode>allowed\u003c/code> roles are emailed. Terminal states (no outgoing transitions) notify no one.\u003c/li>\u003cli>Approvers = enabled users holding any outgoing-transition role, resolved via \u003ccode>tab_has_role ⋈ tab_user\u003c/code> (uses each user's \u003ccode>email\u003c/code> field, falling back to the user name). The \u003cstrong>acting user is excluded\u003c/strong> (no self-notification).\u003c/li>\u003cli>Each approver gets a queued email (\u003ccode>queueEmail\u003c/code>) referencing the document (\u003ccode>reference_doctype\u003c/code>/\u003ccode>reference_name\u003c/code>), subject \u003ccode>Approval required: &lt;DT&gt; &lt;name&gt;\u003c/code>, body with the \u003cstrong>available actions\u003c/strong> and a \u003cstrong>deep link\u003c/strong> (\u003ccode>/desk/&lt;DocType&gt;/&lt;name&gt;\u003c/code>) — the \"action links\" the feature asks for. Delivery rides the existing \u003ca class=\"fid-link\" href=\"#/f/EML-002\">EML-002\u003c/a> queue + worker, so it's persisted, retried, and sent exactly once.\u003c/li>\u003cli>Verified end-to-end: \u003ccode>test/workflow-notify.test.ts\u003c/code> (2 — email queued to the approver on entering Pending with the right subject/link/action; terminal state queues nothing) plus a live HTTP run where the \u003cstrong>worker actually delivered\u003c/strong> the mail to the Email Sink (recipient = approver, subject \u003ccode>Approval required: … wf-http-1\u003c/code>, body contains the deep link + \u003ccode>Approve\u003c/code>). Existing \u003ccode>workflow.test.ts\u003c/code> still green; full server suite 286/286.\u003c/li>\u003cli>Note: \u003ccode>workflow.ts\u003c/code> now imports \u003ccode>email.ts\u003c/code> — no import cycle (email's graph never re-enters workflow). Only \u003ccode>index.ts\u003c/code> imports workflow.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-prn-004-passing-letterheads\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PRN-004\">PRN-004\u003c/a> passing: letterheads\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Letter Head\u003c/strong> is a new Core DocType (\u003ccode>0040_letterhead.ts\u003c/code>, prompt-autoname): \u003ccode>is_default\u003c/code> (Check), \u003ccode>header_html\u003c/code> (Text), \u003ccode>footer_html\u003c/code> (Text). The same migration appends a \u003ccode>letter_head\u003c/code> Link field to \u003cstrong>Print Format\u003c/strong> via \u003ccode>updateDocType\u003c/code> (in-place column + docfield add).\u003c/li>\u003cli>\u003cstrong>Server render\u003c/strong> (\u003ccode>print.ts\u003c/code>): \u003ccode>renderPrintHtml(..., letterHead?)\u003c/code> resolves a letterhead with precedence \u003cstrong>explicit choice &gt; format-named &gt; default\u003c/strong> (\u003ccode>is_default\u003c/code>), the literal \u003ccode>'none'\u003c/code> suppresses it. Header/footer are interpolated with the same \u003ccode>{{ field }}\u003c/code> syntax as a Print Format template and wrapped in \u003ccode>&lt;header class=\"letter-head\"&gt;\u003c/code> / \u003ccode>&lt;footer class=\"letter-foot\"&gt;\u003c/code>, so they flow into the Chromium PDF. Endpoint takes \u003ccode>?letter_head=\u003c/code> query param.\u003c/li>\u003cli>\u003cstrong>Single default enforced\u003c/strong> by a new controller (\u003ccode>controllers/letter-head.ts\u003c/code>, \u003ccode>before_save\u003c/code>): saving a letterhead with \u003ccode>is_default\u003c/code> clears the flag on all others — the resolver uses \u003ccode>limit 1\u003c/code>, so a unique winner is required. Verified over HTTP (save B default → A un-defaulted; exactly 1 default remains).\u003c/li>\u003cli>\u003cstrong>Desk UI\u003c/strong> (\u003ccode>PrintView.tsx\u003c/code>): a \"Letterhead\" picker (default / none / each Letter Head) next to the format picker; header renders above the body, footer below, both interpolated. Letter Heads are listed generically (no per-DocType code).\u003c/li>\u003cli>\u003cstrong>Verified end-to-end:\u003c/strong> server unit tests (\u003ccode>test/letterhead.test.ts\u003c/code>, 4 — default applied + interpolation, explicit override, \u003ccode>none\u003c/code> suppresses, format-named) produce real PDFs whose text contains the header/footer; a live HTTP call returns a valid \u003ccode>%PDF-\u003c/code> with the interpolated header + footer and \u003ccode>letter_head=none\u003c/code> suppresses; Playwright \u003ccode>e2e/letterhead.spec.ts\u003c/code> drives the picker (default → switch → suppress). Full server suite still 284/284 green.\u003c/li>\u003cli>Gotcha: stray \u003ccode>is_default\u003c/code> letterheads from ad-hoc probes made the \"default\" resolution non-deterministic before the single-default controller existed — the controller both fixes correctness and makes tests deterministic. A new controller file needs a hard server restart (tsx watch doesn't pick up a brand-new, not-yet-imported file).\u003c/li>\u003cli>Next: 11 P3 features remain (\u003ca class=\"fid-link\" href=\"#/f/WF-004\">WF-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/RPT-006\">RPT-006\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/EML-007\">EML-007\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/FILE-004\">FILE-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/WEB-003\">WEB-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>/002/006/008, \u003ca class=\"fid-link\" href=\"#/f/UI-022\">UI-022\u003c/a>/025).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-14-adversarial-all-held\">2026-07-16 — Evaluation pass #14 (adversarial) — all held\u003c/h2>\n\u003cul>\u003cli>Probed the newest batch (\u003ca class=\"fid-link\" href=\"#/f/UI-015\">UI-015\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/I18N-001\">I18N-001\u003c/a>/002, \u003ca class=\"fid-link\" href=\"#/f/JOB-004\">JOB-004\u003c/a>/005) + regressions. All held; no status flips, no product code.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/JOB-004\">JOB-004\u003c/a>:\u003c/strong> non-System-Manager retry → 403; retry a non-existent job → 417; retry an already-done job → 417 (only 'failed' jobs re-queue).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/I18N-001\">I18N-001\u003c/a>:\u003c/strong> a non-admin sets their OWN language (set_language keys off the caller, not a target) → ok; reads any catalog → 200; unknown language → \u003ccode>{}\u003c/code>. Field-label translation is generic (t() over field.label) — works on any DocType.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/UI-015\">UI-015\u003c/a>:\u003c/strong> typing \"g\" then \"d\" INSIDE a text field does NOT trigger the g→d leader navigation (the handler guards on INPUT/TEXTAREA/SELECT/contentEditable targets); the field keeps the typed value. Ctrl+S/Ctrl+B are inert off a form.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/JOB-005\">JOB-005\u003c/a>:\u003c/strong> progress publishes to the job OWNER's user channel only, and canSubscribe restricts user:* to self — no cross-user progress leakage.\u003c/li>\u003cli>Regressions: \u003ca class=\"fid-link\" href=\"#/f/CUST-004\">CUST-004\u003c/a> sandbox still closed (\u003ccode>Object.constructor(\"return typeof process\")()\u003c/code> → \"undefined\"); \u003ca class=\"fid-link\" href=\"#/f/RPT-004\">RPT-004\u003c/a> read-only still blocks an UPDATE query (417).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-015-passing-keyboard-shortcuts\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-015\">UI-015\u003c/a> passing: keyboard shortcuts\u003c/h2>\n\u003cul>\u003cli>A global keydown handler in DeskLayout: \u003cstrong>Ctrl/Cmd+S\u003c/strong> clicks the form's Save button, \u003cstrong>Ctrl/Cmd+B\u003c/strong> opens a new document of the current DocType (parsed from the path), and the \u003cstrong>g then d\u003c/strong> leader sequence (only when not typing in a field) goes to the Desk home. Ctrl+S/Ctrl+B preventDefault the browser defaults.\u003c/li>\u003cli>Verified: e2e (Ctrl+S → Saved banner; Ctrl+B → /desk/&lt;DocType&gt;/new form; g then d → /desk). 62 web e2e green. 114/126.\u003c/li>\u003cli>Also de-flaked e2e/i18n-login.spec (\u003ca class=\"fid-link\" href=\"#/f/I18N-002\">I18N-002\u003c/a>): it no longer sets the shared global System Settings date_format (which raced with \u003ca class=\"fid-link\" href=\"#/f/SET-004\">SET-004\u003c/a>'s test) — it asserts the date renders through the formatter in ANY valid order, and targets the first list cell.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-i18n-002-passing-per-user-language-on-login-confi\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/I18N-002\">I18N-002\u003c/a> passing: per-user language on login + configured formats\u003c/h2>\n\u003cul>\u003cli>Satisfied by composition of \u003ca class=\"fid-link\" href=\"#/f/I18N-001\">I18N-001\u003c/a> (per-user \u003ccode>language\u003c/code> returned by whoami, applied by \u003ccode>useI18n\u003c/code> on load) and \u003ca class=\"fid-link\" href=\"#/f/SET-004\">SET-004\u003c/a> (dates rendered via System Settings \u003ccode>date_format\u003c/code>). No new product code needed.\u003c/li>\u003cli>Verified: e2e — a user whose stored language is \u003ccode>fr\u003c/code> logs in fresh and immediately sees French chrome (Log out→Déconnexion, language switcher shows fr) with no manual switch, and a Date field renders in the configured dd-mm-yyyy format. 113/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-i18n-001-passing-translation-infrastructure\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/I18N-001\">I18N-001\u003c/a> passing: translation infrastructure\u003c/h2>\n\u003cul>\u003cli>Mig
