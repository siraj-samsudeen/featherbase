-versioning-audit-effectivity\">7.1 Axis E — Time: versioning, audit, effectivity\u003c/h3>\n\u003cp>Every requirement in this document quietly assumes it: the MDM product, the clinical data, the git CSVs, bidirectional sync. Made explicit:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Audit trail\u003c/strong> — who changed what, when, through which surface. The clinical case makes this regulatory, not optional; Axis G decides \u003cem>who\u003c/em> gets recorded.\u003c/li>\u003cli>\u003cstrong>Version history\u003c/strong> — per-document diffs (Frappe's Version doctype is the floor), restore, and the rule that history is append-only.\u003c/li>\u003cli>\u003cstrong>Effectivity dating\u003c/strong> — the MDM requirement hiding in plain sight: master data changes \u003cem>take effect on a date\u003c/em> (a price, a payment term, an org assignment — SAP master data is effective-dated everywhere). \u003ccode>valid_from\u003c/code>/\u003ccode>valid_to\u003c/code> as a first-class field pattern with overlap validation, not something every app reinvents.\u003c/li>\u003cli>\u003cstrong>As-of reads\u003c/strong> — \"the vendor record as it stood on March 1\", for reports and for sync reconciliation. Bitemporal (valid time vs recorded time — SQL:2011 temporal tables, XTDB) is the full model; v1 can ship effectivity + version history and leave true bitemporal queries later.\u003c/li>\u003cli>Storage-class interactions: the git-files driver gets history \u003cem>free\u003c/em> (the log is the history); DB drivers need version rows; sync bindings need replay (\"re-send everything since T\") — one time model serves all three.\u003c/li>\u003c/ul>\n\u003ch3 id=\"7-2-axis-f-change-lifecycle-environments-metadata-promotion\">7.2 Axis F — Change lifecycle: environments &amp; metadata promotion\u003c/h3>\n\u003cp>Axis E's mirror, for definitions instead of data. The Salesforce quality that isn't packaging: \u003cstrong>sandboxes and staged deployment\u003c/strong>. Frappe's known weakness (ADR 0003 records its export machinery as \"buggy and unreliable\") is exactly here.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Environments\u003c/strong> — a metadata change (new field, new type, new SLA) is authored somewhere safe, then \u003cem>promoted\u003c/em> dev → test → prod; ADR 0003's \u003ccode>package | site\u003c/code> sources and byte-identical promotion round-trip are the foundation; D13's layer stack is the unit that moves.\u003c/li>\u003cli>\u003cstrong>Plan before apply\u003c/strong> — every promotion shows its diff (metadata \u003cem>and\u003c/em> the DDL it implies) before touching prod — terraform-plan for DocTypes; the same diff UI Axis C's reflection re-sync already needs.\u003c/li>\u003cli>\u003cstrong>Rollback\u003c/strong> — a promoted layer version can be stepped back; data migrations that can't roll back must say so at plan time.\u003c/li>\u003cli>Scope note: module admins creating types in prod (Axis A) is \u003cem>allowed\u003c/em> by design — governed, low-risk metadata; Axis F is for changes that carry code, DDL, or cross-module impact. The boundary between \"config change, safe live\" and \"release, goes through promotion\" must be explicit per contribution type.\u003c/li>\u003c/ul>\n\u003ch3 id=\"7-3-axis-g-actors-identity\">7.3 Axis G — Actors &amp; identity\u003c/h3>\n\u003cp>Four kinds of principal act on the system, and v1–v3 only modeled the first:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Internal humans\u003c/strong> — Desk users; roles/scopes (Axis A).\u003c/li>\u003cli>\u003cstrong>External humans\u003c/strong> — portal users: the UN requester filing a ticket, a client reviewing a config PR. Same permission engine, narrower surface; never counted against internal seats.\u003c/li>\u003cli>\u003cstrong>Machines\u003c/strong> — the CLIs writing the control schema, SAP, SaaS webhooks: service accounts with API keys, so external writes are \u003cem>attributed\u003c/em>, rate-limited, and permission-checked like everyone else.\u003c/li>\u003cli>\u003cstrong>AI agents\u003c/strong> — already real here (the medallion CSVs are agent-edited; ADR 0003's authoring loop is agent-first). Agents are principals with their own identity \u003cstrong>plus an on-behalf-of chain\u003c/strong> (\"agent X acting for the doctor\"), so audit (Axis E) never collapses the two.\u003c/li>\u003c/ol>\n\u003cp>The hard requirement is \u003cstrong>identity propagation across boundaries\u003c/strong>: a Desk edit that becomes a git commit carries the acting user as author; a sync push to SAP carries a mapped SAP user; an agent's write is recorded as agent-for-user. Every storage driver and sync binding declares how it represents identity — part of the adapter contract (D5), not an afterthought.\u003c/p>\n\u003ch3 id=\"7-4-cross-cutting-concerns-that-are-deliberately-not-axes\">7.4 Cross-cutting concerns that are deliberately \u003cem>not\u003c/em> axes\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Observability\u003c/strong> (sync health, job monitoring, drift reports) — a quality bar inside each engine, not a dimension of the design space.\u003c/li>\u003cli>\u003cstrong>Compliance/governance\u003c/strong> (retention, PII handling, residency) — policies \u003cem>expressed with\u003c/em> E (history), G (actors), and B (where data lives); adding an axis would duplicate those three.\u003c/li>\u003cli>\u003cstrong>Presentation surfaces\u003c/strong> (Desk / portal / embed) — follows from Axis G personas plus app UI; not independent.\u003c/li>\u003cli>\u003cstrong>i18n\u003c/strong> — exists (\u003ccode>i18n.ts\u003c/code>); a feature, not a dimension.\u003c/li>\u003cli>\u003cstrong>Offline\u003c/strong> — a driver capability (InstantDB has it natively), already expressible in the D5 capability matrix.\u003c/li>\u003cli>\u003cstrong>Performance/scale\u003c/strong> — engineering discipline everywhere, dimension nowhere.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"8-what-other-platforms-teach-independent-survey\">8. What other platforms teach (independent survey)\u003c/h2>\n\u003cblockquote>\u003cp>Deep-dives now live in \u003cstrong>\u003ccode>docs/research/studies/\u003c/code>\u003c/strong> — one document per system (key dimensions / what it enables / downsides / what to adopt), written as reading material. This section stays as the one-line index of lessons.\u003c/p>\u003c/blockquote>\n\u003cul>\u003cli>\u003cstrong>Hasura NDC / DDN\u003c/strong> — connectors are services conforming to a spec with a \u003cstrong>capabilities endpoint\u003c/strong>; the engine negotiates and pushes down what each source supports. The direct model for §3.1.\u003c/li>\u003cli>\u003cstrong>Trino/Presto\u003c/strong> — federated connectors with per-connector pushdown; proof that \"one query surface, many unequal backends\" works at scale.\u003c/li>\u003cli>\u003cstrong>Ecto adapters / Django DB backends\u003c/strong> — ORM-level adapter seams with capability flags and a shared conformance test suite; the packaging model for our drivers (npm packages + conformance tests).\u003c/li>\u003cli>\u003cstrong>Airbyte/Singer\u003c/strong> — connector catalogs + discovery; the precedent for reflection and for the pull half of sync bindings.\u003c/li>\u003cli>\u003cstrong>NocoBase\u003c/strong> — the closest existing system to this document's target: microkernel where the core does only plugin lifecycle/dependency management; data sources, workflow, and UI blocks are all plugins with server+client halves; UI is schema-rendered. A standing study target.\u003c/li>\u003cli>\u003cstrong>Directus\u003c/strong> — introspection-first over any existing SQL DB, zero naming conventions, metadata beside your tables (validates Axis C) — and a clean nine-type extension taxonomy (interfaces, displays, layouts, modules, panels, hooks, endpoints, operations, bundles) that maps almost one-to-one onto §6.2's contribution points.\u003c/li>\u003cli>\u003cstrong>Salesforce packaging (2GP)\u003c/strong> — managed packages with per-component manageability rules, dependency-aware versioned upgrades, push upgrades, AppExchange security review: the reference for §6.4/§6.5.\u003c/li>\u003cli>\u003cstrong>Medusa\u003c/strong> — commerce capabilities as independently usable modules; the proof that \"take only parts of a macro app\" (§6.3) is achievable.\u003c/li>\u003cli>\u003cstrong>Strapi / Payload\u003c/strong> — plugin marketplaces for headless CMS; Strapi's server+admin plugin packaging; Payload's plugins-as-config-transformers (a plugin is a function over the site config — an elegantly composable model worth remembering for metadata-layer merging).\u003c/li>\u003cli>\u003cstrong>WordPress\u003c/strong> — the contribution loop itself: trivially low barrier, update channel, bug fix reaches everyone. Its failure (no isolation, no manageability rules, plugin conflicts) is exactly what §6.4/§6.5 guard against.\u003c/li>\u003cli>\u003cstrong>VS Code\u003c/strong> — statically declared contribution points + lazy activation + marketplace + auto-update; anti-precedent for granularity (§6.3).\u003c/li>\u003cli>\u003cstrong>Hasura metadata-as-code\u003c/strong> — declarative, git-diffable metadata; worth stealing for Featherbase definition exports regardless of storage.\u003c/li>\u003cli>\u003cstrong>NocoDB / Baserow\u003c/strong> — the reflection UX (propose → adjust → adopt).\u003c/li>\u003cli>\u003cstrong>Salesforce / JSM / ServiceNow\u003c/strong> — record types, request types, task inheritance + delegated administration: the references for §2.\u003c/li>\u003cli>\u003cstrong>Odoo\u003c/strong> — many modules, ONE database, modules extend shared models; confirms §3.5 and §2.4.\u003c/li>\u003cli>\u003cstrong>SAP MDG / MDM practice\u003c/strong> — staging + approval before distribution, field-level survivorship, key mapping per receiving system, reconciliation: the checklist behind §3.3.\u003c/li>\u003cli>\u003cstrong>Strangler fig (Fowler)\u003c/strong> — the named pattern behind the legacy coexistence plan; our contribution is making the field-ownership map the incremental dial.\u003c/li>\u003cli>\u003cstrong>Convex / InstantDB\u003c/strong> — both are JS/TS-native with pushable schemas and native realtime, so drivers wrap official SDKs and can make those DocTypes \u003cem>more\u003c/em> reactive than local ones, not less.\u003c/li>\u003cli>\u003cstrong>Decap CMS / dbt\u003c/strong> — UI-over-git with PR gating and CI validation (§3.4).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"9-decisions-to-ratify-candidate-adrs-and-sequencing\">9. Decisions to ratify (candidate ADRs) and sequencing\u003c/h2>\n\u003cp>\u003cstrong>D1.\u003c/strong> One database, one schema for all apps/modules on the core backend; multi-DB-per-instance rejected; site machinery retained, dormant. (§3.5)\u003c/p>\n\u003cp>\u003cstrong>D2.\u003c/strong> Physical name (\u003ccode>table_name\u003c/code>/collection/path) stored in DocType metadata; prefix a configurable policy defaulting to none for adopted stores; renames are generated, tracked migrations. (§4.1)\u003c/p>\n\u003cp>\u003cstrong>D3.\u003c/strong> Module is an administrative scope: per-module admin role, metadata-authoring checks, optional row-scope dimension. (§2)\u003c/p>\n\u003cp>\u003cstrong>D4.\u003c/strong> Shared-base-entity + scoped Type/field-set registry; routing is a field update, never a row migration. (§2.3)\u003c/p>\n\u003cp>\u003cstrong>D5.\u003c/strong> Storage descriptor per DocType = driver + connection + mode + mapping, behind one adapter interface with \u003cstrong>declared capabilities\u003c/strong> and explicit degradation; Desk/API/permissions/hooks are storage-agnostic. (§3, §3.1)\u003c/p>\n\u003cp>\u003cstrong>D6.\u003c/strong> Sync bindings are first-class objects separate from storage: outbox on \u003ccode>tab_background_job\u003c/code>, key crosswalk, field-ownership map, conflict review queue, reconciliation job. (§3.3)\u003c/p>\n\u003cp>\u003cstrong>D7.\u003c/strong> Ship the adapter \u003cem>seam\u003c/em> first, drivers later: implement only \u003ccode>postgres\u003c/code> (owned/adopted/foreign) initially, but define the interface, capability declaration, and a \u003cstrong>driver conformance test suite\u003c/strong> now, so every future driver (sqlite, duckdb, convex, instantdb, rest, git-files) is a plugin passing a known suite — not a framework surgery. (§3.1)\u003c/p>\n\u003cp>\u003cstrong>D8.\u003c/strong> Degradation rules are engine-level law: cross-backend links reference-only; lifecycle transactions within one backend only; permissions, naming series, and hooks always evaluated on core. (§3.1)\u003c/p>\n\u003cp>\u003cstrong>D9.\u003c/strong> One \u003cem>primary\u003c/em> backend per app as flagged default; per-DocType deviation allowed but deliberate. (§5)\u003c/p>\n\u003cp>\u003cstrong>D10.\u003c/strong> Microkernel/dogfooding rule: platform features and first-party apps are plugins over the same public contribution API — no private core APIs for features. (§6.1)\u003c/p>\n\u003cp>\u003cstrong>D11.\u003c/strong> Typed contribution points, statically declared in the package manifest (metadata contributions as declarative JSON), lazily activated; \u003ccode>AppManifest\u003c/code> evolves into this rather than being replaced. (§6.2)\u003c/p>\n\u003cp>\u003cstrong>D12.\u003c/strong> Package (distribution unit) ≠ capability (enableable unit): capabilities carry their own dependency graph; installing a package enables a chosen subset — micro/macro composability. (§6.3)\u003c/p>\n\u003cp>\u003cstrong>D13.\u003c/strong> Layered metadata: per-package read-only layers + a site overlay, deterministic merge, upgrade replaces only the package's own layer, conflicts surfaced at upgrade time. Extends ADR 0003's \u003ccode>source: package | site\u003c/code> to N package layers. (§6.4)\u003c/p>\n\u003cp>\u003cstrong>D14.\u003c/strong> Trust tiers: reviewed in-process packages / sandboxed site scripts / out-of-process driver services; UI contributions prefer declarative schema over arbitrary code. (§6.5)\u003c/p>\n\u003cp>\u003cstrong>D15.\u003c/strong> Distribution rides npm with semver; each contribution type gets a conformance test suite (generalizing D7); marketplace/registry is a later layer on top, not a prerequisite. (§6)\u003c/p>\n\u003cp>\u003cstrong>D16.\u003c/strong> Time is first-class: append-only version history + audit trail on every mutation, and effectivity dating (\u003ccode>valid_from\u003c/code>/\u003ccode>valid_to\u003c/code> with overlap validation) as a standard field pattern; full bitemporal queries deferred. (§7.1)\u003c/p>\n\u003cp>\u003cstrong>D17.\u003c/strong> Metadata changes promote through environments with plan-preview (metadata + implied DDL) and layer-version rollback, building on ADR 0003's promotion round-trip and D13's layers; per contribution type, the \"safe live in prod\" vs \"goes through promotion\" boundary is declared explicitly. (§7.2)\u003c/p>\n\u003cp>\u003cstrong>D18.\u003c/strong> Four principal kinds (internal, portal, machine, agent) share one permission engine; agents carry an on-behalf-of chain; every driver and sync binding declares its identity-propagation mapping as part of the adapter contract. (§7.3)\u003c/p>\n\u003cp>\u003cstrong>D19.\u003c/strong> Runtime interpretation is the source of truth; code generation is one-way and derived only (types, clients, stubs, test skeletons, seeds — regenerable because never edited); DocType eject to owned code is a deliberate one-way off-ramp with re-entry only via adoption. (§6.6)\u003c/p>\n\u003cp>\u003cstrong>D20.\u003c/strong> Analytics egress is a declared push binding: transport by capability (logical replication &gt; outbox &gt; snapshot), and the warehouse artifacts — medallion onboarding config (the current CSVs' format), dbt sources/staging models, lakehouse ingestion specs — are generated from DocType metadata as D19 artifacts; D16's history/effectivity maps to SCD2. Featherbase emits configs and streams; it never runs lake infrastructure itself. (§3.3)\u003c/p>\n\u003cp>\u003cstrong>D21.\u003c/strong> Medallion depth is a per-source decision, not dogma: messy foreign sources get the full bronze/silver; where Featherbase is the system of record, bronze collapses to a thin generated landing (kept only for compute isolation and pipeline uniformity) and silver is emitted directly from metadata; human modeling begins at gold. Warehouse mapping/seed tables are master data and live as MDM DocTypes. (§3.3)\u003c/p>\n\u003ch3 id=\"sequencing-against-the-current-plan\">Sequencing against the current plan\u003c/h3>\n\u003cp>The immediate product is \u003cstrong>one app — Master Data Management — with modules, module + app admins, over partly pre-existing Postgres tables\u003c/strong>:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Now (MDM foundation):\u003c/strong> D2 + D5's \u003cem>descriptor and seam\u003c/em> (postgres driver only, D7) + reflection/adoption + augmentation Level 1 — the UI over inherited schemas, audit columns, no renaming. Then D3 light: module admin role + scoped metadata checks.\u003c/li>\u003cli>\u003cstrong>Now/next (MDM distribution):\u003c/strong> D6 push mode — outbox, crosswalk, on-approve distribution to SAP/SaaS, sync-status UI, reconciliation. Defer bidirectional/survivorship until a real two-way target exists. \u003cstrong>D20's generator belongs here too, and it's cheap:\u003c/strong> emitting the existing bronze/silver CSV config from DocType metadata is a pure D19 artifact — it replaces hand-maintained config with derived config the first week the MDM's DocTypes exist.\u003c/li>\u003cli>\u003cstrong>Next:\u003c/strong> git-files driver for the medallion config CSVs (§3.4) — self-contained, high client value, and the first proof that the D7 seam holds for a non-SQL backend.\u003c/li>\u003cli>\u003cstrong>Later:\u003c/strong> foreign-mode passthrough (ADR 0007 + specs 0001/0002) for the control plane; the legacy/clinical strangler engagement (pull binding → ownership dial); convex/instantdb drivers when a real app lands on them; D4 type machinery with the helpdesk app; bidirectional sync.\u003c/li>\u003c/ol>\n\u003cp>v4 additions to the \"now\" bucket: the MDM app needs \u003cstrong>D16's audit + version history from day one\u003c/strong> (master data without an audit trail is not master data) and should model effectivity dating in its first entities; D17 and D18 (beyond the existing user/role model + attributing CLI writes via service-account convention) can follow.\u003c/p>\n\u003cp>Axis D's cheap-now part: D10 and D11 are \u003cem>disciplines\u003c/em>, not features — every feature built from here on (including the MDM app itself) goes through the manifest/contribution API, which is how the API becomes real before any marketplace exists. D13's layer stack should be designed together with D2 (both touch how definitions are stored). D12's capability granularity, D14's tier 3, and D15's marketplace are genuinely later.\u003c/p>\n\u003cp>Each numbered item becomes its own feather-spec; this document is the map they hang off.\u003c/p>"},{"group":"Design & plan","slug":"execution-plan","title":"Execution plan — milestones M1–M5","path":"docs/design/execution-plan.md","mins":6,"html":"\u003ch1 id=\"execution-plan-from-the-design-framework-to-working-slices\">Execution Plan — from the design framework to working slices\u003c/h1>\n\u003cblockquote>\u003cp>2026-07-26. Companion to \u003ccode>data-and-admin-topology.md\u003c/code> (the \u003cem>what\u003c/em>); this is the \u003cem>how and in what order\u003c/em>, written against a specific history: 4–5 attempts at Featherbase over 1.5 years where big plans produced disappointment and technical debt. The plan's job is to make that failure mode structurally hard.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"0-why-past-attempts-failed-and-what-already-works\">0. Why past attempts failed — and what already works\u003c/h2>\n\u003cp>The failure pattern was never \"the code was bad\"; it was \u003cstrong>the unit of promise was too large\u003c/strong>: framework-first building, horizontal layers with no user, verification deferred to \"later\", agents promising a platform and delivering a demo.\u003c/p>\n\u003cp>The counter-evidence is \u003cstrong>this repo itself\u003c/strong>: 126 harness features got built and verified because the harness forced small units — one feature, exercised end-to-end, PROGRESS entry, app never left broken. The plan is therefore not a new methodology; it is \u003cem>the harness discipline applied to the design doc\u003c/em>, with real client deliverables as the forcing function.\u003c/p>\n\u003ch2 id=\"1-operating-rules-the-anti-disappointment-contract\">1. Operating rules (the anti-disappointment contract)\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Product slices, not framework layers.\u003c/strong> Never build a framework capability except as the smallest version some real slice needs this week. The framework is what's left behind after slices ship.\u003c/li>\u003cli>\u003cstrong>One feature per session\u003c/strong> (existing CLAUDE.md protocol). A feature has a written verify step before code starts. No \"passing\" without end-to-end exercise. App boots green at session end, always.\u003c/li>\u003cli>\u003cstrong>Spec → validate → build.\u003c/strong> Each milestone gets a feather-spec (specs 0001/0002 are the templates, with their definition-of-done sections). The spec is validated against the design doc's axes and D-decisions \u003cem>before\u003c/em> implementation — this is the \"agent breaks it down, then comes back for validation\" loop, made concrete: the breakdown artifact is a spec + feature list with verify criteria, and validation is checking it against D1–D21 and cutting scope.\u003c/li>\u003cli>\u003cstrong>Refactor only at the seam, under green tests.\u003c/strong> The existing suite (382 server tests, e2e) is the refactoring safety net. Refactors that aren't required by the next slice are banned.\u003c/li>\u003cli>\u003cstrong>A visible NOT-NOW list\u003c/strong> (kept below). Scope creep is rejected by pointing at it, not by argument.\u003c/li>\u003c/ol>\n\u003ch2 id=\"2-the-real-use-cases-all-available-today\">2. The real use cases (all available today)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>A. dbt seeds → MDM\u003c/strong> — mapping/seed tables hand-edited in the dbt repo \u003cem>only because there was no edit UI\u003c/em>. They become plain native DocTypes; a generator emits the seed CSVs (and later the bronze/silver config) back into git. \u003cstrong>Needs zero framework change\u003c/strong> — native DocTypes and their whole engine already exist.\u003c/li>\u003cli>\u003cstrong>B. The external CRUD manager retires\u003c/strong> — tables currently managed through a separate CRUD tool move into DocTypes (import → edit in Desk → retire the tool). Also native; a second low-risk write case that grows the MDM's real content.\u003c/li>\u003cli>\u003cstrong>C. Warehouse browser\u003c/strong> — the MotherDuck warehouse (bronze/silver/ gold), currently SQL-only, becomes browsable read-only in the Desk. First \u003cem>foreign\u003c/em> source: needs the read-only half of the storage seam.\u003c/li>\u003cli>\u003cstrong>D. Report-feedback API\u003c/strong> — already live: main records a report server POSTing feedback over REST as the first external consumer (it drove #54–#57). The proof pattern — keep feeding it use cases.\u003c/li>\u003c/ul>\n\u003ch2 id=\"3-milestones-concrete-value-first-refactor-when-informed\">3. Milestones (concrete value first; refactor when informed)\u003c/h2>\n\u003cp>Sequencing principle, per the owner: start with the two concrete, fully-ownable slices that need no framework surgery; meet the seam only when the browser forces it; do the \u003cem>full\u003c/em> refactor last, informed by a real second backend instead of speculation.\u003c/p>\n\u003cp>Each milestone = one feather-spec, ~5–10 features, every feature independently verifiable. If a spec exceeds ~10 features, cut the milestone, not the verification.\u003c/p>\n\u003cp>\u003cstrong>M1 — seeds become master data (use case A; no framework change).\u003c/strong> Pick 2–3 real dbt seed tables. Recreate as native DocTypes (audit columns on), import current rows, edit in the Desk; a D19/D20 generator emits the seed CSVs (byte-stable format) into the dbt repo via branch + PR. \u003cem>Verify: \u003ccode>dbt build\u003c/code> consumes the generated seeds with zero diff-noise; a Desk edit arrives as a reviewable PR authored as the acting user; the old hand-edited files are retired.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>M2 — the CRUD manager's tables come home (use case B).\u003c/strong> Inventory what the external CRUD tool manages; recreate (or, if the tables live outside our Postgres, adopt) as DocTypes; import; permission them; retire the tool for those tables. \u003cem>Verify: every workflow the CRUD tool served is demonstrated in the Desk or over the REST API; row counts and spot-checked values match post-import; the tool is switched off for the migrated tables.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>M3 — warehouse browser MVP (use case C; the seam arrives, half-size).\u003c/strong> This milestone cannot be built honestly without a seam — and the repo already contains the cautionary tale: \u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a>'s \u003ccode>tenancy.ts\u003c/code> bolted on a parallel path that reimplements table creation instead of reusing the engine. \u003cstrong>The browser must not repeat that.\u003c/strong> So M3 introduces the \u003cstrong>read-only adapter seam only\u003c/strong> — \u003ccode>getList / getDoc / count / introspect\u003c/code> dispatched per-DocType — with the postgres driver as the default and a \u003ccode>duckdb\u003c/code>/MotherDuck driver (env-var token) as the second implementation; Data Source registry + reflection of one bronze schema into read-only DocTypes grouped as a Desk module; spec 0001's read-only and allowlist rules. \u003cem>Verify: browse a real client bronze table in the Desk; permission-less user gets 403; a dbt reshape shows in drift re-sync; schema snapshot of the warehouse before == after (no DDL ever); existing suite still green (the read path of local DocTypes now flows through the same seam).\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>M4 — the full storage seam (the refactor, now informed).\u003c/strong> With two real backends behind the read seam, extend it to writes and ownership modes, and migrate \u003ccode>tableName()\u003c/code> into per-DocType metadata (D2, D5, D7) — shaped by what M3 actually needed rather than speculation. \u003cem>Verify: entire suite passes; zero behavior change for native DocTypes; the M1/M2 DocTypes keep working untouched.\u003c/em>\u003c/p>\n\u003cp>\u003cstrong>M5 — egress config generation + reassess.\u003c/strong> From the M1/M2 DocTypes, generate the bronze/silver onboarding config (current CSV format) and dbt \u003ccode>sources.yml\u003c/code> + staging models; \u003cem>verify by byte-matching the hand-written configs\u003c/em> (or an agreed improvement). Then reassess against the design doc before any new axis investment (saved views for analysts, module-admin roles, SAP push, effectivity).\u003c/p>\n\u003ch2 id=\"3b-relationship-to-the-harness-lineage-not-extension\">3b. Relationship to the harness (lineage, not extension)\u003c/h2>\n\u003cp>The original build ran on \u003ccode>harness/\u003c/code> — features.json (126 entries, each with its own end-to-end \u003ccode>verify\u003c/code> criterion and deps; agents may only flip \u003ccode>status\u003c/code>), the CLAUDE.md session protocol, PROGRESS handoffs, \u003ccode>init.sh\u003c/code> boot-proof, a coder prompt (one feature per session) and an adversarial evaluator prompt that re-drives recently-passed features and flips false claims back to \u003ccode>failing\u003c/code>, looped by \u003ccode>run.sh\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>features.json is frozen by hard rule and stays frozen\u003c/strong> — new work does not extend it. The milestone specs in \u003ccode>docs/specs/\u003c/code> are the \u003cem>successor artifact\u003c/em>, replicating the harness mechanics at the next level: capability IDs (\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-1\u003c/a> style) play the role of feature IDs, each EARS criterion + example table is the \u003ccode>verify\u003c/code> field, the spec's definition-of-done is the evaluator's checklist, and the CLAUDE.md session protocol continues unchanged. What the harness proved — an immutable spec agents cannot reword, per-item end-to-end verification, one item per session, adversarial re-checking — is exactly what §1 carries forward; only the file moved.\u003c/p>\n\u003ch2 id=\"4-the-agent-workflow-per-milestone\">4. The agent workflow per milestone\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Plan session\u003c/strong> (one): produce/refresh the feather-spec + feature list with per-feature verify commands. Output is reviewed against D1–D21 — wrong-layer features get cut here, which is where over-promising dies.\u003c/li>\u003cli>\u003cstrong>Build sessions\u003c/strong> (N): one feature each, harness rules, commit at every stable point, PROGRESS entry with what/how-verified/next.\u003c/li>\u003cli>\u003cstrong>Review\u003c/strong>: small PRs per milestone (not per feature); code review + the spec's definition-of-done checked item by item; merge only green.\u003c/li>\u003cli>\u003cstrong>Ownership pass\u003c/strong> (the \"understand completely\" requirement): after each milestone the owner reads the diff end-to-end and writes the PROGRESS \"gotchas\" entry personally — if it can't be explained, it gets simplified before the next milestone starts.\u003c/li>\u003c/ol>\n\u003ch2 id=\"5-not-now-list-rejections-by-pointer\">5. NOT-NOW list (rejections by pointer)\u003c/h2>\n\u003cp>Plugins/marketplace mechanics (D10–D15 stay \u003cem>disciplines\u003c/em>: manifest shapes and no private APIs — no plugin manager built); bidirectional sync + survivorship; Convex/InstantDB drivers; type/field-set machinery (D4) until the helpdesk app; environments/promotion tooling (D17) beyond git; effectivity dating (D16) until an MDM entity needs it; portal surfaces; multi-site anything; eject-to-code.\u003c/p>\n\u003ch2 id=\"6-what-avoid-technical-debt-means-here-concretely\">6. What \"avoid technical debt\" means here, concretely\u003c/h2>\n\u003cp>Debt in past attempts came from \u003cem>unverified breadth\u003c/em>. Under this plan the only breadth is the design doc (which is paper, and cheap), and every line of code exists because a shipped slice needed it, is covered by the suite that already exists, and was reviewed against a spec with a definition of done. The design doc absorbs ambition; the codebase only ever absorbs verified slices.\u003c/p>"},{"group":"Design & plan","slug":"vision","title":"Vision — what this is for","path":"docs/VISION.md","mins":3,"html":"\u003ch1 id=\"vision\">Vision\u003c/h1>\n\u003ch2 id=\"the-one-liner\">The one-liner\u003c/h2>\n\u003cp>A free and open-source GlideOS: describe an app in chat, drop an Excel file, or write a config file — get a working, tested, production-grade business app in minutes, then iterate. Built on a metadata-driven core (Frappe's best idea) with a modern TypeScript stack, and differentiated by something no closed AI app builder can offer: \u003cstrong>every generated artifact is machine-validated and covered by 100% automated tests before a human ever reviews it.\u003c/strong>\u003c/p>\n\u003ch2 id=\"who-it-s-for\">Who it's for\u003c/h2>\n\u003cp>\u003cstrong>Developers first.\u003c/strong> The goal is that a developer covers ~80% of a business system's requirements using:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Configuration options\u003c/strong> — DocTypes defined as JSON, synced on deploy\u003c/li>\u003cli>\u003cstrong>Excel drag-and-drop\u003c/strong> — users hand over the spreadsheets they already run the business on; the schema is inferred, previewed, approved, imported\u003c/li>\u003cli>\u003cstrong>An AI coding-agent chat\u003c/strong> — generating most of the artifacts (DocTypes, flows, layouts, seed data)\u003c/li>\u003c/ol>\n\u003cp>The site goes up fast; iteration happens from there. End users get a second mode: creating their own master/lookup tables at runtime in production, without acting like developers.\u003c/p>\n\u003ch2 id=\"why-the-frappe-lessons\">Why (the Frappe lessons)\u003c/h2>\n\u003cp>We ran production systems on Frappe. What we keep and what we fix:\u003c/p>\n\u003cp>\u003cstrong>Keep (Frappe's genius):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>The DocType metadata system — schema and UI as one artifact, driving everything (tables, forms, lists, API, permissions)\u003c/li>\u003cli>Document lifecycle events as a universal automation bus\u003c/li>\u003cli>Customize-without-forking (layered overrides as data)\u003c/li>\u003cli>Real physical table per DocType — developer-defined and user-created tables get identical treatment\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Fix (the pain):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>The promotion path.\u003c/strong> Users start runtime tables, hit complexity, and need to convert them to code. Frappe offers this exit but it was buggy and unreliable. In Featherbase, promotion is a metadata/codegen change with \u003cstrong>zero data movement\u003c/strong>, testable as a round-trip property. This is a design invariant, not a feature.\u003c/li>\u003cli>The fragmented automation story (five doctypes, five condition syntaxes, five log locations) — replaced by one Flow object with Glide's three-primitive grammar (Action / Loop / Condition) on a durable execution substrate\u003c/li>\u003cli>The dated UI stack and Python/bench operational weight — replaced by a modern TypeScript stack (React + Hono + Postgres; see ADR 0006)\u003c/li>\u003cli>Developer-facing-only logs — replaced by builder-facing run history with inspectable per-step payloads\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-glide-proved-and-where-we-go-past-it\">What Glide proved (and where we go past it)\u003c/h2>\n\u003cp>Glide proved: radical vocabulary reduction (trigger → action/loop/condition), UI actions and backend automations as one continuum, computed columns as a reactive derived-data layer, \"default to working\" auto-generated UI, one-toggle row-level security, and — with GlideOS (2026) — the agentic chat authoring loop from a spreadsheet, prompt, or file.\u003c/p>\n\u003cp>Glide's gaps we deliberately close: no retries/error handling in workflows, no versioning, closed source, lock-in, \u003cstrong>and no testing story\u003c/strong>. Our AI loop is: generate artifacts → JSON-schema validation → apply to an ephemeral in-memory test site → auto-generated tests run → preview → approve → commit. That loop is only possible because every artifact is data — and it is the moat.\u003c/p>\n\u003ch2 id=\"non-negotiable-invariants\">Non-negotiable invariants\u003c/h2>\n\u003col>\u003cli>\u003cstrong>DocType metadata and flow definitions are portable JSON documents\u003c/strong> — never backend-specific artifacts. These are the crown jewels.\u003c/li>\u003cli>\u003cstrong>All record access goes through one repository layer\u003c/strong> keyed on DocType metadata — the only seam that would ever need re-implementing on another backend.\u003c/li>\u003cli>\u003cstrong>Promotion never moves data.\u003c/strong> Any rung of the ladder (runtime → materialized → package) is a metadata/codegen change, independently reversible, round-trip tested.\u003c/li>\u003cli>\u003cstrong>100% automated testing\u003c/strong> per the feather testing philosophy (MECE states, integration-first, test matrix before code). Coverage is the floor; review is the ceiling.\u003c/li>\u003c/ol>"},{"group":"Design & plan","slug":"roadmap","title":"Roadmap (superseded original)","path":"docs/ROADMAP.md","mins":4,"html":"\u003ch1 id=\"frappe-framework-replication-strategy-roadmap\">Frappe Framework Replication — Strategy &amp; Roadmap\u003c/h1>\n\u003cp>Goal: replicate the features of \u003ca href=\"https://frappe.io/framework\" target=\"_blank\" rel=\"noopener\">Frappe Framework\u003c/a> (\u003ca href=\"https://github.com/frappe/frappe\" target=\"_blank\" rel=\"noopener\">source\u003c/a>).\u003c/p>\n\u003cblockquote>\u003cp>\u003cstrong>Status (2026-07): the stack described below is superseded.\u003c/strong> The \"React + Supabase\" choice was never implemented — the project went to Convex (ADR 0001), then to the current \u003cstrong>React + Hono + Postgres\u003c/strong> stack (ADR 0006). Read the Supabase mapping table as historical; the phased build plan below remains the sequencing guide, with each Supabase-provided capability satisfied by a local equivalent (native RLS, server-issued JWTs, server websockets, disk-backed storage).\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"strategic-options\">Strategic options\u003c/h2>\n\u003cp>Frappe is ~1M lines of code built over 15+ years. Pick the goal before picking the stack:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Goal\u003c/th>\u003cth>Right approach\u003c/th>\u003cth>Effort\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Ship the product\u003c/td>\u003ctd>Fork \u003ccode>frappe/frappe\u003c/code> (MIT-licensed), white-label, customize\u003c/td>\u003ctd>Weeks\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Learn the architecture\u003c/td>\u003ctd>Build a \"mini-Frappe\" replicating the core engine\u003c/td>\u003ctd>Months\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Frappe's ideas in another stack\u003c/td>\u003ctd>Rebuild the metadata engine, skip the long tail\u003c/td>\u003ctd>Months+\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Note: MIT license permits full replication and forking; the \"Frappe\" name and logo are trademarks and cannot be reused.\u003c/p>\n\u003ch2 id=\"the-core-insight-doctype-metadata-driven-everything\">The core insight: DocType (metadata-driven everything)\u003c/h2>\n\u003cp>A DocType is a JSON description of a model. From that single JSON, Frappe auto-generates:\u003c/p>\n\u003cul>\u003cli>the database table (and migrations when the JSON changes)\u003c/li>\u003cli>the ORM class with lifecycle hooks (\u003ccode>validate\u003c/code>, \u003ccode>before_save\u003c/code>, \u003ccode>on_submit\u003c/code>, ...)\u003c/li>\u003cli>a full REST API (\u003ccode>/api/resource/&lt;DocType&gt;\u003c/code>)\u003c/li>\u003cli>the admin UI (list view, form view, filters) with zero frontend code\u003c/li>\u003cli>permission checks (role-based, row-level, field-level)\u003c/li>\u003c/ul>\n\u003cp>Even DocTypes are stored as a DocType. Replicating this engine correctly yields ~60% of Frappe's functionality; skipping it means never converging.\u003c/p>\n\u003ch2 id=\"frappe-s-architecture\">Frappe's architecture\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Backend\u003c/strong>: Python, Werkzeug WSGI, Jinja templating\u003c/li>\u003cli>\u003cstrong>Data\u003c/strong>: MariaDB/Postgres; Redis ×3 (cache, job queue, realtime pub/sub)\u003c/li>\u003cli>\u003cstrong>Jobs\u003c/strong>: RQ workers + cron-like scheduler\u003c/li>\u003cli>\u003cstrong>Realtime\u003c/strong>: Node.js Socket.IO server bridged via Redis\u003c/li>\u003cli>\u003cstrong>Frontend\u003c/strong>: Desk SPA (custom JS framework); Frappe UI (Vue 3 + Tailwind) for newer apps\u003c/li>\u003cli>\u003cstrong>Platform\u003c/strong>: \u003ccode>bench\u003c/code> CLI, multi-tenant sites, installable apps via \u003ccode>hooks.py\u003c/code>\u003c/li>\u003c/ul>\n\u003ch2 id=\"chosen-stack-js-ts-react-supabase\">Chosen stack: JS/TS — React + Supabase\u003c/h2>\n\u003cp>Supabase covers a surprising amount of Frappe's platform layer out of the box:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Frappe subsystem\u003c/th>\u003cth>JS-stack equivalent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>MariaDB\u003c/td>\u003ctd>Supabase Postgres\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auto REST API (\u003ccode>/api/resource/*\u003c/code>)\u003c/td>\u003ctd>PostgREST (automatic per-table REST) — read path only, see caveat\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Auth (sessions, API keys, social login)\u003c/td>\u003ctd>Supabase Auth\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Permissions engine\u003c/td>\u003ctd>Postgres RLS policies, \u003cstrong>generated from DocType metadata\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Realtime (Socket.IO + Redis)\u003c/td>\u003ctd>Supabase Realtime\u003c/td>\u003c/tr>\u003ctr>\u003ctd>File attachments\u003c/td>\u003ctd>Supabase Storage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Background jobs (RQ + Redis)\u003c/td>\u003ctd>pgmq / pg_cron (or Trigger.dev / Inngest later)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Email queue\u003c/td>\u003ctd>Resend (or similar) + pgmq\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Desk SPA\u003c/td>\u003ctd>React + Vite, TanStack Router + Query, Tailwind + shadcn/ui\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Form rendering/validation\u003c/td>\u003ctd>react-hook-form + zod, \u003cstrong>zod schemas generated from DocType metadata\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jinja print formats\u003c/td>\u003ctd>React-to-PDF or Puppeteer print routes\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"the-critical-caveat-writes-must-go-through-the-document-engi\">The critical caveat: writes must go through the Document engine\u003c/h3>\n\u003cp>Frappe routes every write through the \u003ccode>Document\u003c/code> class so lifecycle hooks (\u003ccode>validate\u003c/code>, \u003ccode>before_save\u003c/code>, \u003ccode>on_submit\u003c/code>, server scripts) always run. Raw PostgREST inserts/updates bypass any such layer. So:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Reads / list views\u003c/strong>: PostgREST directly (fast, free, RLS-protected).\u003c/li>\u003cli>\u003cstrong>Writes\u003c/strong>: a single \u003ccode>save_doc\u003c/code> endpoint (Supabase Edge Function, or a small Node service — Hono/Fastify — pointed at the same Postgres) that loads the DocType metadata, runs the hook chain, validates, then writes.\u003c/li>\u003cli>\u003cstrong>DDL\u003c/strong> (creating/altering tables when a DocType changes): a \u003ccode>security definer\u003c/code> Postgres function invoked by the metadata engine.\u003c/li>\u003c/ul>\n\u003cp>Start with Edge Functions; if/when the hook system grows (server scripts, app plugins), graduate to a dedicated Node service — Supabase is plain Postgres, so an external API server attaches cleanly.\u003c/p>\n\u003ch3 id=\"what-you-still-build-yourself-the-actual-project\">What you still build yourself (the actual project)\u003c/h3>\n\u003col>\u003cli>The DocType metadata engine: JSON schema, storage (a \u003ccode>doctype\u003c/code> table), DDL generation + diffing, naming series, child tables.\u003c/li>\u003cli>The document lifecycle/hook chain in TypeScript.\u003c/li>\u003cli>RLS-policy generation from DocType permission metadata.\u003c/li>\u003cli>The generic Desk UI: metadata-driven list/form/link-field components.\u003c/li>\u003c/ol>\n\u003ch2 id=\"phased-build-plan\">Phased build plan\u003c/h2>\n\u003ch3 id=\"phase-1-metadata-engine-foundation-spend-the-most-time-here\">Phase 1 — Metadata engine (foundation; spend the most time here)\u003c/h3>\n\u003cul>\u003cli>DocType JSON schema definition\u003c/li>\u003cli>Dynamic table creation + schema diffing/migration on metadata change\u003c/li>\u003cli>\u003ccode>Document\u003c/code> class with lifecycle hook chain\u003c/li>\u003cli>Naming rules (autoname, series like \u003ccode>INV-.####\u003c/code>)\u003c/li>\u003cli>Child tables (one-to-many modeled as nested documents)\u003c/li>\u003c/ul>\n\u003ch3 id=\"phase-2-auto-rest-api-permissions\">Phase 2 — Auto REST API + permissions\u003c/h3>\n\u003cul>\u003cli>Generic CRUD endpoints driven by metadata\u003c/li>\u003cli>Session + API-key/token auth\u003c/li>\u003cli>Permission engine: role perms per DocType/action, user (row-level) perms, field-level read/write\u003c/li>\u003c/ul>\n\u003ch3 id=\"phase-3-auto-admin-ui-desk\">Phase 3 — Auto admin UI (\"Desk\")\u003c/h3>\n\u003cul>\u003cli>SPA that fetches DocType metadata and renders list/form views generically\u003c/li>\u003cli>Link fields (foreign-key autocomplete), filters, sorting\u003c/li>\u003cli>One generic codebase renders every model\u003c/li>\u003c/ul>\n\u003ch3 id=\"phase-4-platform-services\">Phase 4 — Platform services\u003c/h3>\n\u003cul>\u003cli>Background jobs + scheduler\u003c/li>\u003cli>Realtime updates (websocket + Redis pub/sub)\u003c/li>\u003cli>Email sending/queue, notifications\u003c/li>\u003cli>File attachments\u003c/li>\u003c/ul>\n\u003ch3 id=\"phase-5-power-features\">Phase 5 — Power features\u003c/h3>\n\u003cul>\u003cli>Report builder (saved list configurations); query/script reports\u003c/li>\u003cli>Print formats + PDF generation\u003c/li>\u003cli>Workflow engine (states, transitions, approvals)\u003c/li>\u003cli>Customization layer: Custom Fields, client/server scripts (stored as data)\u003c/li>\u003cli>Webhooks\u003c/li>\u003c/ul>\n\u003ch3 id=\"phase-6-platform-ification\">Phase 6 — Platform-ification\u003c/h3>\n\u003cul>\u003cli>Multi-tenant sites\u003c/li>\u003cli>App/plugin system with hooks\u003c/li>\u003cli>CLI (\u003ccode>bench\u003c/code> equivalent)\u003c/li>\u003cli>Fixtures, patch-based migrations, translations\u003c/li>\u003cli>Website/portal module\u003c/li>\u003c/ul>\n\u003ch2 id=\"studying-the-original\">Studying the original\u003c/h2>\n\u003cp>Run real Frappe first (\u003ccode>bench init\u003c/code>, build a toy app), then read in \u003ccode>frappe/frappe\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>frappe/model/document.py\u003c/code>, \u003ccode>frappe/model/base_document.py\u003c/code> — ORM + lifecycle\u003c/li>\u003cli>\u003ccode>frappe/model/meta.py\u003c/code> — metadata loading/caching\u003c/li>\u003cli>\u003ccode>frappe/core/doctype/doctype/doctype.py\u003c/code> — how DocTypes create/alter tables\u003c/li>\u003cli>\u003ccode>frappe/handler.py\u003c/code>, \u003ccode>frappe/api/\u003c/code> — request dispatch + auto REST API\u003c/li>\u003cli>\u003ccode>frappe/permissions.py\u003c/code> — permission engine\u003c/li>\u003cli>\u003ccode>hooks.py\u003c/code> resolution in \u003ccode>frappe/__init__.py\u003c/code> — the app system\u003c/li>\u003c/ul>\n\u003ch2 id=\"recommended-mvp\">Recommended MVP\u003c/h2>\n\u003cp>Phases 1–3: metadata engine, auto REST API, auto admin UI. Realistic as a 2–3 month solo project, and it is the architecturally interesting part of Frappe. Everything later is accretion on top of that engine.\u003c/p>"},{"group":"Specs","slug":"specs-index","title":"Specs index","path":"docs/specs/README.md","mins":1,"html":"\u003ch1 id=\"specs\">Specs\u003c/h1>\n\u003cp>Requirements for work that is \u003cstrong>agreed but not yet built\u003c/strong>. Once a spec is implemented and verified end-to-end, it stays here as the contract the code was written against; \u003ccode>PROGRESS.md\u003c/code> records when that happened.\u003c/p>\n\u003cp>Format: feather-spec — a one-pager per feature with EARS acceptance criteria (\u003ccode>WHEN … THE SYSTEM SHALL …\u003c/code>) grouped by user capability, each group carrying a concrete example table. Capability IDs (\u003ccode>\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-1\u003c/a>\u003c/code>, \u003ccode>\u003ca class=\"fid-link\" href=\"#/d/spec-0002\">VDT-3\u003c/a>\u003c/code>) are the traceability handle: use them in commits, bugs and review comments.\u003c/p>\n\u003cp>These IDs are deliberately \u003cstrong>not\u003c/strong> in \u003ccode>harness/features.json\u003c/code> — that file is frozen except for \u003ccode>status\u003c/code> flips (see \u003ccode>CLAUDE.md\u003c/code>).\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Spec\u003c/th>\u003cth>Status\u003c/th>\u003cth>Summary\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>0001 — External Data Sources\u003c/td>\u003ctd>Proposed\u003c/td>\u003ctd>DocTypes bound to existing tables in another Postgres, with no change to the foreign schema\u003c/td>\u003c/tr>\u003ctr>\u003ctd>0002 — Virtual DocTypes\u003c/td>\u003ctd>Proposed\u003c/td>\u003ctd>Controller-supplied storage for sources that are not Postgres tables\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Both are shaped by ADR 0007 and the research note Frappe: many apps in one instance.\u003c/p>"},{"group":"Specs","slug":"spec-0001","title":"Spec 0001 — External data sources","path":"docs/specs/0001-external-data-sources.md","mins":18,"html":"\u003ch1 id=\"feature-external-data-sources-doctypes-bound-to-existing-pos\">Feature: External Data Sources — DocTypes bound to existing Postgres tables\u003c/h1>\n\u003cp>Status: \u003cstrong>Proposed\u003c/strong> — not implemented. Written 2026-07-26. Decision record: \u003ccode>docs/adr/0007-app-and-database-topology.md\u003c/code>. Background: \u003ccode>docs/research/frappe-multi-app-and-multi-db.md\u003c/code>.\u003c/p>\n\u003ch2 id=\"workflow-context\">Workflow Context\u003c/h2>\n\u003cblockquote>\u003cp>\"I have a control schema in a Railway-hosted Postgres. Real data is being populated into it by CLIs. I want to put a management app on top of that schema. Does this require any change to that schema, or can I just put it on top?\"\u003c/p>\u003c/blockquote>\n\u003cp>Pain points: the data already exists and keeps changing under a tool Featherbase does not control; copying it makes the management app wrong; and today a DocType can only ever mean \"a table Featherbase created, named \u003ccode>tab_&lt;doctype&gt;\u003c/code>, in the one database \u003ccode>DATABASE_URL\u003c/code> points at\".\u003c/p>\n\u003cp>Opportunity: a Desk over foreign tables — list, filter, sort, open, edit, comment, attach, assign, permission — with \u003cstrong>no change to the foreign schema\u003c/strong> for the base case, and an honest, enumerated list of the features that do need a column to exist.\u003c/p>\n\u003ch2 id=\"goal\">Goal\u003c/h2>\n\u003cp>Let a DocType read and write an existing table in another Postgres database, so a Featherbase app can manage data it did not create and does not exclusively own.\u003c/p>\n\u003ch2 id=\"scope\">Scope\u003c/h2>\n\u003cp>\u003cstrong>In:\u003c/strong> a Data Source registry; introspection of a source's schemas, tables and columns; binding a DocType to \u003ccode>{source, schema, table}\u003c/code> with a column map; generated DocTypes from introspection; the full read path (get, list, filter, sort, paginate, count) executed as SQL on the source; the write path (insert, update, delete) with a read-only mode; conflict detection; schema-drift detection; Desk parity; explicit failure and transaction semantics.\u003c/p>\n\u003cp>\u003cstrong>Out:\u003c/strong> cross-source joins; cross-source transactions or 2PC; DDL against a source (Featherbase never creates, alters or drops a foreign table); replicating foreign data into the control DB; non-Postgres engines (see \u003ccode>docs/specs/0002-virtual-doctypes.md\u003c/code>); child tables stored on a source; \u003ccode>postgres_fdw\u003c/code> (an optional later optimisation, not part of the contract).\u003c/p>\n\u003ch2 id=\"dependencies\">Dependencies\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Requires:\u003c/strong> the DocType engine and meta cache (\u003ca class=\"fid-link\" href=\"#/f/META-001\">META-001\u003c/a>…011), the document engine (\u003ca class=\"fid-link\" href=\"#/f/DOC-001\">DOC-001\u003c/a>…011), the permission layer (PERM-*), the app system (\u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>).\u003c/li>\u003cli>\u003cstrong>Triggers:\u003c/strong> \u003ccode>db.ts\u003c/code> gains a per-DocType client resolver; \u003ccode>doctype-engine.ts\u003c/code> DDL and RLS generation must skip bound DocTypes; the migration runner must skip them; the test harness needs a second sandbox.\u003c/li>\u003cli>\u003cstrong>Blocked by:\u003c/strong> nothing.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"eds-1-register-a-data-source\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-1\u003c/a>: Register a data source\u003c/h2>\n\u003cul>\u003cli>WHEN an administrator saves a \u003ccode>Data Source\u003c/code> naming an engine and the \u003cstrong>name of an environment variable\u003c/strong> holding its connection string, THE SYSTEM SHALL store the source and open no connection until first use.\u003c/li>\u003cli>WHEN an administrator triggers \u003cem>Test Connection\u003c/em>, THE SYSTEM SHALL connect, record \u003ccode>status\u003c/code>, \u003ccode>last_checked_at\u003c/code> and, on failure, \u003ccode>last_error\u003c/code>.\u003c/li>\u003cli>IF the named environment variable is unset or empty at connect time, THEN THE SYSTEM SHALL fail with a message naming the variable and SHALL NOT fall back to the control database.\u003c/li>\u003cli>THE SYSTEM SHALL NOT store a connection string, password or any other secret in the database, in an export, in a Version row, or in an error message.\u003c/li>\u003cli>THE SYSTEM SHALL keep one bounded pool per source, sized by \u003ccode>pool_max\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>name \u003ccode>railway-control\u003c/code>, engine \u003ccode>Postgres\u003c/code>, url env \u003ccode>RAILWAY_CONTROL_URL\u003c/code>, access \u003ccode>read_write\u003c/code>, pool max \u003ccode>5\u003c/code>\u003c/td>\u003ctd>Source saved, status \u003ccode>untested\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Test Connection, variable set and reachable\u003c/td>\u003ctd>status \u003ccode>ok\u003c/code>, \u003ccode>last_checked_at\u003c/code> stamped\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Test Connection, variable unset\u003c/td>\u003ctd>status \u003ccode>error\u003c/code>, message \"RAILWAY_CONTROL_URL is not set\"; no credentials echoed\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-2-browse-what-a-source-contains\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-2\u003c/a>: Browse what a source contains\u003c/h2>\n\u003cul>\u003cli>WHEN an administrator opens a source's browser, THE SYSTEM SHALL list its schemas, and the tables and views in a chosen schema.\u003c/li>\u003cli>WHEN an administrator selects a table, THE SYSTEM SHALL show each column with its Postgres type, nullability, default, and whether it is part of the primary key, plus the proposed Featherbase fieldtype for each.\u003c/li>\u003cli>IF a table has no single-column primary key, THEN THE SYSTEM SHALL show it as \u003cstrong>not bindable\u003c/strong> and say why.\u003c/li>\u003cli>THE SYSTEM SHALL read introspection through the same credentials the source uses, and SHALL NOT require any privilege beyond \u003ccode>SELECT\u003c/code> on the catalog.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Selection\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>schema \u003ccode>control\u003c/code>\u003c/td>\u003ctd>tables \u003ccode>tenant\u003c/code>, \u003ccode>deployment\u003c/code>, \u003ccode>job_run\u003c/code>, view \u003ccode>active_tenant\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>table \u003ccode>control.tenant\u003c/code>\u003c/td>\u003ctd>\u003ccode>id uuid PK → Data\u003c/code>, \u003ccode>slug text NOT NULL → Data\u003c/code>, \u003ccode>plan text → Select?\u003c/code>, \u003ccode>created_at timestamptz → Datetime\u003c/code>, \u003ccode>updated_at timestamptz → Datetime\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>table \u003ccode>control.tenant_tag\u003c/code> (composite PK)\u003c/td>\u003ctd>\"Not bindable: needs a single-column primary key\"\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-3-bind-a-doctype-to-an-existing-table\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-3\u003c/a>: Bind a DocType to an existing table\u003c/h2>\n\u003cul>\u003cli>WHEN an administrator generates a DocType from a browsed table, THE SYSTEM SHALL create a DocType whose \u003ccode>data_source\u003c/code>, \u003ccode>external_schema\u003c/code>, \u003ccode>external_table\u003c/code> and \u003ccode>external_pk\u003c/code> are set, with one DocField per column and a \u003ccode>column_name\u003c/code> recorded on each field.\u003c/li>\u003cli>WHERE a column name is not a legal fieldname, THE SYSTEM SHALL derive a legal \u003ccode>fieldname\u003c/code> and keep the true \u003ccode>column_name\u003c/code> for SQL.\u003c/li>\u003cli>WHEN a bound DocType is saved, THE SYSTEM SHALL NOT emit \u003ccode>CREATE TABLE\u003c/code>, \u003ccode>ALTER TABLE\u003c/code>, \u003ccode>DROP TABLE\u003c/code>, or an RLS policy for it, and SHALL NOT create \u003ccode>tab_&lt;doctype&gt;\u003c/code> in the control database.\u003c/li>\u003cli>WHEN a column is omitted from the DocType, THE SYSTEM SHALL never read it, write it, or reference it in a filter.\u003c/li>\u003cli>IF a bound DocType names a column that does not exist on the source, THEN THE SYSTEM SHALL reject the save with a field-wise error.\u003c/li>\u003cli>THE SYSTEM SHALL allow a DocType to be bound only at creation, and SHALL reject converting a local DocType to bound or a bound DocType to local.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Generate from \u003ccode>railway-control\u003c/code> / \u003ccode>control.tenant\u003c/code>, PK \u003ccode>id\u003c/code>\u003c/td>\u003ctd>DocType \u003ccode>Control Tenant\u003c/code>, 5 fields, no \u003ccode>tab_control_tenant\u003c/code> table created\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Column \u003ccode>is-active?\u003c/code>\u003c/td>\u003ctd>fieldname \u003ccode>is_active\u003c/code>, column_name \u003ccode>is-active?\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bound DocType saved\u003c/td>\u003ctd>migration runner and DDL generator both skip it\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-4-identity-and-audit-columns-with-no-change-to-the-forei\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-4\u003c/a>: Identity and audit columns, with no change to the foreign schema\u003c/h2>\n\u003cp>The foreign table will not have Featherbase's standard columns. This group is the contract that makes \"just put it on top\" true.\u003c/p>\n\u003cul>\u003cli>THE SYSTEM SHALL use the bound \u003ccode>external_pk\u003c/code> column as the document \u003ccode>name\u003c/code>, casting non-text keys (uuid, bigint) to text on read and back on write.\u003c/li>\u003cli>WHERE a source column is mapped to a standard column (\u003ccode>owner\u003c/code>, \u003ccode>creation\u003c/code>, \u003ccode>modified\u003c/code>, \u003ccode>modified_by\u003c/code>, \u003ccode>docstatus\u003c/code>, \u003ccode>idx\u003c/code>), THE SYSTEM SHALL read and write it as that standard column.\u003c/li>\u003cli>WHERE no column is mapped to a standard column, THE SYSTEM SHALL synthesise it on read (\u003ccode>creation\u003c/code>/\u003ccode>modified\u003c/code> null, \u003ccode>owner\u003c/code>/\u003ccode>modified_by\u003c/code> null, \u003ccode>docstatus\u003c/code> 0, \u003ccode>idx\u003c/code> 0) and SHALL NOT attempt to write it.\u003c/li>\u003cli>IF \u003ccode>docstatus\u003c/code> is unmapped, THEN THE SYSTEM SHALL treat every record as a saved draft and SHALL reject \u003ccode>submit\u003c/code>, \u003ccode>cancel\u003c/code> and \u003ccode>amend\u003c/code> for that DocType.\u003c/li>\u003cli>IF \u003ccode>owner\u003c/code> is unmapped, THEN THE SYSTEM SHALL reject any \u003ccode>if_owner\u003c/code> DocPerm on that DocType at save time rather than silently granting or denying access.\u003c/li>\u003cli>IF \u003ccode>modified\u003c/code> is unmapped, THEN THE SYSTEM SHALL apply the fallback in \u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-8\u003c/a>.\u003c/li>\u003cli>THE SYSTEM SHALL NOT require the foreign table to carry any Featherbase column in order to support list, read, create, update and delete.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Foreign column\u003c/th>\u003cth>Mapped as\u003c/th>\u003cth>Behaviour\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>id uuid\u003c/code> (PK)\u003c/td>\u003ctd>\u003ccode>name\u003c/code>\u003c/td>\u003ctd>\u003ccode>GET /api/resource/Control Tenant/6f1c…\u003c/code> works; name is the uuid as text\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>created_at timestamptz\u003c/code>\u003c/td>\u003ctd>\u003ccode>creation\u003c/code>\u003c/td>\u003ctd>shows in the form's audit line, never written on update\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>updated_at timestamptz\u003c/code>\u003c/td>\u003ctd>\u003ccode>modified\u003c/code>\u003c/td>\u003ctd>optimistic locking active (\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-8\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cem>(no owner column)\u003c/em>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>\u003ccode>owner\u003c/code> reads as null; an \u003ccode>if_owner\u003c/code> perm on this DocType is rejected as a configuration error\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cem>(no docstatus column)\u003c/em>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>every record is a draft; Submit button absent\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-5-listing-and-reading-bound-records\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-5\u003c/a>: Listing and reading bound records\u003c/h2>\n\u003cul>\u003cli>WHEN a client calls \u003ccode>get_list\u003c/code> on a bound DocType, THE SYSTEM SHALL execute one \u003ccode>SELECT\u003c/code> against the source with the filters, ordering, limit and offset pushed down as SQL, selecting only mapped columns.\u003c/li>\u003cli>WHEN a client calls \u003ccode>get_doc\u003c/code>, THE SYSTEM SHALL fetch the single row by the PK column and return the mapped fields plus the synthesised standard fields.\u003c/li>\u003cli>WHEN a client requests a count, THE SYSTEM SHALL count on the source.\u003c/li>\u003cli>THE SYSTEM SHALL apply DocType and permlevel permissions \u003cstrong>before\u003c/strong> issuing the query, and SHALL translate permission-derived scoping into the \u003ccode>WHERE\u003c/code> clause exactly as it does for local DocTypes.\u003c/li>\u003cli>IF a filter, ordering or selected field names something that is not a mapped field, THEN THE SYSTEM SHALL reject the request without querying the source.\u003c/li>\u003cli>THE SYSTEM SHALL quote schema, table and column identifiers, and SHALL pass every value as a bound parameter.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Request\u003c/th>\u003cth>SQL issued on the source\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>list \u003ccode>Control Tenant\u003c/code>, filter \u003ccode>plan = 'pro'\u003c/code>, order \u003ccode>created_at desc\u003c/code>, limit 20\u003c/td>\u003ctd>\u003ccode>select \"id\",\"slug\",\"plan\",\"created_at\" from \"control\".\"tenant\" where \"plan\" = $1 order by \"created_at\" desc limit 20 offset 0\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>filter on unmapped column \u003ccode>internal_notes\u003c/code>\u003c/td>\u003ctd>400 before any connection is used\u003c/td>\u003c/tr>\u003ctr>\u003ctd>user lacking read on \u003ccode>Control Tenant\u003c/code>\u003c/td>\u003ctd>403, no query issued\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-6-creating-updating-and-deleting-bound-records\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-6\u003c/a>: Creating, updating and deleting bound records\u003c/h2>\n\u003cul>\u003cli>WHEN a client saves a new document on a read-write bound DocType, THE SYSTEM SHALL run the full hook chain (\u003ccode>validate\u003c/code> → \u003ccode>before_save\u003c/code> → write → \u003ccode>after_save\u003c/code>) and SHALL \u003ccode>INSERT\u003c/code> only mapped, writable columns.\u003c/li>\u003cli>WHERE the PK column has a database default (identity, \u003ccode>gen_random_uuid()\u003c/code>), THE SYSTEM SHALL omit it from the \u003ccode>INSERT\u003c/code> and take the document \u003ccode>name\u003c/code> from \u003ccode>RETURNING\u003c/code>.\u003c/li>\u003cli>WHERE the PK column has no default and the DocType declares an \u003ccode>autoname\u003c/code>, THE SYSTEM SHALL generate the name as it does for local DocTypes.\u003c/li>\u003cli>WHEN a client updates a document, THE SYSTEM SHALL \u003ccode>UPDATE … WHERE &lt;pk&gt; = $1\u003c/code> writing only fields present in the payload and permitted at the user's permlevel.\u003c/li>\u003cli>WHEN a client deletes a document, THE SYSTEM SHALL \u003ccode>DELETE\u003c/code> the row by PK, and SHALL first apply Featherbase's link-integrity check across \u003cstrong>control-DB\u003c/strong> DocTypes that link to it.\u003c/li>\u003cli>IF the source rejects a write (not-null, check, unique, foreign key), THEN THE SYSTEM SHALL map the constraint to the owning field where it can and return a field-wise error, with the raw driver message only in the server log.\u003c/li>\u003cli>THE SYSTEM SHALL never write a column the DocType does not map — a CLI-owned column absent from the DocType is left untouched by every update.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Before\u003c/th>\u003cth>Action\u003c/th>\u003cth>After\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>—\u003c/td>\u003ctd>create \u003ccode>Control Tenant\u003c/code> slug \u003ccode>acme\u003c/code>, plan \u003ccode>pro\u003c/code>\u003c/td>\u003ctd>Row inserted; \u003ccode>id\u003c/code> from \u003ccode>gen_random_uuid()\u003c/code> default returned as the document name\u003c/td>\u003c/tr>\u003ctr>\u003ctd>tenant \u003ccode>acme\u003c/code>, plan \u003ccode>pro\u003c/code>, \u003ccode>internal_notes\u003c/code> set by a CLI\u003c/td>\u003ctd>Desk edits \u003ccode>plan\u003c/code> → \u003ccode>enterprise\u003c/code>\u003c/td>\u003ctd>\u003ccode>plan\u003c/code> updated; \u003ccode>internal_notes\u003c/code> untouched\u003c/td>\u003c/tr>\u003ctr>\u003ctd>slug \u003ccode>acme\u003c/code> exists, unique index on \u003ccode>slug\u003c/code>\u003c/td>\u003ctd>create another \u003ccode>acme\u003c/code>\u003c/td>\u003ctd>\u003ccode>{\"slug\": \"acme already exists\"}\u003c/code>, 409-style error\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-7-read-only-sources-and-table-allowlists\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-7\u003c/a>: Read-only sources and table allowlists\u003c/h2>\n\u003cul>\u003cli>WHERE a source is \u003ccode>read_only\u003c/code>, THE SYSTEM SHALL reject create, update, delete, submit and cancel on every DocType bound to it, and the Desk SHALL render its forms read-only.\u003c/li>\u003cli>WHERE a source declares a table allowlist, THE SYSTEM SHALL refuse to bind or query any table outside it.\u003c/li>\u003cli>THE SYSTEM SHALL surface a source's access mode on the DocType and in the Desk so the restriction is visible before a user starts typing.\u003c/li>\u003cli>THE SYSTEM SHALL recommend, in the source's own help text, that a read-only source use a database role with \u003ccode>SELECT\u003c/code>-only grants — the application-level flag is a guard rail, not the security boundary.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Source access\u003c/th>\u003cth>Action\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>read_only\u003c/code>\u003c/td>\u003ctd>open list\u003c/td>\u003ctd>works\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>read_only\u003c/code>\u003c/td>\u003ctd>Save on a form\u003c/td>\u003ctd>403 \"Data source railway-control is read-only\"; Save button disabled\u003c/td>\u003c/tr>\u003ctr>\u003ctd>allowlist \u003ccode>control.tenant, control.deployment\u003c/code>\u003c/td>\u003ctd>bind \u003ccode>control.secret\u003c/code>\u003c/td>\u003ctd>rejected\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-8-concurrency-and-conflict-detection\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-8\u003c/a>: Concurrency and conflict detection\u003c/h2>\n\u003cul>\u003cli>WHERE a \u003ccode>modified\u003c/code> column is mapped, THE SYSTEM SHALL detect conflicts exactly as it does locally: the update carries the loaded \u003ccode>modified\u003c/code> value in the \u003ccode>WHERE\u003c/code>, and zero affected rows is a conflict error.\u003c/li>\u003cli>WHERE no \u003ccode>modified\u003c/code> column is mapped and the DocType opts into \u003ccode>conflict_check: row\u003c/code>, THE SYSTEM SHALL include every loaded mapped value in the \u003ccode>WHERE\u003c/code> clause, so a concurrent CLI write causes zero affected rows.\u003c/li>\u003cli>WHERE no \u003ccode>modified\u003c/code> column is mapped and the DocType opts into \u003ccode>conflict_check: none\u003c/code>, THE SYSTEM SHALL update by PK alone (last write wins) and the Desk SHALL show a persistent notice on the form.\u003c/li>\u003cli>IF a conflict is detected, THEN THE SYSTEM SHALL return the current row with the error so the client can show a diff.\u003c/li>\u003cli>THE SYSTEM SHALL default a newly bound DocType to \u003ccode>row\u003c/code> when no \u003ccode>modified\u003c/code> column exists, never to \u003ccode>none\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Before\u003c/th>\u003cth>Action\u003c/th>\u003cth>After\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>updated_at\u003c/code> mapped; another writer bumped it\u003c/td>\u003ctd>Save with stale \u003ccode>modified\u003c/code>\u003c/td>\u003ctd>409 conflict, current row returned\u003c/td>\u003c/tr>\u003ctr>\u003ctd>no timestamp column, \u003ccode>conflict_check: row\u003c/code>; a CLI changed \u003ccode>plan\u003c/code> since load\u003c/td>\u003ctd>Save \u003ccode>slug\u003c/code>\u003c/td>\u003ctd>409 conflict, current row returned\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>conflict_check: none\u003c/code>\u003c/td>\u003ctd>Save\u003c/td>\u003ctd>applied; form shows \"Concurrent changes are not detected on this source\"\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-9-schema-drift\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-9\u003c/a>: Schema drift\u003c/h2>\n\u003cul>\u003cli>WHEN a bound DocType is loaded and the source's table has lost a mapped column or changed its type incompatibly, THE SYSTEM SHALL fail that DocType's requests with a clear drift error naming the column, and SHALL NOT silently drop the field.\u003c/li>\u003cli>WHEN an administrator runs \u003cem>Sync from source\u003c/em>, THE SYSTEM SHALL show added, removed and retyped columns and apply only the changes the administrator accepts.\u003c/li>\u003cli>THE SYSTEM SHALL treat a column added on the source as informational — an unmapped column is not an error.\u003c/li>\u003cli>THE SYSTEM SHALL cache a source's introspected shape alongside the meta cache and invalidate it on sync.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Change on the source\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>CLI adds \u003ccode>control.tenant.region\u003c/code>\u003c/td>\u003ctd>list still works; sync offers to add a \u003ccode>region\u003c/code> field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CLI drops \u003ccode>control.tenant.plan\u003c/code> (mapped)\u003c/td>\u003ctd>requests for \u003ccode>Control Tenant\u003c/code> fail with \"column plan no longer exists on railway-control/control.tenant\"; sync offers to remove the field\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>plan text\u003c/code> → \u003ccode>plan int\u003c/code>\u003c/td>\u003ctd>drift error naming the type change\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-10-featherbase-companions-on-foreign-records\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-10\u003c/a>: Featherbase companions on foreign records\u003c/h2>\n\u003cul>\u003cli>THE SYSTEM SHALL store comments, attachments, assignments, tags, versions, and share/permission rows for a bound document in the \u003cstrong>control database\u003c/strong>, keyed by \u003ccode>(doctype, name)\u003c/code>, exactly as for local documents.\u003c/li>\u003cli>WHEN a bound document's \u003ccode>name\u003c/code> changes on the source (a PK the CLIs mutate), THE SYSTEM SHALL treat the old key's companion rows as orphaned and SHALL provide a reconcile report listing them.\u003c/li>\u003cli>WHERE a local DocType has a \u003ccode>Link\u003c/code> field to a bound DocType, THE SYSTEM SHALL validate the link by querying the source.\u003c/li>\u003cli>THE SYSTEM SHALL NOT offer link-integrity protection \u003cem>on the source\u003c/em> — a CLI deleting a row cannot be blocked by Featherbase, so the reconcile report is the mechanism.\u003c/li>\u003cli>WHERE a bound DocType has a \u003ccode>Link\u003c/code> field, THE SYSTEM SHALL allow it to target only DocTypes on the same source or in the control DB, validating each in its own database.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Comment on tenant \u003ccode>6f1c…\u003c/code>\u003c/td>\u003ctd>Row in the control DB's comment table; visible on the form\u003c/td>\u003c/tr>\u003ctr>\u003ctd>CLI deletes tenant \u003ccode>6f1c…\u003c/code>\u003c/td>\u003ctd>Form 404s; reconcile report lists 1 orphaned comment, 1 orphaned assignment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Local \u003ccode>Support Case.tenant\u003c/code> links to \u003ccode>Control Tenant\u003c/code>\u003c/td>\u003ctd>Save validates the tenant exists by querying the source\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-11-source-failure-and-degradation\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-11\u003c/a>: Source failure and degradation\u003c/h2>\n\u003cul>\u003cli>IF a source is unreachable or times out, THEN THE SYSTEM SHALL return a \u003ccode>DataSourceError\u003c/code> naming the source, and SHALL NOT return an empty list as if there were no records.\u003c/li>\u003cli>THE SYSTEM SHALL apply a per-source statement timeout and connect timeout, and SHALL bound its pool so a slow source cannot exhaust the server's workers.\u003c/li>\u003cli>WHILE a source is failing, THE SYSTEM SHALL keep every control-DB DocType fully functional, and the Desk SHALL show the failure on the affected list and form only.\u003c/li>\u003cli>THE SYSTEM SHALL log every foreign statement's duration and source name for diagnosis.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>State\u003c/th>\u003cth>Action\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Railway unreachable\u003c/td>\u003ctd>open \u003ccode>Control Tenant\u003c/code> list\u003c/td>\u003ctd>error banner \"railway-control is unreachable\", retry button; sidebar and other DocTypes still work\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Query exceeds \u003ccode>statement_timeout_ms\u003c/code>\u003c/td>\u003ctd>list\u003c/td>\u003ctd>timeout error, not a partial result\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-12-transaction-boundary\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-12\u003c/a>: Transaction boundary\u003c/h2>\n\u003cul>\u003cli>THE SYSTEM SHALL execute a save that touches both databases as a control-DB transaction and a separate foreign statement, ordering the foreign write \u003cstrong>last\u003c/strong> so a failed foreign write leaves the control DB untouched by rollback.\u003c/li>\u003cli>IF the foreign write succeeds and the control-DB commit then fails, THEN THE SYSTEM SHALL log a reconciliation record naming the doctype, name and operation, and surface it in the reconcile report.\u003c/li>\u003cli>THE SYSTEM SHALL document at the API that a bound save is not atomic across databases, and SHALL NOT claim two-phase commit.\u003c/li>\u003cli>WHERE a hook writes to the control DB and to the same source, THE SYSTEM SHALL keep all statements for one source inside one transaction on that source.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Scenario\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>validate\u003c/code> hook throws\u003c/td>\u003ctd>nothing written anywhere\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Foreign \u003ccode>INSERT\u003c/code> violates a check constraint\u003c/td>\u003ctd>control-DB transaction rolled back; no version row, no comment\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Foreign write ok, control-DB commit fails\u003c/td>\u003ctd>reconciliation record written; report shows \"Control Tenant/6f1c… inserted on source, local record missing\"\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"eds-13-desk-parity\">\u003ca class=\"fid-link\" href=\"#/d/spec-0001\">EDS-13\u003c/a>: Desk parity\u003c/h2>\n\u003cul>\u003cli>THE SYSTEM SHALL render a bound DocType with the same generic \u003ccode>ListView\u003c/code> and \u003ccode>FormView\u003c/code> as any other DocType — no per-source frontend code (invariant 3).\u003c/li>\u003cli>WHEN a user opens a bound list or form, THE SYSTEM SHALL show a badge naming the source and its access mode.\u003c/li>\u003cli>WHERE a source is read-only or a DocType has \u003ccode>conflict_check: none\u003c/code>, THE SYSTEM SHALL show that state on the form before the user edits.\u003c/li>\u003cli>THE SYSTEM SHALL keep all UI within the existing \u003ccode>.fc-*\u003c/code> component classes and design tokens.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Examples:\u003c/strong>\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Input\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Open \u003ccode>Control Tenant\u003c/code> list\u003c/td>\u003ctd>Standard list with filters and sorting; header badge \"railway-control · read-write\"\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Read-only source\u003c/td>\u003ctd>Badge \"read-only\"; Save/Delete absent, not merely disabled on click\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003chr>\n\u003ch2 id=\"business-validation\">Business Validation\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>BV1!:\u003c/strong> Featherbase never issues DDL against a data source. (critical: the foreign schema belongs to someone else; a stray \u003ccode>ALTER\u003c/code> is unrecoverable.)\u003c/li>\u003c
