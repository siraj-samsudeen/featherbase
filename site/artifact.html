tact); empty/whitespace new_name → 417; rename-to-same-name → 200 no-op; cascade updates MULTIPLE linking docs (O1+O2) and child-table links; save after rename works (version logic intact).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/API-005\">API-005\u003c/a> HOLDS\u003c/strong>: non-admin generates own key; token auth scoped to their perms (Ev7 Cust 200, Role 403); all malformed token headers → 401; Bearer-with-key-pair → 401 (won't accept a key as a JWT).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/API-003\">API-003\u003c/a> HOLDS\u003c/strong>: count_docs on missing doctype → 404, on unpermitted doctype (non-admin) → 403, path traversal → 404, non-whitelisted → 403.\u003c/li>\u003cli>\u003cstrong>Regressions HOLD\u003c/strong>: list scope correct for restricted user; NO credential leak (User doc has no hashes; selecting api_key → 417); link search permission-filtered.\u003c/li>\u003cli>\u003cstrong>Robustness gap (not a failure)\u003c/strong>: a whitelisted method that throws a plain Error (count_docs with no doctype arg / a POST with a non-JSON body → {} → missing arg) surfaces as 500 InternalError instead of a clean 4xx. The RPC layer is correct; the sample method should throw AppError. Fixing next in coder mode — \u003ca class=\"fid-link\" href=\"#/f/API-003\">API-003\u003c/a> stays passing (its verify criteria all pass).\u003c/li>\u003c/ul>\n\u003cp>63/126 unchanged. Next (coder): harden count_docs to ValidationError.\u003c/p>\n\u003ch2 id=\"2026-07-16-doc-012-passing-rename-document-cascade-link-refs\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/DOC-012\">DOC-012\u003c/a> passing: rename document + cascade Link refs\u003c/h2>\n\u003cul>\u003cli>\u003ccode>renameDoc(doctype, old, new, user)\u003c/code> in document.ts: one transaction — update the PK, re-point this doc's own child rows (parent col), then UPDATE every Link field in every DocType whose options = this doctype (child-table links included). Write-permission checked; collision → 409, missing → 404; single/child/engine-managed refused. POST /api/rename_doc. FormView gained a Rename control (button → inline input → confirm → navigate to new name).\u003c/li>\u003cli>Verified: vitest (parent + child-table Link cascade, collision 409, missing 404) + live curl (cascade confirmed) + e2e/rename.spec.ts (rename from the form; linking doc's Link now shows the new name).\u003c/li>\u003cli>Fixed a rules-of-hooks slip: the rename useState were placed after the early returns first (Vite error overlay); moved them up.\u003c/li>\u003cli>157 server + 21 web e2e green. 63/126 — HALFWAY.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-api-003-passing-rpc-for-whitelisted-methods\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/API-003\">API-003\u003c/a> passing: RPC for whitelisted methods\u003c/h2>\n\u003cul>\u003cli>\u003ccode>src/methods.ts\u003c/code>: whitelist(path, fn, {allowGuest}) registry + callMethod; method modules in src/methods/*.ts self-register at import (loadMethods() at boot, mirroring loadControllers). Route /api/method/:path{.+} (GET query args / POST JSON args) sits BEFORE the auth middleware: guest-allowed methods run session-less, all others resolveToken. Result wrapped as {message}. Non-whitelisted → 403 PermissionError, so internal helpers stay unreachable.\u003c/li>\u003cli>Reference methods: ping (echoes args+user), count_docs (runs through the permission-checked query layer), public_info (allowGuest).\u003c/li>\u003cli>Verified: vitest (5 cases incl. guest bypass + 401 for non-guest) + live curl (JSON args, query args, 403 non-whitelisted, 401 unauth).\u003c/li>\u003cli>154 server tests green. 62/126.\u003c/li>\u003cli>Session tally (this wakeup): eval #6 + 2 fixes, \u003ca class=\"fid-link\" href=\"#/f/RPT-002\">RPT-002\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/RPT-003\">RPT-003\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/UI-012\">UI-012\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/UI-014\">UI-014\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/API-008\">API-008\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/API-005\">API-005\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/API-003\">API-003\u003c/a> → 55→62.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-api-005-passing-api-key-secret-auth-credential-ha\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/API-005\">API-005\u003c/a> passing: API key/secret auth (+ credential hardening)\u003c/h2>\n\u003cul>\u003cli>Migration 0012: api_key + api_secret_hash raw columns on tab_user (unique partial index on api_key). auth.ts: generateApiKeys (returns the secret ONCE, scrypt-hashed at rest), revokeApiKeys, and resolveToken now accepts \u003ccode>Authorization: token key:secret\u003c/code> alongside Bearer JWTs. Endpoints POST /api/generate_api_key + /api/revoke_api_key (self, or any user for a System Manager).\u003c/li>\u003cli>Security hardening surfaced while building this: the generic doc API was serializing password_hash (a hidden DocField). Added a SENSITIVE_COLUMNS denylist — stripInternalColumns in document.ts drops password_hash/ api_secret_hash/api_key/new_password from every read (parent + child rows), and query.ts removes them from the selectable/filterable column set (selecting one now 417s). getDoc/save/submit/cancel/amend all funnel through loadChildren so one strip point covers them.\u003c/li>\u003cli>Verified: vitest (generate→auth→wrong-secret 401→revoke→401; non-SM can't target another user; no credential leaks) + live curl (token auth lists users, password_hash absent, revoke kills it).\u003c/li>\u003cli>149 server + 20 web e2e green. 61/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-api-008-passing-cors-security-headers\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/API-008\">API-008\u003c/a> passing: CORS + security headers\u003c/h2>\n\u003cul>\u003cli>hono/cors on /api/* limited to config.allowedOrigins (WEB_ORIGINS env, default localhost+127.0.0.1 :5173), registered BEFORE auth so preflight OPTIONS (no Authorization) succeeds. hono/secure-headers globally (nosniff, frame-options, referrer-policy…).\u003c/li>\u003cli>Verified: vitest preflight/echo/deny cases; live curl (204 preflight with ACAO for Desk origin; zero ACAO for evil origin); real browser on :5173 fetched :8000/api/ping cross-origin OK (temp spec).\u003c/li>\u003cli>146 server + 20 web e2e green. 60/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-014-passing-awesomebar-documents-new-x-actions\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-014\">UI-014\u003c/a> passing: awesomebar documents + new-X actions\u003c/h2>\n\u003cul>\u003cli>Server GET /api/search: global typeahead over every regular DocType the user can READ (hasPermission per doctype) — name ilike + title_field ilike, LIKE-escaped, 3/doctype, 15 total. New \u003ccode>src/search.ts\u003c/code>.\u003c/li>\u003cli>DeskLayout awesomebar: 150ms-debounced doc hits under the DocType matches, \"+ New X\" action rows for matched DocTypes, Enter opens exact DocType list else the first document hit's form.\u003c/li>\u003cli>Verified by e2e/awesomebar.spec.ts (doc hit surfaces + click navigates, Enter navigates, New X opens the new-doc form).\u003c/li>\u003cli>De-flaked two more cross-worker races: report specs each own their DocType now (RPT Saved/Export Task), and bulk-actions asserts exact-match stage cells. Full suite ran 6× green (20 passed).\u003c/li>\u003cli>143 server + 20 web e2e green. 59/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-012-passing-list-bulk-actions\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-012\">UI-012\u003c/a> passing: list bulk actions\u003c/h2>\n\u003cul>\u003cli>ListView: leading checkbox column (row-check + select-all over the visible page), a bulk bar when selection non-empty (count, Delete, Edit-field select + value + Apply). Bulk ops run per-doc through the normal endpoints (DELETE resource / GET+PUT with modified) — no side-channel; Check fields coerce 'true/1/yes'. Selection clears on page/filter/doctype change.\u003c/li>\u003cli>Verified by e2e/bulk-actions.spec.ts: 5 seeded rows → select 3 → bulk-edit stage='done' (3 rows show it; API confirms 5 docs remain) → select-all → bulk delete → 0 total on screen AND via API.\u003c/li>\u003cli>19 web e2e green (server untouched). 58/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-rpt-003-passing-csv-xlsx-export\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RPT-003\">RPT-003\u003c/a> passing: CSV/XLSX export\u003c/h2>\n\u003cul>\u003cli>ReportView exports exactly the on-screen grid in display order: header, group header rows (value (n) + numeric sums) interleaved with member rows, grand total. CSV built inline (RFC-quoted); XLSX via dynamically-imported SheetJS (\u003ccode>xlsx\u003c/code> pkg, local, no network).\u003c/li>\u003cli>Verified by e2e/report-export.spec.ts: real browser downloads of both formats; CSV line order equals the on-screen titles order, group sums (Open 3 / Closed 5 / Total 8) checked, XLSX parsed back with SheetJS in node and grid compared.\u003c/li>\u003cli>143 server + 18 web e2e green. 57/126.\u003c/li>\u003cli>Session tally so far: eval #6 (2 bugs found+fixed), \u003ca class=\"fid-link\" href=\"#/f/RPT-002\">RPT-002\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/RPT-003\">RPT-003\u003c/a>.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-rpt-002-passing-saved-reports\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RPT-002\">RPT-002\u003c/a> passing: saved reports\u003c/h2>\n\u003cul>\u003cli>Migration 0011: 'Report' DocType (autoname prompt; ref_doctype Link, config JSON). ReportView gained filters (reuses the exported FilterBar from ListView — filters now count into \u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a>'s view too), a saved- report picker, and Save-report popover (name → save_doc). Config {columns, group_by, filters} restores from ?report=&lt;name&gt; (URL state via reportRoute validateSearch) or the picker.\u003c/li>\u003cli>Verified by e2e/saved-report.spec.ts: configure (drop qty column, filter status=Open, group by status) → save → fresh navigation to the URL restores all three (column gone, groupby=status, 2 rows, Open (2)); picker from a clean view restores too.\u003c/li>\u003cli>143 server + 17 web e2e green. 56/126.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-eval-6-findings-fixed-api-006-meta-004-back-to-pa\">2026-07-16 — Eval #6 findings fixed: \u003ca class=\"fid-link\" href=\"#/f/API-006\">API-006\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> back to passing\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a>: \u003ccode>prepare: false\u003c/code> in db.ts — a system that ALTERs its own tables at runtime cannot use per-connection statement caches (PG 0A000). Regression test hammers a doc with reads/updates across 3 sync cycles (test/schema-sync-stale-plan.test.ts); live re-drive of the evaluator repro: 30 requests across 2 syncs, zero non-200s.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/API-006\">API-006\u003c/a>: listArgsFromQuery validates pagination with Number.isFinite → 400 BadRequestError envelope (\"limit_start must be a number\"); NaN and Infinity never reach SQL. Covered in error-envelope.test.ts.\u003c/li>\u003cli>143 server + 16 web e2e green. 55/126 again — now with both bugs dead.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-6-adversarial-2-real-bugs-found\">2026-07-16 — Evaluation pass #6 (adversarial): 2 real bugs found\u003c/h2>\n\u003cp>Checked the 6 newest passing features as a NON-admin user ('Eval Role' granted CRUD on a fresh 'Eval Ticket' DT + CRUD on File) plus 2 older regressions. Verdicts:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a> HOLDS\u003c/strong>: report math correct for restricted user (Open (2) sum 3 / Closed (1) sum 5, grand total 8); /desk/Role/view/report leaks zero rows to a non-permitted user; a DocType with no numeric columns renders (no grand-total row) and groups by Check fine.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/UI-023\">UI-023\u003c/a> / \u003ca class=\"fid-link\" href=\"#/f/FILE-001\">FILE-001\u003c/a> / \u003ca class=\"fid-link\" href=\"#/f/FILE-002\">FILE-002\u003c/a> HOLD\u003c/strong> for non-admin with proper grants: upload 201 (403 with clean envelope when File create not granted), attachments list via ref filters, delete removes the storage object (404 after), Attach value persists via PUT.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/PERM-004\">PERM-004\u003c/a> HOLDS\u003c/strong>: desk_client as eval-user sees granted tables only, all writes denied, post-migration tables carry the generated policy.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/DOC-009\">DOC-009\u003c/a> / \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> HOLD\u003c/strong> (regressions): version diffs recorded; permlevel-1 field invisible to level-0 user and hostile write dropped.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/API-006\">API-006\u003c/a> → FAILING\u003c/strong>: \u003ccode>GET /api/list/X?limit_start=abc\u003c/code> (or limit_page_length=xyz) → 500 InternalError. Number('abc') = NaN reaches the SQL layer. Malformed client input must be a 4xx envelope (BadRequestError). Repro: any list endpoint with non-numeric pagination.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> → FAILING\u003c/strong>: after \u003ccode>PUT /api/doctype/:name\u003c/code> adds a column, postgres.js per-connection prepared statements go stale: the next request served by each warm pooled connection 500s with PG 0A000 \"cached plan must not change result type\" (document.ts:424 seen; any \u003ccode>select *\u003c/code>/\u003ccode>returning *\u003c/code> on the altered table). Repro: create DT → save doc → PUT doc (warms conn) → PUT /api/doctype adding a field → repeat PUT doc a few times → one returns 500, then heals. Fix direction for coder: disable prepared statements (\u003ccode>prepare: false\u003c/code> in db.ts) or catch 0A000 and retry once.\u003c/li>\u003cli>Also cleaned leftover probe fixtures (RLS Widget/Secret DTs, rls-probe/eval users, eval DocTypes) from the DB.\u003c/li>\u003c/ul>\n\u003cp>55→53 passing (two honest regressions beat two false positives).\u003c/p>\n\u003ch2 id=\"2026-07-16-rpt-001-passing-report-view-columns-group-by-tota\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a> passing: report view (columns + group-by totals)\u003c/h2>\n\u003cul>\u003cli>\u003ccode>ReportView.tsx\u003c/code> at /desk/:doctype/view/report (3-segment route, no clash with $doctype/$name); \"Report\" button on ListView opens it. Metadata-driven like everything else: column picker (checkbox dropdown, defaults to in_list_view fields), group-by select over Select/Link/Data/Check fields, groups render header rows with count + sums of numeric (Int/Float/Currency) columns, collapsible; grand-total row across all rows. Fetches up to 500 rows via the normal list API.\u003c/li>\u003cli>Verified by e2e/report-view.spec.ts: seeded Open(1,2)/Closed(5), grand total 8; grouped: Open (2) sum 3, Closed (1) sum 5; collapse hides member rows; unchecking qty removes the column.\u003c/li>\u003cli>141 server + 16 web e2e green. 55/126.\u003c/li>\u003cli>Session tally (this wakeup): \u003ca class=\"fid-link\" href=\"#/f/API-006\">API-006\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/PERM-004\">PERM-004\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/FILE-001\">FILE-001\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/FILE-002\">FILE-002\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/UI-023\">UI-023\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a> — 50→55. Next: \u003ca class=\"fid-link\" href=\"#/f/RPT-002\">RPT-002\u003c/a> (saved reports) or \u003ca class=\"fid-link\" href=\"#/f/RPT-003\">RPT-003\u003c/a> (CSV/XLSX export) build on this; \u003ca class=\"fid-link\" href=\"#/f/UI-017\">UI-017\u003c/a> partially exists (attachments panel done, needs assignments/tags/shares). An evaluator pass is due next wakeup (~3 wakeups since pass #5).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-ui-023-passing-attach-attach-image-fields\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/UI-023\">UI-023\u003c/a> passing: Attach / Attach Image fields\u003c/h2>\n\u003cul>\u003cli>New fieldtype 'Attach Image' added to all three layers (server FIELD_TYPES + COLUMN_TYPES text, shared zod string, web FIELD_TYPES so the builder offers it). 'Attach' already existed as a column type but rendered as a bare text input.\u003c/li>\u003cli>\u003ccode>AttachControl\u003c/code> in FormView: empty → \"Attach file/image\" button (hidden input, image/* accept for Attach Image); uploaded → filename link (+ inline &lt;img&gt; preview for Attach Image, ?token= for private) and a Clear button that nulls the value. Value is the file_url string; the doc saves like any field. Uploads tag ref_doctype/ref_name when editing an existing doc.\u003c/li>\u003cli>Verified by e2e/attach-field.spec.ts: upload → preview renders (real naturalWidth &gt; 0), URL stored on save, survives reload, Clear + save nulls the field, plain Attach gets link only.\u003c/li>\u003cli>141 server + 15 web e2e green. 54/126.\u003c/li>\u003cli>Gotcha: \u003ccode>page.request\u003c/code> carries NO auth — pull fc_token from localStorage for API asserts in browser tests.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-file-002-passing-attachments-panel-delete-cleanup\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/FILE-002\">FILE-002\u003c/a> passing: attachments panel + delete cleanup\u003c/h2>\n\u003cul>\u003cli>\u003ccode>controllers/file.ts\u003c/code>: \u003ccode>on_trash\u003c/code> hook deletes the storage object when a File doc is deleted — no orphaned files.\u003c/li>\u003cli>\u003ccode>Attachments.tsx\u003c/code> panel in a new FormView right sidebar (existing docs only): lists File docs filtered by ref_doctype/ref_name, + Attach uses a hidden input → multipart /api/upload_file with the ref fields, × deletes the File doc. Private links carry ?token=. FormView widened to max-w-5xl with a flex main+aside; all existing testids untouched.\u003c/li>\u003cli>Verified: Playwright attaches two files to /desk/User/Guest, both listed, deletes one → row gone AND storage 404s, survivor still serves (e2e/attachments.spec.ts); server-side flow in files.test.ts \u003ca class=\"fid-link\" href=\"#/f/FILE-002\">FILE-002\u003c/a>.\u003c/li>\u003cli>\u003cstrong>Flake fixed\u003c/strong>: link-autocomplete.spec grabbed the NEWEST 'UI Form A' doc (order_by creation desc), racing with parallel-worker specs editing their own docs → \"modified after you loaded it\". It now creates its own fixture doc. Full web suite ran 3× green (14 passed).\u003c/li>\u003cli>141 server tests + 14 web e2e green. 53/126.\u003c/li>\u003cli>Gotcha: REST list returns only \u003ccode>name\u003c/code> by default — pass fields=[...] explicitly in tests.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-file-001-passing-disk-backed-file-storage-file-do\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/FILE-001\">FILE-001\u003c/a> passing: disk-backed file storage + File docs\u003c/h2>\n\u003cul>\u003cli>\u003ccode>src/storage.ts\u003c/code>: uploads land in \u003ccode>apps/server/storage/{public,private}\u003c/code> (gitignored; FILE_STORAGE_DIR overrides) with a random-prefix sanitized name. POST /api/upload_file (multipart, authed) writes the object then creates the File doc through saveDoc (file_name, file_url, mime_type, file_size, is_private, ref_doctype/ref_name).\u003c/li>\u003cli>Serving: GET /files/:stored public; GET /private/files/:stored needs a bearer header or ?token= (for &lt;img src&gt;). Files serve ONLY via a File-row lookup on file_url — unregistered/traversal paths 404. Vite now proxies /files and /private/files.\u003c/li>\u003cli>Verified live via curl (upload public+private, 401 unauthed upload and private read, token read OK, traversal 404, through :5173 proxy) and 6 tests in test/files.test.ts.\u003c/li>\u003cli>Also fixed latent server typecheck: @types/node was missing in apps/server (tsc always failed); document.ts:384 cast + smoke.ts top-level-await module-ness. \u003ccode>npx tsc -p tsconfig.json --noEmit\u003c/code> green.\u003c/li>\u003cli>140 server tests + 13 web e2e green. 52/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/FILE-002\">FILE-002\u003c/a> (attachments panel + delete cleanup) or \u003ca class=\"fid-link\" href=\"#/f/UI-023\">UI-023\u003c/a> (Attach fields) now unblocked; \u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a> still queued.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-perm-004-passing-generated-rls-native-pg-supabase\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PERM-004\">PERM-004\u003c/a> passing: generated RLS (native PG, Supabase-equivalent)\u003c/h2>\n\u003cul>\u003cli>Migration \u003ccode>0010_rls.sql\u003c/code>: \u003ccode>desk_client\u003c/code> login role stands in for supabase-js/PostgREST direct access; session user rides in the \u003ccode>app.user\u003c/code> GUC (analogue of PostgREST's jwt claims — set by the trusted connection layer). Security-definer \u003ccode>fc_has_read(dt)\u003c/code> checks DocPerm × tab_has_role (permlevel 0, can_read; Administrator bypass). Every DocType table gets RLS + a generated SELECT-only policy; child tables gate per row on \u003ccode>fc_has_read(parenttype)\u003c/code>. No write policies/grants → all direct writes denied; server (postgres, table owner) bypasses RLS and stays the only write path. \u003ccode>applyRls()\u003c/code> in doctype-engine covers tables created after the migration (guarded on fc_has_read existing, for bootstrap ordering).\u003c/li>\u003cli>Verified live via psql as desk_client: granted DT visible (child rows too), non-granted DT + tab_user 0 rows, Guest 0 rows, Administrator all, INSERT/UPDATE/DELETE all \"permission denied\", \u003ccode>migration\u003c/code> table not exposed. Fresh-DB migration run confirmed all 11 bootstrap tables get rowsecurity=t. Permanent coverage: test/rls.test.ts (6 tests, real second PG connection as desk_client).\u003c/li>\u003cli>134 server tests + 13 web e2e green. 51/126.\u003c/li>\u003cli>Gotcha: a plpgsql \u003ccode>for r in select … from tab_doctype\u003c/code> cursor blocks \u003ccode>alter table tab_doctype\u003c/code> (55006) — snapshot into a temp table first.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-api-006-passing-consistent-error-envelope\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/API-006\">API-006\u003c/a> passing: consistent error envelope\u003c/h2>\n\u003cul>\u003cli>Probed every error class against the live server. Two gaps found and fixed: unknown routes past auth returned Hono's plain-text 404 (now an enveloped NotFoundError via \u003ccode>app.notFound\u003c/code>), and a malformed JSON body surfaced as 500 InternalError (now 400 BadRequestError — SyntaxError from \u003ccode>c.req.json()\u003c/code> is mapped in \u003ccode>errorResponse\u003c/code>). New \u003ccode>BadRequestError\u003c/code> type → 400 added to the envelope.\u003c/li>\u003cli>Verified live via curl: 400/401/403/404/409/417 all return \u003ccode>{error:{type,message,fields?}}\u003c/code> with application/json. Permanent coverage in \u003ccode>test/error-envelope.test.ts\u003c/code> (8 tests, incl. a role-less probe user getting an enveloped 403 on /api/doctype).\u003c/li>\u003cli>128 server tests + 13 web e2e green. 50/126.\u003c/li>\u003cli>Gotcha: features.json is single-line-per-entry formatted — flip statuses with a string Edit, never a JSON rewrite (reformats the whole file).\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-004\">PERM-004\u003c/a> (p1, generated RLS — satisfy with native PG RLS per CLAUDE.md invariant 2), then \u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/FILE-001\">FILE-001\u003c/a> (p2).\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-frappe-reskin-interleave-polish-pass\">2026-07-16 — Frappe reskin (Interleave polish pass)\u003c/h2>\n\u003cul>\u003cli>Reskinned Login, Desk shell, ListView, FormView, DocTypeBuilder to the Frappe Desk look (tokens + fc-* classes above). Self-hosted Inter to keep the offline test browser fast (a Google Fonts \u003ccode>&lt;link&gt;\u003c/code> had blocked the \u003ccode>load\u003c/code> event → 30s goto timeouts). Kept all data-testids; avatar shows initials with the full name as sr-only text so \u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a> still asserts it.\u003c/li>\u003cli>13 web e2e green in ~11s (was 2.9m with the network font). Verified all four screens by screenshot.\u003c/li>\u003c/ul>\n\u003ch2 id=\"2026-07-16-evaluation-pass-5-ui-010-passing-submit-cancel-am\">2026-07-16 — Evaluation pass #5 + \u003ca class=\"fid-link\" href=\"#/f/UI-010\">UI-010\u003c/a> passing: submit/cancel/amend UI\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Evaluator pass #5\u003c/strong> (all held, no findings): permlevel-1 field injection via save_doc (not just PUT) is stripped (secret NULL in DB); a write-only DocShare does NOT grant read (403); fieldtype change via PUT rejected (417); amending a non-cancelled draft rejected (417).\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/UI-010\">UI-010\u003c/a>: FormView gained a docstatus badge (Draft/Submitted/Cancelled) and contextual action buttons for submittable DocTypes — Submit (draft, when clean), Cancel (submitted), Amend (cancelled → navigates to the new draft). Submitted docs render all fields read_only and disable Save. \u003ccode>runAction()\u003c/code> posts to submit/cancel/amend endpoints and invalidates caches. Playwright drove the full draft→submit→cancel→amend lifecycle.\u003c/li>\u003cli>13 web e2e + 120 server tests green. 49/126.\u003c/li>\u003cli>Gotcha: inline \u003ccode>npx tsx -e\u003c/code> with top-level await fails (CJS) — use a .mts helper file for one-off password sets in probes.\u003c/li>\u003cli>Next: the big remaining blocks — reports (RPT), printing (PRN), workflow (WF), jobs (JOB), realtime (RT), email (EML), files (FILE). \u003ca class=\"fid-link\" href=\"#/f/FILE-001\">FILE-001\u003c/a> and \u003ca class=\"fid-link\" href=\"#/f/RPT-001\">RPT-001\u003c/a> are good next picks (both priority 1-2, deps met).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-16-perm-006-perm-008-passing-permlevel-docshare-perm\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/PERM-008\">PERM-008\u003c/a> passing: permlevel + DocShare (permissions engine COMPLETE)\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a>: \u003ccode>permittedLevels()\u003c/code>, \u003ccode>filterReadFields()\u003c/code>, \u003ccode>stripUnwritableFields()\u003c/code>. getDoc strips fields above the user's read permlevels; save paths drop writes to fields above write permlevels (silent, no escalation). Admin/ System Manager see all levels (sentinel -1). Verified: level-1 'salary' hidden from level-0 user; their write to it ignored (server + live).\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/PERM-008\">PERM-008\u003c/a>: DocShare DocType (migration 0009); \u003ccode>isSharedWith()\u003c/code> grants read/write on ONE doc bypassing role perms. getDoc/updateDoc consult shares FIRST; a share grants full permlevel access (else a shared reader with no role read-levels would get every field stripped — fixed both read and write paths). Verified: no-role user 403 → read-share → 200 with body → read-only can't write (403) → write-share edits → unshare → 403.\u003c/li>\u003cli>\u003cstrong>Permissions engine is now feature-complete\u003c/strong>: roles, DocPerm CRUD grants, server enforcement, generated intent (RLS deferred), if_owner, user permissions, permlevel field-level, DocShare, admin bypass, link-search filtering. (10 of the 10 PERM features passing.)\u003c/li>\u003cli>48/126. Next: \u003ca class=\"fid-link\" href=\"#/f/UI-010\">UI-010\u003c/a> (submit/cancel/amend buttons in FormView — engine ready), \u003ca class=\"fid-link\" href=\"#/f/UI-003\">UI-003\u003c/a>-adjacent list views (Kanban/Calendar), then reports/print/ workflow/jobs/realtime/email/files blocks.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-16-meta-004-ui-011-passing-schema-sync-doctype-build\">2026-07-16 — \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/UI-011\">UI-011\u003c/a> passing: schema sync + DocType builder\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a>: \u003ccode>updateDocType()\u003c/code> + PUT /api/doctype/:name. Adds columns for new fields, updates docfield rows for property edits, drops docfields for removed fields but KEEPS the column (data) unless drop_columns:true. Fieldtype changes and istable/issingle changes rejected. Unique constraints added/dropped to match. Verified: 114 vitest + live (column added, 'keepme' row preserved).\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/UI-011\">UI-011\u003c/a>: \u003ccode>DocTypeBuilder\u003c/code> page at /desk/new-doctype (+ sidebar link). Field grid (fieldname/label/type/options/reqd/list), create via POST /api/doctype, navigates to the new list. Playwright: built a 5-field DocType from the UI, its list+form worked immediately, doc created and listed, server meta real.\u003c/li>\u003cli>\u003cstrong>init.sh BUG FIXED (important)\u003c/strong>: pkill patterns matched only the tsx WRAPPER, not the node child holding :8000 — stale servers survived restarts and served stale meta caches (this masked deleted DocTypes as 200). init.sh now kills by listening port via \u003ccode>fuser\u003c/code>. This was the root cause of intermittent 'deleted DocType still 200' behavior noted in prior sessions — RESOLVED.\u003c/li>\u003cli>Gotcha: Select options in the builder grid are entered comma/newline separated and normalized to newlines (single-line input can't hold \\n).\u003c/li>\u003cli>Note: doctype-builder.spec skips if 'Builder Widget' already exists (no delete-DocType endpoint yet) — runs on fresh DB.\u003c/li>\u003cli>46/126. Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> (permlevel), \u003ca class=\"fid-link\" href=\"#/f/PERM-008\">PERM-008\u003c/a> (DocShare), \u003ca class=\"fid-link\" href=\"#/f/UI-010\">UI-010\u003c/a> (submit buttons), then the reports/print/workflow blocks.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-evaluation-pass-4-doc-008-doc-009-passing-version\">2026-07-15 — Evaluation pass #4 + \u003ca class=\"fid-link\" href=\"#/f/DOC-008\">DOC-008\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/DOC-009\">DOC-009\u003c/a> passing: versions, amend\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Evaluator pass #4\u003c/strong>: child-row server errors surface in the banner and never corrupt the doc (per-cell child error highlighting logged as polish); child Link cells in the grid are plain text inputs (autocomplete is parent-level only — noted, within \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a>'s verified scope).\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/DOC-009\">DOC-009\u003c/a>\u003c/strong>: \u003ccode>recordVersion()\u003c/code> inside updateDoc's tx — field-level diff ([field, old, new]) into tab_version when track_changes (skips Version/DocType/DocField); no-op saves record nothing. GOTCHA: pass objects (not JSON.stringify strings) to jsonb columns via the postgres lib, or the value double-encodes as a JSON string scalar.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/DOC-008\">DOC-008\u003c/a>\u003c/strong>: submittable DocTypes auto-gain a hidden amended_from Link (createDocType + backfill migration 0008); \u003ccode>amendDoc()\u003c/code> requires docstatus=2, copies fields + children (fresh child names), derives NAME-n from the amended_from count, resolveName honors the pre-derived name. POST /api/amend_doc. Amended docs are editable and resubmittable; amending twice yields NAME-2.\u003c/li>\u003cli>Verified: 110 vitest + live e2e (version diff [[\"t\",\"one\",\"two\"]] via /api/resource/Version; amend produced &lt;name&gt;-1 draft).\u003c/li>\u003cli>44/126. Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> (permlevel), \u003ca class=\"fid-link\" href=\"#/f/PERM-008\">PERM-008\u003c/a> (DocShare), \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> (schema sync) + \u003ca class=\"fid-link\" href=\"#/f/UI-011\">UI-011\u003c/a> (DocType builder), \u003ca class=\"fid-link\" href=\"#/f/UI-010\">UI-010\u003c/a> (submit buttons in UI).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-ui-007-ui-008-ui-016-passing-grid-ops-sections-br\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/UI-008\">UI-008\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/UI-016\">UI-016\u003c/a> passing: grid ops, sections, breadcrumbs\u003c/h2>\n\u003cul>\u003cli>ChildGrid gained ↑/↓ reorder buttons (swap-based move). Playwright drives the full loop: edit cell, delete row, add row, move it up, save — then asserts the DB via API returns exact [item, qty, idx] order.\u003c/li>\u003cli>Section testids + first:border styling; 'UI Section DT' fixture with Section Break + Column Break renders two grouped sections in metadata order (fields provably in the right section, b1 absent from section 0).\u003c/li>\u003cli>Breadcrumbs (Desk / DocType / name) on FormView; doctype crumb navigates back to the list; title bar Saved/Not saved cycle re-verified.\u003c/li>\u003cli>12 web e2e + 107 server tests green. 42/126 — one-third done.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/DOC-008\">DOC-008\u003c/a> (amend) + \u003ca class=\"fid-link\" href=\"#/f/DOC-009\">DOC-009\u003c/a> (versions) close the document engine; then \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> (permlevel), \u003ca class=\"fid-link\" href=\"#/f/PERM-008\">PERM-008\u003c/a> (DocShare), \u003ca class=\"fid-link\" href=\"#/f/UI-011\">UI-011\u003c/a> (DocType builder UI), \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> (schema sync — needed by \u003ca class=\"fid-link\" href=\"#/f/UI-011\">UI-011\u003c/a> editing).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-perm-010-ui-006-passing-filtered-link-search-auto\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/PERM-010\">PERM-010\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/UI-006\">UI-006\u003c/a> passing: filtered link search, autocomplete\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/PERM-010\">PERM-010\u003c/a>: dedicated suite proves the autocomplete query shape (list API, name-like filter) is permission-filtered: no-read 403, if_owner returns only own docs, user permissions narrow further, bypass unaffected.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/UI-006\">UI-006\u003c/a>: \u003ccode>LinkControl\u003c/code> in FormView — debounced (150ms) search over listResource, dropdown with matches, mousedown-select stores the name, 'No matches' state, '+ Create new &lt;target&gt;' footer navigating to /desk/$target/new. Playwright: filter narrows 2→1, pick persists through save+reload, create-new lands on a blank form.\u003c/li>\u003cli>9 web e2e + 107 server tests green. 39/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a> (child grid verification), \u003ca class=\"fid-link\" href=\"#/f/UI-008\">UI-008\u003c/a> (section layout — code exists, needs breaks fixture + Playwright), \u003ca class=\"fid-link\" href=\"#/f/UI-016\">UI-016\u003c/a> (title bar — mostly built), \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> (permlevel), \u003ca class=\"fid-link\" href=\"#/f/DOC-008\">DOC-008\u003c/a>/009.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-perm-005-passing-user-permissions\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/PERM-005\">PERM-005\u003c/a> passing: user permissions\u003c/h2>\n\u003cul>\u003cli>Migration 0007 installs 'User Permission' DocType (user, allow→DocType, for_value). permissions.ts: \u003ccode>getUserPermissionMap\u003c/code> + \u003ccode>checkUserPermissions\u003c/code> + \u003ccode>isBypassUser\u003c/code>. getList injects name-in / linkfield-in filters for non-bypass users; document paths (read/insert/update/delete/docstatus) assert against the map — insert checks OUTGOING link values too.\u003c/li>\u003cli>Verified: 104 vitest (list narrowing on link + target doctype, 403 direct reads, create-with-forbidden-link 403, admin unaffected) + live e2e (restricted user lists only CoA, CoB read 403).\u003c/li>\u003cli>37/126. Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-010\">PERM-010\u003c/a> (its verify is now implementable: restricted link search), then \u003ca class=\"fid-link\" href=\"#/f/UI-006\">UI-006\u003c/a> (link autocomplete), \u003ca class=\"fid-link\" href=\"#/f/PERM-006\">PERM-006\u003c/a> (permlevel), \u003ca class=\"fid-link\" href=\"#/f/PERM-008\">PERM-008\u003c/a> (DocShare).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-ui-009-meta-013-passing-shared-zod-schema-on-the-\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/UI-009\">UI-009\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> passing: shared zod schema on the client\u003c/h2>\n\u003cul>\u003cli>Web app now depends on the \u003ccode>shared\u003c/code> workspace package; FormView.save() runs \u003ccode>metaToZod(meta.fields).safeParse(values)\u003c/code> BEFORE the network — the literal same generator the server validates with. Field errors render inline; the save request is never sent (verified with a Playwright route counter: 0 calls on invalid, 1 on valid).\u003c/li>\u003cli>Note: \u003ca class=\"fid-link\" href=\"#/f/UI-009\">UI-009\u003c/a> and \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> were mutually-dependent halves (client usage was \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a>'s missing clause; \u003ca class=\"fid-link\" href=\"#/f/UI-009\">UI-009\u003c/a>'s dep was \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a>) — implemented and flipped together as one unit; recorded here per protocol.\u003c/li>\u003cli>8 web e2e + 99 server tests green. 36/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-005\">PERM-005\u003c/a> (user permissions) → unlocks \u003ca class=\"fid-link\" href=\"#/f/PERM-010\">PERM-010\u003c/a> → unlocks \u003ca class=\"fid-link\" href=\"#/f/UI-006\">UI-006\u003c/a> (link autocomplete). Then \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/UI-008\">UI-008\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/UI-016\">UI-016\u003c/a>.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-evaluation-pass-3-ui-004-ui-005-meta-012-passing-\">2026-07-15 — Evaluation pass #3 + \u003ca class=\"fid-link\" href=\"#/f/UI-004\">UI-004\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/UI-005\">UI-005\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/META-012\">META-012\u003c/a> passing: generic FormView\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Evaluator pass #3\u003c/strong> (UI probes): core DocTypes render in ListView, malformed filters URL doesn't crash, sort+filter compose. Finding fixed: TanStack Query retried 4xx errors leaving missing/forbidden doctypes stuck on \"Loading…\" — query client now fails fast on ApiError &lt; 500.\u003c/li>\u003cli>\u003cstrong>FormView\u003c/strong> (components/FormView.tsx): one component renders + saves any DocType. Controls per fieldtype (number/date/datetime-local/checkbox/ select/textarea/JSON mono/link combobox/child grid), Section/Column Break layout grouping, reqd asterisks, read_only disabled, dirty tracking (Save disabled when clean), field-wise server errors inline, create mode at /desk/$doctype/new. ChildGrid: editable cells, add/remove rows (full verification of grid ops is \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a>).\u003c/li>\u003cli>\u003cstrong>API fix found by tests\u003c/strong>: REST POST stripped doc.name, making prompt-named DocTypes impossible to create via REST. POST now keeps the name but is create-only (saveDoc mode='insert' → 409 on existing).\u003c/li>\u003cli>\u003cstrong>Round-trip fix\u003c/strong>: DB date columns serialize as full ISO timestamps and failed Date re-validation on save; shared schema now normalizes.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-012\">META-012\u003c/a> flipped: FormView renders /desk/DocType/User with meta fields and the DocField child grid (verified via Playwright probe).\u003c/li>\u003cli>7 web e2e + 99 server tests green. 34/126.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/UI-006\">UI-006\u003c/a> (link autocomplete), \u003ca class=\"fid-link\" href=\"#/f/UI-009\">UI-009\u003c/a> (client zod → flips \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a>), \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a> (child grid verification), \u003ca class=\"fid-link\" href=\"#/f/UI-016\">UI-016\u003c/a> (title bar indicator — mostly done inside FormView already).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-ui-003-passing-list-filters-with-url-persistence\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/UI-003\">UI-003\u003c/a> passing: list filters with URL persistence\u003c/h2>\n\u003cul>\u003cli>FilterBar in ListView: field select (name + non-hidden data fields), operators = != like &gt; &lt; &gt;= &lt;= (like auto-wraps %…%), Enter-to-add, removable chips. Filters live in the route's \u003ccode>filters\u003c/code> search param (JSON) via validateSearch on /desk/$doctype — reload/share-safe; paging resets on filter change. Sidebar Links needed explicit \u003ccode>search={{ filters: undefined }}\u003c/code> after adding validateSearch (TanStack Router makes search params required on Links).\u003c/li>\u003cli>Playwright: stacked three filters (qty&gt;=25 → 5; +title like; +title = → 1), URL contains filters=, reload restores chips + narrowed results, chip removal widens. All 5 web e2e + server suite green.\u003c/li>\u003cli>31/126. Next: \u003ca class=\"fid-link\" href=\"#/f/UI-004\">UI-004\u003c/a> (generic FormView — all field types) + \u003ca class=\"fid-link\" href=\"#/f/UI-005\">UI-005\u003c/a> (save with field-wise errors); those also complete \u003ca class=\"fid-link\" href=\"#/f/META-012\">META-012\u003c/a> and \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a>'s client half.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-ui-002-passing-generic-listview\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/UI-002\">UI-002\u003c/a> passing: generic ListView\u003c/h2>\n\u003cul>\u003cli>\u003ccode>components/ListView.tsx\u003c/code> + \u003ccode>lib/meta.ts\u003c/code>: ONE component renders any DocType — columns from \u003ccode>listColumns()\u003c/code> (name + in_list_view fields, fallback first two data fields), click-to-sort headers (toggles asc/desc, resets paging), pagination (20/page, prev/next, page-info), keepPreviousData for smooth paging, Check renders ✓/✗, name column links to /desk/$doctype/$name (placeholder until \u003ca class=\"fid-link\" href=\"#/f/UI-004\">UI-004\u003c/a>).\u003c/li>\u003cli>Playwright verified on TWO DocTypes with zero doctype-specific code ('UI List A' 30 docs: columns/pagination/sort asc+desc; 'UI List B': different columns, Check rendering, row-link navigation). Fixtures are idempotent via API (create-if-missing) since no DocType-delete path exists yet — 'UI List A/B' persist in the dev DB deliberately.\u003c/li>\u003cli>All 4 web e2e + 99 server tests green.\u003c/li>\u003cli>30/126. Next: \u003ca class=\"fid-link\" href=\"#/f/UI-003\">UI-003\u003c/a> (filter UI) then \u003ca class=\"fid-link\" href=\"#/f/UI-004\">UI-004\u003c/a>/005 (FormView + save).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-perm-007-ui-001-passing-if-owner-scoping-desk-she\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/PERM-007\">PERM-007\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a> passing: if_owner scoping, Desk shell live\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/PERM-007\">PERM-007\u003c/a>: \u003ccode>permissionScope()\u003c/code> returns all/owner/none; unconditional rows override if_owner rows. Doc-scoped checks (\u003ccode>assertDocPermission\u003c/code>) run after the FOR UPDATE/select so ownership is authoritative: update, delete, submit/cancel, getDoc; getList injects an owner=user filter for owner-scope. Verified with two restricted users (vitest + live curl).\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a>: Desk shell wired to the real API — \u003ccode>src/lib/api.ts\u003c/code> (token in localStorage, 401 auto-logout redirect, listResource helper), functional login page (error display), DeskLayout sidebar listing non-child DocTypes via TanStack Query, session user footer, logout, route guards, and a /desk/$doctype placeholder for \u003ca class=\"fid-link\" href=\"#/f/UI-002\">UI-002\u003c/a>. Playwright e2e covers: wrong password error → login → sidebar shows User/Role/DocType → navigate → reload persistence → logout → guard redirect. @types/node added to web.\u003c/li>\u003cli>29/126. Next: \u003ca class=\"fid-link\" href=\"#/f/UI-002\">UI-002\u003c/a> (generic ListView — columns from in_list_view, sort, paginate), then \u003ca class=\"fid-link\" href=\"#/f/UI-003\">UI-003\u003c/a> (filters), \u003ca class=\"fid-link\" href=\"#/f/UI-004\">UI-004\u003c/a> (FormView). The UI block is now unblocked end-to-end.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-evaluation-pass-2-perm-001-002-003-009-passing\">2026-07-15 — Evaluation pass #2 + \u003ca class=\"fid-link\" href=\"#/f/PERM-001\">PERM-001\u003c/a>/002/003/009 passing\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Evaluator pass #2\u003c/strong>: tampered tokens 401, unauth doctype-create 401, disabled-user tokens die immediately (resolveToken re-reads the user row), submitted docs immutable via REST PUT, migrate idempotent. Known-risk note: meta cache serves stale meta after OUT-OF-BAND (psql) doctype deletes — no product delete-DocType path exists yet; when \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a>/ \u003ca class=\"fid-link\" href=\"#/f/UI-011\">UI-011\u003c/a> add one, it MUST call invalidateMeta.\u003c/li>\u003cli>\u003cstrong>Permission engine\u003c/strong> (permissions.ts): getRoles (implicit 'All'; Guest special), hasPermission via tab_docperm (role in user-roles, permlevel 0, can_&lt;action&gt;), Administrator + System Manager bypass, assertSystemManager for /api/doctype. Enforcement at engine level: create/write in saveDoc, read in getDoc/getList/meta, delete/submit/cancel in their fns. Engine callers default to 'Administrator' (seeds/hooks unaffected).\u003c/li>\u003cli>Verified: 97 vitest incl. restricted-user matrix + live e2e (read 403 → DocPerm grant → read 200, create still 403).\u003c/li>\u003cli>Gotcha: deleting Users via SQL leaves tab_has_role orphans (no FK) — test cleanups must delete child rows explicitly.\u003c/li>\u003cli>27/126. Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-007\">PERM-007\u003c/a> (if_owner) or \u003ca class=\"fid-link\" href=\"#/f/PERM-005\">PERM-005\u003c/a> (user permissions), then \u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a> (login+shell) — auth + read APIs are ready for the Desk.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-api-004-passing-authentication\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/API-004\">API-004\u003c/a> passing: authentication\u003c/h2>\n\u003cul>\u003cli>\u003ccode>auth.ts\u003c/code>: scrypt password hashing (32-byte key — 64-byte overflowed the varchar(140) password_hash column), login by name OR email (enabled users with a hash only), HS256 JWT (8h, secret env JWT_SECRET). Auth middleware guards ALL /api/* except /api/ping and /api/login; \u003ccode>GET /api/whoami\u003c/code>. AuthenticationError type → 401 (PermissionError stays 403 for authz). User identity threads into saveDoc/submit/cancel/delete (owner/modified_by = actual session user — verified with a non-admin user via live HTTP). Migration 0006 sets Administrator password (env ADMIN_PASSWORD, default 'admin').\u003c/li>\u003cli>\u003cstrong>GOTCHA: this hono version's \u003ccode>verify()\u003c/code> requires the alg argument\u003c/strong> — \u003ccode>verify(token, secret, 'HS256')\u003c/code>; without it every token 403s.\u003c/li>\u003cli>Tests all authenticate via \u003ccode>test/helpers.ts\u003c/code> \u003ccode>areq()\u003c/code> (cached admin token); any new test file must use areq, not app.request (except auth negative tests). Web login page still a shell — \u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a> will wire it to /api/login.\u003c/li>\u003cli>23/126. Next: \u003ca class=\"fid-link\" href=\"#/f/PERM-001\">PERM-001\u003c/a>..003 (roles/DocPerm/enforcement — DocPerm doctype already seeded), then \u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a> (login + shell) since auth is ready.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-011-meta-014-passing-meta-012-half-done\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-011\">META-011\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/META-014\">META-014\u003c/a> passing; \u003ca class=\"fid-link\" href=\"#/f/META-012\">META-012\u003c/a> half done\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-011\">META-011\u003c/a>: meta cache in meta.ts (loads/hits stats exported for tests); invalidateMeta() called by createDocType. NOTE: dev server caches meta — e2e probes that delete DocTypes via psql leave stale entries until a create invalidates or the server restarts.\u003c/li>\u003cli>Bootstrap refactor: doctype/docfield → tab_doctype/tab_docfield (migration 0004) with standard columns; DocType + DocField described by meta rows, so /api/resource/DocType works generically (verified live: list + doc with 8 child fields). Generic writes/deletes to DocType/DocField are 417 — DDL path is /api/doctype. \u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/META-012\">META-012\u003c/a> stays failing\u003c/strong>: its verify also needs the Desk form view to render DocType (\u003ca class=\"fid-link\" href=\"#/f/UI-004\">UI-004\u003c/a>).\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-014\">META-014\u003c/a>: migrate.ts now supports .ts migrations (export up()); 0005_core_seeds.ts installs Role, Has Role, User, DocPerm, Comment, Version, File through the engine + seeds System Manager/All/Guest roles, Administrator (with System Manager) and Guest users. Verified per criterion: scratch DB + migrate → all core DocTypes + Administrator; then dropped. NOTE: psql -c can't run drop+create database in one call.\u003c/li>\u003cli>22/126. Next: \u003ca class=\"fid-link\" href=\"#/f/API-004\">API-004\u003c/a> (auth/login vs User table), \u003ca class=\"fid-link\" href=\"#/f/PERM-001\">PERM-001\u003c/a>/002/003 block, or \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> (schema sync). Auth unlocks the UI work.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-doc-007-api-001-api-002-passing-submit-lifecycle-\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/DOC-007\">DOC-007\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/API-001\">API-001\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/API-002\">API-002\u003c/a> passing: submit lifecycle, REST resource\u003c/h2>\n\u003cul>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/DOC-007\">DOC-007\u003c/a>: \u003ccode>submitDoc\u003c/code>/\u003ccode>cancelDoc\u003c/code> via shared \u003ccode>setDocstatus\u003c/code> (FOR UPDATE, from-state check, on_submit/on_cancel inside tx). Updates and deletes of submitted docs 417; cancelled docs terminal for edits. Endpoints /api/submit_doc, /api/cancel_doc.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/API-001\">API-001\u003c/a>/002: /api/resource/:doctype[/name] — GET list (same query-param parser as /api/list: filters/fields/order_by/limit_*), POST insert (name stripped), GET one, PUT update (name from path), DELETE. All driven by the same engine; unknown doctype 404s everywhere; field-wise errors surface through.\u003c/li>\u003cli>Verified: 76 vitest + live e2e (submit→immutable→cancel; REST create+list).\u003c/li>\u003cli>20/126. Next: \u003ca class=\"fid-link\" href=\"#/f/META-011\">META-011\u003c/a> (meta cache + invalidation), \u003ca class=\"fid-link\" href=\"#/f/META-012\">META-012\u003c/a> (bootstrap DocType-of-DocTypes), \u003ca class=\"fid-link\" href=\"#/f/META-014\">META-014\u003c/a> (core seeds) — then auth (\u003ca class=\"fid-link\" href=\"#/f/API-004\">API-004\u003c/a>) and permissions block, then the Desk UI.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-doc-003-004-006-passing-hooks-controllers-safe-de\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/DOC-003\">DOC-003\u003c/a>/004/006 passing: hooks, controllers, safe deletes\u003c/h2>\n\u003cul>\u003cli>\u003ccode>controllers.ts\u003c/code>: registry + file loader (src/controllers/*.ts default- export {doctype, hooks}); chain runs INSIDE the save tx — insert: before_insert→validate→before_save→INSERT→after_insert→after_save; update: validate→before_save→UPDATE→after_save. Hooks mutate ctx.doc (re-filtered via columnValues so hooks can't inject unknown SQL keys); ctx has old/isNew/user/tx. Reference controller hook_file_demo.ts.\u003c/li>\u003cli>\u003ccode>deleteDoc()\u003c/code> + DELETE /api/doc/:dt/:name: blocks when any Link field (parent or child row — child resolves to its parent doc in the message) references the doc; runs on_trash; removes own child rows; blocks direct child/single deletes. Gotcha found: don't select parent/parenttype from non-child tables (column doesn't exist → was 500).\u003c/li>\u003cli>Verified: 71 vitest + live e2e (slug hook fired on running server; linked delete 417 naming holder, then clean delete).\u003c/li>\u003cli>17/126. Next: \u003ca class=\"fid-link\" href=\"#/f/DOC-007\">DOC-007\u003c/a> (submit/cancel), then \u003ca class=\"fid-link\" href=\"#/f/API-001\">API-001\u003c/a>/002 (REST resource) or \u003ca class=\"fid-link\" href=\"#/f/META-004\">META-004\u003c/a> (schema sync) to unlock \u003ca class=\"fid-link\" href=\"#/f/CUST-001\">CUST-001\u003c/a> later. \u003ca class=\"fid-link\" href=\"#/f/META-011\">META-011\u003c/a>/012/014 (cache, bootstrap meta, seeds) also unblocked.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-008-passing-link-integrity\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-008\">META-008\u003c/a> passing: Link integrity\u003c/h2>\n\u003cul>\u003cli>\u003ccode>validateLinks()\u003c/code> runs inside the save transaction for parents (insert + update) and each child row (prefixed error keys like allocs.1.customer). Empty links allowed; missing target DocType and missing target doc both produce field-wise 417s.\u003c/li>\u003cli>Verified: 62 vitest + live e2e (bogus link 417, valid link 201).\u003c/li>\u003cli>13/126 passing. Next: \u003ca class=\"fid-link\" href=\"#/f/DOC-003\">DOC-003\u003c/a> (lifecycle hooks) + \u003ca class=\"fid-link\" href=\"#/f/DOC-004\">DOC-004\u003c/a> (controller registry) — they unlock \u003ca class=\"fid-link\" href=\"#/f/DOC-006\">DOC-006\u003c/a>/007 and the whole business-logic layer.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-007-doc-005-passing-child-tables\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-007\">META-007\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/DOC-005\">DOC-005\u003c/a> passing: child tables\u003c/h2>\n\u003cul>\u003cli>\u003ccode>pickChildInputs\u003c/code>/\u003ccode>saveChildren\u003c/code>/\u003ccode>loadChildren\u003c/code> in document.ts: Table fields carry arrays; rows validated against child meta (errors keyed \u003ccode>field.i.child_field\u003c/code>), existing names updated, new rows inserted with parent/parenttype/parentfield + idx by array order, omitted rows deleted (payload authoritative) — all inside the parent's transaction (child error rolls parent back; verified). Direct save of istable DocTypes is blocked. createDocType validates Table options target is istable. getDoc/save responses include children ordered by idx.\u003c/li>\u003cli>Verified: 59 vitest + live e2e (order with 2 rows; psql shows linkage).\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-008\">META-008\u003c/a> (Link integrity), then \u003ca class=\"fid-link\" href=\"#/f/DOC-003\">DOC-003\u003c/a>/004 (hooks + controllers) to unlock \u003ca class=\"fid-link\" href=\"#/f/DOC-006\">DOC-006\u003c/a>/007.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-evaluation-pass-1-meta-010-passing\">2026-07-15 — Evaluation pass #1 + \u003ca class=\"fid-link\" href=\"#/f/META-010\">META-010\u003c/a> passing\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Evaluator pass\u003c/strong> (3rd wakeup): re-drove \u003ca class=\"fid-link\" href=\"#/f/META-006\">META-006\u003c/a>/009/003, \u003ca class=\"fid-link\" href=\"#/f/DOC-002\">DOC-002\u003c/a>/011 on fresh DocTypes via public HTTP. Held up: injection-safe prompt names, stale-update 409s, SQL-keyword DocType names, empty-reqd/overlong-data 417s. \u003cstrong>Finding: Int of 1e20 leaked a 500\u003c/strong> (passed zod int check, blew bigint range). No status flips warranted; defect fixed this session.\u003c/li>\u003cli>\u003cstrong>\u003ca class=\"fid-link\" href=\"#/f/META-010\">META-010\u003c/a>\u003c/strong>: \u003ccode>applyDefaults()\u003c/code> (typed defaults incl. read_only fields), read_only client values silently dropped in \u003ccode>pickFieldValues\u003c/code> (insert AND update), \u003ccode>mapDbError()\u003c/code> translates PG 23505 unique violations to field-wise 417s (constraint name → fieldname) and 22003/22001/22P02 range errors to 417. Int schema now bounded to JS safe-integer range (fixes the evaluator finding).\u003c/li>\u003cli>Verified: 53 vitest + live e2e (huge int 417, duplicate unique 417 with fields.c).\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-007\">META-007\u003c/a> (child tables) + \u003ca class=\"fid-link\" href=\"#/f/DOC-005\">DOC-005\u003c/a> (transactional child saves), then \u003ca class=\"fid-link\" href=\"#/f/META-008\">META-008\u003c/a> (link integrity).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-doc-011-meta-009-passing-metadata-driven-validati\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/DOC-011\">DOC-011\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/META-009\">META-009\u003c/a> passing: metadata-driven validation\u003c/h2>\n\u003cul>\u003cli>\u003ccode>packages/shared/src/schema.ts\u003c/code>: \u003ccode>metaToZod(fields)\u003c/code> builds a zod object per DocType (type-correct per fieldtype, Select→enum from options, reqd enforcement, empty→undefined preprocess); \u003ccode>zodFieldErrors()\u003c/code> flattens to {fieldname: message}. Server dep: \u003ccode>shared\u003c/code> workspace package.\u003c/li>\u003cli>document.ts \u003ccode>validateValues()\u003c/code>: full-object validation on insert, \u003ccode>.partial()\u003c/code> on update (only changed fields), provided-but-empty values become explicit SQL nulls so updates can clear fields.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/DOC-011\">DOC-011\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/META-009\">META-009\u003c/a> verified (48 vitest; live e2e returned both title 'Required' and qty NaN errors in one field-wise envelope).\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> stays failing: the CLIENT must consume the same schema (lands with \u003ca class=\"fid-link\" href=\"#/f/UI-009\">UI-009\u003c/a>). \u003ca class=\"fid-link\" href=\"#/f/META-010\">META-010\u003c/a> (defaults, read_only, unique mapping) still open — reqd alone doesn't satisfy it.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-010\">META-010\u003c/a>, then \u003ca class=\"fid-link\" href=\"#/f/META-007\">META-007\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/DOC-005\">DOC-005\u003c/a> (child tables) or \u003ca class=\"fid-link\" href=\"#/f/META-008\">META-008\u003c/a> (link integrity).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-006-passing-naming-engine\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-006\">META-006\u003c/a> passing: naming engine\u003c/h2>\n\u003cul>\u003cli>\u003ccode>resolveName()\u003c/code> in document.ts inside the save transaction: hash (default), prompt (client name required; if the name already exists it becomes an update), field:&lt;fieldname&gt;, and series \u003ccode>PREFIX-.####\u003c/code> via \u003ccode>series\u003c/code> table with INSERT..ON CONFLICT DO UPDATE RETURNING (row-lock serializes concurrent savers). Migration 0003 adds \u003ccode>series\u003c/code>.\u003c/li>\u003cli>saveDoc name-routing changed: name present → update if exists, else 404 unless autoname=prompt (insert-with-name).\u003c/li>\u003cli>Verified: 44 vitest incl. 50 parallel inserts → exactly NMINV-0001..0050, no gaps/dupes; live e2e produced E2EINV-0001..0003.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/DOC-011\">DOC-011\u003c/a> (zod validation, field-wise errors), then \u003ca class=\"fid-link\" href=\"#/f/META-009\">META-009\u003c/a>/010.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-doc-010-passing-get-list-query-engine\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/DOC-010\">DOC-010\u003c/a> passing: get_list query engine\u003c/h2>\n\u003cul>\u003cli>\u003ccode>query.ts\u003c/code>: \u003ccode>getList()\u003c/code> with [field, op, value] filters (=, !=, &lt;, &gt;, &lt;=, &gt;=, like/not like as ilike, in/not in), field projection, order_by parsing (regex-validated, identifier-quoted — injection attempts 417), pagination (max 500) + total count. Every field name validated against meta columns. \u003ccode>GET /api/list/:doctype\u003c/code> with JSON query params.\u003c/li>\u003cli>Verified: 40 vitest incl. injection attempt + live e2e (like filter, unknown field 417).\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> (shared zod schemas) + \u003ca class=\"fid-link\" href=\"#/f/DOC-011\">DOC-011\u003c/a> (field-wise validation) go together; then \u003ca class=\"fid-link\" href=\"#/f/META-006\">META-006\u003c/a> naming series, \u003ca class=\"fid-link\" href=\"#/f/META-009\">META-009\u003c/a>/010 flag enforcement.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-doc-002-meta-005-passing-updates-with-optimistic-\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/DOC-002\">DOC-002\u003c/a> + \u003ca class=\"fid-link\" href=\"#/f/META-005\">META-005\u003c/a> passing: updates with optimistic concurrency\u003c/h2>\n\u003cul>\u003cli>\u003ccode>saveDoc\u003c/code> now routes docs carrying a \u003ccode>name\u003c/code> to \u003ccode>updateDoc\u003c/code>: SELECT ... FOR UPDATE, compares client-echoed \u003ccode>modified\u003c/code> timestamp against DB (409 ConflictError on mismatch, 417 if omitted), auto-bumps modified/modified_by, preserves owner/creation. Standard-field payload keys are ignored rather than rejected so clients can send whole docs back.\u003c/li>\u003cli>\u003ca class=\"fid-link\" href=\"#/f/META-005\">META-005\u003c/a> flipped too: columns verified via information_schema (ddl.test), auto-set on insert (document.test) and update (update.test).\u003c/li>\u003cli>Verified: 36 vitest + live e2e (fresh update 201 → v2 in psql; replay of same modified → 409; row unchanged).\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-006\">META-006\u003c/a> (naming series with atomic counter) or \u003ca class=\"fid-link\" href=\"#/f/DOC-010\">DOC-010\u003c/a> (get_list) — both unlock a lot. Prefer \u003ca class=\"fid-link\" href=\"#/f/DOC-010\">DOC-010\u003c/a> next; then \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/DOC-011\">DOC-011\u003c/a> validation.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-doc-001-passing-save-doc-insert-path\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/DOC-001\">DOC-001\u003c/a> passing: save_doc insert path\u003c/h2>\n\u003cul>\u003cli>\u003ccode>document.ts\u003c/code>: \u003ccode>saveDoc()\u003c/code> loads meta, rejects unknown fields (field-wise errors), skips layout/Table fields, generates hash names, auto-sets standard fields (owner/creation/modified/modified_by/docstatus/idx), transactional insert, returns full doc. \u003ccode>getDoc()\u003c/code> reads back. Endpoints: \u003ccode>POST /api/save_doc\u003c/code> {doctype, doc}, \u003ccode>GET /api/doc/:dt/:name\u003c/code>.\u003c/li>\u003cli>Verified: vitest (insert+readback, unknown-field 417, 404s, envelope) + live e2e (create DocType → save_doc → row visible via psql).\u003c/li>\u003cli>Gotcha: postgres lib returns bigint columns as strings ('3' not 3) — typed value coercion should land with \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> zod schemas.\u003c/li>\u003cli>Gotcha: doctype tests that create DocTypes must also drop tab_* tables in cleanup now that DDL runs (fixed doctype-engine.test.ts).\u003c/li>\u003cli>Note: \u003ca class=\"fid-link\" href=\"#/f/DOC-001\">DOC-001\u003c/a>'s dep \u003ca class=\"fid-link\" href=\"#/f/META-005\">META-005\u003c/a> is implemented (columns + auto-set on insert) but stays failing until update-path auto-set exists (\u003ca class=\"fid-link\" href=\"#/f/DOC-002\">DOC-002\u003c/a>).\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/DOC-002\">DOC-002\u003c/a> (update + conflict detection) → then \u003ca class=\"fid-link\" href=\"#/f/META-005\">META-005\u003c/a> flip.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-003-passing-ddl-generation\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-003\">META-003\u003c/a> passing: DDL generation\u003c/h2>\n\u003cul>\u003cli>\u003ccode>createTableDDL()\u003c/code> in doctype-engine: standard columns always, parent linkage + (parent,idx) index for istable, per-field columns via \u003ccode>columnType()\u003c/code>, unique constraints, no table for issingle. DDL runs in the SAME transaction as metadata rows (verified rollback: pre-existing table name → 500 and no orphan doctype row). \u003ccode>tableName()\u003c/code> = tab_&lt;snake_case&gt;.\u003c/li>\u003cli>Verified: vitest column-type assertions via information_schema + live API created 'Task' → \u003ccode>\\d tab_task\u003c/code> shows all columns/PK; cleaned up after.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/DOC-001\">DOC-001\u003c/a> (save_doc insert through Document engine), which will also complete \u003ca class=\"fid-link\" href=\"#/f/META-005\">META-005\u003c/a>'s auto-set behavior.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-002-passing-field-type-system\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-002\">META-002\u003c/a> passing: field type system\u003c/h2>\n\u003cul>\u003cli>\u003ccode>doctype-engine.ts\u003c/code>: \u003ccode>columnType()\u003c/code> maps all 16 fieldtypes to PG column types (Table/Section Break/Column Break → no column); \u003ccode>createDocType()\u003c/code> validates via zod (\u003ccode>doctypeDefSchema\u003c/code>) + semantic checks (reserved \u003ccode>STANDARD_COLUMNS\u003c/code>, duplicate fieldnames, Link/Table/Select require options), inserts doctype+docfield rows transactionally, 409 on duplicate. \u003ccode>POST /api/doctype\u003c/code> endpoint. Field-wise 417 error envelope.\u003c/li>\u003cli>Verified: 25 vitest cases + live HTTP (invalid fieldtype 417 with field-wise message; valid def persists rows).\u003c/li>\u003cli>NOTE: \u003ccode>POST /api/doctype\u003c/code> stores metadata only — DDL is \u003ca class=\"fid-link\" href=\"#/f/META-003\">META-003\u003c/a>, next.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-meta-001-passing-doctype-metadata-storage\">2026-07-15 — \u003ca class=\"fid-link\" href=\"#/f/META-001\">META-001\u003c/a> passing: DocType metadata storage\u003c/h2>\n\u003cul>\u003cli>Migration \u003ccode>0002_doctype.sql\u003c/code>: \u003ccode>doctype\u003c/code> + \u003ccode>docfield\u003c/code> tables (FK cascade, \u003ccode>(parent, fieldname)\u003c/code> unique, ordered by \u003ccode>idx\u003c/code>). \u003ccode>src/meta.ts\u003c/code>: \u003ccode>getMeta()\u003c/code> loads a \u003ccode>DocTypeMeta\u003c/code> with ordered fields; \u003ccode>GET /api/meta/:doctype\u003c/code> serves it. \u003ccode>FIELD_TYPES\u003c/code> const defined (enforcement lands with \u003ca class=\"fid-link\" href=\"#/f/META-002\">META-002\u003c/a>).\u003c/li>\u003cli>Verified: vitest (loader, HTTP, 404 envelope) + live e2e — SQL-inserted 'E2E Task' returned by the running server with fields; unknown doctype 404s; doctype delete cascades docfields.\u003c/li>\u003cli>Next: \u003ca class=\"fid-link\" href=\"#/f/META-002\">META-002\u003c/a> (fieldtype→pg column mapping + rejection of invalid fieldtypes on a DocType-save path), then \u003ca class=\"fid-link\" href=\"#/f/META-003\">META-003\u003c/a> (DDL generation).\u003c/li>\u003c/ul>\n\u003chr>\n\u003cp>Newest entries first. Every session appends: date, feature ID worked on, what was done, how it was verified, what to pick up next, gotchas.\u003c/p>\n\u003chr>\n\u003ch2 id=\"2026-07-15-initializer-session-complete-stack-boots-green\">2026-07-15 — Initializer session complete: stack boots green\u003c/h2>\n\u003cul>\u003cli>Scaffolded pnpm monorepo: \u003ccode>apps/server\u003c/code> (Hono, \u003ccode>postgres\u003c/code> client, error envelope, SQL migration runner, \u003ccode>/api/ping\u003c/code>), \u003ccode>apps/web\u003c/code> (Vite + React 19 + Tailwind v4 + TanStack Router/Query, login + desk shells, Playwright), \u003ccode>packages/shared\u003c/code> (placeholder for \u003ca class=\"fid-link\" href=\"#/f/META-013\">META-013\u003c/a> zod generator).\u003c/li>\u003cli>\u003cstrong>Database decision (user-approved): local system Postgres 16 cluster on port 5432, NOT Supabase.\u003c/strong> \u003ccode>init.sh\u003c/code> starts it via \u003ccode>pg_ctlcluster\u003c/code>, sets postgres password to 'postgres', creates \u003ccode>frappe_clone\u003c/code> db. \u003ccode>DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/frappe_clone\u003c/code>. Supabase-flavored features map to local equivalents (see CLAUDE.md).\u003c/li>\u003cli>Verified end-to-end: \u003ccode>./init.sh\u003c/code> exits 0 — migrations apply, server :8000 and web :5173 boot, server smoke (ping+db) and Playwright smoke (login page renders, API via proxy) all pass.\u003c/li>\u003cli>\u003cstrong>Gotchas\u003c/strong>: (1) Docker daemon is not running in this environment — do not try Supabase local or docker compose. (2) Playwright must use \u003ccode>executablePath: '/opt/pw-browsers/chromium'\u003c/code> (already in playwright.config.ts). (3) Piping \u003ccode>./init.sh | tail\u003c/code> never returns EOF because the spawned dev servers hold the pipe; run it as \u003ccode>bash init.sh &gt; /tmp/init.log 2&gt;&amp;1\u003c/code> and read the log instead. (4) \u003ccode>pkill -f init.sh\u003c/code> will kill your own shell if the command string contains \"init.sh\" — use exact patterns.\u003c/li>\u003cli>\u003cstrong>Next session\u003c/strong>: \u003ca class=\"fid-link\" href=\"#/f/META-001\">META-001\u003c/a> (doctype/docfield storage + Meta loader).\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"2026-07-15-harness-initialized-no-code-yet\">2026-07-15 — Harness initialized (no code yet)\u003c/h2>\n\u003cul>\u003cli>Repo contains strategy (\u003ccode>docs/ROADMAP.md\u003c/code>) and the agent harness (\u003ccode>CLAUDE.md\u003c/code>, \u003ccode>harness/\u003c/code>). No application code exists yet.\u003c/li>\u003cli>\u003cstrong>Next session\u003c/strong>: run the initializer prompt (\u003ccode>harness/prompts/initializer.md\u003c/code>) to scaffold the monorepo, Supabase local config, and \u003ccode>init.sh\u003c/code>, then start on \u003ccode>\u003ca class=\"fid-link\" href=\"#/f/META-001\">META-001\u003c/a>\u003c/code>.\u003c/li>\u003cli>Gotchas: none yet.\u003c/li>\u003c/ul>"},{"group":"System studies","slug":"study-README","title":"Studies index — the two families","path":"docs/research/studies/README.md","mins":3,"html":"\u003ch1 id=\"system-studies-how-the-veterans-handled-it\">System Studies — how the veterans handled it\u003c/h1>\n\u003cblockquote>\u003cp>Study series, 2026-07-26. One document per system that shaped the Featherbase design framework (\u003ccode>docs/design/data-and-admin-topology.md\u003c/code>), each answering the same four questions:\u003c/p>\n\u003col>\u003cli>\u003cstrong>What key dimensions did they take?\u003c/strong> (the core architectural bets)\u003c/li>\u003cli>\u003cstrong>What does that enable them to do?\u003c/strong>\u003c/li>\u003cli>\u003cstrong>What are the downsides?\u003c/strong>\u003c/li>\u003cli>\u003cstrong>What should Featherbase adopt — and explicitly not adopt?\u003c/strong>\u003c/li>\u003c/ol>\n\u003cp>\"Adopt\" verdicts reference the framework's decisions (D1–D19) so each lesson lands somewhere concrete.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"the-two-families\">The two families\u003c/h2>\n\u003cp>Every system here sits somewhere on one spectrum, and naming it clarifies everything else:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Runtime interpreters\u003c/strong> — the model is \u003cem>data\u003c/em>, read at runtime; there is no generated code to drift. Frappe, Salesforce, ServiceNow, NocoBase, Directus, Odoo (mostly), ActiveAdmin. Superpower: users change the system live; upgrades can't collide with code nobody wrote. Weakness: the behavior lives in an engine you must trust and debug indirectly.\u003c/li>\u003cli>\u003cstrong>Code generators\u003c/strong> — the model is \u003cem>input\u003c/em>; the output is code you own and refactor. JHipster, ScaffoldHub, Rails scaffolding, and the 2000s-era XML→EJB MDM generators (AndroMDA, XDoclot-style) this project's author built with. Superpower: readable, refactorable, no-lock-in code with the whole test pyramid included. Weakness: the \u003cstrong>round-trip problem\u003c/strong> — the moment a human edits the output, the model lies, and regeneration becomes a merge conflict.\u003c/li>\u003c/ul>\n\u003cp>Featherbase's position (decision \u003cstrong>D19\u003c/strong> in the design doc): \u003cstrong>interpret at runtime as the source of truth; generate only one-way, derived artifacts\u003c/strong> — typed clients, hook stubs, test skeletons, and (as an off-ramp, never round-tripped) full eject of a DocType to owned code.\u003c/p>\n\u003ch2 id=\"the-studies\">The studies\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>System\u003c/th>\u003cth>Family\u003c/th>\u003cth>One-line reason it's here\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>JHipster\u003c/td>\u003ctd>generator\u003c/td>\u003ctd>model-to-everything incl. the full test pyramid; blueprints; the upgrade merge\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Generator family\u003c/td>\u003ctd>generator\u003c/td>\u003ctd>ScaffoldHub, Rails scaffolding/ActiveAdmin/Administrate, XML→EJB MDM — five answers to the round-trip problem\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NocoBase\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>microkernel, everything-is-a-plugin, data sources as plugins\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Salesforce\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>metadata multitenancy, packaging, permission sets, admin-as-builder\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Jira\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>schemes as reusable config, request types, the two-paradigm cautionary tale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Directus\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>database-first reflection, snapshot/apply, the extension taxonomy\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Odoo\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>module composition over shared models; the upgrade-pain cautionary tale\u003c/td>\u003c/tr>\u003ctr>\u003ctd>ServiceNow\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>table inheritance, scoped apps, why update sets are the wrong promotion unit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>react-admin\u003c/td>\u003ctd>code-first frontend\u003c/td>\u003ctd>the dataProvider adapter ecosystem; guessers — generation as one-way suggestion\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Avo\u003c/td>\u003ctd>interpreter (of code)\u003c/td>\u003ctd>the escape-hatch ladder — \"designed so you can't get stuck\"; fields as tiny packages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>NocoDB\u003c/td>\u003ctd>interpreter\u003c/td>\u003ctd>spreadsheet skin over existing DBs; views as the user-facing unit; virtual columns\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hudi &amp; the lakehouse stack\u003c/td>\u003ctd>lakehouse ingestion\u003c/td>\u003ctd>keyed upserts + incremental queries downstream; DLT-META's metadata-driven pipelines; the D20 egress story\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Frappe already has its own deep study: \u003ccode>../frappe-architecture.md\u003c/code> (+ the two multi-app/multi-DB notes beside it). Hasura, Medusa, WordPress, VS Code, and Strapi/Payload are covered inside the design doc's survey (§8) — deep-dives can be added here on demand.\u003c/p>\n\u003ch2 id=\"suggested-reading-order\">Suggested reading order\u003c/h2>\n\u003col>\u003cli>\u003cstrong>JHipster\u003c/strong> then \u003cstrong>Generator family\u003c/strong> — they define the generation side and D19, and connect to the author's own MDM-generator history.\u003c/li>\u003cli>\u003cstrong>NocoBase\u003c/strong> and \u003cstrong>Salesforce\u003c/strong> — the two most complete pictures of what Featherbase wants to become (open microkernel; governed metadata platform).\u003c/li>\u003cli>\u003cstrong>Jira\u003c/strong>, \u003cstrong>ServiceNow\u003c/strong>, \u003cstrong>Odoo\u003c/strong> — the veterans' scar tissue: scheme indirection, update sets, upgrade pain. Mostly lessons in what to avoid and why the framework's D-decisions are shaped the way they are.\u003c/li>\u003cli>\u003cstrong>Directus\u003c/strong> and \u003cstrong>NocoDB\u003c/strong> — Axis C shipped as products, for the developer and spreadsheet audiences respectively.\u003c/li>\u003cli>\u003cstrong>react-admin\u003c/strong> and \u003cstrong>Avo\u003c/strong> — the admired admin-framework pair: the adapter/guesser mechanics and the escape-hatch ladder, i.e. how to make \"simple where possible, never stuck\" a designed property.\u003c/li>\u003cli>\u003cstrong>Hudi &amp; the lakehouse stack\u003c/strong> — the downstream: how master data reaches bronze/silver, and why the ingestion config should be generated from DocType metadata rather than modeled by hand (D20).\u003c/li>\u003c/ol>"},{"group":"System studies","slug":"study-avo","title":"Study — Avo","path":"docs/research/studies/avo.md","mins":3,"html":"\u003ch1 id=\"avo-the-modern-rails-admin-resources-fields-and-escape-hatch\">Avo — the modern Rails admin: r
