esources, fields, and escape hatches\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong> (of Ruby resource classes). The modern successor to ActiveAdmin/Administrate — very plausibly the \"beautiful Ruby project with admin panel\" remembered from earlier discussion, and the best current expression of the defaults-plus-escape-hatches philosophy in any ecosystem.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>A Rails admin-panel framework / internal-tool builder (open core, commercial tiers): one generator command per model produces a \u003ccode>Resource\u003c/code> class; you declare \u003cstrong>fields\u003c/strong> on it and Avo renders index/show/edit/create views, filters, search, associations, and \u003cstrong>actions\u003c/strong> (custom operations run on selected records) — all from those Ruby declarations, at runtime.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>The Resource class is the unit of configuration.\u003c/strong> One plain Ruby class per model: \u003ccode>field :name, as: :text\u003c/code>, \u003ccode>field :status, as: :select\u003c/code>, associations, visibility rules (\u003ccode>visible on: :index\u003c/code>), authorization via Pundit policies. Declarative, but ordinary Ruby — readable, diffable, greppable. No separate DSL universe (ActiveAdmin's trap) and no bare-metal minimalism (Administrate's trade).\u003c/li>\u003cli>\u003cstrong>Field types as the extension currency.\u003c/strong> A rich built-in field library (badges, key-value, trix, files, gravatar…) plus \u003cstrong>custom fields\u003c/strong> generated as tiny component bundles (Ruby + ERB/Stimulus) — the fieldtype-as-plugin economy, same shape as Directus interfaces and Featherbase's D11 fieldtype contribution point.\u003c/li>\u003cli>\u003cstrong>Actions, filters, dashboards as first-class objects\u003c/strong> — each its own small class, declared then rendered; the same named-object-bound-to-scope pattern as Jira schemes, at Rails scale.\u003c/li>\u003cli>\u003cstrong>\"Designed so you can't get stuck\": layered escape hatches.\u003c/strong> This is Avo's stated philosophy and its real contribution: customize a field → custom field; customize a view → custom component per resource; outgrow Avo on one screen → \u003cstrong>custom tools\u003c/strong> (arbitrary Rails views/controllers mounted inside Avo's layout, with its nav and auth). Every level of \"the framework doesn't do X\" has a designed exit that keeps you \u003cem>inside\u003c/em> the product instead of forking out of it.\u003c/li>\u003cli>\u003cstrong>Open-core with per-tier features\u003c/strong> (licensing gates advanced fields, menus, etc.) — sustainable, with the usual adoption friction.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>ActiveAdmin-class speed with modern Rails (Hotwire-era) internals and none of the legacy DSL's fight-the-framework endgame.\u003c/li>\u003cli>Teams customize progressively — the distance between \"generated default\" and \"fully bespoke screen\" is a ramp, not a cliff.\u003c/li>\u003cli>The resource-class idiom doubles as documentation: reading \u003ccode>app/avo/resources/*.rb\u003c/code> tells you what the admin does.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>Developer-only authoring: like every code-configured admin, an end-user/admin persona can't add a field at runtime — the Featherbase gap again.\u003c/li>\u003cli>Configuration lives per-app; there's no packaging/sharing story for resources across projects beyond gems — no marketplace of domain modules.\u003c/li>\u003cli>Commercial gating of individual features inside an open-source framework blurs what \"using Avo\" means for OSS projects.\u003c/li>\u003cli>Young compared to its ancestors; API still evolves.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>The escape-hatch ladder as a design requirement (D11/D14):\u003c/strong> for every generated surface, define the named next step — metadata tweak → layout override → custom fieldtype → custom view component → custom page (\"custom tool\") — each staying inside the platform's nav, auth, and theme. Write this ladder into the Desk's contribution-point spec explicitly; \"you can't get stuck\" is a testable product property, not a slogan.\u003c/li>\u003cli>\u003cstrong>Fields as small, generatable component packages:\u003c/strong> Avo's custom-field generator (scaffold a working fieldtype in one command) is the DX bar for Featherbase's fieldtype contributions.\u003c/li>\u003cli>\u003cstrong>Actions as first-class scoped objects (Axis A):\u003c/strong> module admins defining \"run on selected records\" operations with their own authorization — a natural, high-value contribution point the design doc hasn't listed explicitly yet (it fits under D11's workflow/logic row).\u003c/li>\u003cli>\u003cstrong>Resource-class readability as the bar for DocType JSON:\u003c/strong> a DocType definition should read as pleasantly as an Avo resource file — this is Rails' convention-over-configuration lesson (generator-family study) restated for the metadata side.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> per-app-only configuration with no packaging (Axis D exists to beat this); feature-gating inside the core contribution surface (gate hosted services and support, not contribution points).\u003c/p>"},{"group":"System studies","slug":"study-directus","title":"Study — Directus","path":"docs/research/studies/directus.md","mins":3,"html":"\u003ch1 id=\"directus-database-first-reflection-as-a-product\">Directus — database-first reflection as a product\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong>. Included because it is Axis C shipped commercially: the proof that \"sit on any existing SQL database, impose nothing\" works — and a preview of its limits.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>An open-source \"backend-as-a-service / data platform\" that wraps \u003cstrong>any existing SQL database\u003c/strong> with a REST + GraphQL API and an admin app (the Data Studio), by \u003cem>introspecting\u003c/em> the schema rather than owning it. Its own metadata (collections config, permissions, flows, users) lives in a handful of \u003ccode>directus_*\u003c/code> tables placed \u003cem>beside\u003c/em> yours.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Database-first, not framework-first.\u003c/strong> Tables are the truth; Directus reflects them and layers presentation metadata on top. No naming conventions, no required columns, no prefixes — the direct validation of Featherbase's anti-\u003ccode>tab_\u003c/code> stance (D2) and adoption mode.\u003c/li>\u003cli>\u003cstrong>Metadata beside the data.\u003c/strong> \u003ccode>directus_*\u003c/code> tables coexist with the inspected schema in the same database — adoption without invasion.\u003c/li>\u003cli>\u003cstrong>A complete extension taxonomy.\u003c/strong> Nine types — interfaces (field widgets), displays, layouts, modules (pages), panels (dashboard), hooks, endpoints, operations (flow steps), bundles — cleanly split app-side vs API-side. The best-organized plugin surface in this study series after VS Code.\u003c/li>\u003cli>\u003cstrong>Flows\u003c/strong> — event/schedule/webhook-triggered no-code automation with operations as pluggable steps.\u003c/li>\u003cli>\u003cstrong>Schema snapshot / diff / apply.\u003c/strong> The CLI can snapshot the schema + config to a file, diff it against another instance, and apply — their answer to promotion across environments (Axis F), git-friendly.\u003c/li>\u003cli>\u003cstrong>Permissions as data\u003c/strong>: role/field/item-level rules with dynamic variables, enforced in the API layer (not the database).\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>Point it at a legacy database and get an admin UI, API, and permissions \u003cstrong>today\u003c/strong>, with the CLIs/apps that own that database untouched — the doctor's-clinical-system move, productized.\u003c/li>\u003cli>Refactor-friendliness: because the DB is the truth, renaming with ordinary migration tools doesn't fight the platform.\u003c/li>\u003cli>Its extension taxonomy lets agencies ship polished custom field widgets — the fieldtype-as-plugin economy in miniature.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Business logic is thin by design.\u003c/strong> Database-first means there is no rich document lifecycle: no equivalent of the validate→before_save→transaction→after_save chain, submittable documents, or naming series. Complex invariants end up in hooks/flows scattered per-collection, or back in application code. (Featherbase's differentiator: adoption \u003cem>plus\u003c/em> a real document engine.)\u003c/li>\u003cli>\u003cstrong>API-layer permissions only\u003c/strong> — the database itself is open to anyone with a connection string; there's no RLS story. Fine for its positioning, but weaker than Featherbase's local-Postgres RLS + server gate combination.\u003c/li>\u003cli>Introspection-driven metadata can drift confusing when other tools migrate the schema mid-flight (their snapshot/diff mitigates, not cures).\u003c/li>\u003cli>License: moved from GPL to BSL-style source-available with a revenue threshold — a reminder that ecosystem trust depends on license stability (relevant to Featherbase's own positioning as the free/open option).\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>The reflection UX bar (Axis C):\u003c/strong> browse → propose → adjust → adopt, with live re-sync diffs. Directus proves users expect this to be effortless.\u003c/li>\u003cli>\u003cstrong>Snapshot / diff / apply as the promotion primitive (D17):\u003c/strong> metadata + implied DDL, exportable to a file, diffable in git, applyable with a plan preview. Directus shipped the mechanics; Featherbase adds the layer stack (D13) on top.\u003c/li>\u003cli>\u003cstrong>The extension taxonomy names (D11):\u003c/strong> interfaces/displays/layouts/ modules/panels/operations is a proven, teachable vocabulary — reuse it rather than inventing synonyms.\u003c/li>\u003cli>\u003cstrong>Beside-the-data metadata placement\u003c/strong> for adopted databases (already implicit in adoption mode; Directus is the precedent that it scales).\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> database-first \u003cem>thinness\u003c/em> — Featherbase's document lifecycle, permissions-in-depth (RLS + server), and naming series are precisely the value the overlay adds; giving them up would make it a second Directus instead of a better Frappe.\u003c/p>"},{"group":"System studies","slug":"study-generator-family","title":"Study — Generator Family","path":"docs/research/studies/generator-family.md","mins":4,"html":"\u003ch1 id=\"the-generator-family-scaffoldhub-rails-admin-panels-and-the-\">The generator family — ScaffoldHub, Rails admin panels, and the XML→EJB era\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>code generators\u003c/strong> (with one honorary interpreter). Grouped because together they map every known answer to the round-trip problem. Includes the author's own formative system: an MDM platform built ~20 years ago from an \u003cstrong>XML model definition\u003c/strong> generating EJB backends and front+back validation — \"still what I want to get back in the modern days: simple where it is possible, and the code can always be refactored.\"\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"the-systems\">The systems\u003c/h2>\n\u003ch3 id=\"scaffoldhub\">ScaffoldHub\u003c/h3>\n\u003cp>Commercial generator: design the data model on a visual canvas (entities, fields, relations), and it generates a full multi-tenant SaaS codebase — Next.js/Prisma (earlier versions: several stacks), forms, lists, validation, RBAC, audit logs, i18n, tests. \u003cstrong>You own the code forever\u003c/strong>; customization happens in your editor. Regeneration is effectively a starting-point story, not a lifecycle: it optimizes for the first month, not year three.\u003c/p>\n\u003ch3 id=\"rails-scaffolding-activeadmin-administrate\">Rails: scaffolding, ActiveAdmin, Administrate\u003c/h3>\n\u003cp>Three answers from one ecosystem:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>rails generate scaffold\u003c/code>\u003c/strong> — one-shot generation of model/controller/views; universally used as a \u003cem>learning and starting\u003c/em> device, universally abandoned as a lifecycle tool. Rails' real lesson is \u003cstrong>convention over configuration\u003c/strong>: most metadata is \u003cem>implied\u003c/em>, so there is less model to keep in sync.\u003c/li>\u003cli>\u003cstrong>ActiveAdmin\u003c/strong> — the honorary interpreter: a runtime admin framework configured by a Ruby \u003cstrong>DSL\u003c/strong> per resource. No generated code to drift — but the DSL is its own world; when you outgrow it, you fight it.\u003c/li>\u003cli>\u003cstrong>Administrate\u003c/strong> (thoughtbot) — the philosophical opposite, and the one whose principle sounds like the author's own words: \u003cstrong>\"no DSLs; support the simplest use cases and let the user override defaults with standard tools\"\u003c/strong> — plain Rails controllers and views, ordinary classes and inheritance. Simple where possible; escape by writing normal code, not by learning a bigger DSL.\u003c/li>\u003c/ul>\n\u003ch3 id=\"the-xml-ejb-mdm-generators-the-author-s-own-2006\">The XML→EJB MDM generators (the author's own, ~2006)\u003c/h3>\n\u003cp>The Model-Driven-Architecture era pattern (AndroMDA, XDoclet, home-grown XML models): one XML file defines the entities; generators emit EJBs, DAO layers, and validation for both frontend and backend. It worked — a whole MDM system ran on it — and its virtues are exactly the ones worth recovering: \u003cem>one model artifact drives every layer; validation is written once\u003c/em>. Its era-specific pains: generated code nobody wanted to read, \"protected regions\" for hand edits that broke on regeneration, toolchains that rotted, and UML/MDA ceremony that collapsed under its own weight. MDA died on the round-trip problem; the idea didn't.\u003c/p>\n\u003ch2 id=\"the-round-trip-problem-five-answers-on-one-table\">The round-trip problem — five answers on one table\u003c/h2>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Strategy\u003c/th>\u003cth>Used by\u003c/th>\u003cth>Cost\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Never regenerate (starting point only)\u003c/td>\u003ctd>ScaffoldHub, Rails scaffold\u003c/td>\u003ctd>model is disposable; truth moves to code on day 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Protected regions in generated files\u003c/td>\u003ctd>MDA/XDoclet era\u003c/td>\u003ctd>fragile, ugly, still merges by hope\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Three-way git merge on regen\u003c/td>\u003ctd>JHipster (\u003ccode>upgrade\u003c/code>)\u003c/td>\u003ctd>honest, but real conflicts land on you\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Don't generate — interpret a DSL at runtime\u003c/td>\u003ctd>ActiveAdmin\u003c/td>\u003ctd>no drift, but the DSL becomes a cage\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Don't generate \u003cem>and\u003c/em> no DSL — defaults + plain-code overrides\u003c/td>\u003ctd>Administrate\u003c/td>\u003ctd>smallest surface; fewest capabilities out of the box\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2 id=\"what-this-family-enables\">What this family enables\u003c/h2>\n\u003cul>\u003cli>Day-one completeness with the whole validation/test story included — the experience the author has been chasing since the XML→EJB system.\u003c/li>\u003cli>Code you can read, refactor, and own: no engine to trust blindly, no vendor to outlive.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides-shared\">Downsides (shared)\u003c/h2>\n\u003cul>\u003cli>The model stops being the truth the moment output is edited — every strategy above is a mitigation, none is a cure.\u003c/li>\u003cli>No runtime authoring: admins and users can't change anything without a developer cycle. (ActiveAdmin/Administrate escape this only because they gave up generation.)\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>D19, stated as this family's synthesis:\u003c/strong> runtime interpretation is the source of truth (Featherbase already is this); generation exists only as \u003cem>one-way derived artifacts\u003c/em> — TypeScript types, typed API clients, hook stubs, test skeletons, seed fixtures — regenerable at any time precisely because nobody edits them. The full \u003cstrong>eject\u003c/strong> of a DocType to owned code is the deliberate off-ramp: one-way, ScaffoldHub ownership rules apply, and re-entry happens only through Axis C adoption (reflection of what the table became), never by merging code back into metadata.\u003c/li>\u003cli>\u003cstrong>Administrate's principle as the extension philosophy:\u003c/strong> defaults derived from metadata; overriding means writing an ordinary hook / ordinary component through the contribution points (D11) — never a second DSL layer between the user and the platform.\u003c/li>\u003cli>\u003cstrong>Rails' convention-over-configuration\u003c/strong> applied to DocType JSON: every field the author doesn't specify should have an obvious derived default (label from fieldname, list columns from first fields, etc.) — the model stays small enough to read, which is what \"simple where possible\" cashed out to in the XML system too.\u003c/li>\u003cli>\u003cstrong>From the XML→EJB system:\u003c/strong> validation defined once in the model and enforced on both sides — Featherbase already does this (Zod from DocType JSON, shared package); guard it as a hard invariant.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> protected regions in any generated artifact; DSLs that aren't the DocType JSON itself; treating generated code as a second source of truth.\u003c/p>"},{"group":"System studies","slug":"study-hudi-lakehouse","title":"Study — Hudi Lakehouse","path":"docs/research/studies/hudi-lakehouse.md","mins":4,"html":"\u003ch1 id=\"apache-hudi-the-lakehouse-ingestion-stack-the-etl-egress-stu\">Apache Hudi &amp; the lakehouse ingestion stack — the ETL egress study\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>lakehouse storage/ingestion\u003c/strong> (a new category in this series — the \u003cem>downstream\u003c/em> of everything else). Written to answer: how does master data flow from Featherbase into the bronze/silver (medallion) layers, and can the ingestion config — today hand-written CSVs — be auto-generated from DocType metadata? Covers Hudi as the named system, with Debezium, dbt, and Databricks' DLT-META as the surrounding stack.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-hudi-is\">What Hudi is\u003c/h2>\n\u003cp>An open-source \u003cstrong>lakehouse table format + ingestion platform\u003c/strong> (peer of Delta Lake and Iceberg, originally from Uber): it brings record-level \u003cstrong>upserts and deletes\u003c/strong> to files on object storage, so a data lake can be kept in sync with operational databases instead of being append-only dumps. Widely adopted (notably across Indian data teams) for CDC-heavy pipelines.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Primary keys in the lake.\u003c/strong> Every Hudi record has a \u003cstrong>record key\u003c/strong> (+ optional partition path); writes are upserts against that key, via an index that locates the file group holding each key. The lake stops being \"append and dedupe later\" and becomes a keyed store.\u003c/li>\u003cli>\u003cstrong>The precombine field.\u003c/strong> When two versions of a record collide, the one with the larger precombine value (typically the update timestamp) wins — ordering semantics declared as metadata, not coded per pipeline.\u003c/li>\u003cli>\u003cstrong>The timeline.\u003c/strong> Every commit is a timestamped action on a table timeline; this powers time travel, rollback, and — the crown jewel — \u003cstrong>incremental queries\u003c/strong>: \"give me exactly the records that changed since instant T\". Downstream jobs consume changes in chunks without rescanning the table, decoupling writers from readers.\u003c/li>\u003cli>\u003cstrong>CDC on both ends.\u003c/strong> Ingest side: HoodieStreamer (formerly DeltaStreamer) tails Kafka/Debezium/JDBC sources into Hudi tables continuously, with schema evolution handled. Serve side: Hudi can materialize change streams (or infer them on read) for the next hop.\u003c/li>\u003cli>\u003cstrong>Copy-on-write vs merge-on-read\u003c/strong> table types — the write-latency vs read-cost dial, chosen per table.\u003c/li>\u003c/ol>\n\u003ch2 id=\"the-surrounding-stack-how-the-medallion-actually-runs\">The surrounding stack (how the medallion actually runs)\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Debezium / Postgres logical replication\u003c/strong> — row-level change capture from an operational database with zero application code; the standard bronze feed.\u003c/li>\u003cli>\u003cstrong>Bronze\u003c/strong> — raw, append-only landed changes (full payloads + ingestion metadata). \u003cstrong>Silver\u003c/strong> — cleaned, deduplicated, \u003cem>keyed\u003c/em> (Hudi's upserts naturally live here), conformed types, SCD handling. \u003cstrong>Gold\u003c/strong> — business marts.\u003c/li>\u003cli>\u003cstrong>dbt\u003c/strong> — SQL transformations as versioned, tested models; \u003ccode>sources.yml\u003c/code> + staging models are the silver layer's code form.\u003c/li>\u003cli>\u003cstrong>DLT-META (Databricks Labs)\u003c/strong> — the direct precedent for the auto-generation ask: a \u003cem>metadata-driven\u003c/em> framework where an \"onboarding JSON\" (the \u003cstrong>Dataflowspec\u003c/strong>: source, target, quality rules, CDC settings per table) drives one generic pipeline that builds all bronze/silver flows. The hand-written per-table pipeline is replaced by config — and config can be \u003cem>generated\u003c/em>. \u003cem>Status caveat (2026-07):\u003c/em> activity is thin (last release 2025-09, sparse commits since) and, like all Databricks Labs projects, it is explicitly unsupported — no SLA, \"exploration purposes only\". The verdict for Featherbase: \u003cstrong>adopt the Dataflowspec idea, never the dependency\u003c/strong> — D20 generates \u003cem>our own\u003c/em> spec format plus whatever the client's runner needs (DLT-META's JSON being just one emit target).\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-this-enables\">What this enables\u003c/h2>\n\u003cul>\u003cli>Operational data lands in the lake continuously, keyed and deduped, with downstream consumers pulling \u003cem>only deltas\u003c/em> — the warehouse stays minutes behind the app instead of a nightly batch behind.\u003c/li>\u003cli>One declarative spec per table instead of one pipeline per table (DLT-META's lesson), which is exactly what the current CSV-in-git config is groping toward.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>Hudi is operationally heavy: Spark/Flink runtimes, compaction and clustering to babysit, config sprawl (dozens of \u003ccode>hoodie.*\u003c/code> knobs); for small/medium estates, Postgres + dbt + DuckDB/Iceberg-lite may serve better. Choose it for scale/CDC needs, not by default.\u003c/li>\u003cli>Table-format wars (Hudi/Delta/Iceberg) mean the \u003cem>format\u003c/em> choice is volatile — the stable investment is the metadata that generates configs, which can retarget formats.\u003c/li>\u003cli>CDC pipelines silently rot when source schemas drift and nobody owns the mapping — the precise failure the auto-generation below removes.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt-the-etl-answer-d20\">What Featherbase should adopt (the ETL answer, D20)\u003c/h2>\n\u003cp>The realization: \u003cstrong>a DocType already contains everything the medallion config needs\u003c/strong> — physical table, fields and types, PK, the \u003ccode>modified\u003c/code> column (incremental/precombine key), soft-delete semantics, and (with D16) effectivity columns. So the warehouse side stops being a modeling exercise:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Analytics egress as a declared sync-binding kind (Axis B / D6):\u003c/strong> a DocType (or a whole module/app) declares \u003ccode>egress: analytics\u003c/code>, with a target (lake path / schema) and transport chosen by capability: Postgres \u003cstrong>logical replication/Debezium\u003c/strong> for local tables (zero app work), the \u003cstrong>outbox\u003c/strong> for external/adopted sources where replication isn't available, snapshot for small dimensions.\u003c/li>\u003cli>\u003cstrong>Generate the configs as one-way D19 artifacts:\u003c/strong> from DocType metadata, emit (a) the \u003cstrong>existing bronze/silver CSV config\u003c/strong> the agents maintain today — same format, now derived; (b) \u003cstrong>dbt \u003ccode>sources.yml\u003c/code> + staging models\u003c/strong> with column types, tests (not-null/unique from field metadata), and doc strings from labels; (c) \u003cstrong>HoodieStreamer / DLT-META Dataflowspec\u003c/strong> configs where that stack is in play — record key = DocType PK, precombine = \u003ccode>modified\u003c/code>. Regenerated whenever the DocType changes, so warehouse schema drift follows metadata promotion (Axis F) instead of being discovered at 2am.\u003c/li>\u003cli>\u003cstrong>Axis E makes SCD free:\u003c/strong> version history + effectivity dating map directly to SCD Type 2 — \u003ccode>valid_from\u003c/code>/\u003ccode>valid_to\u003c/code> flow into silver without any warehouse-side modeling. Hudi's timeline/incremental queries are the same idea downstream; Featherbase's replay (\"changes since T\", §7.1) is the handshake between them.\u003c/li>\u003cli>\u003cstrong>MDM as the source of conformed dimensions:\u003c/strong> the strategic loop closes — the master data app governs customer/vendor/item \u003cem>upstream\u003c/em>, and the warehouse's dimension tables are \u003cem>generated\u003c/em> from those same DocTypes. Golden records in, conformed dims out, one metadata source.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> running lake infrastructure inside Featherbase (emit configs and streams; let the lake stack be whatever the client runs); hand-maintained per-table pipeline code (the DLT-META lesson); coupling to one table format (generate for Hudi today, Iceberg tomorrow — the metadata is the constant).\u003c/p>"},{"group":"System studies","slug":"study-jhipster","title":"Study — Jhipster","path":"docs/research/studies/jhipster.md","mins":3,"html":"\u003ch1 id=\"jhipster-model-to-everything-generation-tests-included\">JHipster — model-to-everything generation, tests included\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>code generator\u003c/strong>. Personal note: a project the author loves and half-wanted to redo — \"once you sign up, the whole E2E test and everything is there, just that it looks very complicated.\" Both halves of that sentence are architectural, not accidental.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>An opinionated full-stack generator: describe applications, entities, relationships, and even deployments in \u003cstrong>JDL\u003c/strong> (JHipster Domain Language, a compact text DSL), and it generates a complete Spring Boot backend + Angular/React/Vue frontend — JPA entities, repositories, services, REST resources, forms, list pages, validation on both sides, auth, i18n, Docker/Kubernetes descriptors, CI pipelines, and the \u003cstrong>entire test pyramid\u003c/strong>: unit tests, integration tests, Cypress e2e, Gatling load tests.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>The model is a text artifact (JDL), not a UI session.\u003c/strong> One file declares entities, fields with validation rules, relationships, enums, and per-entity options (pagination, DTO, service layer, filtering). Diffable, reviewable, generatable-by-tooling.\u003c/li>\u003cli>\u003cstrong>Generate everything, then hand over ownership.\u003c/strong> The output is a normal codebase; JHipster has no runtime presence at all. Refactor freely — it's your code.\u003c/li>\u003cli>\u003cstrong>The test pyramid is part of the deliverable.\u003c/strong> Every generated entity arrives with tests at every layer. Quality isn't something you add to the scaffold; it ships in it.\u003c/li>\u003cli>\u003cstrong>Blueprints: the generator itself is extensible.\u003c/strong> A blueprint is a Yeoman generator that overrides templates and sub-generators — community blueprints swap whole stacks (Quarkus, Micronaut, .NET, Node). Extension happens at \u003cem>generation time\u003c/em>, the analog of runtime plugins one level up.\u003c/li>\u003cli>\u003cstrong>Upgrade by three-way merge.\u003c/strong> \u003ccode>jhipster upgrade\u003c/code> regenerates the app clean on a branch and git-merges it into yours — the most honest mechanical answer anyone has given to the round-trip problem.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>A production-grade, \u003cem>tested\u003c/em> application in an afternoon — the exact experience the author wants to recreate.\u003c/li>\u003cli>Zero lock-in: teams delete JHipster from their toolchain and keep shipping, because nothing at runtime depends on it.\u003c/li>\u003cli>Stack evolution without re-modeling: the same JDL regenerates onto a different blueprint.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>The complexity wall is structural.\u003c/strong> Generating \u003cem>everything\u003c/em> means the day-one codebase carries every concern of a mature app (security config, caching, websockets, CI, deployment) — hundreds of files the new owner must eventually understand. \"It looks very complicated\" because it \u003cem>is\u003c/em> the whole app, honestly disclosed up front.\u003c/li>\u003cli>\u003cstrong>The round-trip problem, only mitigated.\u003c/strong> Once entities are customized, regenerating from changed JDL or upgrading versions turns into real merge conflicts. The model silently stops being the truth the first week someone edits a generated service.\u003c/li>\u003cli>\u003cstrong>No runtime metadata.\u003c/strong> An end user or admin can never add a field — every model change is a developer + regeneration + deployment cycle. This alone rules it out as Featherbase's core, whose whole premise is runtime DocTypes.\u003c/li>\u003cli>Option-matrix sprawl: N frontends × M backends × K options is a heavy test/maintenance burden the project itself carries.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>The deliverable standard (adopt hardest):\u003c/strong> an entity is not \"done\" when the table exists — it's done when its list/form work \u003cem>and its tests, seeds, and e2e checks exist\u003c/em>. For generated \u003cem>and adopted\u003c/em> DocTypes, emitting test skeletons + seed fixtures should be part of the engine's output. This matches the repo's harness culture already.\u003c/li>\u003cli>\u003cstrong>A JDL-like text DSL as an authoring input\u003c/strong> for DocTypes — alongside the UI and reflection, not instead of them. Compact, diffable, agent-friendly (Axis G); it compiles to the same DocType JSON (ADR 0003's canonical artifact).\u003c/li>\u003cli>\u003cstrong>Blueprints ≈ D11 at generation level:\u003c/strong> when Featherbase emits derived artifacts (D19), the emitters should themselves be contribution points, so a package can override how types/stubs/tests are generated.\u003c/li>\u003cli>\u003cstrong>The eject off-ramp (D19):\u003c/strong> JHipster's ownership model becomes Featherbase's escape hatch — a DocType can be ejected to owned code when a client outgrows metadata, one-way, eyes open.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> generation as the primary mode (kills runtime authoring, invites round-trip drift); the everything-up-front deliverable (Featherbase's generic Desk means most apps never need the generated-app surface at all).\u003c/p>"},{"group":"System studies","slug":"study-jira","title":"Study — Jira","path":"docs/research/studies/jira.md","mins":3,"html":"\u003ch1 id=\"jira-schemes-request-types-and-the-cost-of-two-config-paradi\">Jira — schemes, request types, and the cost of two config paradigms\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong>. Included because the helpdesk requirement (departments with their own ticket types under a company-wide admin) is Jira Service Management's home turf, and because Jira carries twenty years of scar tissue about \u003cem>sharing configuration across scopes\u003c/em> — exactly Axis A's hard problem.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>Atlassian's issue tracker: projects contain issues of configurable \u003cem>issue types\u003c/em>, governed by workflows, screens, fields, and permissions — all runtime configuration. Jira Service Management (JSM) adds customer-facing portals over the same engine.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Schemes: named, reusable configuration objects.\u003c/strong> A workflow scheme, screen scheme, field configuration scheme, permission scheme, or notification scheme is defined \u003cem>once\u003c/em> and \u003cstrong>bound to many projects\u003c/strong>. Change the scheme, and 200 projects change together. Configuration is normalized, not copied.\u003c/li>\u003cli>\u003cstrong>Custom fields are global.\u003c/strong> One \"Severity\" field exists instance-wide and is \u003cem>associated\u003c/em> with contexts/screens. Single definition, shared semantics — and a famous failure mode (below).\u003c/li>\u003cli>\u003cstrong>JSM request types: a persona view over an internal type.\u003c/strong> A portal \"Report a broken laptop\" request type maps onto an internal issue type, with its own portal form (subset of fields, friendlier names) and is owned by \u003cstrong>project admins\u003c/strong>, not instance admins. Customers see request types; agents see issue types. Two audiences, one record.\u003c/li>\u003cli>\u003cstrong>Two project paradigms.\u003c/strong> \u003cem>Company-managed\u003c/em> projects share global schemes (power, central control); \u003cem>team-managed\u003c/em> projects own their config in isolation (simplicity, delegation). This was Atlassian's answer to the delegated-admin demand — shipped as a \u003cstrong>second, incompatible configuration model\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>Issue-type hierarchy is shallow and fixed\u003c/strong> (epic → issue → subtask); everything else is fields and links — Jira resisted deep type inheritance and mostly got away with it.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>Enterprise-scale governance: one workflow change rolls out everywhere it's bound; auditors love schemes.\u003c/li>\u003cli>The UN-case workflow, natively: a customer files a vague request in a portal; triage moves it across request/issue types and projects; each desk's admin shapes their own types and SLAs within delegated bounds.\u003c/li>\u003cli>The portal/agent split (Axis G's external-human persona) with zero duplication of the underlying record.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Scheme indirection is notoriously confusing.\u003c/strong> Five scheme layers between \"I want a field on this screen\" and it appearing means admins routinely fail the \u003cem>\"why does this project behave like this?\"\u003c/em> test. Normalization traded readability for reuse and never bought it back with good tooling.\u003c/li>\u003cli>\u003cstrong>Global custom-field pollution.\u003c/strong> Because fields are instance-global and creation was historically easy, big instances accumulate thousands — with duplicate near-identical fields (\"Severity\", \"severity level\"), and real performance degradation. A global namespace without scoped ownership rots. (The exact disease D4's \u003cem>scoped\u003c/em> field-sets are designed to prevent.)\u003c/li>\u003cli>\u003cstrong>The two-paradigm split is the deepest lesson.\u003c/strong> Team-managed vs company-managed means two permission models, two field systems, and features that exist in one but not the other — a permanent fork in the product's brain, because delegation was bolted on as a separate mode instead of being a \u003cem>scope\u003c/em> in one model.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Schemes, generalized (Axis A):\u003c/strong> SLAs, workflows, permission bundles, and layouts should be \u003cem>named objects bound to scopes\u003c/em> (module/type), never per-scope copies. Featherbase's advantage: bind them through ordinary Link fields with an \"where used\" view, so the indirection Jira hides is a visible, queryable graph.\u003c/li>\u003cli>\u003cstrong>Request types → the portal face of D4:\u003c/strong> a Type registry entry should optionally carry a \u003cem>portal presentation\u003c/em> (subset of fields, public labels, intake form) distinct from the internal one — the generic \"I don't know where this belongs\" intake is just the global-scope request type.\u003c/li>\u003cli>\u003cstrong>Delegation as scope, not as mode:\u003c/strong> one configuration model where a module admin's power is a \u003cem>scoped slice\u003c/em> of the same objects the app admin manages (D3). Never ship a second, simplified config system — that's how you get Jira's fork forever.\u003c/li>\u003cli>\u003cstrong>Field governance from day one:\u003c/strong> scoped ownership (D4), usage visibility, and dedup suggestions at creation time (\"a global field 'Severity' already exists — reuse it?\").\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> five-layer scheme indirection without a \"why does this behave this way\" explainer; a global flat custom-field namespace; paradigm forks.\u003c/p>"},{"group":"System studies","slug":"study-nocobase","title":"Study — Nocobase","path":"docs/research/studies/nocobase.md","mins":2,"html":"\u003ch1 id=\"nocobase-microkernel-everything-is-a-plugin\">NocoBase — microkernel, everything is a plugin\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong>. The closest existing open-source system to the Featherbase target; the author has actively tried to use it and admires its plugin mechanism. Study it as the nearest competitor \u003cem>and\u003c/em> the richest source of validated decisions.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>An open-source, self-hosted no-code/low-code platform (TypeScript, Koa + React) for building business systems, whose defining trait is architectural: \u003cstrong>the core does nothing but plugin lifecycle scheduling, dependency management, and base infrastructure — every business capability is a plugin.\u003c/strong>\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Microkernel.\u003c/strong> \u003ccode>@nocobase/server\u003c/code> (Koa app, resource routing) and \u003ccode>@nocobase/client\u003c/code> (React shell, schema rendering) are the kernel; collections, workflow, auth methods, file storage, even the \u003cstrong>data source manager\u003c/strong> are plugins. WordPress-style install/enable/disable at runtime.\u003c/li>\u003cli>\u003cstrong>A plugin is server + client in one package.\u003c/strong> Data logic and UI interactions ship and version together; the plugin manager handles activation and dependencies.\u003c/li>\u003cli>\u003cstrong>Data sources are plugins too.\u003c/strong> The \"main\" database is itself a data-source plugin; external MySQL/Postgres/API sources are more of the same — the storage layer was born pluggable rather than retrofitted.\u003c/li>\u003cli>\u003cstrong>UI is schema-rendered.\u003c/strong> Pages and blocks are JSON UI schemas interpreted by the client; building a UI means composing schema, and a plugin contributes blocks/actions as schema components.\u003c/li>\u003cli>\u003cstrong>Separation of data model from UI.\u003c/strong> Unlike spreadsheet-flavored tools (Airtable-likes), collections are modeled independently and multiple blocks/views present them — the same DocType/Desk separation Featherbase inherits from Frappe.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>Third parties can build features with exactly the power of core features — the dogfooding guarantee, structurally enforced.\u003c/li>\u003cli>Deployments enable only what they need; the product scales down gracefully (a quality Frappe lacks — you get all of Frappe or nothing).\u003c/li>\u003cli>External databases as first-class citizens validate Featherbase's Axis B ambition commercially.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Young-ecosystem tax\u003c/strong>: plugin API churn between versions, thin docs for plugin authors, community plugins lagging releases. (The likely friction behind \"actively tried to use.\")\u003c/li>\u003cli>\u003cstrong>Schema-rendered UI is opaque to debug\u003c/strong> — when a block misbehaves, you're spelunking JSON schema and renderer internals, not reading component code. Powerful, but the escape hatch to \"just write a component\" matters and is where the seams show.\u003c/li>\u003cli>Commercial/open split on key plugins complicates adoption decisions.\u003c/li>\u003cli>The microkernel discipline has a cost: even trivial features carry plugin packaging ceremony.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>D10 verbatim\u003c/strong> — the microkernel/dogfooding rule is NocoBase's core proof: it works in this exact product category, in TypeScript, today.\u003c/li>\u003cli>\u003cstrong>Server+client-in-one-package plugins (D11)\u003c/strong> — contribution points spanning both halves, versioned together.\u003c/li>\u003cli>\u003cstrong>Data-source-as-plugin\u003c/strong> — direct validation of Axis B's driver model (D5/D7); their external-DB plugins are prior art worth reading before implementing spec 0001.\u003c/li>\u003cli>\u003cstrong>Declarative UI contributions (D14)\u003c/strong> — schema-rendered blocks as the default contribution form, with full-code components as the trusted-tier exception.\u003c/li>\u003cli>\u003cstrong>Their plug-and-play lifecycle UX\u003c/strong> (install → enable → configure in the running app) as the bar for Featherbase's app manager.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> schema-everything without a first-class plain-code escape hatch (Administrate's lesson applies); unversioned plugin API surface — Featherbase's answer is conformance suites per contribution type (D15) so the API contract is executable, not aspirational.\u003c/p>"},{"group":"System studies","slug":"study-nocodb","title":"Study — Nocodb","path":"docs/research/studies/nocodb.md","mins":3,"html":"\u003ch1 id=\"nocodb-a-spreadsheet-skin-over-databases-you-already-have\">NocoDB — a spreadsheet skin over databases you already have\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong>. Not to be confused with NocoBase (the microkernel platform — separate study): NocoDB is the open-source \u003cem>Airtable alternative\u003c/em>, and its one big idea overlaps directly with Featherbase's adoption story.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>An open-source no-code database UI: point it at an existing MySQL / Postgres / MariaDB / MSSQL / SQLite database (or let it manage its own) and every table becomes a smart spreadsheet with grid, gallery, kanban, calendar, and form \u003cstrong>views\u003c/strong>, rich field types (attachments, lookups, rollups, formulas), REST APIs, webhooks, and role-based sharing.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>\"Your data stays where it is.\"\u003c/strong> NocoDB is a \u003cem>UI layer over the database\u003c/em>, not a database: connect an external DB, it introspects, and the spreadsheet appears. The same bet as Directus (reflection, no schema imposition) aimed at a spreadsheet audience instead of a developer/API audience. Its own metadata (view definitions, virtual columns, sharing) lives in its store, beside your data.\u003c/li>\u003cli>\u003cstrong>Views as the product.\u003c/strong> One table, many audience-shaped views — a grid for ops, a kanban for triage, a public \u003cem>form view\u003c/em> for intake, a gallery for review — each with its own visible fields, filters, and share link. This is the most user-legible version of \"one entity, many presentations\" in the study series (Jira request types and Salesforce layouts are the enterprise cousins).\u003c/li>\u003cli>\u003cstrong>Virtual columns over real ones.\u003c/strong> Lookups, rollups, and formulas are computed metadata-layer fields layered onto physical tables — Airtable semantics without owning the storage. (The Glide-gap analysis in the Frappe study wants exactly this trio.)\u003c/li>\u003cli>\u003cstrong>Spreadsheet UX as the contract.\u003c/strong> The grid — inline editing, drag, sort, group — \u003cem>is\u003c/em> the interface; forms and APIs are secondary. That choice defines both its audience (business users first) and its ceiling (below).\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>The fastest \"existing database → something a business user can safely touch\" path in open source — shared links, form intake, and role-gated editing in minutes, CLIs and apps untouched.\u003c/li>\u003cli>Non-developers genuinely self-serve: filters, groupings, and views require no admin.\u003c/li>\u003cli>Form views give the Axis G \"external human\" persona for free at the table level.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>A database interface, not an application platform.\u003c/strong> No document lifecycle, no hook chain, no server-side validation model, no workflow — business rules live in the humans. The moment \"edit the cell\" needs to become \"run the process\", you've outgrown it.\u003c/li>\u003cli>Weak collaborative/concurrency story (refresh-and-hope on shared grids) — no optimistic locking surfaced to users.\u003c/li>\u003cli>Spreadsheet semantics on top of \u003cem>shared production\u003c/em> tables is a loaded gun: inline edits bypass whatever invariants the owning application maintains. (Featherbase's answer: every write through the server's permission + hook chain — invariant 2 — even on adopted tables.)\u003c/li>\u003cli>External-DB mode has historically wobbled between first-class and de-emphasized across versions; reflection depth (composite keys, exotic types) has edges.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Views as first-class, sharable, audience-shaped objects (Axis A/G + D11):\u003c/strong> the design doc has list \u003cem>layouts\u003c/em> as contribution points; NocoDB shows the user-facing unit should be the saved \u003cstrong>view\u003c/strong> — a named (fields + filters + sort + layout) object a module admin can share or expose as an intake form. Cheap to build on the generic ListView; large perceived value.\u003c/li>\u003cli>\u003cstrong>Form views as the portal intake primitive:\u003c/strong> a public form bound to a DocType with a field subset is the 80% case of Axis G's external-human surface — worth speccing ahead of a full portal.\u003c/li>\u003cli>\u003cstrong>Virtual columns (lookup/rollup/formula) as metadata-layer fields\u003c/strong> computed by the engine — the Glide-gap trio, validated by NocoDB (and Airtable) as what business users actually reach for first.\u003c/li>\u003cli>\u003cstrong>The grid-editing bar:\u003c/strong> inline, keyboard-friendly bulk editing on the ListView for permitted fields — with Featherbase's difference that every cell commit still runs the full lifecycle chain.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> UI-direct writes that bypass lifecycle invariants; the spreadsheet as the \u003cem>only\u003c/em> mental model (documents, workflow, and permissions-in-depth are the point); metadata-layer features that silently break when the underlying schema drifts (tie virtual columns into Axis C's drift detection instead).\u003c/p>"},{"group":"System studies","slug":"study-odoo","title":"Study — Odoo","path":"docs/research/studies/odoo.md","mins":3,"html":"\u003ch1 id=\"odoo-module-composition-over-shared-models-and-the-upgrade-t\">Odoo — module composition over shared models, and the upgrade toll\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong> (Python classes + XML data, loaded per-database). Included as the largest working example of \"many apps, ONE database, modules extending shared entities\" — the §2.4/§3.5 confirmation — and as the cautionary tale about upgrades.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>An open-core ERP suite (CRM, accounting, inventory, HR, e-commerce, …) built on one framework: Python model classes (ORM), XML-defined views and data, one Postgres database per company instance, and an addon/module system through which \u003cem>everything\u003c/em> — including Odoo's own apps — is delivered.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>One database, shared models, modules extend in place.\u003c/strong> A module doesn't create its own parallel world: \u003ccode>_inherit = 'res.partner'\u003c/code> adds fields and behavior to the \u003cem>same\u003c/em> partner model every other module uses. Sales, accounting, and HR all enrich one Customer. Composition over duplication, enforced by the framework.\u003c/li>\u003cli>\u003cstrong>Manifest + dependency graph.\u003c/strong> Each module declares \u003ccode>depends\u003c/code>; install pulls dependencies in; \u003ccode>auto_install\u003c/code> triggers glue modules when two others coexist (the \"bridge module\" pattern — connect A and B only when both are present).\u003c/li>\u003cli>\u003cstrong>Views are overridable XML data.\u003c/strong> UI is records (view definitions) that modules override via XPath inheritance — the same extend-don't-copy philosophy applied to screens.\u003c/li>\u003cli>\u003cstrong>Runtime customization via Studio / \u003ccode>ir.model.fields\u003c/code>:\u003c/strong> fields and views can be added from the UI, stored as \u003ccode>x_\u003c/code>-prefixed metadata rows — a second, data-level customization layer on top of module code.\u003c/li>\u003cli>\u003cstrong>OCA (Odoo Community Association):\u003c/strong> a federated GitHub organization maintaining thousands of community modules with shared review standards and per-version branches — the governance model that keeps an open module ecosystem coherent.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>The deepest functional suite in open source, assembled from ~40k modules, precisely because modules \u003cem>compose on shared entities\u003c/em> instead of shipping parallel tables — cross-app links, one partner, one chart of accounts.\u003c/li>\u003cli>Bridge modules give \"take only the parts you need\" at the integration level: install \u003ccode>sale\u003c/code> and \u003ccode>stock\u003c/code>, and \u003ccode>sale_stock\u003c/code> auto-installs the glue.\u003c/li>\u003cli>OCA proves community maintenance of business modules can work for decades.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Major-version upgrades are the ecosystem's chronic pain.\u003c/strong> Model and view changes between versions break modules; every module must be ported per version (OCA maintains one branch per Odoo version); database migrations need OpenUpgrade or paid Odoo upgrade services. The cause: extensions patch \u003cem>implementation surfaces\u003c/em> (model internals, view XPaths) rather than declared contracts — there are no manageability rules (D13) marking what's stable.\u003c/li>\u003cli>\u003cstrong>View-inheritance archaeology:\u003c/strong> five modules XPath-patching the same form produce breakage whose origin is genuinely hard to trace — override stacking without ownership metadata.\u003c/li>\u003cli>Open-core tension: enterprise-only features (including Studio) and license changes have repeatedly strained the community.\u003c/li>\u003cli>Python-in-process extensions mean a bad module can take the whole instance down; no isolation tiers.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Composition over parallel entities (already D4/§2.4):\u003c/strong> Odoo is the at-scale proof that \"modules add fields to shared models\" beats \"modules ship their own tables\" for ERP-shaped domains. Keep it as the default grain of app design.\u003c/li>\u003cli>\u003cstrong>Bridge/glue capabilities:\u003c/strong> D12's capability graph should support \u003ccode>auto_enable_when: [A, B]\u003c/code> — Odoo's \u003ccode>auto_install\u003c/code> is the proven pattern for optional integrations between independently chosen parts.\u003c/li>\u003cli>\u003cstrong>OCA as the community blueprint:\u003c/strong> per-version compatibility labeling, shared review standards, and org-level module stewardship — plan the Featherbase package registry's governance on it (D15).\u003c/li>\u003cli>\u003cstrong>The negative lesson powering D13:\u003c/strong> extensions must target \u003cem>declared contribution points with manageability rules\u003c/em>, never raw internals — that is the difference between Salesforce's painless upgrades and Odoo's version-porting industry. This study is the strongest argument in the series for keeping D13 strict.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> XPath-style override-anything extension (archaeology by design); unversioned extension surfaces; in-process-only trust (D14's tiers exist for a reason).\u003c/p>"},{"group":"System studies","slug":"study-react-admin","title":"Study — React Admin","path":"docs/research/studies/react-admin.md","mins":3,"html":"\u003ch1 id=\"react-admin-the-adapter-pattern-on-the-frontend-and-guessers\">react-admin — the adapter pattern on the frontend, and guessers\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>code-first frontend framework\u003c/strong> (neither pure interpreter nor generator — it occupies a third position worth understanding precisely). Marmelab's open-source framework for B2B/admin single-page apps; ~20 years of agency scar tissue distilled into one library.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>A React frontend framework for admin and B2B apps over \u003cem>any\u003c/em> API: you compose \u003ccode>&lt;List&gt;\u003c/code>, \u003ccode>&lt;Edit&gt;\u003c/code>, \u003ccode>&lt;Create&gt;\u003c/code>, \u003ccode>&lt;Show&gt;\u003c/code> components per resource, and all data access flows through a \u003cstrong>dataProvider\u003c/strong> — a standardized CRUD interface with 50+ community adapters (REST flavors, GraphQL, Supabase, Hasura, Firebase, local storage). The core (\u003ccode>ra-core\u003c/code>) is headless hooks; the Material-UI layer (and newer shadcn distribution) sits on top.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>The dataProvider: a frontend driver model.\u003c/strong> One interface (\u003ccode>getList\u003c/code>, \u003ccode>getOne\u003c/code>, \u003ccode>create\u003c/code>, \u003ccode>update\u003c/code>, \u003ccode>delete\u003c/code>, …) decouples the entire UI from the backend. Featherbase's Axis B adapter interface is the same idea placed server-side — react-admin proves the shape works and that a 50-adapter ecosystem can grow around a stable interface. The \u003cstrong>authProvider\u003c/strong> does the same for identity (Axis G's pluggable principal sources, on the client).\u003c/li>\u003cli>\u003cstrong>Code-first composition, not metadata.\u003c/strong> A resource's screens are JSX you write. No schema drives the UI — the developer is the interpreter. This is the opposite bet from Featherbase's generic Desk, chosen because react-admin's customer is a developer building a \u003cem>bespoke\u003c/em> admin, not an end user creating DocTypes.\u003c/li>\u003cli>\u003cstrong>Guessers: generation as a one-way suggestion.\u003c/strong> \u003ccode>&lt;ListGuesser&gt;\u003c/code> introspects actual API responses at runtime, renders a sensible UI, and \u003cstrong>prints the equivalent JSX to the console for you to paste and own\u003c/strong>. This is the most elegant resolution of the generation-vs-interpretation tension in the whole study series: interpretation for the first render, generation as \u003cem>copyable output\u003c/em>, zero round-trip problem because the tool never touches your files.\u003c/li>\u003cli>\u003cstrong>Headless core / replaceable skin.\u003c/strong> \u003ccode>ra-core\u003c/code> hooks carry all logic; the component layer is swappable (Material UI, shadcn). Logic and presentation are separate packages, so the design system can age without the framework aging.\u003c/li>\u003cli>\u003cstrong>Optimistic rendering with undo.\u003c/strong> Mutations apply instantly in the UI, are undoable for a few seconds, and only then hit the API — a deliberate UX stance on latency and mistakes.\u003c/li>\u003cli>\u003cstrong>Open-core:\u003c/strong> solid free core; enterprise modules (RBAC, realtime, audit log, tree views) fund the company — a sustainable OSS economics reference for Featherbase itself.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>One admin-building skill that survives every backend the agency meets — the adapter interface \u003cem>is\u003c/em> the product.\u003c/li>\u003cli>Instant start (guessers) with a no-cliff path to full custom code — \"simple where possible, refactorable always\", achieved from the code side rather than the metadata side.\u003c/li>\u003cli>A huge ecosystem (adapters, tutorials, hires) around a small stable contract.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>No runtime authoring at all\u003c/strong>: every screen is developer-written code; an admin can't add a field, ever. It's a framework for building admins, not a platform — the gap Featherbase exists to fill.\u003c/li>\u003cli>Per-resource JSX accumulates into exactly the repetitive surface metadata-driven systems eliminate; DRY discipline is on the team.\u003c/li>\u003cli>The Material-UI default reads \"generic admin\" out of the box; real products restyle (hence the shadcn distribution).\u003c/li>\u003cli>Enterprise-module boundary means some table-stakes features (RBAC, audit) are paid — fine as economics, friction as adoption.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Guessers, verbatim (D19's missing UX):\u003c/strong> the Desk's generic ListView/FormView \u003cem>is\u003c/em> the guesser; add the \"eject this view\" button that emits the equivalent explicit layout (or component code, tier-1) for the case where a screen needs to become bespoke. One-way, copy-out, no round-trip — react-admin proved users understand this contract instantly.\u003c/li>\u003cli>\u003cstrong>Headless separation for the Desk (Axis D):\u003c/strong> keep view logic in hooks/services separate from the \u003ccode>.fc-*\u003c/code>-styled components, so UI contributions (D11) can reuse logic without inheriting markup, and a future design-system swap doesn't touch behavior.\u003c/li>\u003cli>\u003cstrong>Optimistic-with-undo\u003c/strong> as the Desk's mutation UX for low-risk edits — it's the best-feeling answer to server-mediated writes (invariant 2) without lying about latency.\u003c/li>\u003cli>\u003cstrong>dataProvider ecosystem mechanics (D7/D15):\u003c/strong> a small, stable, documented adapter contract + a community listing is what turned 50 backends into a strength; the driver conformance suite is Featherbase's version of that contract made executable.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> code-as-the-only-authoring-mode (the generic Desk is the product); UI-side data drivers as the \u003cem>primary\u003c/em> integration (drivers belong server-side behind permissions — invariant 2 — with react-admin's pattern reserved for the client talking to \u003cem>our\u003c/em> API).\u003c/p>"},{"group":"System studies","slug":"study-salesforce","title":"Study — Salesforce","path":"docs/research/studies/salesforce.md","mins":3,"html":"\u003ch1 id=\"salesforce-the-governed-metadata-platform\">Salesforce — the governed metadata platform\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong> (the most successful one ever built). The author admires the design without having worked in it — this study is the \"what's actually inside\" briefing, and the measure of which parts survive translation to an open, self-hosted world.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>A multi-tenant platform where \u003cstrong>every customization is metadata\u003c/strong>: objects, fields, layouts, validation rules, flows, permissions, even most \"code\" artifacts are rows interpreted by one shared runtime that Salesforce upgrades three times a year — for every tenant simultaneously, without breaking them.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Metadata-driven multitenancy.\u003c/strong> One giant runtime; an \u003cem>org\u003c/em> (tenant) is a pile of metadata + data. Nothing a customer does forks the platform. This is the extreme end of the interpreter family, and the reason seasonal upgrades are even possible.\u003c/li>\u003cli>\u003cstrong>Declarative first, code governed.\u003c/strong> Admins build with objects, record types, page layouts, validation rules, and Flow; developers add Apex/LWC — but code runs under \u003cstrong>governor limits\u003c/strong> (SOQL query caps, CPU time, heap) because the runtime is shared. Code is a guest; metadata is the citizen.\u003c/li>\u003cli>\u003cstrong>The admin is a first-class builder persona.\u003c/strong> An entire profession (\"Salesforce admin\") exists because the platform treats declarative builders as its primary customer, with certification paths and tooling. Not an afterthought UI over a developer product.\u003c/li>\u003cli>\u003cstrong>Record types + page layouts + field-level security\u003c/strong> specialize one object per audience — the pattern the Featherbase design adopted for ticket types (D4).\u003c/li>\u003cli>\u003cstrong>Permission sets over profiles.\u003c/strong> The permission model migrated from monolithic \u003cem>profiles\u003c/em> (one per user) to composable, additive \u003cem>permission sets\u003c/em> — grant-shaped bundles stacked per user. Roles remained for record-level sharing hierarchy, separate from object/field rights.\u003c/li>\u003cli>\u003cstrong>Packaging with manageability rules (2GP).\u003c/strong> A managed package's components carry per-type rules for what subscribers may edit; upgrades are versioned, dependency-aware, and can be pushed. The AppExchange sits on top with security review.\u003c/li>\u003cli>\u003cstrong>Sandboxes + staged deployment.\u003c/strong> Change is authored in sandbox orgs and promoted (change sets historically; SFDX/source-tracked deploys now) — the change-lifecycle axis (F) as a product.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Upgrades that never break customers\u003c/strong> — the manageability contract is why a 25-year-old platform ships three releases a year onto every tenant. This is the single most enviable property in this study series.\u003c/li>\u003cli>The largest ISV economy in enterprise software (AppExchange), because packaging + review + upgrade-safety make third-party software \u003cem>operable\u003c/em> by non-engineers.\u003c/li>\u003cli>Non-developers building real systems, at scale, for decades.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Org sprawl is the platform's tech debt.\u003c/strong> Twenty years of admins × no forced cleanup = thousands of fields, flows, and rules nobody dares touch. Metadata debt is real debt; the platform's power to accrete is also its curse. (Featherbase's Axis E/F — history and promotion with plan-preview — are partial antidotes.)\u003c/li>\u003cli>\u003cstrong>Governor limits are opaque rage-generators\u003c/strong> — necessary for shared tenancy, but they surface as mysterious production failures. Self-hosted Featherbase doesn't need them; per-tier resource honesty (Axis D trust tiers) is the open-world equivalent.\u003c/li>\u003cli>Proprietary everything: language (Apex), UI framework (LWC), query (SOQL) — the learning curve and lock-in are the price of the governed runtime.\u003c/li>\u003cli>Declarative testing is weak (Flows are hard to test), the classic interpreter-family weakness; code has enforced coverage, metadata mostly doesn't.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Manageability rules (D13)\u003c/strong> — already adopted; this study is the evidence for \u003cem>why\u003c/em>: it is the load-bearing wall of the whole ISV/ upgrade story.\u003c/li>\u003cli>\u003cstrong>Permission sets (Axis A refinement):\u003c/strong> model grants as additive, composable sets attached to users/roles rather than ever-growing monolithic roles. Frappe's role model is closer to profiles; take the newer lesson.\u003c/li>\u003cli>\u003cstrong>The admin persona as a product requirement:\u003c/strong> module admins (Axis A) deserve first-class tooling, docs, and guardrails — not a scaled-down developer UI.\u003c/li>\u003cli>\u003cstrong>Sandbox/promotion (D17)\u003c/strong> — adopted; Salesforce is the proof it can be product-grade rather than a git workflow for engineers only.\u003c/li>\u003cli>\u003cstrong>Metadata debt countermeasures\u003c/strong> Salesforce lacks: usage analytics on fields/types (\"last used\"), deprecation states, and plan-preview diffs (D17) from day one.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> governor limits (wrong trade for self-hosted); proprietary language/UI layers (TypeScript + open standards are the point); profiles-style monolithic permissions.\u003c/p>"},{"group":"System studies","slug":"study-servicenow","title":"Study — Servicenow","path":"docs/research/studies/servicenow.md","mins":3,"html":"\u003ch1 id=\"servicenow-table-inheritance-scoped-apps-and-the-update-set-\">ServiceNow — table inheritance, scoped apps, and the update-set warning\u003c/h1>\n\u003cblockquote>\u003cp>Study, 2026-07-26. Family: \u003cstrong>runtime interpreter\u003c/strong>. Included for two reasons: it runs the generic→specific record pattern (Axis A / D4) at the largest enterprise scale in existence, and its change-promotion mechanism (update sets) is the definitive cautionary tale for Axis F.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"what-it-is\">What it is\u003c/h2>\n\u003cp>The dominant enterprise service-management platform (ITSM and far beyond): one platform database, everything — incidents, changes, users, \u003cem>and the platform's own configuration and code\u003c/em> — stored as records in tables, edited through the platform itself, with per-instance (not multi-tenant) deployment.\u003c/p>\n\u003ch2 id=\"key-dimensions\">Key dimensions\u003c/h2>\n\u003col>\u003cli>\u003cstrong>Table inheritance from a \u003ccode>task\u003c/code> base.\u003c/strong> \u003ccode>incident\u003c/code>, \u003ccode>change_request\u003c/code>, \u003ccode>problem\u003c/code>, and hundreds of others \u003cem>extend\u003c/em> the \u003ccode>task\u003c/code> table: shared columns (assignment, state, SLA hooks) live on the base; extensions add their own. Generic list/form machinery, assignment engines, and SLAs are written once against \u003ccode>task\u003c/code> and work for every descendant. This is the ancestor of the design doc's base-entity + subtype decision (D4) — proven at billions of rows.\u003c/li>\u003cli>\u003cstrong>Everything is a record.\u003c/strong> Business rules (server scripts), UI policies, workflows, even script includes are rows — so one audit trail, one history mechanism, and one access model cover data \u003cem>and\u003c/em> configuration alike (Axis E for free, structurally).\u003c/li>\u003cli>\u003cstrong>Scoped applications.\u003c/strong> Later-era ServiceNow apps get a namespace (\u003ccode>x_acme_*\u003c/code>), private tables, explicit cross-scope access grants, and delegated development rights — the platform's answer to \"module admin\" and app isolation after a decade of global-scope chaos.\u003c/li>\u003cli>\u003cstrong>Update sets: change capture as recorded diffs.\u003c/strong> Configuration changes in a dev instance are captured into an \"update set\" — a bag of changed records — exported and applied to test/prod instances.\u003c/li>\u003cli>\u003cstrong>Flow Designer / IntegrationHub:\u003c/strong> declarative automation with pluggable \"spokes\" (connector packs) — their sync-binding economy.\u003c/li>\u003c/ol>\n\u003ch2 id=\"what-it-enables\">What it enables\u003c/h2>\n\u003cul>\u003cli>One platform serving hundreds of enterprise use cases with uniform audit, SLA, assignment, and reporting — the payoff of the \u003ccode>task\u003c/code> base and everything-is-a-record.\u003c/li>\u003cli>Delegated app development inside giant orgs without global blast radius (scoped apps — arrived late, but it worked).\u003c/li>\u003cli>An enormous services economy — proof that \"platform + governed customization\" scales commercially beyond even Salesforce in the service domain.\u003c/li>\u003c/ul>\n\u003ch2 id=\"downsides\">Downsides\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Update sets are the wrong promotion unit, famously.\u003c/strong> They capture \u003cem>what happened to records\u003c/em>, not \u003cem>what the configuration should be\u003c/em>: partial captures (a change made outside capture is silently missing), order-dependence between sets, collisions on shared records, and no real diff/preview. Entire consultancies exist to clean up bad update-set promotions. The lesson for Axis F is precise: \u003cstrong>promote declared states with a plan (snapshot/diff/apply, D17 + Directus study), never recorded change-bags.\u003c/strong>\u003c/li>\u003cli>Global-scope legacy: pre-scoping customizations (still everywhere in old instances) patch shared artifacts with the same archaeology problems as Odoo's views.\u003c/li>\u003cli>Per-instance architecture means every customer runs their own upgrade project; upgrades routinely break customizations that touched out-of-contract surfaces (\"skipped records\" reviews are a ritual).\u003c/li>\u003cli>Proprietary, expensive, and JavaScript-in-a-box: the developer experience is the platform's, not the ecosystem's.\u003c/li>\u003c/ul>\n\u003ch2 id=\"what-featherbase-should-adopt\">What Featherbase should adopt\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>\u003ccode>task\u003c/code>-style base entities (D4), consciously:\u003c/strong> design the helpdesk (and any ERP domain) around a shared base with subtype field-sets, and write engines (SLA, assignment, routing) against the base — the ServiceNow proof is that this single choice is what makes \"100 ticket types\" cheap.\u003c/li>\u003cli>\u003cstrong>Everything-is-a-record symmetry (Axes E/G):\u003c/strong> Featherbase already stores DocTypes as data; extend the same audit/versioning machinery to \u003cem>metadata changes\u003c/em> so config history and data history are one system — ServiceNow shows how much operational value that symmetry yields.\u003c/li>\u003cli>\u003cstrong>Scoped-app namespacing (Axis A/D):\u003c/strong> package-owned artifacts carry their owner's identity, and cross-scope access is an explicit grant — arrive at this on day one rather than after the global-scope decade.\u003c/li>\u003cli>\u003cstrong>Spokes/connector packs as packaged sync bindings (D6 + D12):\u003c/strong> a \"SAP spoke\" = a package contributing a driver + crosswalk templates + prebuilt flows.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Do not adopt:\u003c/strong> update sets (D17 exists specifically to not be this); per-instance upgrade projects (D13's layer contract is the alternative); global mutable scope as the default.\u003c/p>"}],"axes":[{"k":"A","t":"Organization & delegation","d":"Apps, modules as admin boundaries, scoped types & field-sets."},{"k":"B","t":"Storage & system of record","d":"Driver × ownership mode × sync bindings; analytics egress."},{"k":"C","t":"Naming, reflection, augmentation","d":"No forced prefixes; adopt existing tables; opt-in audit columns."},{"k":"D","t":"Extensibility & distribution","d":"Contribution points, micro/macro packages, upgrade-safe layers."},{"k":"E","t":"Time","d":"Audit trail, version history, effectivity dating, as-of reads."},{"k":"F","t":"Change lifecycle","d":"Environments, promotion with plan preview, rollback."},{"k":"G","t":"Actors & identity","d":"Humans, portal users, machines, AI agents; on-behalf-of chains."}],"lifecycle":["A client calls save_doc over REST — never Postgres directly (API-001).","Auth resolves the session or token to a user and their roles.","Permissions gate the doctype, the permlevels, and if_owner scope (PERM rows).","Zod validation, generated from the DocType metadata, checks the payload field-wise (META-013).","The lifecycle chain runs: validate → before_save hooks in registered controllers (DOC-003).","One transaction writes parent + child tables, naming series, link checks (DOC-001, DOC-005).","after_save fans out: versions, audit, background jobs, webhooks, realtime push (DOC-009).","The generic Desk re-renders from the same metadata that defined all of the above (UI-002, UI-004)."],"milestones":["M1 · dbt seeds → DocTypes","M2 · CRUD manager retires","M3 · MotherDuck browser","M4 · storage seam refactor","M5 · generated egress configs"],"learnSlug":"learning-path"};</script>
<script>/* Featherbase Explorer — client. Data injected by build.mjs as window.__DATA__ */
(function () {
  const D = window.__DATA__;
  const $main = document.getElementById('app');
  const byId = {};
  D.features.forEach(f => { byId[f.id] = f; });
  const dependents = {};
  D.features.forEach(f => (f.deps || []).forEach(d => {
    (dependents[d] = dependents[d] || []).push(f.id);
  }));

  /* ---------- notes (questions) ---------- */
  const NKEY = 'fbx-notes-v1';
  const loadNotes = () => { try { return JSON.parse(localStorage.getItem(NKEY) || '[]'); } catch { return []; } };
  const saveNotes = (n) => localStorage.setItem(NKEY, JSON.stringify(n));
  function addNote(ctx, ctxTitle, text) {
    const notes = loadNotes();
    notes.unshift({ id: 'q' + Date.now().toString(36), ctx, ctxTitle, text, ts: new Date().toISOString() });
    saveNotes(notes);
    updateNavBadge();
  }
  function updateNavBadge() {
    const n = loadNotes().length;
    const el = document.getElementById('nav-q');
    if (el) el.textContent = n ? `Questions (${n})` : 'Questions';
  }

  /* ---------- tiny helpers ---------- */
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const linkIds = (s) => esc(s).replace(/\b([A-Z][A-Z0-9]{1,5}-\d{3})\b/g, (m, id) =>
    byId[id] ? `<a class="fid-link" href="#/f/${id}">${id}</a>` : m);
  const gh = (p) => `${D.repo}/blob/main/${p}`;
  const chip = (txt, cls) => `<span class="chip ${cls || ''}">${esc(txt)}</span>`;
  function toast(msg) {
    let t = document.querySelector('.toast');
    if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function ghIssueUrl(ctx, ctxTitle, text) {
    const where = ctx.startsWith('feature:') ? '#/f/' + ctx.slice(8)
      : ctx.startsWith('doc:') ? '#/d/' + ctx.slice(4) : '';
    const page = location.origin.startsWith('http') ? location.href.split('#')[0] + where : '';
    const title = 'Explorer question: ' + ctxTitle.slice(0, 70);
    const body = text + '\n\n---\nContext: **' + ctxTitle + '**' +
      (page ? '\nPage: ' + page : '') + '\n_Asked via Featherbase Explorer_';
    return D.repo + '/issues/new?labels=question&title=' + encodeURIComponent(title) +
      '&body=' + encodeURIComponent(body);
  }

  function qboxHTML(ctx, ctxTitle) {
    return `<div class="card qbox" data-ctx="${esc(ctx)}" data-ctxtitle="${esc(ctxTitle)}">
      <div class="eyebrow">Ask / note something here</div>
      <textarea placeholder="A question, a doubt, a thing to dig into later…"></textarea>
      <div class="row">
        <button class="btn primary" data-act="save-note">Save note</button>
        <button class="btn" data-act="save-note-gh">Save + raise on GitHub</button>
        <span class="qhint">Notes stay in this browser (export from the Questions tab).
        “Raise on GitHub” also opens a prefilled issue so the maintainer sees it right away
        — needs a GitHub account.</span>
      </div>
    </div>`;
  }

  /* ---------- pages ---------- */
  function pageHome() {
    const passing = D.features.filter(f => f.status === 'passing').length;
    return `
    <div class="hero">
      <h1>What the agent built, made explorable.</h1>
      <p>Featherbase is a metadata-driven app platform — Frappe's core ideas rebuilt on
      React + Hono + Postgres by a long-running agent harness. This site interlinks every
      harness feature with its tests, code, and the design documents, so you can audit it,
      learn it, and own it — from a phone.</p>
    </div>
    <div class="statrow">
