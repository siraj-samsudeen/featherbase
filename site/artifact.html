<title>Featherbase Explorer</title>
<style>/* Featherbase Explorer — inherits the Desk visual identity
   (tokens per PROGRESS.md: canvas #f4f5f6, brand #2490ef, ink #1c2126) */
:root {
  --canvas: #f4f5f6;
  --surface: #ffffff;
  --surface-2: #eef1f3;
  --ink: #1c2126;
  --muted: #5f6b76;
  --faint: #8a95a0;
  --hairline: #e3e8ec;
  --hairline-2: #d1d8dd;
  --brand: #2490ef;
  --brand-ink: #1272c4;
  --brand-soft: #e8f2fd;
  --good: #188a42;
  --good-soft: #e6f4ec;
  --warn: #b45309;
  --warn-soft: #fdf1e3;
  --code-bg: #f0f3f5;
  --shadow: 0 1px 2px rgba(25, 39, 52, 0.06), 0 2px 8px rgba(25, 39, 52, 0.05);
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --canvas: #14181d;
    --surface: #1c2228;
    --surface-2: #232a31;
    --ink: #e4e9ed;
    --muted: #97a3ae;
    --faint: #6d7883;
    --hairline: #2a323a;
    --hairline-2: #37414b;
    --brand: #4da3f5;
    --brand-ink: #7dbcf8;
    --brand-soft: #1b2c3d;
    --good: #43c073;
    --good-soft: #17301f;
    --warn: #e0a24a;
    --warn-soft: #33270f;
    --code-bg: #232a31;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="light"] {
  --canvas: #f4f5f6; --surface: #ffffff; --surface-2: #eef1f3;
  --ink: #1c2126; --muted: #5f6b76; --faint: #8a95a0;
  --hairline: #e3e8ec; --hairline-2: #d1d8dd;
  --brand: #2490ef; --brand-ink: #1272c4; --brand-soft: #e8f2fd;
  --good: #188a42; --good-soft: #e6f4ec;
  --warn: #b45309; --warn-soft: #fdf1e3;
  --code-bg: #f0f3f5;
  --shadow: 0 1px 2px rgba(25,39,52,0.06), 0 2px 8px rgba(25,39,52,0.05);
}
:root[data-theme="dark"] {
  --canvas: #14181d; --surface: #1c2228; --surface-2: #232a31;
  --ink: #e4e9ed; --muted: #97a3ae; --faint: #6d7883;
  --hairline: #2a323a; --hairline-2: #37414b;
  --brand: #4da3f5; --brand-ink: #7dbcf8; --brand-soft: #1b2c3d;
  --good: #43c073; --good-soft: #17301f;
  --warn: #e0a24a; --warn-soft: #33270f;
  --code-bg: #232a31;
  --shadow: 0 1px 2px rgba(0,0,0,0.35);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: Inter, "Inter Variable", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}
code, pre, .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; }

a { color: var(--brand-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 3px;
}

/* ---------- shell ---------- */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--hairline);
  box-shadow: var(--shadow);
}
.topbar-inner {
  max-width: 900px; margin: 0 auto; padding: 0 14px;
  display: flex; align-items: center; gap: 10px; height: 52px;
}
.wordmark {
  font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
  color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 7px;
}
.wordmark .feather { color: var(--brand); }
.nav {
  display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none;
  margin-left: auto;
}
.nav::-webkit-scrollbar { display: none; }
.nav a {
  padding: 6px 10px; border-radius: 6px; font-size: 13.5px; font-weight: 500;
  color: var(--muted); white-space: nowrap;
}
.nav a:hover { text-decoration: none; color: var(--ink); background: var(--surface-2); }
.nav a.active { color: var(--brand-ink); background: var(--brand-soft); }

main { max-width: 900px; margin: 0 auto; padding: 18px 14px 90px; }

/* ---------- shared bits ---------- */
.card {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 16px;
}
.stack > * + * { margin-top: 12px; }
.eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--faint); margin: 0 0 4px;
}
h1.page-title { font-size: 23px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 14px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 62ch; margin: 0 0 18px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; font-weight: 500; padding: 2px 9px;
  border-radius: 999px; border: 1px solid var(--hairline-2);
  color: var(--muted); background: var(--surface);
  white-space: nowrap;
}
.chip.brand { background: var(--brand-soft); color: var(--brand-ink); border-color: transparent; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
button.chip { cursor: pointer; }
button.chip:hover { border-color: var(--brand); color: var(--brand-ink); }
button.chip.on { background: var(--brand-soft); color: var(--brand-ink); border-color: var(--brand); }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.pass { background: var(--good); }
.dot.fail { background: var(--warn); }

.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid3 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (min-width: 640px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }

/* ---------- home ---------- */
.hero { padding: 26px 0 8px; }
.hero h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.025em; margin: 0 0 8px; text-wrap: balance; }
.hero p { color: var(--muted); max-width: 60ch; margin: 0; }
.statrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 20px; }
.stat {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 8px 13px; font-size: 13px; color: var(--muted); box-shadow: var(--shadow);
}
.stat b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; margin-right: 4px; }
.pathcard { display: block; color: inherit; transition: border-color 120ms ease; }
.pathcard:hover { text-decoration: none; border-color: var(--brand); }
.pathcard h3 { margin: 0 0 5px; font-size: 15.5px; letter-spacing: -0.01em; }
.pathcard p { margin: 0; font-size: 13.5px; color: var(--muted); }
.pathcard .go { color: var(--brand-ink); font-size: 13px; font-weight: 500; margin-top: 8px; display: inline-block; }

/* ---------- features ---------- */
.toolrow { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.search {
  width: 100%; padding: 9px 12px; font-size: 15px;
  border: 1px solid var(--hairline-2); border-radius: var(--radius);
  background: var(--surface); color: var(--ink);
}
.search::placeholder { color: var(--faint); }
.chiprow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.flist { display: flex; flex-direction: column; gap: 8px; }
.frow {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 11px 13px;
  color: inherit; box-shadow: var(--shadow);
}
.frow:hover { text-decoration: none; border-color: var(--brand); }
.frow .dot { margin-top: 7px; }
.frow .fid { font-size: 12px; color: var(--brand-ink); font-weight: 600; }
.frow .ft { font-size: 14px; line-height: 1.45; }
.frow .fc { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.count-note { font-size: 12.5px; color: var(--faint); margin: 8px 2px; }

/* feature detail */
.kv { display: flex; flex-direction: column; gap: 3px; }
.kv .k { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); }
.filelist { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
.filelist li { display: flex; align-items: baseline; gap: 8px; font-size: 13.5px; }
.filelist .mono { font-size: 12.5px; word-break: break-all; }
.filelist .n { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.deprow { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- docs ---------- */
.docgroup { margin-bottom: 22px; }
.docgroup h2 { font-size: 13px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint); margin: 0 0 8px; }
.doclist { display: flex; flex-direction: column; gap: 6px; }
.doclist a {
  background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius);
  padding: 10px 13px; color: inherit; font-size: 14px; box-shadow: var(--shadow);
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
}
.doclist a:hover { text-decoration: none; border-color: var(--brand); }
.doclist .sub { color: var(--faint); font-size: 12px; white-space: nowrap; }

/* rendered markdown */
.prose { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px; overflow-wrap: break-word; }
@media (min-width: 640px) { .prose { padding: 28px 32px; } }
.prose > :first-child { margin-top: 0; }
.prose h1 { font-size: 22px; letter-spacing: -0.02em; line-height: 1.3; text-wrap: balance; margin: 0 0 14px; }
.prose h2 { font-size: 18px; letter-spacing: -0.015em; margin: 28px 0 10px; padding-top: 14px; border-top: 1px solid var(--hairline); }
.prose h3 { font-size: 15.5px; margin: 22px 0 8px; }
.prose h4 { font-size: 14px; margin: 18px 0 6px; }
.prose p, .prose li { font-size: 14.5px; line-height: 1.65; }
.prose p { margin: 10px 0; }
.prose ul, .prose ol { padding-left: 22px; margin: 10px 0; }
.prose li { margin: 4px 0; }
.prose blockquote {
  margin: 14px 0; padding: 10px 14px; border-left: 3px solid var(--brand);
  background: var(--brand-soft); border-radius: 0 6px 6px 0; color: var(--muted);
}
.prose blockquote p { margin: 6px 0; font-size: 13.5px; }
.prose code {
  background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
  font-size: 12.8px; color: var(--ink);
}
.prose pre {
  background: var(--code-bg); border: 1px solid var(--hairline);
  border-radius: 6px; padding: 12px 14px; overflow-x: auto;
  font-size: 12.5px; line-height: 1.55; margin: 12px 0;
}
.prose pre code { background: none; padding: 0; }
.prose .tablewrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--hairline); border-radius: 6px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 13px; }
.prose th, .prose td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 600; white-space: nowrap; }
.prose tr:last-child td { border-bottom: none; }
.prose hr { border: none; border-top: 1px solid var(--hairline); margin: 22px 0; }
.prose a.fid-link { font-family: ui-monospace, Menlo, monospace; font-size: 0.92em; }

/* ---------- map ---------- */
.axiscard h3 { margin: 0 0 4px; font-size: 14.5px; }
.axiscard p { margin: 0; font-size: 13px; color: var(--muted); }
.axiscard .ax { color: var(--brand-ink); font-weight: 700; margin-right: 6px; }
.lifecycle { counter-reset: step; list-style: none; padding: 0; margin: 0; }
.lifecycle li { position: relative; padding: 0 0 0 34px; margin: 10px 0; font-size: 14px; }
.lifecycle li::before {
  counter-increment: step; content: counter(step);
  position: absolute; left: 0; top: 1px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand-ink);
  font-size: 11.5px; font-weight: 600; display: flex; align-items: center; justify-content: center;
}
.catcard { display: block; color: inherit; }
.catcard:hover { text-decoration: none; border-color: var(--brand); }
.catcard b { font-size: 13.5px; }
.catcard .n { color: var(--faint); font-size: 12px; float: right; font-variant-numeric: tabular-nums; }
.catcard p { margin: 4px 0 0; font-size: 12.5px; color: var(--muted); }

/* ---------- questions ---------- */
.qbox { margin-top: 16px; }
.qbox textarea {
  width: 100%; min-height: 70px; padding: 10px 12px; font-size: 14px;
  font-family: inherit; border: 1px solid var(--hairline-2); border-radius: var(--radius);
  background: var(--surface); color: var(--ink); resize: vertical;
}
.qbox .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--hairline-2); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 7px 14px; font-size: 13.5px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}
.btn:hover { border-color: var(--brand); color: var(--brand-ink); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); color: #fff; }
.qhint { font-size: 12px; color: var(--faint); }
.qitem { border-left: 3px solid var(--brand); }
.qitem .ctx { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.qitem .txt { white-space: pre-wrap; font-size: 14px; }
.qitem .row { display: flex; gap: 10px; margin-top: 8px; }
.qitem .del { color: var(--warn); font-size: 12.5px; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; }
.empty { color: var(--faint); text-align: center; padding: 30px 0; font-size: 14px; }

.backlink { font-size: 13px; display: inline-block; margin-bottom: 10px; }
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: var(--canvas); font-size: 13px;
  padding: 8px 16px; border-radius: 999px; box-shadow: var(--shadow);
  opacity: 0; transition: opacity 160ms ease; pointer-events: none; z-index: 50;
}
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

rd reset flow","category":"system","priority":2,"deps":["API-004","EML-002"],"verify":"Playwright: admin creates a user, user resets password via emailed link (sink), disabled user cannot log in.","status":"passing","tests":[{"file":"apps/web/e2e/user-management.spec.ts","n":4},{"file":"apps/server/test/password-reset.test.ts","n":2}],"src":[{"file":"apps/server/src/index.ts","n":1},{"file":"apps/server/src/password-reset.ts","n":1},{"file":"apps/web/src/pages/ResetPassword.tsx","n":1},{"file":"apps/web/src/router.tsx","n":1}]},{"id":"SET-003","title":"Role & permission manager UI: edit DocPerm matrix per DocType from the Desk","category":"system","priority":2,"deps":["PERM-003","UI-004"],"verify":"Playwright: revoke write for a role via the UI; that role's user immediately loses save ability.","status":"passing","tests":[{"file":"apps/server/test/permission-manager.test.ts","n":2},{"file":"apps/web/e2e/permission-manager.spec.ts","n":2}],"src":[{"file":"apps/server/src/index.ts","n":1},{"file":"apps/web/src/components/PermissionManager.tsx","n":1},{"file":"apps/web/src/lib/session.ts","n":1},{"file":"apps/web/src/router.tsx","n":1}]},{"id":"SET-004","title":"System Settings applied globally: date format, currency, precision, session expiry","category":"system","priority":3,"deps":["SET-001"],"verify":"Changing date format changes rendering across list/form; currency fields honor precision.","status":"passing","tests":[{"file":"apps/server/test/settings.test.ts","n":2},{"file":"apps/web/e2e/system-settings-global.spec.ts","n":2}],"src":[{"file":"apps/server/src/auth.ts","n":1},{"file":"apps/server/src/index.ts","n":1},{"file":"apps/server/src/settings.ts","n":1},{"file":"apps/web/src/components/FormView.tsx","n":1},{"file":"apps/web/src/components/ListView.tsx","n":1},{"file":"apps/web/src/lib/settings.ts","n":1}]},{"id":"PLAT-001","title":"App system: installable apps declaring DocTypes and hooks in a manifest","category":"platform","priority":3,"deps":["META-014","DOC-004"],"verify":"A sample app adds a DocType and a doc_event hook on install; uninstalling removes its DocTypes.","status":"passing","tests":[{"file":"apps/server/test/apps.test.ts","n":2}],"src":[{"file":"apps/server/src/apps.ts","n":2},{"file":"apps/server/src/index.ts","n":2},{"file":"apps/server/src/controllers.ts","n":1},{"file":"apps/server/src/sample-apps/hello-crm.ts","n":1}]},{"id":"PLAT-002","title":"doc_events hooks: apps subscribe to lifecycle events of any DocType without owning its controller","category":"platform","priority":3,"deps":["PLAT-001"],"verify":"An app hook on Task after_save fires alongside the core controller.","status":"passing","tests":[{"file":"apps/server/test/apps.test.ts","n":3}],"src":[{"file":"apps/server/src/apps.ts","n":1},{"file":"apps/server/src/methods.ts","n":1}]},{"id":"PLAT-003","title":"Migration runner: ordered, recorded patches (schema + data) executed once per database","category":"platform","priority":2,"deps":["META-014"],"verify":"Running migrate twice applies each patch exactly once; a failing patch aborts cleanly.","status":"passing","tests":[{"file":"apps/server/test/patches.test.ts","n":2}],"src":[{"file":"apps/server/src/migrate.ts","n":1},{"file":"apps/server/src/patches.ts","n":1},{"file":"apps/server/src/run-patches.ts","n":1}]},{"id":"PLAT-004","title":"CLI: create-doctype, migrate, seed, create-user, console (REPL with the document API)","category":"platform","priority":2,"deps":["PLAT-003"],"verify":"Each command works against the dev database from a fresh checkout.","status":"passing","tests":[{"file":"apps/server/test/app-grants.test.ts","n":2},{"file":"apps/server/test/cli.test.ts","n":2}],"src":[{"file":"apps/server/src/apps.ts","n":2},{"file":"apps/server/src/cli.ts","n":1}]},{"id":"PLAT-005","title":"Webhooks: DocType configuring HTTP callbacks on document events with signing and retry","category":"platform","priority":3,"deps":["DOC-003","JOB-002"],"verify":"on_update webhook posts the doc JSON to a test receiver with a valid signature; failures retry.","status":"passing","tests":[{"file":"apps/server/test/declarative-apps.test.ts","n":2},{"file":"apps/server/test/webhooks.test.ts","n":2}],"src":[{"file":"apps/server/src/document.ts","n":3},{"file":"apps/server/src/apps.ts","n":1},{"file":"apps/server/src/webhooks.ts","n":1}]},{"id":"PLAT-006","title":"Social login (Google OAuth) via Supabase Auth mapped to the User DocType","category":"platform","priority":3,"deps":["API-004"],"verify":"OAuth sign-in (mocked provider in dev) creates/links a User and lands in the Desk.","status":"passing","tests":[{"file":"apps/web/e2e/oauth.spec.ts","n":3}],"src":[{"file":"apps/server/src/auth.ts","n":1},{"file":"apps/server/src/index.ts","n":1},{"file":"apps/server/src/oauth.ts","n":1},{"file":"apps/web/src/lib/api.ts","n":1},{"file":"apps/web/src/pages/Login.tsx","n":1},{"file":"apps/web/src/pages/OAuthCallback.tsx","n":1},{"file":"apps/web/src/router.tsx","n":1}]},{"id":"PLAT-007","title":"Audit logs: Activity Log for logins and Access Log for exports/prints","category":"platform","priority":3,"deps":["RPT-003"],"verify":"Login and CSV export each produce a log row with user and timestamp.","status":"passing","tests":[{"file":"apps/web/e2e/audit-log.spec.ts","n":3},{"file":"apps/server/test/audit.test.ts","n":2}],"src":[{"file":"apps/server/src/index.ts","n":2},{"file":"apps/server/src/audit.ts","n":1},{"file":"apps/server/src/auth.ts","n":1},{"file":"apps/web/src/components/ReportView.tsx","n":1}]},{"id":"PLAT-008","title":"Multi-tenancy: schema-per-site with a site resolver (host header) and per-site migrate","category":"platform","priority":3,"deps":["PLAT-003","PLAT-004"],"verify":"Two sites on one Postgres hold independent DocTypes and users; requests never leak across sites.","status":"passing","tests":[{"file":"apps/server/test/tenancy.test.ts","n":2}],"src":[{"file":"apps/server/src/index.ts","n":1},{"file":"apps/server/src/tenancy.ts","n":1}]}],"cats":{"metadata":{"title":"Metadata engine","short":"DocTypes as data; tables, validation and meta generated from JSON.","files":["apps/server/src/doctype-engine.ts","apps/server/src/meta.ts"],"how":"A DocType is rows in tab_doctype/tab_docfield. Saving one runs createTableDDL in doctype-engine.ts — a real Postgres table with the standard columns — and Zod validators are derived from the same metadata, so schema, validation and UI all share one source. meta.ts caches the processed definition and invalidates on change."},"document-engine":{"title":"Document engine","short":"The save/submit/delete lifecycle: hooks, child tables, one transaction.","files":["apps/server/src/document.ts","apps/server/src/query.ts","apps/server/src/controllers.ts"],"how":"Every mutation goes through document.ts: validate → before_save → DB write → after_save inside one transaction, including child-table reconciliation, naming series, link integrity and conflict detection. Controllers registered per DocType hook into that chain; query.ts builds filtered list queries."},"rest-api":{"title":"REST API","short":"Frappe-wire-compatible resource + RPC endpoints, auth, tokens.","files":["apps/server/src/index.ts","apps/server/src/methods.ts","apps/server/src/auth.ts"],"how":"index.ts mounts /api/resource/:doctype CRUD and /api/method/* RPC in Frappe’s wire shapes (sid cookie + Bearer token, exc_type error bodies, frappe.client.* namespace) so existing Frappe clients work unchanged. methods.ts holds the RPC registry apps can extend or override."},"permissions":{"title":"Permissions","short":"Role DocPerms, permlevels, if_owner, user permissions — plus Postgres RLS.","files":["apps/server/src/permissions.ts","apps/server/migrations/0010_rls.sql"],"how":"permissions.ts evaluates DocPerm rows (role × right × permlevel), if_owner scoping and user-permission link filters on every read and write; list queries get the same restrictions compiled into WHERE clauses. Underneath, migration 0010 adds real Postgres RLS for the desk_client role as defense in depth."},"desk-ui":{"title":"Desk UI","short":"One generic ListView and FormView render every DocType from metadata.","files":["apps/web/src/pages/DeskLayout.tsx","apps/web/src/components","apps/web/src/pages/DocTypeBuilder.tsx"],"how":"The Desk is deliberately generic: a single ListView and FormView read the DocType metadata and render any model — fields, link typeaheads, child grids, section layout — with zero per-model frontend code. DeskLayout provides the shell (sidebar grouped by module, awesomebar); DocTypeBuilder edits DocTypes themselves."},"reports":{"title":"Reports","short":"Query reports (safe SQL), script reports, charts.","files":["apps/server/src/query-report.ts","apps/server/src/script-report.ts","apps/server/src/report-chart.ts"],"how":"Query reports run a single read-only SELECT with named {filter} placeholders bound as parameters inside a READ ONLY transaction — power without letting reports mutate. Script reports run registered server functions; report-chart.ts feeds the chart widgets."},"printing":{"title":"Printing","short":"Server-side PDF via headless Chromium; print formats.","files":["apps/server/src/print.ts","apps/web/src/pages/PrintView.tsx"],"how":"print.ts renders a document’s print view in headless Chromium (resolved from the environment, never hardcoded) and streams a PDF; PrintView.tsx is the same HTML a browser prints."},"workflow":{"title":"Workflow","short":"State machines on a status field: states, transitions, role gates.","files":["apps/server/src/workflow.ts"],"how":"A Workflow doc defines states and role-gated transitions over a state field on the target DocType; workflow.ts validates every save against legal transitions and applies transition side effects. The HD Ticket helpdesk flow is the shipped example."},"customization":{"title":"Customization","short":"Custom fields, property setters, sandboxed server scripts.","files":["apps/server/src/custom-fields.ts","apps/server/src/customizations.ts","apps/server/src/server-scripts.ts"],"how":"Site-level changes layer on top of shipped metadata instead of editing it: custom-fields.ts adds real columns at runtime, customizations.ts stores property overrides, and server-scripts.ts runs site-authored logic in a sandbox — the seed of the upgrade-safe overlay the design doc formalizes as D13."},"background-jobs":{"title":"Background jobs","short":"A Postgres-backed queue: enqueue, drain, retries, scheduled jobs.","files":["apps/server/src/jobs.ts","apps/server/src/jobs"],"how":"tab_background_job is the queue; jobs.ts enqueues (transactionally with the triggering save) and drainJobs executes with retries. Scheduled/recurring jobs live in jobs/ — assignment, SLA escalation, email pulls ride this."},"realtime":{"title":"Realtime","short":"WebSocket push: doc updates, list refreshes, progress.","files":["apps/server/src/realtime.ts"],"how":"realtime.ts runs the ws server; saves publish doc/list events the Desk subscribes to, so open lists and forms refresh without polling."},"email":{"title":"Email","short":"Accounts, queue, notifications, inbound rules, auto email reports.","files":["apps/server/src/email.ts","apps/server/src/email-rules.ts","apps/server/src/auto-email-report.ts"],"how":"Outbound mail goes through a queue table (rendered at delivery time); email-rules.ts turns inbound mail into documents (the helpdesk’s ticket-from-email), and auto-email-report.ts mails report results on schedule."},"files":{"title":"Files","short":"Disk-backed uploads, attachments, thumbnails.","files":["apps/server/src/storage.ts","apps/server/src/thumbnails.ts"],"how":"storage.ts stores uploads on disk with File docs carrying metadata and permissions; thumbnails.ts renders previews via the same Chromium used for printing."},"website":{"title":"Website & portal","short":"Public web forms and the logged-in portal over the same engine.","files":["apps/server/src/webform.ts","apps/server/src/website.ts","apps/web/src/pages/WebForm.tsx","apps/web/src/pages/Portal.tsx"],"how":"Web Forms expose a DocType subset publicly (the generic intake surface); the Portal gives external users a narrow, permission-gated view of their own documents — both reuse the document engine and permission stack unchanged."},"i18n":{"title":"i18n","short":"Translation table + language switching.","files":["apps/server/src/i18n.ts"],"how":"tab_translation maps (language, source_text) → translated text; the Desk loads the active language’s bundle and falls back to source strings."},"system":{"title":"System","short":"Settings, audit trail, global search.","files":["apps/server/src/settings.ts","apps/server/src/audit.ts","apps/server/src/search.ts"],"how":"System/singles settings via the single_value store, an audit/activity trail on document events, and global search across DocTypes power the awesomebar."},"platform":{"title":"Platform","short":"Installable apps, hooks, patches, CLI, schema-per-site tenancy.","files":["apps/server/src/apps.ts","apps/server/src/patches.ts","apps/server/src/cli.ts","apps/server/src/tenancy.ts"],"how":"apps.ts is the installable-app registry: a manifest declares DocTypes, roles, permissions, doc_events and scheduler jobs; install runs them through the normal engine and records ownership for clean uninstall. patches.ts runs one-off migrations, cli.ts is the bench-equivalent, tenancy.ts demonstrates schema-per-site isolation."}},"docs":[{"group":"Start here","slug":"architecture","title":"Architecture — one save traced end to end","path":"docs/ARCHITECTURE.md","mins":10,"html":"\u003ch1 id=\"architecture\">Architecture\u003c/h1>\n\u003cp>Featherbase is a metadata-driven app platform: you define a model (a \u003cstrong>DocType\u003c/strong>) as JSON, and the platform generates the database table, the API, the validation schema, and the UI from that one definition. Nothing is hand-written per model — one save path, one list view, one form view serve every DocType.\u003c/p>\n\u003cp>This document walks one request end to end, then explains the metadata engine and the generic Desk UI, and closes with a map of the source tree.\u003c/p>\n\u003ch2 id=\"the-life-of-a-save-doc-request\">The life of a \u003ccode>save_doc\u003c/code> request\u003c/h2>\n\u003cp>Everything below is traceable in two files: the route in \u003ccode>apps/server/src/index.ts\u003c/code> and the lifecycle in \u003ccode>apps/server/src/document.ts\u003c/code>.\u003c/p>\n\u003ch3 id=\"1-route-and-middleware\">1. Route and middleware\u003c/h3>\n\u003cp>The server is a single Hono app built in \u003ccode>apps/server/src/index.ts\u003c/code>. Before any handler runs, three middlewares apply to \u003ccode>/api/*\u003c/code>:\u003c/p>\n\u003cul>\u003cli>\u003ccode>secureHeaders()\u003c/code> and a CORS policy restricted to the Desk origins (\u003ccode>config.allowedOrigins\u003c/code>, default \u003ccode>http://localhost:5173\u003c/code>).\u003c/li>\u003cli>The auth middleware (\u003ccode>app.use('/api/*', ...)\u003c/code> — registered after the public routes) resolves the caller and stores it as \u003ccode>c.var.user\u003c/code>. Credentials come from \u003ccode>authCredential()\u003c/code>: the \u003ccode>Authorization\u003c/code> header wins; an HttpOnly \u003ccode>sid\u003c/code> cookie is the fallback. That cookie is set by both \u003ccode>POST /api/login\u003c/code> and the Frappe-shaped \u003ccode>POST /api/method/login\u003c/code>, so Frappe-style clients work unchanged.\u003c/li>\u003cli>\u003ccode>rateLimit\u003c/code> (\u003ccode>apps/server/src/rate-limit.ts\u003c/code>), keyed by the resolved user.\u003c/li>\u003c/ul>\n\u003cp>Token resolution lives in \u003ccode>apps/server/src/auth.ts\u003c/code> (\u003ccode>resolveToken\u003c/code>): a \u003ccode>Bearer &lt;jwt&gt;\u003c/code> is verified against \u003ccode>JWT_SECRET\u003c/code> and looked up in \u003ccode>tab_user\u003c/code>; an \u003ccode>Authorization: token key:secret\u003c/code> pair authenticates an integration via its API key.\u003c/p>\n\u003cp>The route itself:\u003c/p>\n\u003cpre>\u003ccode>// apps/server/src/index.ts\napp.post('/api/save_doc', async (c) =&gt; {\n  const body = await c.req.json()          // { doctype, doc }\n  const saved = await saveDoc(body.doctype, body.doc, who(c))\n  publishDocEvent(body.doctype, String(saved.name), hadName ? 'updated' : 'created')\n  return c.json(saved, 201)\n})\u003c/code>\u003c/pre>\n\u003cp>The handler is deliberately thin: parse, call \u003ccode>saveDoc\u003c/code>, publish a realtime event (\u003ccode>apps/server/src/realtime.ts\u003c/code>), return the saved document as JSON with status 201.\u003c/p>\n\u003ch3 id=\"2-savedoc-before-the-transaction\">2. \u003ccode>saveDoc\u003c/code> — before the transaction\u003c/h3>\n\u003cp>\u003ccode>saveDoc\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code> starts by loading the DocType's metadata via \u003ccode>getMeta\u003c/code> (\u003ccode>apps/server/src/meta.ts\u003c/code>, a per-process cache over \u003ccode>tab_doctype\u003c/code> + \u003ccode>tab_docfield\u003c/code>). Then it routes special cases:\u003c/p>\n\u003cul>\u003cli>\u003ccode>DocType\u003c/code> / \u003ccode>DocField\u003c/code> documents are refused — schema changes must go through \u003ccode>/api/doctype\u003c/code> so DDL runs (the \u003ccode>ENGINE_MANAGED\u003c/code> set).\u003c/li>\u003cli>A Single DocType (\u003ccode>issingle\u003c/code>) goes to \u003ccode>saveSingle\u003c/code>, which persists values into the \u003ccode>single_value\u003c/code> EAV table instead of a generated table.\u003c/li>\u003cli>A child DocType (\u003ccode>istable\u003c/code>) is refused — child rows are only saved through their parent.\u003c/li>\u003cli>If \u003ccode>doc.name\u003c/code> is set and the row exists, this is an \u003cstrong>update\u003c/strong> and control passes to \u003ccode>updateDoc\u003c/code> (see below). Otherwise it is an \u003cstrong>insert\u003c/strong>.\u003c/li>\u003c/ul>\n\u003cp>For an insert, before any SQL write:\u003c/p>\n\u003cul>\u003cli>\u003ccode>assertPermission(user, doctype, 'create')\u003c/code> and User Permission checks (\u003ccode>apps/server/src/permissions.ts\u003c/code>).\u003c/li>\u003cli>\u003ccode>pickFieldValues\u003c/code> filters the payload to declared fields — unknown keys are a \u003ccode>ValidationError\u003c/code> (typos fail loudly), \u003ccode>read_only\u003c/code> fields are ignored (they are system-managed).\u003c/li>\u003cli>\u003ccode>stripUnwritableFields\u003c/code> drops fields above the caller's writable permlevels.\u003c/li>\u003cli>\u003ccode>applyDefaults\u003c/code> fills declared \u003ccode>default_value\u003c/code>s.\u003c/li>\u003cli>\u003ccode>validateValues\u003c/code> parses the result against a Zod schema \u003cstrong>generated from the metadata\u003c/strong> (\u003ccode>metaToZod\u003c/code> in \u003ccode>packages/shared\u003c/code>) — required fields, types, select options.\u003c/li>\u003cli>\u003ccode>applySla\u003c/code> (\u003ccode>apps/server/src/sla.ts\u003c/code>) stamps response/resolution deadlines if an active SLA covers this DocType.\u003c/li>\u003cli>If a Workflow governs the DocType, the workflow state field is forced to the initial state — a caller cannot smuggle in a later state (\u003ccode>apps/server/src/workflow.ts\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch3 id=\"3-inside-the-transaction\">3. Inside the transaction\u003c/h3>\n\u003cp>The write happens in a single \u003ccode>sql.begin(...)\u003c/code> transaction:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Naming\u003c/strong> — \u003ccode>resolveName\u003c/code> applies the DocType's \u003ccode>autoname\u003c/code> rule: \u003ccode>hash\u003c/code> (random), \u003ccode>prompt\u003c/code> (client supplies the name), \u003ccode>field:&lt;fieldname&gt;\u003c/code>, or a naming series like \u003ccode>TASK-.####\u003c/code>. Series counters use \u003ccode>INSERT ... ON CONFLICT DO UPDATE\u003c/code> on the \u003ccode>series\u003c/code> table \u003cem>inside\u003c/em> the transaction, so concurrent savers serialize on the counter row and a rolled-back save rolls the increment back too.\u003c/li>\u003cli>\u003cstrong>Pre-write hooks\u003c/strong> — \u003ccode>runHooks\u003c/code> (\u003ccode>apps/server/src/controllers.ts\u003c/code>) runs \u003ccode>before_insert → before_validate → validate → before_save\u003c/code>, interleaved with sandboxed Server Scripts for \u003ccode>validate\u003c/code> and \u003ccode>before_save\u003c/code> (\u003ccode>runDocEventScripts\u003c/code> in \u003ccode>apps/server/src/server-scripts.ts\u003c/code>). Hooks may mutate \u003ccode>ctx.doc\u003c/code>; any throw aborts the whole transaction.\u003c/li>\u003cli>\u003cstrong>Link validation\u003c/strong> — \u003ccode>validateLinks\u003c/code> checks every Link field references an existing row of its target DocType.\u003c/li>\u003cli>\u003cstrong>The INSERT\u003c/strong> into the generated \u003ccode>tab_*\u003c/code> table.\u003c/li>\u003cli>\u003cstrong>Child tables\u003c/strong> — \u003ccode>saveChildren\u003c/code> writes each \u003ccode>Table\u003c/code> field's rows into the child DocType's table (with \u003ccode>parent\u003c/code>, \u003ccode>parenttype\u003c/code>, \u003ccode>parentfield\u003c/code> linkage), in the same transaction. On update, rows omitted from the payload are deleted — the payload is authoritative.\u003c/li>\u003cli>\u003cstrong>Post-write hooks\u003c/strong> — \u003ccode>after_insert → after_save → on_update\u003c/code>, plus \u003ccode>after_save\u003c/code> Server Scripts.\u003c/li>\u003c/ol>\n\u003cp>The update path (\u003ccode>updateDoc\u003c/code>) differs in a few ways: it takes the row with \u003ccode>SELECT ... FOR UPDATE\u003c/code>, enforces \u003cstrong>optimistic concurrency\u003c/strong> (the client must echo the \u003ccode>modified\u003c/code> timestamp it loaded; a mismatch is a 409 \u003ccode>ConflictError\u003c/code>), refuses writes to submitted/cancelled documents (\u003ccode>docstatus\u003c/code> 1/2), blocks direct edits to a workflow-controlled state field, and records a field-level diff into \u003ccode>tab_version\u003c/code> (\u003ccode>recordVersion\u003c/code>) when the DocType has \u003ccode>track_changes\u003c/code>.\u003c/p>\n\u003ch3 id=\"4-after-commit-subsystem-fan-out\">4. After commit — subsystem fan-out\u003c/h3>\n\u003cp>Only after the transaction commits does the save fan out to side effects (all in \u003ccode>document.ts\u003c/code>, right after the \u003ccode>sql.begin\u003c/code> block):\u003c/p>\n\u003cul>\u003cli>\u003ccode>evaluateEmailRules\u003c/code> (\u003ccode>apps/server/src/email-rules.ts\u003c/code>) — Notification-style rules on \u003ccode>on_create\u003c/code> / \u003ccode>on_save\u003c/code>.\u003c/li>\u003cli>\u003ccode>evaluateAssignmentRules\u003c/code> (\u003ccode>apps/server/src/assignment-rules.ts\u003c/code>) — auto-assignment, which creates ToDos.\u003c/li>\u003cli>\u003ccode>evaluateWebhooks\u003c/code> (\u003ccode>apps/server/src/webhooks.ts\u003c/code>) — outbound HTTP calls.\u003c/li>\u003cli>Back in the route handler, \u003ccode>publishDocEvent\u003c/code> pushes a realtime event over the WebSocket server (\u003ccode>apps/server/src/realtime.ts\u003c/code>).\u003c/li>\u003c/ul>\n\u003cp>Submit and cancel (\u003ccode>submitDoc\u003c/code> / \u003ccode>cancelDoc\u003c/code> → \u003ccode>setDocstatus\u003c/code>) run their own hook order — \u003ccode>before_submit\u003c/code>/\u003ccode>before_cancel\u003c/code> before the write, then \u003ccode>on_update\u003c/code> and \u003ccode>on_submit\u003c/code>/\u003ccode>on_cancel\u003c/code> — matching Frappe.\u003c/p>\n\u003ch3 id=\"5-the-response\">5. The response\u003c/h3>\n\u003cp>The saved row is re-read with child tables attached (\u003ccode>loadChildren\u003c/code>) and passed through \u003ccode>stripInternalColumns\u003c/code>, which drops anything that is not a standard column or a declared DocField, and always drops credential columns (\u003ccode>password_hash\u003c/code>, \u003ccode>api_secret_hash\u003c/code>, ...). The client gets plain JSON of the document.\u003c/p>\n\u003cp>Errors follow one envelope everywhere (\u003ccode>apps/server/src/errors.ts\u003c/code>): an \u003ccode>AppError\u003c/code> maps to a status code (Frappe's convention of \u003cstrong>417\u003c/strong> for business validation), a body with \u003ccode>error: { type, message, fields? }\u003c/code>, and a top-level \u003ccode>exc_type\u003c/code> carrying the Frappe exception-class name (\u003ccode>DoesNotExistError\u003c/code> for 404s) — deliberate wire parity so Frappe clients can parse failures.\u003c/p>\n\u003ch2 id=\"the-hook-chain\">The hook chain\u003c/h2>\n\u003cp>\u003ccode>apps/server/src/controllers.ts\u003c/code> keeps a registry of per-DocType controllers. Each file in \u003ccode>apps/server/src/controllers/\u003c/code> default-exports a \u003ccode>DocTypeController\u003c/code> (\u003ccode>{ doctype, hooks }\u003c/code>) and is auto-loaded at boot. The events, in Frappe's order:\u003c/p>\n\u003cpre>\u003ccode>insert: before_insert -&gt; before_validate -&gt; validate -&gt; before_save\n        -&gt; INSERT -&gt; after_insert -&gt; after_save -&gt; on_update\nupdate: before_validate -&gt; validate -&gt; before_save\n        -&gt; UPDATE -&gt; after_save -&gt; on_update\u003c/code>\u003c/pre>\n\u003cp>plus \u003ccode>before_submit\u003c/code>/\u003ccode>on_submit\u003c/code>, \u003ccode>before_cancel\u003c/code>/\u003ccode>on_cancel\u003c/code>, and \u003ccode>on_trash\u003c/code>. A controller registered under the wildcard DocType \u003ccode>'*'\u003c/code> runs for every DocType (Frappe's \u003ccode>doc_events[\"*\"]\u003c/code>), after the specific ones. Hooks receive a \u003ccode>HookContext\u003c/code> with the doc, the old row (on update), the metadata, the acting user, and the open transaction handle.\u003c/p>\n\u003ch2 id=\"the-metadata-engine\">The metadata engine\u003c/h2>\n\u003cp>\u003ccode>apps/server/src/doctype-engine.ts\u003c/code> turns a DocType JSON definition into a real Postgres table.\u003c/p>\n\u003cp>A definition is validated by \u003ccode>doctypeDefSchema\u003c/code> (Zod): a name, flags (\u003ccode>issingle\u003c/code>, \u003ccode>istable\u003c/code>, \u003ccode>is_submittable\u003c/code>), an \u003ccode>autoname\u003c/code> rule, and a list of fields, each with \u003ccode>fieldname\u003c/code> (snake_case), \u003ccode>fieldtype\u003c/code>, \u003ccode>options\u003c/code>, and flags like \u003ccode>reqd\u003c/code>, \u003ccode>unique\u003c/code>, \u003ccode>in_list_view\u003c/code>, \u003ccode>permlevel\u003c/code>.\u003c/p>\n\u003cp>\u003ccode>createDocType\u003c/code>:\u003c/p>\n\u003col>\u003cli>Inserts one row into \u003ccode>tab_doctype\u003c/code> and one per field into \u003ccode>tab_docfield\u003c/code> — the metadata \u003cem>is\u003c/em> data.\u003c/li>\u003cli>Generates \u003ccode>CREATE TABLE \"tab_&lt;name&gt;\"\u003c/code> from the fields. Every table gets the standard columns (\u003ccode>name\u003c/code> PK, \u003ccode>owner\u003c/code>, \u003ccode>creation\u003c/code>, \u003ccode>modified\u003c/code>, \u003ccode>modified_by\u003c/code>, \u003ccode>docstatus\u003c/code>, \u003ccode>idx\u003c/code>); child tables additionally get \u003ccode>parent\u003c/code>/\u003ccode>parenttype\u003c/code>/\u003ccode>parentfield\u003c/code>. Field types map to column types in the \u003ccode>COLUMN_TYPES\u003c/code> table (\u003ccode>Data\u003c/code> → \u003ccode>varchar(140)\u003c/code>, \u003ccode>Currency\u003c/code> → \u003ccode>numeric(21,9)\u003c/code>, \u003ccode>JSON\u003c/code> → \u003ccode>jsonb\u003c/code>, ...). Layout fields (\u003ccode>Section Break\u003c/code>, \u003ccode>Column Break\u003c/code>) and \u003ccode>Table\u003c/code> fields produce no column.\u003c/li>\u003cli>Enables row-level security and generates a SELECT-only policy for the \u003ccode>desk_client\u003c/code> role (\u003ccode>applyRls\u003c/code>) — the local stand-in for a direct PostgREST-style client. The app server connects as the table owner and remains the only write path (see \u003ccode>apps/server/migrations/0010_rls.sql\u003c/code>).\u003c/li>\u003c/ol>\n\u003cp>\u003ccode>updateDocType\u003c/code> syncs an edited definition: new fields add columns (\u003ccode>ALTER TABLE ... ADD COLUMN\u003c/code>), property edits update \u003ccode>tab_docfield\u003c/code> rows, removed fields delete the docfield but \u003cstrong>keep\u003c/strong> the column unless \u003ccode>drop_columns\u003c/code> is passed, and fieldtype changes are rejected outright.\u003c/p>\n\u003cp>Singles get no table at all — their values live in the \u003ccode>single_value\u003c/code> EAV table, one row per field.\u003c/p>\n\u003ch2 id=\"the-generic-desk-ui\">The generic Desk UI\u003c/h2>\n\u003cp>The web app never knows about specific DocTypes. Two facts make that work:\u003c/p>\n\u003cp>\u003cstrong>Metadata comes from the server.\u003c/strong> \u003ccode>useMeta\u003c/code> in \u003ccode>apps/web/src/lib/meta.ts\u003c/code> fetches \u003ccode>GET /api/meta/:doctype\u003c/code> (registered in \u003ccode>apps/server/src/index.ts\u003c/code>) and caches it via TanStack Query. Everything the UI renders — labels, field types, list columns, required flags — derives from that response. \u003ccode>listColumns\u003c/code> picks the list view's columns: \u003ccode>name\u003c/code> first, then fields flagged \u003ccode>in_list_view\u003c/code> (or the first two data fields when none are flagged), matching Frappe.\u003c/p>\n\u003cp>\u003cstrong>Routes are generic.\u003c/strong> \u003ccode>apps/web/src/router.tsx\u003c/code> defines:\u003c/p>\n\u003cul>\u003cli>\u003ccode>/desk/$doctype\u003c/code> → \u003ccode>ListView\u003c/code> (\u003ccode>apps/web/src/components/ListView.tsx\u003c/code>), with filters kept in the URL. A Single DocType renders its one \u003ccode>FormView\u003c/code> directly.\u003c/li>\u003cli>\u003ccode>/desk/$doctype/$name\u003c/code> → \u003ccode>FormView\u003c/code> (\u003ccode>apps/web/src/components/FormView.tsx\u003c/code>). The literal name \u003ccode>new\u003c/code> means a blank unsaved document (\u003ccode>const isNew = name === 'new'\u003c/code>).\u003c/li>\u003cli>\u003ccode>/desk/new-doctype\u003c/code> → the DocType Builder (\u003ccode>apps/web/src/pages/DocTypeBuilder.tsx\u003c/code>), which POSTs to \u003ccode>/api/doctype\u003c/code>.\u003c/li>\u003cli>Additional generic views: \u003ccode>$doctype/view/report|kanban|calendar|gantt\u003c/code>, \u003ccode>query-report/$name\u003c/code>, \u003ccode>script-report/$name\u003c/code>, \u003ccode>workspace/$name\u003c/code>, \u003ccode>dashboard/$name\u003c/code>, \u003ccode>permissions/$doctype\u003c/code>, \u003ccode>jobs\u003c/code>.\u003c/li>\u003c/ul>\n\u003cp>\u003ccode>FormView\u003c/code> loads the document with \u003ccode>GET /api/resource/:doctype/:name\u003c/code>, renders an input per field from the metadata, and saves with \u003ccode>POST /api/save_doc\u003c/code> — the exact endpoint traced above, echoing back \u003ccode>modified\u003c/code> for the concurrency check. \u003ccode>DeskLayout\u003c/code> (\u003ccode>apps/web/src/pages/DeskLayout.tsx\u003c/code>) builds the sidebar by listing the \u003ccode>DocType\u003c/code> DocType itself (\u003ccode>/api/resource/DocType\u003c/code> with \u003ccode>istable = false\u003c/code>), and hosts the awesomebar (\u003ccode>GET /api/search\u003c/code>, Ctrl/Cmd+K).\u003c/p>\n\u003cp>Adding a DocType therefore requires zero frontend code: define it, and \u003ccode>/desk/YourDocType\u003c/code> works.\u003c/p>\n\u003ch2 id=\"frappe-wire-compatibility\">Frappe wire compatibility\u003c/h2>\n\u003cp>Deliberate, load-bearing parity (do not \"clean up\"):\u003c/p>\n\u003cul>\u003cli>\u003ccode>POST /api/method/login\u003c/code> returns Frappe's \u003ccode>{ message, home_page, full_name }\u003c/code> shape and sets the \u003ccode>sid\u003c/code> cookie (\u003ccode>apps/server/src/index.ts\u003c/code>).\u003c/li>\u003cli>Error bodies carry \u003ccode>exc_type\u003c/code> (\u003ccode>apps/server/src/errors.ts\u003c/code>).\u003c/li>\u003cli>\u003ccode>GET|POST /api/method/:path\u003c/code> dispatches whitelisted RPC methods (\u003ccode>apps/server/src/methods.ts\u003c/code>), including the \u003ccode>frappe.client.*\u003c/code> namespace (\u003ccode>apps/server/src/methods/frappe-client.ts\u003c/code>) that frappe-js-sdk calls.\u003c/li>\u003cli>\u003ccode>/api/resource/:doctype[/:name]\u003c/code> is the Frappe-style REST resource: one generic handler set for CRUD on every DocType.\u003c/li>\u003c/ul>\n\u003ch2 id=\"project-map\">Project map\u003c/h2>\n\u003ch3 id=\"apps-server-src\">\u003ccode>apps/server/src/\u003c/code>\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>index.ts\u003c/code>\u003c/td>\u003ctd>The Hono app: every route, middleware order, server boot, worker/scheduler startup\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>config.ts\u003c/code>\u003c/td>\u003ctd>Port, \u003ccode>DATABASE_URL\u003c/code> default, allowed CORS origins\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>db.ts\u003c/code>\u003c/td>\u003ctd>The \u003ccode>postgres\u003c/code> client (no ORM) and the test-sandbox delegate hook\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>meta.ts\u003c/code>\u003c/td>\u003ctd>DocType metadata loader + per-process cache (\u003ccode>getMeta\u003c/code>, \u003ccode>invalidateMeta\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>doctype-engine.ts\u003c/code>\u003c/td>\u003ctd>DocType JSON → DDL: create/update tables, standard columns, RLS policies\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>document.ts\u003c/code>\u003c/td>\u003ctd>The document lifecycle: save/update/submit/cancel/amend/delete/rename, naming, child tables, versioning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>controllers.ts\u003c/code> + \u003ccode>controllers/\u003c/code>\u003c/td>\u003ctd>Hook registry and per-DocType controllers (auto-loaded at boot)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>query.ts\u003c/code>\u003c/td>\u003ctd>Permission-scoped list queries (\u003ccode>getList\u003c/code>, \u003ccode>countDocs\u003c/code>, \u003ccode>groupCount\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>permissions.ts\u003c/code>\u003c/td>\u003ctd>DocPerm checks, permlevels, if_owner, User Permissions, shares\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>auth.ts\u003c/code>\u003c/td>\u003ctd>Login, JWT sessions, scrypt password hashing, API keys\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>oauth.ts\u003c/code>\u003c/td>\u003ctd>Google OAuth flow with a dev mock provider\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>password-reset.ts\u003c/code>\u003c/td>\u003ctd>Reset request + token redemption\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>rate-limit.ts\u003c/code>\u003c/td>\u003ctd>Per-user request throttling\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>errors.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>AppError\u003c/code>, status mapping, the \u003ccode>exc_type\u003c/code> error envelope\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>methods.ts\u003c/code> + \u003ccode>methods/\u003c/code>\u003c/td>\u003ctd>\u003ccode>/api/method\u003c/code> RPC whitelist, incl. \u003ccode>frappe-client.ts\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>workflow.ts\u003c/code>\u003c/td>\u003ctd>Workflow states/transitions, role-gated actions\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>server-scripts.ts\u003c/code>\u003c/td>\u003ctd>Sandboxed (node:vm) Server Scripts + workflow condition evaluation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>custom-fields.ts\u003c/code>\u003c/td>\u003ctd>Apply Custom Field records (column + docfield)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>customizations.ts\u003c/code>\u003c/td>\u003ctd>Export/import Custom Fields + Property Setters as JSON\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>email.ts\u003c/code>, \u003ccode>email-rules.ts\u003c/code>\u003c/td>\u003ctd>Email queue/delivery and notification rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>assign.ts\u003c/code>, \u003ccode>assignment-rules.ts\u003c/code>\u003c/td>\u003ctd>Assignments (ToDo + notify) and auto-assignment rules\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>sla.ts\u003c/code>\u003c/td>\u003ctd>SLA deadline stamping and escalation support\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>webhooks.ts\u003c/code>\u003c/td>\u003ctd>Outbound webhooks on lifecycle events\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>jobs.ts\u003c/code> + \u003ccode>jobs/\u003c/code>\u003c/td>\u003ctd>Background job queue (\u003ccode>tab_background_job\u003c/code>), worker, handlers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>realtime.ts\u003c/code>\u003c/td>\u003ctd>WebSocket server, doc/user event publishing\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>search.ts\u003c/code>\u003c/td>\u003ctd>Awesomebar global search\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>print.ts\u003c/code>\u003c/td>\u003ctd>Server-side PDF rendering via Playwright\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>query-report.ts\u003c/code>, \u003ccode>script-report.ts\u003c/code>, \u003ccode>reports/\u003c/code>\u003c/td>\u003ctd>Query Reports (SQL) and Script Reports (code)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>report-chart.ts\u003c/code>\u003c/td>\u003ctd>Chart series from saved reports, dashboard pinning\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>storage.ts\u003c/code>, \u003ccode>thumbnails.ts\u003c/code>\u003c/td>\u003ctd>Disk-backed file storage, signed URLs, image thumbnails\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>webform.ts\u003c/code>, \u003ccode>website.ts\u003c/code>\u003c/td>\u003ctd>Public web forms and server-rendered web pages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>settings.ts\u003c/code>\u003c/td>\u003ctd>System Settings (a Single DocType)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>i18n.ts\u003c/code>\u003c/td>\u003ctd>Translation catalogs\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>audit.ts\u003c/code>\u003c/td>\u003ctd>Access/activity logging\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>apps.ts\u003c/code>, \u003ccode>sample-apps/\u003c/code>\u003c/td>\u003ctd>Installable app registry (e.g. \u003ccode>hello-crm\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>tenancy.ts\u003c/code>\u003c/td>\u003ctd>Multi-site provisioning, schema-per-site isolation\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>migrate.ts\u003c/code>, \u003ccode>patches.ts\u003c/code>, \u003ccode>run-patches.ts\u003c/code>\u003c/td>\u003ctd>Migration and patch runners\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>cli.ts\u003c/code>\u003c/td>\u003ctd>Command-line entry (\u003ccode>pnpm --filter server cli\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>smoke.ts\u003c/code>\u003c/td>\u003ctd>The server smoke test (\u003ccode>pnpm --filter server test:smoke\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>auto-email-report.ts\u003c/code>\u003c/td>\u003ctd>Scheduled report emails\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3 id=\"apps-web-src\">\u003ccode>apps/web/src/\u003c/code>\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Path\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>main.tsx\u003c/code>\u003c/td>\u003ctd>App entry, providers\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>router.tsx\u003c/code>\u003c/td>\u003ctd>Every route; the generic \u003ccode>$doctype\u003c/code> / \u003ccode>$doctype/$name\u003c/code> mapping\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>index.css\u003c/code>\u003c/td>\u003ctd>Design tokens and the \u003ccode>.fc-*\u003c/code> component classes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lib/api.ts\u003c/code>\u003c/td>\u003ctd>Fetch wrapper, token storage, \u003ccode>ApiError\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lib/meta.ts\u003c/code>\u003c/td>\u003ctd>\u003ccode>useMeta\u003c/code> hook, field-type constants, \u003ccode>listColumns\u003c/code>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lib/realtime.ts\u003c/code>\u003c/td>\u003ctd>WebSocket client hook\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lib/client-scripts.ts\u003c/code>\u003c/td>\u003ctd>Loads and runs Client Scripts against forms\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>lib/session.ts\u003c/code>, \u003ccode>lib/settings.ts\u003c/code>, \u003ccode>lib/theme.ts\u003c/code>, \u003ccode>lib/i18n.ts\u003c/code>\u003c/td>\u003ctd>Session, display settings, theme, translations\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/ListView.tsx\u003c/code>\u003c/td>\u003ctd>The one list view for every DocType\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/FormView.tsx\u003c/code>\u003c/td>\u003ctd>The one form view for every DocType (incl. child-table grids)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/ReportView.tsx\u003c/code>, \u003ccode>QueryReportView.tsx\u003c/code>, \u003ccode>ScriptReportView.tsx\u003c/code>\u003c/td>\u003ctd>Report surfaces\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/KanbanView.tsx\u003c/code>, \u003ccode>CalendarView.tsx\u003c/code>, \u003ccode>GanttView.tsx\u003c/code>\u003c/td>\u003ctd>Alternate list renderings\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/WorkflowActions.tsx\u003c/code>\u003c/td>\u003ctd>Workflow action buttons on a form\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/PermissionManager.tsx\u003c/code>\u003c/td>\u003ctd>The DocPerm role/permission matrix editor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/DashboardView.tsx\u003c/code>, \u003ccode>WorkspaceView.tsx\u003c/code>, \u003ccode>JobMonitor.tsx\u003c/code>\u003c/td>\u003ctd>Dashboards, workspaces, background-job monitor\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>components/Comments.tsx\u003c/code>, \u003ccode>ActivityTimeline.tsx\u003c/code>, \u003ccode>Assignments.tsx\u003c/code>, \u003ccode>Attachments.tsx\u003c/code>, \u003ccode>Tags.tsx\u003c/code>\u003c/td>\u003ctd>Form sidebar features\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages/DeskLayout.tsx\u003c/code>\u003c/td>\u003ctd>The Desk shell: sidebar, awesomebar, keyboard shortcuts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages/DocTypeBuilder.tsx\u003c/code>\u003c/td>\u003ctd>Build a DocType from the Desk (\u003ccode>/desk/new-doctype\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages/Login.tsx\u003c/code>, \u003ccode>ResetPassword.tsx\u003c/code>, \u003ccode>OAuthCallback.tsx\u003c/code>\u003c/td>\u003ctd>Auth pages\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>pages/Portal.tsx\u003c/code>, \u003ccode>WebForm.tsx\u003c/code>, \u003ccode>PrintView.tsx\u003c/code>\u003c/td>\u003ctd>Customer portal, public forms, print view\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003ccode>packages/shared\u003c/code> holds the types and contracts both sides import — notably \u003ccode>metaToZod\u003c/code>, the metadata-to-validation-schema generator used by the save path.\u003c/p>"},{"group":"Start here","slug":"tutorial","title":"Tutorial — your first DocType","path":"docs/TUTORIAL.md","mins":6,"html":"\u003ch1 id=\"your-first-doctype-build-a-todo-list\">Your first DocType: build a todo list\u003c/h1>\n\u003cblockquote>\u003cp>\u003cstrong>Note:\u003c/strong> every HTTP step below (DocType creation, generated table, naming series, optimistic-lock update, Server Script validation, and the stretch test) has been verified against a live instance. If a step doesn't match what you see, trust the running app and please file an issue.\u003c/p>\u003c/blockquote>\n\u003cp>In this exercise you build a small task tracker from scratch — model, API, and UI — without writing a line of application code. That's the point of the platform: define a DocType, and storage, validation, API, and UI are all generated from it.\u003c/p>\n\u003cp>A \u003ccode>ToDo\u003c/code> DocType already ships with the platform (it backs assignments — see \u003ccode>apps/server/migrations/0022_todo.ts\u003c/code>). We'll build our own called \u003cstrong>Task\u003c/strong> so nothing collides, and use the built-in ToDo as the reference solution to compare against at the end.\u003c/p>\n\u003ch2 id=\"0-prerequisites\">0. Prerequisites\u003c/h2>\n\u003cp>A running stack: \u003ccode>./init.sh\u003c/code> from the repo root boots Postgres, migrations, the API on :8000, and the web app on :5173 (see CONTRIBUTING.md). Log in at http://localhost:5173 as \u003ccode>Administrator\u003c/code> / \u003ccode>admin\u003c/code> (the default from \u003ccode>apps/server/migrations/0006_admin_password.ts\u003c/code>; override with \u003ccode>ADMIN_PASSWORD\u003c/code>).\u003c/p>\n\u003ch2 id=\"1-meet-the-doctype-builder\">1. Meet the DocType Builder\u003c/h2>\n\u003cp>The Desk has a DocType builder at \u003cstrong>\u003ccode>/desk/new-doctype\u003c/code>\u003c/strong> — reachable from the \u003cstrong>“+ New DocType”\u003c/strong> link in the sidebar (\u003ccode>apps/web/src/pages/DeskLayout.tsx\u003c/code>) or via the command palette (Ctrl/Cmd+K). The page (\u003ccode>apps/web/src/pages/DocTypeBuilder.tsx\u003c/code>) is a name input plus a field grid with columns \u003cstrong>Fieldname · Label · Type · Options · Reqd · List\u003c/strong>, an \u003cstrong>+ Add field\u003c/strong> row, and a \u003cstrong>Create DocType\u003c/strong> button. Options for a Select can be typed comma- or newline-separated; the builder normalizes them to the newline-separated form the engine expects before POSTing to \u003ccode>POST /api/doctype\u003c/code>.\u003c/p>\n\u003cp>Try it with a throwaway DocType — name it \u003ccode>Note\u003c/code>, give it a \u003ccode>title\u003c/code> (Data, Reqd, List) and a \u003ccode>content\u003c/code> (Text) field, and click \u003cstrong>Create DocType\u003c/strong>. You land on \u003ccode>/desk/Note\u003c/code>, a fully working list view. That's the whole loop.\u003c/p>\n\u003cp>One caveat before we build the real thing: the builder currently exposes only a subset of the definition — notably not \u003ccode>autoname\u003c/code> (naming rules) or \u003ccode>default_value\u003c/code> — and a DocType cannot be deleted once created (\u003ccode>deleteDoc\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code> refuses engine-managed documents). Since the rest of this tutorial leans on a naming series and a status default, we'll create \u003ccode>Task\u003c/code> over HTTP.\u003c/p>\n\u003ch2 id=\"2-define-task-over-http\">2. Define \u003ccode>Task\u003c/code> over HTTP\u003c/h2>\n\u003cp>The builder is just a client of the public API. The raw calls (routes registered in \u003ccode>apps/server/src/index.ts\u003c/code>):\u003c/p>\n\u003cpre>\u003ccode># Log in; the response body carries { token, user }.\nTOKEN=$(curl -s http://localhost:8000/api/login \\\n  -H 'content-type: application/json' \\\n  -d '{\"usr\":\"Administrator\",\"pwd\":\"admin\"}' | jq -r .token)\n\n# Create the DocType (System Manager only). autoname gives us a naming\n# series: TASK-0001, TASK-0002, ... (four # = four digits).\ncurl -s http://localhost:8000/api/doctype \\\n  -H \"Authorization: Bearer $TOKEN\" -H 'content-type: application/json' \\\n  -d '{\n    \"name\": \"Task\",\n    \"autoname\": \"TASK-.####\",\n    \"fields\": [\n      { \"fieldname\": \"title\",    \"fieldtype\": \"Data\",   \"reqd\": true, \"in_list_view\": true },\n      { \"fieldname\": \"status\",   \"fieldtype\": \"Select\", \"options\": \"Open\\nDone\", \"default_value\": \"Open\", \"in_list_view\": true },\n      { \"fieldname\": \"due_date\", \"fieldtype\": \"Date\",   \"in_list_view\": true },\n      { \"fieldname\": \"priority\", \"fieldtype\": \"Select\", \"options\": \"Low\\nMedium\\nHigh\", \"default_value\": \"Medium\" }\n    ]\n  }'\u003c/code>\u003c/pre>\n\u003cp>The field shape (\u003ccode>fieldname\u003c/code>, \u003ccode>fieldtype\u003c/code>, \u003ccode>options\u003c/code>, \u003ccode>reqd\u003c/code>, \u003ccode>unique\u003c/code>, \u003ccode>default_value\u003c/code>, \u003ccode>in_list_view\u003c/code>, \u003ccode>permlevel\u003c/code>, ...) is validated by \u003ccode>doctypeDefSchema\u003c/code> in \u003ccode>apps/server/src/doctype-engine.ts\u003c/code>. Compare with the canonical definitions in the metadata migrations — \u003ccode>apps/server/migrations/0022_todo.ts\u003c/code> (ToDo) and \u003ccode>apps/server/migrations/0036_workspace.ts\u003c/code> (Workspace) use exactly this shape via \u003ccode>createDocType\u003c/code>.\u003c/p>\n\u003ch2 id=\"3-watch-the-table-appear\">3. Watch the table appear\u003c/h2>\n\u003cp>\u003ccode>createDocType\u003c/code> generated a real Postgres table. Look at it:\u003c/p>\n\u003cpre>\u003ccode>psql \"postgres://postgres:postgres@127.0.0.1:5432/featherbase\" -c '\\d tab_task'\u003c/code>\u003c/pre>\n\u003cp>You'll see your four columns plus the standard columns every generated table gets — \u003ccode>name\u003c/code> (primary key), \u003ccode>owner\u003c/code>, \u003ccode>creation\u003c/code>, \u003ccode>modified\u003c/code>, \u003ccode>modified_by\u003c/code>, \u003ccode>docstatus\u003c/code>, \u003ccode>idx\u003c/code> (\u003ccode>STANDARD_COLUMNS\u003c/code> and \u003ccode>createTableDDL\u003c/code> in \u003ccode>apps/server/src/doctype-engine.ts\u003c/code>). The metadata itself landed as rows in \u003ccode>tab_doctype\u003c/code> and \u003ccode>tab_docfield\u003c/code>. The table also has row-level security enabled with a generated read policy for the \u003ccode>desk_client\u003c/code> role.\u003c/p>\n\u003ch2 id=\"4-use-the-generated-ui\">4. Use the generated UI\u003c/h2>\n\u003cp>Open \u003cstrong>http://localhost:5173/desk/Task\u003c/strong>. The generic \u003ccode>ListView\u003c/code> (\u003ccode>apps/web/src/components/ListView.tsx\u003c/code>) renders your list-flagged columns — no Task-specific frontend code exists anywhere.\u003c/p>\n\u003cp>Create a task: a new document lives at \u003cstrong>\u003ccode>/desk/Task/new\u003c/code>\u003c/strong> (the literal name \u003ccode>new\u003c/code> renders an empty \u003ccode>FormView\u003c/code> — \u003ccode>apps/web/src/components/FormView.tsx\u003c/code>). Fill in a title and save; the form POSTs to \u003ccode>/api/save_doc\u003c/code> and the naming series assigns \u003ccode>TASK-0001\u003c/code>.\u003c/p>\n\u003cp>Create a few more. Then try the HTTP equivalent:\u003c/p>\n\u003cpre>\u003ccode>curl -s http://localhost:8000/api/save_doc \\\n  -H \"Authorization: Bearer $TOKEN\" -H 'content-type: application/json' \\\n  -d '{\"doctype\":\"Task\",\"doc\":{\"title\":\"Read ARCHITECTURE.md\",\"due_date\":\"2026-08-01\"}}'\u003c/code>\u003c/pre>\n\u003cp>The response is the saved document, with \u003ccode>name\u003c/code>, \u003ccode>status: \"Open\"\u003c/code> (your default), and audit columns filled in.\u003c/p>\n\u003cp>To \u003cstrong>complete\u003c/strong> a task over HTTP you must echo the \u003ccode>modified\u003c/code> timestamp you loaded — updates are optimistically locked (\u003ccode>updateDoc\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code> rejects a stale \u003ccode>modified\u003c/code> with a 409):\u003c/p>\n\u003cpre>\u003ccode>DOC=$(curl -s http://localhost:8000/api/resource/Task/TASK-0001 \\\n  -H \"Authorization: Bearer $TOKEN\")\nMOD=$(echo \"$DOC\" | jq -r .modified)\n\ncurl -s http://localhost:8000/api/save_doc \\\n  -H \"Authorization: Bearer $TOKEN\" -H 'content-type: application/json' \\\n  -d \"{\\\"doctype\\\":\\\"Task\\\",\\\"doc\\\":{\\\"name\\\":\\\"TASK-0001\\\",\\\"modified\\\":\\\"$MOD\\\",\\\"status\\\":\\\"Done\\\"}}\"\u003c/code>\u003c/pre>\n\u003cp>In the Desk the form does this for you. Filter the list to open tasks: the list's filters live in the URL (\u003ccode>/desk/Task?filters=...\u003c/code>), so a filtered view is shareable.\u003c/p>\n\u003ch2 id=\"5-add-a-validation-without-redeploying\">5. Add a validation — without redeploying\u003c/h2>\n\u003cp>Let's enforce a rule: a task's title must be at least five characters. \u003cstrong>Server Scripts\u003c/strong> are documents too (defined in \u003ccode>apps/server/migrations/0037_server_script.ts\u003c/code>, executed by \u003ccode>apps/server/src/server-scripts.ts\u003c/code> in a hardened \u003ccode>node:vm\u003c/code> sandbox inside the save transaction).\u003c/p>\n\u003cp>Create one at \u003ccode>/desk/Server Script/new\u003c/code> (or via \u003ccode>save_doc\u003c/code>):\u003c/p>\n\u003cul>\u003cli>\u003cstrong>name\u003c/strong>: \u003ccode>task-title-length\u003c/code> (Server Script uses prompt naming)\u003c/li>\u003cli>\u003cstrong>script_type\u003c/strong>: \u003ccode>Document Event\u003c/code>\u003c/li>\u003cli>\u003cstrong>reference_doctype\u003c/strong>: \u003ccode>Task\u003c/code>\u003c/li>\u003cli>\u003cstrong>event\u003c/strong>: \u003ccode>validate\u003c/code>\u003c/li>\u003cli>\u003cstrong>script\u003c/strong>:\u003c/li>\u003c/ul>\n\u003cp>  ``\u003ccode>js   if (!doc.title || doc.title.length &lt; 5) {     frappe.throw('Title must be at least 5 characters')   }   \u003c/code>``\u003c/p>\n\u003cul>\u003cli>\u003cstrong>enabled\u003c/strong>: checked\u003c/li>\u003c/ul>\n\u003cp>The script sees the document as \u003ccode>doc\u003c/code> and can call \u003ccode>frappe.throw(message)\u003c/code> to abort the save (the sandbox exposes nothing else — no \u003ccode>process\u003c/code>, no \u003ccode>fetch\u003c/code>). Now try saving a task titled \"x\": the save fails with a 417 validation error, in the Desk and over HTTP alike, because the script runs inside \u003ccode>saveDoc\u003c/code> itself.\u003c/p>\n\u003cp>If you'd rather gate status changes by role, look at \u003cstrong>Workflow\u003c/strong> (\u003ccode>apps/server/migrations/0015_workflow.ts\u003c/code>, \u003ccode>apps/server/src/workflow.ts\u003c/code>): a Workflow document ties states and role-gated transitions to a DocType, and the form grows action buttons via \u003ccode>/api/workflow/:doctype/:name\u003c/code>. That's a good second exercise.\u003c/p>\n\u003ch2 id=\"6-compare-with-the-reference-solution\">6. Compare with the reference solution\u003c/h2>\n\u003cp>Open \u003ccode>/desk/ToDo\u003c/code> — the built-in equivalent. Its definition in \u003ccode>apps/server/migrations/0022_todo.ts\u003c/code> is a superset of what you built: \u003ccode>allocated_to\u003c/code> is a \u003cstrong>Link\u003c/strong> field to \u003ccode>User\u003c/code>, and \u003ccode>reference_doctype\u003c/code>/\u003ccode>reference_name\u003c/code> let a ToDo point at any document (this is what \u003ccode>/api/assign\u003c/code> creates). Link fields get you referential integrity for free — the save path verifies the target row exists (\u003ccode>validateLinks\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code>), and deletion of a linked document is blocked.\u003c/p>\n\u003ch2 id=\"7-stretch-write-a-sandboxed-test\">7. Stretch: write a sandboxed test\u003c/h2>\n\u003cp>Server tests run against the real Postgres inside a rolled-back transaction (see TESTING.md). Model yours on \u003ccode>apps/server/test/naming.test.ts\u003c/code>. Create \u003ccode>apps/server/test/task-tutorial.test.ts\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode>import { describe, expect } from 'vitest'\nimport { test } from './pg-test'\n\ndescribe('Task tutorial', () =&gt; {\n  test('creates tasks with series names and the status default', async ({ admin }) =&gt; {\n    await admin.post('/api/doctype', {\n      name: 'Tutorial Task',\n      autoname: 'TUT-.####',\n      fields: [\n        { fieldname: 'title', fieldtype: 'Data', reqd: true },\n        { fieldname: 'status', fieldtype: 'Select', options: 'Open\\nDone', default_value: 'Open' },\n      ],\n    })\n    const doc = await admin.post&lt;{ name: string; status: string }&gt;('/api/save_doc', {\n      doctype: 'Tutorial Task',\n      doc: { title: 'Write the tutorial' },\n    })\n    expect(doc.name).toBe('TUT-0001')\n    expect(doc.status).toBe('Open')\n  })\n})\u003c/code>\u003c/pre>\n\u003cp>Run just this file:\u003c/p>\n\u003cpre>\u003ccode>pnpm --filter server test test/task-tutorial.test.ts\u003c/code>\u003c/pre>\n\u003cp>Two things worth noticing. The DocType is named \u003ccode>Tutorial Task\u003c/code>, not \u003ccode>Task\u003c/code>: the test's transaction rolls back, but it still \u003cem>sees\u003c/em> committed state, so reusing the \u003ccode>Task\u003c/code> you created earlier would make \u003ccode>/api/doctype\u003c/code> answer 409. And asserting \u003ccode>TUT-0001\u003c/code> is safe precisely because the series counter row is created inside the rolled-back transaction — every run starts the series fresh.\u003c/p>\n\u003ch2 id=\"where-to-go-next\">Where to go next\u003c/h2>\n\u003cul>\u003cli>ARCHITECTURE.md traces exactly what happened on each of your saves.\u003c/li>\u003cli>GLOSSARY.md decodes the Frappe vocabulary you just used.\u003c/li>\u003cli>Try \u003ccode>permissions/Task\u003c/code> in the Desk to grant a non-admin role access, then log in as a second user.\u003c/li>\u003c/ul>"},{"group":"Start here","slug":"learning-path","title":"Learning path — the staged todo app","path":"docs/LEARNING-PATH.md","mins":5,"html":"\u003ch1 id=\"learning-path-own-the-engine-by-building-a-todo-app\">Learning Path — own the engine by building a todo app\u003c/h1>\n\u003cblockquote>\u003cp>Written 2026-07-26 for the owner's stated goal: \u003cem>understand and own every layer completely\u003c/em> by building something small end-to-end, then complicating it one concept at a time. Each stage names the harness features it exercises (their IDs link to tests and code in the Explorer site), gives a verify checklist, and ends with questions worth answering before moving on. Do the stages in order; each one introduces exactly one new engine concept.\u003c/p>\u003c/blockquote>\n\u003cp>\u003cstrong>Ground rule:\u003c/strong> build everything twice — once through the Desk UI, once through raw HTTP (\u003ccode>curl\u003c/code> or the browser console) — because the UI is generated from the same metadata the API serves, and seeing both is how the \"everything derives from DocType metadata\" invariant becomes real.\u003c/p>\n\u003ch2 id=\"stage-0-boot-and-orient-30-min\">Stage 0 — Boot and orient (30 min)\u003c/h2>\n\u003cp>Run \u003ccode>./init.sh\u003c/code>, log in as Administrator, open an existing DocType (ToDo ships with core) in list and form view. Skim \u003ccode>docs/ARCHITECTURE.md\u003c/code>'s save_doc walkthrough once — you'll re-read pieces of it at every stage.\u003c/p>\n\u003cp>\u003cem>Exercises:\u003c/em> the boot protocol; the generic Desk (\u003ca class=\"fid-link\" href=\"#/f/UI-001\">UI-001\u003c/a>…). No new concepts — this stage is calibration.\u003c/p>\n\u003ch2 id=\"stage-1-plain-crud-the-todo-item-doctype-half-a-day\">Stage 1 — Plain CRUD: the \u003ccode>Todo Item\u003c/code> DocType (half a day)\u003c/h2>\n\u003cp>The MVC-tutorial equivalent, done the metadata way. Create a DocType \u003ccode>Todo Item\u003c/code> with fields: \u003ccode>title\u003c/code> (Data, required), \u003ccode>done\u003c/code> (Check, default off), \u003ccode>notes\u003c/code> (Text). No controller, no code.\u003c/p>\n\u003cp>Through the Desk: create, edit, complete, delete items. Through HTTP: \u003ccode>POST /api/resource/Todo Item\u003c/code>, list with filters (\u003ccode>[[\"done\",\"=\",0]]\u003c/code>), update, delete.\u003c/p>\n\u003cp>\u003cem>Exercises:\u003c/em> \u003ca class=\"fid-link\" href=\"#/f/META-001\">META-001\u003c/a>/002/003 (a real \u003ccode>tab_todo_item\u003c/code> table appears — inspect it with psql), \u003ca class=\"fid-link\" href=\"#/f/META-005\">META-005\u003c/a> (standard columns filled in), \u003ca class=\"fid-link\" href=\"#/f/META-010\">META-010\u003c/a> (reqd/default enforced), \u003ca class=\"fid-link\" href=\"#/f/DOC-001\">DOC-001\u003c/a>/010 (save + list), \u003ca class=\"fid-link\" href=\"#/f/DOC-011\">DOC-011\u003c/a> (send an invalid payload, read the field-wise error), \u003ca class=\"fid-link\" href=\"#/f/API-001\">API-001\u003c/a>… \u003cem>Verify:\u003c/em> the table exists with your columns; a missing \u003ccode>title\u003c/code> errors field-wise over both surfaces; the list filter works over HTTP. \u003cem>Questions to answer before Stage 2:\u003c/em> where did the column types come from? What wrote \u003ccode>creation\u003c/code>/\u003ccode>modified\u003c/code>? What happens in one transaction when you save?\u003c/p>\n\u003ch2 id=\"stage-2-projects-a-second-doctype-and-a-link-half-a-day\">Stage 2 — Projects: a second DocType and a Link (half a day)\u003c/h2>\n\u003cp>Create \u003ccode>Todo Project\u003c/code> (fields: \u003ccode>title\u003c/code>, \u003ccode>description\u003c/code>), then add a \u003ccode>project\u003c/code> \u003cstrong>Link field\u003c/strong> on \u003ccode>Todo Item\u003c/code> pointing to it. Try to delete a project that still has items.\u003c/p>\n\u003cp>\u003cem>Exercises:\u003c/em> \u003ca class=\"fid-link\" href=\"#/f/META-008\">META-008\u003c/a> (link integrity on save — bogus project name rejected), \u003ca class=\"fid-link\" href=\"#/f/DOC-006\">DOC-006\u003c/a> (delete blocked while referenced), \u003ca class=\"fid-link\" href=\"#/f/DOC-012\">DOC-012\u003c/a> (rename a project; watch items follow), \u003ca class=\"fid-link\" href=\"#/f/UI-002\">UI-002\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/UI-003\">UI-003\u003c/a> (filter items by project in the generated list view) and \u003ca class=\"fid-link\" href=\"#/f/UI-006\">UI-006\u003c/a> (the link field renders as a debounced typeahead). \u003cem>Verify:\u003c/em> saving an item with a nonexistent project fails field-wise; deleting a referenced project fails naming the blocker; renaming the project updates every item's \u003ccode>project\u003c/code> value. \u003cem>Questions:\u003c/em> how does the engine know what links to what? (Read the delete-integrity code the Explorer links from \u003ca class=\"fid-link\" href=\"#/f/DOC-006\">DOC-006\u003c/a>.) What would a dangling reference cost you in a system without this?\u003c/p>\n\u003ch2 id=\"stage-3-subtasks-the-child-table-half-a-day\">Stage 3 — Subtasks: the child table (half a day)\u003c/h2>\n\u003cp>Create \u003ccode>Todo Subtask\u003c/code> with \u003ccode>istable\u003c/code> on (fields: \u003ccode>description\u003c/code>, \u003ccode>done\u003c/code>), and add a Table field \u003ccode>subtasks\u003c/code> on \u003ccode>Todo Item\u003c/code>. Add/edit/remove/reorder subtask rows in the form; save the parent with an invalid subtask row and watch the whole save roll back.\u003c/p>\n\u003cp>\u003cem>Exercises:\u003c/em> \u003ca class=\"fid-link\" href=\"#/f/META-007\">META-007\u003c/a> (parent/parenttype/parentfield/idx columns), \u003ca class=\"fid-link\" href=\"#/f/DOC-005\">DOC-005\u003c/a> (child rows atomic with parent — the reconciliation on resave), \u003ca class=\"fid-link\" href=\"#/f/UI-007\">UI-007\u003c/a> (the child grid editor is generated, zero frontend code). \u003cem>Verify:\u003c/em> child rows live in \u003ccode>tab_todo_subtask\u003c/code> carrying parent linkage and \u003ccode>idx\u003c/code> order; a child validation error aborts the parent save entirely; reordering persists. \u003cem>Questions:\u003c/em> why are child rows modeled as their own DocType instead of JSON on the parent? What does that buy for queries and permissions?\u003c/p>\n\u003ch2 id=\"stage-4-checklists-field-flags-select-and-a-controller-1-day\">Stage 4 — Checklists: field flags, Select, and a controller (1 day)\u003c/h2>\n\u003cp>Add to \u003ccode>Todo Item\u003c/code>: \u003ccode>priority\u003c/code> (Select: Low/Medium/High, default Medium), \u003ccode>due_date\u003c/code> (Date), and make \u003ccode>notes\u003c/code> visible only when a Check \u003ccode>has_notes\u003c/code> is on (depends_on). Then write your \u003cstrong>first controller\u003c/strong>: a \u003ccode>validate\u003c/code> hook rejecting a \u003ccode>due_date\u003c/code> in the past, and a \u003ccode>before_save\u003c/code> that auto-sets \u003ccode>priority\u003c/code> High when due within 48h.\u003c/p>\n\u003cp>\u003cem>Exercises:\u003c/em> \u003ca class=\"fid-link\" href=\"#/f/META-009\">META-009\u003c/a> (Select validated against options), \u003ca class=\"fid-link\" href=\"#/f/META-010\">META-010\u003c/a>, \u003ca class=\"fid-link\" href=\"#/f/DOC-003\">DOC-003\u003c/a>/\u003ca class=\"fid-link\" href=\"#/f/DOC-004\">DOC-004\u003c/a> (lifecycle hooks; a thrown error aborts the transaction), UI conditional display. \u003cem>Verify:\u003c/em> an out-of-options priority is rejected over raw HTTP (not just hidden by the UI); the past-due save fails from the \u003cem>hook\u003c/em>, and the row is untouched; the auto-priority shows in the response. \u003cem>Questions:\u003c/em> trace the order validate → before_save → write → after_save in \u003ccode>document.ts\u003c/code>. What runs inside the transaction? What would you now do in a hook vs. in the client?\u003c/p>\n\u003ch2 id=\"stage-5-a-second-user-permissions-1-day\">Stage 5 — A second user: permissions (1 day)\u003c/h2>\n\u003cp>Create a \u003ccode>Todo User\u003c/code> role; give it read/write/create on \u003ccode>Todo Item\u003c/code> but read-only on \u003ccode>Todo Project\u003c/code>; make a non-admin user; add an \u003ccode>if_owner\u003c/code> DocPerm so users only see their own items. Log in as them (or use their API token) and retry everything from Stages 1–4.\u003c/p>\n\u003cp>\u003cem>Exercises:\u003c/em> \u003ca class=\"fid-link\" href=\"#/f/PERM-001\">PERM-001\u003c/a>… (role permissions, if_owner row-scoping), the RLS layer underneath, API auth (tokens/sessions). \u003cem
