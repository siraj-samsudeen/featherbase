>Verify:\u003c/em> the second user cannot create a project, cannot see your items, and every restriction holds over raw HTTP — the UI hiding a button is not the test. \u003cem>Questions:\u003c/em> where is each check enforced — server, RLS, or both? Why does the UI-only check never count?\u003c/p>\n\u003ch2 id=\"stage-6-make-it-live-and-useful-optional-1-day\">Stage 6 — Make it live and useful (optional, 1 day)\u003c/h2>\n\u003cp>Pick any two: a naming series (\u003ccode>TODO-.####\u003c/code>, \u003ca class=\"fid-link\" href=\"#/f/META-006\">META-006\u003c/a> — watch the atomic counter under parallel inserts), an assignment rule that round-robins new items (background jobs, JOB-*), an email notification on completion (EML-*), a Kanban-ish saved filter set, or a public web form (WEB-*) for submitting todos without login.\u003c/p>\n\u003cp>\u003cem>Verify:\u003c/em> each through its own feature's \u003ccode>verify\u003c/code> line in the harness.\u003c/p>\n\u003ch2 id=\"after-the-path\">After the path\u003c/h2>\n\u003cp>You will have touched, deliberately: the metadata engine, DDL generation, the document lifecycle, links, child tables, hooks, the permission stack, and one integration surface — which is the entire core of the framework. At that point read \u003ccode>docs/design/data-and-admin-topology.md\u003c/code> end to end; every axis will now map to something you've held. Then the M1 milestone (dbt seeds → DocTypes) is exactly Stage 1–2 skills applied to real client data.\u003c/p>"},{"group":"Start here","slug":"glossary","title":"Glossary — Frappe terms, codebase pointers","path":"docs/GLOSSARY.md","mins":4,"html":"\u003ch1 id=\"glossary\">Glossary\u003c/h1>\n\u003cp>Frappe vocabulary, as it applies to this codebase. Each entry says what the thing is and where it lives here.\u003c/p>\n\u003cp>\u003cstrong>DocType\u003c/strong> — the central concept: a model defined as metadata. A DocType's definition (fields, flags, naming rule) lives as rows in \u003ccode>tab_doctype\u003c/code> and \u003ccode>tab_docfield\u003c/code>; the engine (\u003ccode>apps/server/src/doctype-engine.ts\u003c/code>) generates a real \u003ccode>tab_&lt;name&gt;\u003c/code> table from it, and the API and UI are derived from the same metadata. Created via \u003ccode>POST /api/doctype\u003c/code> or the Desk's DocType Builder (\u003ccode>apps/web/src/pages/DocTypeBuilder.tsx\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Desk\u003c/strong> — the back-office UI where operators work with documents; distinct from public-facing pages. Here it's the React app under \u003ccode>/desk\u003c/code> routes (\u003ccode>apps/web/src/router.tsx\u003c/code>), with the shell — sidebar, awesomebar, avatar — in \u003ccode>apps/web/src/pages/DeskLayout.tsx\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Naming series\u003c/strong> — an \u003ccode>autoname\u003c/code> rule like \u003ccode>TASK-.####\u003c/code> that names new documents sequentially (\u003ccode>TASK-0001\u003c/code>, \u003ccode>TASK-0002\u003c/code>, ...). Implemented in \u003ccode>resolveName\u003c/code> (\u003ccode>apps/server/src/document.ts\u003c/code>): the counter is a row in the \u003ccode>series\u003c/code> table, incremented with \u003ccode>INSERT ... ON CONFLICT\u003c/code> inside the save transaction, so names are unique and gapless even under concurrency. Other \u003ccode>autoname\u003c/code> rules: \u003ccode>hash\u003c/code> (default), \u003ccode>prompt\u003c/code> (caller supplies the name), and \u003ccode>field:&lt;fieldname&gt;\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Child table\u003c/strong> — a DocType with \u003ccode>istable: true\u003c/code> whose rows exist only inside a parent document, through a parent field of type \u003ccode>Table\u003c/code>. Child rows carry \u003ccode>parent\u003c/code>, \u003ccode>parenttype\u003c/code>, and \u003ccode>parentfield\u003c/code> columns and are saved, loaded, and deleted with the parent in one transaction (\u003ccode>saveChildren\u003c/code> / \u003ccode>loadChildren\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code>). Example: \u003ccode>Workflow\u003c/code> holds \u003ccode>Workflow Document State\u003c/code> and \u003ccode>Workflow Transition\u003c/code> children (\u003ccode>apps/server/migrations/0015_workflow.ts\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>DocPerm\u003c/strong> — a role-based permission row for a DocType: which role may read/write/create/delete/submit/cancel/amend, at which permlevel. Stored in \u003ccode>tab_docperm\u003c/code>, enforced by \u003ccode>apps/server/src/permissions.ts\u003c/code>, edited from the Desk's Permission Manager (\u003ccode>/desk/permissions/:doctype\u003c/code>, \u003ccode>apps/web/src/components/PermissionManager.tsx\u003c/code>) via \u003ccode>GET/POST /api/permissions/:doctype\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>permlevel\u003c/strong> — a per-field permission tier (0–9). Each DocField has a \u003ccode>permlevel\u003c/code>; a role's DocPerm at that level grants read/write on those fields. On save, fields above the caller's writable levels are silently stripped (\u003ccode>stripUnwritableFields\u003c/code>); on read, fields above readable levels are omitted (\u003ccode>filterReadFields\u003c/code>) — both in \u003ccode>apps/server/src/permissions.ts\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>if_owner\u003c/strong> — a DocPerm flag meaning \"this grant applies only to documents the user owns\" (\u003ccode>owner\u003c/code> column). Implemented in \u003ccode>apps/server/src/permissions.ts\u003c/code> (\u003ca class=\"fid-link\" href=\"#/f/PERM-007\">PERM-007\u003c/a>); it's also what makes the customer Portal show a user only their own documents.\u003c/p>\n\u003cp>\u003cstrong>User Permission\u003c/strong> — a per-user data restriction: \"this user may only see documents linked to Company A\". Stored as \u003ccode>User Permission\u003c/code> documents (\u003ccode>apps/server/migrations/0007_user_permission.ts\u003c/code>: \u003ccode>user\u003c/code>, \u003ccode>allow\u003c/code> = the DocType, \u003ccode>for_value\u003c/code>), enforced against every Link field on read and write (\u003ccode>checkUserPermissions\u003c/code> in \u003ccode>apps/server/src/permissions.ts\u003c/code>, \u003ccode>assertUserPermissions\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Single DocType\u003c/strong> — a DocType with \u003ccode>issingle: true\u003c/code> that has exactly one instance and no table; think of System Settings. Values are stored per-field in the \u003ccode>single_value\u003c/code> EAV table (\u003ccode>getSingle\u003c/code> / \u003ccode>saveSingle\u003c/code> in \u003ccode>apps/server/src/document.ts\u003c/code>), and the document's name is the DocType name. The Desk opens its form directly instead of a list.\u003c/p>\n\u003cp>\u003cstrong>Workflow\u003c/strong> — role-gated state machines over a DocType. A \u003ccode>Workflow\u003c/code> document (\u003ccode>apps/server/migrations/0015_workflow.ts\u003c/code>) holds states (each mapping to a docstatus) and transitions (each allowed to a Role). The engine (\u003ccode>apps/server/src/workflow.ts\u003c/code>) forces new documents into the initial state, blocks direct edits of the state field, and applies transitions through \u003ccode>POST /api/apply_workflow_action\u003c/code>; the form shows available actions via \u003ccode>apps/web/src/components/WorkflowActions.tsx\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Server Script\u003c/strong> — admin-authored code that runs on the server without a deploy: either on document events (\u003ccode>validate\u003c/code>, \u003ccode>before_save\u003c/code>, \u003ccode>after_save\u003c/code>, inside the save transaction) or as a callable API method. Stored as \u003ccode>Server Script\u003c/code> documents (\u003ccode>apps/server/migrations/0037_server_script.ts\u003c/code>) and executed in a hardened \u003ccode>node:vm\u003c/code> sandbox that exposes only \u003ccode>doc\u003c/code>/\u003ccode>args\u003c/code> and \u003ccode>frappe.throw\u003c/code> — no host objects (\u003ccode>apps/server/src/server-scripts.ts\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Client Script\u003c/strong> — user JS that hooks into form events in the browser (onload, field change, before save). Stored as \u003ccode>Client Script\u003c/code> documents (\u003ccode>apps/server/migrations/0038_client_script.ts\u003c/code>), loaded and run by the Desk via \u003ccode>apps/web/src/lib/client-scripts.ts\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Custom Field\u003c/strong> — a field added to an existing DocType as data rather than by editing its definition — the mechanism for site-local extensions that survive upstream re-seeds. A \u003ccode>Custom Field\u003c/code> record (\u003ccode>apps/server/migrations/0016_custom_field.ts\u003c/code>) is applied by \u003ccode>apps/server/src/custom-fields.ts\u003c/code> (adds the column and a docfield row marked custom) and re-applied at boot (\u003ccode>reapplyCustomFields\u003c/code> in \u003ccode>apps/server/src/index.ts\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Property Setter\u003c/strong> — a stored override of a single metadata property (\"label of \u003ccode>status\u003c/code> on \u003ccode>Task\u003c/code> is now 'State'\") without touching the base definition. Applied as an overlay when metadata is loaded; any change invalidates the target's meta cache (\u003ccode>apps/server/src/controllers/property-setter.ts\u003c/code>, \u003ccode>apps/server/migrations/0017_property_setter.ts\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Web Form\u003c/strong> — a public, optionally anonymous form over a whitelisted subset of one DocType's fields. Config and submission run through \u003ccode>GET/POST /api/web_form/:route\u003c/code> (\u003ccode>apps/server/src/webform.ts\u003c/code>) — submissions go through the normal save lifecycle so server validation still applies — and render at \u003ccode>/form/:route\u003c/code> (\u003ccode>apps/web/src/pages/WebForm.tsx\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Portal\u003c/strong> — the customer-facing counterpart to the Desk: a logged-in website user sees only their own documents (if_owner-scoped by the API). Routes \u003ccode>/portal/:doctype[/:name]\u003c/code> in \u003ccode>apps/web/src/router.tsx\u003c/code>, pages in \u003ccode>apps/web/src/pages/Portal.tsx\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>Awesomebar\u003c/strong> — the global search box in the Desk's top bar (focus with Ctrl/Cmd+K). It matches document names and title fields across every DocType the user can read, via \u003ccode>GET /api/search\u003c/code> (\u003ccode>apps/server/src/search.ts\u003c/code>, UI in \u003ccode>apps/web/src/pages/DeskLayout.tsx\u003c/code>), and doubles as a command palette (jump to a DocType, new document, new DocType).\u003c/p>\n\u003cp>\u003cstrong>Workspace\u003c/strong> — a configurable module home page of shortcut cards (links to DocType lists, reports, dashboards). Stored as \u003ccode>Workspace\u003c/code> documents with a JSON \u003ccode>shortcuts\u003c/code> field (\u003ccode>apps/server/migrations/0036_workspace.ts\u003c/code>), rendered at \u003ccode>/desk/workspace/:name\u003c/code> by \u003ccode>apps/web/src/components/WorkspaceView.tsx\u003c/code>.\u003c/p>"},{"group":"Start here","slug":"testing","title":"Testing — the SQL-sandbox model","path":"docs/TESTING.md","mins":4,"html":"\u003ch1 id=\"testing\">Testing\u003c/h1>\n\u003cp>Featherbase tests hit a \u003cstrong>real Postgres\u003c/strong> — no mocks, no fixture files, no cleanup code. The trick that makes this fast and safe is the SQL Sandbox model, borrowed from Phoenix/Ecto and packaged as \u003ca href=\"https://github.com/siraj-samsudeen/feather-testing-postgres\" target=\"_blank\" rel=\"noopener\">feather-testing-postgres\u003c/a> (consumed as a published npm dependency; it lives in its own repo — fix it there, never vendor it here).\u003c/p>\n\u003ch2 id=\"the-sandbox-model\">The sandbox model\u003c/h2>\n\u003cp>Every test body runs inside one Postgres transaction that is \u003cstrong>rolled back\u003c/strong> when the test ends. Whatever the test creates — DocTypes, tables, documents, users — vanishes at rollback, so tests need no teardown and can't pollute each other. Crucially, the test drives the \u003cem>real\u003c/em> Hono app in-process, so the full production path (routes → auth → permissions → lifecycle → SQL) gets exercised.\u003c/p>\n\u003cp>The binding of the harness to this app is \u003ccode>apps/server/test/pg-test.ts\u003c/code>. It hands \u003ccode>createPgTest\u003c/code> the app, the \u003ccode>sql\u003c/code> client, and a delegate hook (\u003ccode>_setSqlDelegate\u003c/code> in \u003ccode>apps/server/src/db.ts\u003c/code>) that routes the app's queries through the test's transaction. It also wires:\u003c/p>\n\u003cul>\u003cli>\u003ccode>mintToken\u003c/code> / \u003ccode>insertUser\u003c/code> — fixtures like \u003ccode>admin\u003c/code> come pre-authenticated.\u003c/li>\u003cli>\u003ccode>onTeardown\u003c/code> — invalidates the per-process metadata cache and resets the rate limiter, because a test may have created DocTypes whose tables no longer exist after rollback.\u003c/li>\u003c/ul>\n\u003ch2 id=\"writing-a-test\">Writing a test\u003c/h2>\n\u003cp>A minimal real example, adapted from \u003ccode>apps/server/test/naming.test.ts\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode>import { describe, expect } from 'vitest'\nimport { test } from './pg-test'   // NOT vitest's test — the sandboxed one\n\ndescribe('naming', () =&gt; {\n  test('series names are sequential', async ({ admin }) =&gt; {\n    await admin.post('/api/doctype', {\n      name: 'Nm Invoice',\n      autoname: 'NMINV-.####',\n      fields: [{ fieldname: 'title', fieldtype: 'Data' }],\n    })\n    const doc = await admin.post&lt;{ name: string }&gt;('/api/save_doc', {\n      doctype: 'Nm Invoice',\n      doc: { title: 'first' },\n    })\n    expect(doc.name).toBe('NMINV-0001')\n  })\n})\u003c/code>\u003c/pre>\n\u003cp>Import \u003ccode>test\u003c/code> from \u003ccode>./pg-test\u003c/code> and \u003ccode>expect\u003c/code> from vitest (pg-test re-exports it too). The \u003ccode>admin\u003c/code> fixture is a \u003ccode>TestClient\u003c/code> logged in as Administrator; call the HTTP API through it and assert on the JSON. You can also import \u003ccode>sql\u003c/code> from \u003ccode>../src/db\u003c/code> and query the database directly mid-test — you'll see the test's own uncommitted state, which is exactly what you want.\u003c/p>\n\u003cp>Asserting \u003ccode>NMINV-0001\u003c/code> works every run because the series counter row is created inside the transaction and rolled back with it. But remember the sandbox \u003cem>sees committed state\u003c/em>: a name that collides with seeded data (a DocType that a migration created, say) will 409 — pick names that don't exist in the real schema.\u003c/p>\n\u003ch2 id=\"running-tests\">Running tests\u003c/h2>\n\u003cpre>\u003ccode>pnpm test                                        # everything (all workspaces)\npnpm --filter server test                        # server suite\npnpm --filter server test test/naming.test.ts    # one file\npnpm --filter web test                           # web component suite\npnpm --filter web e2e                            # Playwright e2e (stack must be running)\npnpm smoke                                       # server + web smoke tests\npnpm --filter server typecheck\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>pnpm --filter server test\u003c/code> is \u003ccode>vitest run\u003c/code>, so anything after it is a vitest filter — a path runs that file.\u003c/p>\n\u003ch2 id=\"why-fileparallelism-false\">Why \u003ccode>fileParallelism: false\u003c/code>\u003c/h2>\n\u003cp>Both \u003ccode>apps/server/vitest.config.ts\u003c/code> and \u003ccode>apps/web/vitest.config.ts\u003c/code> set \u003ccode>fileParallelism: false\u003c/code>, and \u003ccode>apps/web/playwright.config.ts\u003c/code> sets \u003ccode>workers: 1\u003c/code>, all for the same reason: every test file shares \u003cstrong>one\u003c/strong> database. Tests within a file are transaction-isolated, but parallel \u003cem>files\u003c/em> contend on cross-cutting state — the single \u003ccode>tab_background_job\u003c/code> queue (\u003ccode>drainJobs()\u003c/code> drains every queued job, so parallel files steal each other's jobs) and naming-series row locks. Do not turn parallelism back on; the flake it causes looks like unrelated bugs.\u003c/p>\n\u003ch2 id=\"the-stale-job-queue-story\">The stale-job-queue story\u003c/h2>\n\u003cp>\u003ccode>tab_background_job\u003c/code> is the one piece of state that outlives a run. A run killed partway through (Ctrl-C, crash) leaves committed \u003ccode>queued\u003c/code> rows behind; the next run's \u003ccode>drainJobs()\u003c/code> then returns a higher count than a test expected, and the failure (\u003ccode>expected 2 to be 1\u003c/code>) reads like a real bug in job code. The fix is \u003ccode>apps/server/test/global-setup.ts\u003c/code>: a Vitest \u003ccode>globalSetup\u003c/code> that runs in the main process, \u003cstrong>outside\u003c/strong> any sandbox transaction, and deletes everything in \u003ccode>tab_background_job\u003c/code> once per run. Both suites use it (the web config points at \u003ccode>../server/test/global-setup.ts\u003c/code>), so every run starts from a known-empty queue. It complements \u003ccode>fileParallelism: false\u003c/code> rather than replacing it.\u003c/p>\n\u003ch2 id=\"the-three-layers\">The three layers\u003c/h2>\n\u003cp>\u003cstrong>1. Server integration\u003c/strong> — \u003ccode>apps/server/test/*.test.ts\u003c/code>. Sandboxed HTTP against the in-process Hono app, as above. This is where almost everything belongs: lifecycle behavior, permissions, naming, validation, API shapes. Reach for it first.\u003c/p>\n\u003cp>\u003cstrong>2. Web component\u003c/strong> — \u003ccode>apps/web/test/*.test.tsx\u003c/code>. jsdom + \u003ccode>@testing-library/react\u003c/code>, but \u003cem>not\u003c/em> mocked: the components' API calls hit the same in-process server against the same sandboxed database (which is why the web vitest config inlines \u003ccode>feather-testing-postgres\u003c/code> and reuses the server's global setup). \u003ccode>apps/web/test/setup.ts\u003c/code> stubs \u003ccode>WebSocket\u003c/code> so the Desk's realtime client doesn't try to open real connections under jsdom. Use this layer when the behavior under test is React-side: rendering from metadata, form interaction logic, query invalidation.\u003c/p>\n\u003cp>\u003cstrong>3. Playwright e2e\u003c/strong> — \u003ccode>apps/web/e2e/*.spec.ts\u003c/code>, run with \u003ccode>pnpm --filter web e2e\u003c/code> against the live stack (\u003ccode>baseURL\u003c/code> \u003ccode>http://localhost:5173\u003c/code>, so run \u003ccode>./init.sh\u003c/code> first; \u003ccode>pnpm smoke\u003c/code> runs just \u003ccode>e2e/smoke.spec.ts\u003c/code>). These are \u003cstrong>not\u003c/strong> sandboxed — they commit real data through a real browser. Use this layer only for things the other two can't see: routing, focus/keyboard behavior, realtime updates, visual flows.\u003c/p>\n\u003cp>One deliberate exception in the server suite: \u003ccode>apps/server/test/rls.test.ts\u003c/code> is \u003cem>not\u003c/em> sandbox-isolated either. It verifies native Postgres row-level security through a second connection under the \u003ccode>desk_client\u003c/code> role — and that connection could never see an uncommitted sandbox transaction, so the test commits for real and cleans up after itself. It connects to \u003ccode>postgres://desk_client:desk_client@127.0.0.1:5432/featherbase\u003c/code> by default; override with \u003ccode>RLS_TEST_URL\u003c/code> (the role is created by \u003ccode>apps/server/migrations/0010_rls.sql\u003c/code>).\u003c/p>\n\u003ch2 id=\"ground-rules\">Ground rules\u003c/h2>\n\u003cul>\u003cli>Never mock the database or the API — if a test can't run against the sandbox, reshape the test.\u003c/li>\u003cli>Don't add cleanup code to sandboxed tests; rollback is the cleanup.\u003c/li>\u003cli>If a run dies and the next one fails with a job-count mismatch, that's the stale-queue symptom above — just rerun; the global setup clears it.\u003c/li>\u003c/ul>"},{"group":"Start here","slug":"deploy","title":"Deploy — the production runbook","path":"docs/DEPLOY.md","mins":2,"html":"\u003ch1 id=\"deploying-featherbase\">Deploying Featherbase\u003c/h1>\n\u003cp>How to run the server in production (#57). This is an \u003cem>additional\u003c/em> path — \u003ccode>./init.sh\u003c/code> remains the development boot and is unchanged. This document supersedes the deployment half of issue #25: the Convex backend it described died with ADR 0006, and the current SPA reads no \u003ccode>VITE_*\u003c/code> build variables at all.\u003c/p>\n\u003ch2 id=\"the-two-step-boot\">The two-step boot\u003c/h2>\n\u003cp>Every deploy is \u003cstrong>release, then serve\u003c/strong> — never the reverse, and never both in one process:\u003c/p>\n\u003cpre>\u003ccode># 1. Release: apply migrations + patches. Run ONCE per deploy, before any\n#    new-code instance serves traffic.\npnpm --filter server release\n\n# 2. Serve: the API server, no file watcher.\nPORT=8000 pnpm --filter server start\u003c/code>\u003c/pre>\n\u003cp>The release step takes a Postgres advisory lock (\u003ccode>hashtext('featherbase-release')\u003c/code>) for its whole run, so N instances that all execute it on boot serialize instead of racing: the first applies everything, the rest wait on the lock and find nothing left to do. It exits non-zero on the first failure without recording the failed step, so the next release retries it.\u003c/p>\n\u003ch2 id=\"configuration\">Configuration\u003c/h2>\n\u003cp>Everything comes from the environment; every variable has a dev default in \u003ccode>apps/server/src/config.ts\u003c/code> (or at its point of use).\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Variable\u003c/th>\u003cth>Required in production\u003c/th>\u003cth>Purpose\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003ccode>DATABASE_URL\u003c/code>\u003c/td>\u003ctd>\u003cstrong>yes\u003c/strong>\u003c/td>\u003ctd>Postgres connection string\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>PORT\u003c/code>\u003c/td>\u003ctd>no (8000)\u003c/td>\u003ctd>HTTP + WebSocket port\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>WEB_ORIGINS\u003c/code>\u003c/td>\u003ctd>yes, if the SPA is served from another origin\u003c/td>\u003ctd>comma-separated CORS allowlist\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>JWT_SECRET\u003c/code>\u003c/td>\u003ctd>\u003cstrong>yes\u003c/strong>\u003c/td>\u003ctd>session/token signing (dev default is \u003ccode>dev-secret-change-me\u003c/code>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>SITE_URL\u003c/code>\u003c/td>\u003ctd>for password-reset emails\u003c/td>\u003ctd>absolute URL of the SPA\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>FILE_STORAGE_DIR\u003c/code>\u003c/td>\u003ctd>recommended\u003c/td>\u003ctd>uploaded-file directory (must persist across deploys)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ccode>CHROMIUM_PATH\u003c/code> / \u003ccode>PLAYWRIGHT_BROWSERS_PATH\u003c/code>\u003c/td>\u003ctd>for PDF printing\u003c/td>\u003ctd>Chromium binary resolution — never hardcoded\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Two settings already in the codebase matter specifically for hosted Postgres and must not regress: \u003ccode>db.ts\u003c/code> sets \u003ccode>prepare: false\u003c/code> (required by transaction-mode poolers such as Supabase's on port 6543), and \u003ccode>config.ts\u003c/code> reads \u003ccode>DATABASE_URL\u003c/code> with a local default.\u003c/p>\n\u003ch2 id=\"container\">Container\u003c/h2>\n\u003cp>\u003ccode>apps/server/Dockerfile\u003c/code> is a minimal, vendor-neutral image. Build from the repo root so the pnpm workspace resolves:\u003c/p>\n\u003cpre>\u003ccode>docker build -f apps/server/Dockerfile -t featherbase-server .\ndocker run --rm -e DATABASE_URL=$DATABASE_URL featherbase-server pnpm --filter server release\ndocker run -d -e DATABASE_URL=$DATABASE_URL -e JWT_SECRET=$JWT_SECRET -p 8000:8000 featherbase-server\u003c/code>\u003c/pre>\n\u003cp>Any platform that runs a container and can execute a pre-deploy command (release phase, job, CI step) fits this shape; nothing is welded to one vendor.\u003c/p>\n\u003ch2 id=\"the-web-spa\">The web SPA\u003c/h2>\n\u003cp>\u003ccode>apps/web\u003c/code> is a static Vite build (\u003ccode>pnpm --filter web build\u003c/code> → \u003ccode>dist/\u003c/code>), servable by any static host. It reads no build-time environment variables; it talks to the API on the same origin or wherever the reverse proxy sends \u003ccode>/api\u003c/code>. The Railway \u003ccode>web\u003c/code> service that issue #25 documents still serves it today.\u003c/p>\n\u003ch2 id=\"smoke-check\">Smoke check\u003c/h2>\n\u003cp>After a deploy: \u003ccode>SERVER_URL=https://... pnpm --filter server test:smoke\u003c/code> asserts \u003ccode>GET /api/ping\u003c/code> answers \u003ccode>pong\u003c/code> with a live DB connection. Then \u003ccode>POST /api/method/login\u003c/code> with valid credentials should return Frappe's login shape (\u003ccode>{\"message\":\"Logged In\", ...}\u003c/code>).\u003c/p>"},{"group":"Start here","slug":"contributing","title":"Contributing — prerequisites & commands","path":"CONTRIBUTING.md","mins":3,"html":"\u003ch1 id=\"contributing-to-featherbase\">Contributing to Featherbase\u003c/h1>\n\u003ch2 id=\"prerequisites\">Prerequisites\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Node\u003c/strong> — a current LTS. There is no \u003ccode>engines\u003c/code> pin or \u003ccode>.nvmrc\u003c/code>; the code is ESM with top-level \u003ccode>await\u003c/code> (see \u003ccode>apps/server/src/index.ts\u003c/code>), so anything recent enough for \u003ccode>tsx\u003c/code> works.\u003c/li>\u003cli>\u003cstrong>pnpm 10\u003c/strong> — the repo pins \u003ccode>pnpm@10.33.0\u003c/code> via the \u003ccode>packageManager\u003c/code> field in the root \u003ccode>package.json\u003c/code> (Corepack picks this up automatically).\u003c/li>\u003cli>\u003cstrong>Postgres\u003c/strong> — reachable at \u003ccode>DATABASE_URL\u003c/code>, which defaults to \u003ccode>postgres://postgres:postgres@127.0.0.1:5432/featherbase\u003c/code> (\u003ccode>apps/server/src/config.ts\u003c/code>). You usually don't need to set anything up by hand: \u003ccode>./init.sh\u003c/code> provisions it (below). Nothing runs on 5433 and there is no \u003ccode>.pgdata\u003c/code> directory.\u003c/li>\u003cli>For e2e tests and server-side PDF printing, Playwright resolves its own installed Chromium; set \u003ccode>CHROMIUM_PATH\u003c/code> only if you need a specific binary (\u003ccode>apps/web/playwright.config.ts\u003c/code>, \u003ccode>apps/server/src/print.ts\u003c/code>).\u003c/li>\u003c/ul>\n\u003ch2 id=\"getting-a-running-stack\">Getting a running stack\u003c/h2>\n\u003cpre>\u003ccode>./init.sh\u003c/code>\u003c/pre>\n\u003cp>One script boots everything. Step by step (read \u003ccode>init.sh\u003c/code> itself — it's heavily commented):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Dependencies\u003c/strong> — installs pnpm if missing, runs \u003ccode>pnpm install\u003c/code> if \u003ccode>node_modules\u003c/code> is absent.\u003c/li>\u003cli>\u003cstrong>Database\u003c/strong> — probes \u003ccode>DATABASE_URL\u003c/code> first and never touches a Postgres that already answers. Only if the probe fails does it try to start a cluster (Debian \u003ccode>pg_ctlcluster\u003c/code>, macOS \u003ccode>brew services\u003c/code>) and create the role/database over whichever superuser connection the host accepts.\u003c/li>\u003cli>\u003cstrong>Migrations + patches\u003c/strong> — \u003ccode>pnpm --filter server migrate\u003c/code> then \u003ccode>pnpm --filter server patches\u003c/code>. Migrations live in \u003ccode>apps/server/migrations/\u003c/code> (numbered SQL and TS files).\u003c/li>\u003cli>\u003cstrong>App servers\u003c/strong> — kills stale listeners on ports \u003cstrong>8000\u003c/strong> (API) and \u003cstrong>5173\u003c/strong> (web) by port, starts both dev servers (logs at \u003ccode>/tmp/featherbase-server.log\u003c/code> and \u003ccode>/tmp/featherbase-web.log\u003c/code>), waits for both to answer, and asserts the answering PIDs are the ones it started — so another checkout's stack can't masquerade as yours.\u003c/li>\u003cli>\u003cstrong>Smoke test\u003c/strong> — \u003ccode>pnpm smoke\u003c/code> (server smoke + the web \u003ccode>e2e/smoke.spec.ts\u003c/code>).\u003c/li>\u003c/ol>\n\u003cp>Re-running \u003ccode>./init.sh\u003c/code> is safe and mostly a no-op once things are up.\u003c/p>\n\u003cp>\u003cstrong>Log in\u003c/strong> at http://localhost:5173 as \u003ccode>Administrator\u003c/code> / \u003ccode>admin\u003c/code>. The default password is set by \u003ccode>apps/server/migrations/0006_admin_password.ts\u003c/code>; override with the \u003ccode>ADMIN_PASSWORD\u003c/code> environment variable at first migration.\u003c/p>\n\u003ch2 id=\"running-tests\">Running tests\u003c/h2>\n\u003cp>See docs/TESTING.md for the how and why (the SQL-sandbox model, why files run sequentially). The short version:\u003c/p>\n\u003cpre>\u003ccode>pnpm test                                        # every suite\npnpm --filter server test                        # server integration suite\npnpm --filter server test test/naming.test.ts    # a single file\npnpm --filter web test                           # web component suite\npnpm --filter web e2e                            # Playwright e2e — stack must be running\npnpm smoke                                       # quick server + web smoke\npnpm --filter server typecheck\u003c/code>\u003c/pre>\n\u003cp>Two suites have extra environment hooks:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>RLS suite\u003c/strong> (\u003ccode>apps/server/test/rls.test.ts\u003c/code>) opens a second connection as the \u003ccode>desk_client\u003c/code> Postgres role (created by \u003ccode>apps/server/migrations/0010_rls.sql\u003c/code>, password \u003ccode>desk_client\u003c/code>). Default URL \u003ccode>postgres://desk_client:desk_client@127.0.0.1:5432/featherbase\u003c/code>; override with \u003ccode>RLS_TEST_URL\u003c/code>.\u003c/li>\u003cli>\u003cstrong>e2e\u003c/strong> targets \u003ccode>http://localhost:5173\u003c/code> (override with \u003ccode>WEB_URL\u003c/code>), so run \u003ccode>./init.sh\u003c/code> first.\u003c/li>\u003c/ul>\n\u003ch2 id=\"working-conventions\">Working conventions\u003c/h2>\n\u003cp>The repo is developed session-by-session with a standing protocol (the full version is in \u003ccode>CLAUDE.md\u003c/code>; \u003ccode>PROGRESS.md\u003c/code> is the running log):\u003c/p>\n\u003col>\u003cli>\u003cstrong>Orient\u003c/strong> — read the newest \u003ccode>PROGRESS.md\u003c/code> entry and recent git log before starting.\u003c/li>\u003cli>\u003cstrong>Boot and smoke-test first\u003c/strong> — \u003ccode>./init.sh\u003c/code>, verify login → list → form works before writing code. If the app is broken, fixing it is the task.\u003c/li>\u003cli>\u003cstrong>One piece of work per session\u003c/strong>, implemented fully — small, complete, working — then verified end-to-end (real HTTP calls, real browser), not just unit tests.\u003c/li>\u003cli>\u003cstrong>Record it\u003c/strong> — append a dated entry to \u003ccode>PROGRESS.md\u003c/code> (what, how verified, what's next), commit at every stable point, and leave the tree clean and the app booting.\u003c/li>\u003c/ol>\n\u003cp>A few hard rules worth knowing before your first PR:\u003c/p>\n\u003cul>\u003cli>Everything derives from DocType metadata — never hand-write a per-model table, endpoint, or form component.\u003c/li>\u003cli>The Frappe wire shapes (\u003ccode>sid\u003c/code> cookie, \u003ccode>/api/method/login\u003c/code> response, \u003ccode>exc_type\u003c/code> error bodies) are deliberate compatibility surface; don't \"clean them up\".\u003c/li>\u003cli>New UI must inherit the Desk look — the design tokens and \u003ccode>.fc-*\u003c/code> component classes (rules at the top of \u003ccode>PROGRESS.md\u003c/code>).\u003c/li>\u003cli>Don't edit entries in \u003ccode>harness/features.json\u003c/code> beyond flipping a \u003ccode>status\u003c/code>.\u003c/li>\u003cli>\u003ccode>feather-testing-postgres\u003c/code> lives in its own repo; fix it there and bump the dependency, never vendor it back in.\u003c/li>\u003c/ul>\n\u003ch2 id=\"finding-your-way-around\">Finding your way around\u003c/h2>\n\u003cul>\u003cli>docs/ARCHITECTURE.md — the request lifecycle, metadata engine, and a map of the source tree\u003c/li>\u003cli>docs/TUTORIAL.md — build your first DocType end to end\u003c/li>\u003cli>docs/TESTING.md — the SQL-sandbox test model\u003c/li>\u003cli>docs/GLOSSARY.md — Frappe vocabulary decoded\u003c/li>\u003cli>docs/adr/ — why things are the way they are; start with ADR 0006\u003c/li>\u003c/ul>"},{"group":"Design & plan","slug":"design-topology","title":"Design framework — 7 axes, 21 decisions","path":"docs/design/data-and-admin-topology.md","mins":33,"html":"\u003ch1 id=\"featherbase-data-administration-topology-design-framework\">Featherbase Data &amp; Administration Topology — Design Framework\u003c/h1>\n\u003cblockquote>\u003cp>Status: \u003cstrong>design framework, v7, 2026-07-26\u003c/strong> — follows the research in \u003ccode>docs/research/frappe-multi-app-multi-db.md\u003c/code>. v1 organized the requirements into three axes; v2 (same day) reworked Axis B after the backend-flexibility discussion (Convex/InstantDB apps, legacy-app mirroring, future backends, \"a different database means a different app\"); v3 (same day) adds \u003cstrong>Axis D — extensibility &amp; distribution\u003c/strong>: a WordPress/VS Code/Salesforce-grade plugin ecosystem with micro/macro composability, grounded in a survey of NocoBase, Directus, Medusa, Strapi/Payload, and Salesforce 2GP packaging. v4 (same day) answers \"is there any other axis?\" with three: \u003cstrong>E — time\u003c/strong> (versioning, audit, effectivity), \u003cstrong>F — change lifecycle\u003c/strong> (environments &amp; metadata promotion), \u003cstrong>G — actors &amp; identity\u003c/strong> (humans, portals, machines, AI agents) — and names the cross-cutting concerns that are deliberately \u003cem>not\u003c/em> axes. v5 (same day) adds §6.6 \u003cstrong>generation vs interpretation\u003c/strong> (D19) and the per-system study series at \u003ccode>docs/research/studies/\u003c/code> (JHipster, NocoBase, Salesforce, Jira, Directus, Odoo, ServiceNow, and the generator family incl. ScaffoldHub and the Rails admin panels). v6 (same day) adds §3.3's \u003cstrong>analytics egress\u003c/strong> (D20): the medallion lakehouse as an auto-generated push target, with the Hudi/DLT-META study grounding it. v7 (same day) answers \"does a clean system of record even need bronze/silver?\" (layer economics, D21), gives warehouse mapping/seed tables their home in the MDM, and adds the reverse-direction use case: the Desk as a \u003cstrong>warehouse browser\u003c/strong> over MotherDuck/DuckDB. §9 lists decisions to ratify and sequencing. Nothing here is implemented; nothing has to land at once.\u003c/p>\n\u003cp>Related: ADR 0007 and specs \u003ccode>0001-external-data-sources.md\u003c/code> / \u003ccode>0002-virtual-doctypes.md\u003c/code> (merged from a parallel session) implement the \u003ccode>postgres/foreign\u003c/code> slice of Axis B and the custom-controller fallback.\u003c/p>\u003c/blockquote>\n\u003ch2 id=\"0-the-requirements-being-organized-verbatim-intent\">0. The requirements being organized (verbatim intent)\u003c/h2>\n\u003cul>\u003cli>Helpdesk: Finance and Legal each run a helpdesk on the \u003cem>same\u003c/em> application with \u003cem>different\u003c/em> ticket types, some shared company-wide; a generic ticket is created by someone who doesn't know where it belongs and is routed to a department with ~100 specific types. Department admins (create ticket types, SLAs) under a company-wide admin. Sub-departments (accounting, advance payments, recon) feel like \u003cem>modules\u003c/em>. Generalize to ERP.\u003c/li>\u003cli>Storage flexibility, first round: single DB (one schema / several / several DBs in one instance) — or the data lives elsewhere: SAP master data (author here, sync there, periodically or on every write), SaaS products (bidirectional master-data sync), a control plane in Railway Postgres (overlay UI — now specced as \u003ccode>docs/specs/0001-external-data-sources.md\u003c/code> under ADR 0007), config CSVs in a GitHub repo edited by agents (clients need a UI \u003cstrong>without losing git diffability\u003c/strong>).\u003c/li>\u003cli>Storage flexibility, second round: some apps on \u003cstrong>Convex\u003c/strong>, some on \u003cstrong>InstantDB\u003c/strong>; clients with a \u003cstrong>legacy app\u003c/strong> (a doctor's clinical management system — mirror it, adapt on top gradually: doctor + a few admins move to our UI while the rest of the team stays on the legacy system). Tomorrow a client may insist on a file system, a REST backend, SQLite, DuckDB. Candidate simplification to evaluate: \u003cem>\"if it is a different database, it has to be a different app.\"\u003c/em>\u003c/li>\u003cli>Extensibility, third round: \u003cstrong>Salesforce's design is admired.\u003c/strong> Wanted: a WordPress-style contribution loop (someone contributes a plugin or fixes a bug and it becomes available to everybody) and VS Code-style extensions — contributing tables, workflows, definitions, even UI elements. Plus \u003cstrong>micro-apps\u003c/strong>: unlike VS Code extensions (all-or-nothing), it should be possible to take \u003cem>only certain parts\u003c/em> of a larger app — \"micro modules or macro modules from which people can pick\". Research leading open-source platforms (Strapi-class headless CMS and similar).\u003c/li>\u003cli>Naming: no forced \u003ccode>tab\u003c/code> prefix — adopt existing tables under their own names via a reflection API; optionally add \u003ccode>created_by\u003c/code> / \u003ccode>created_at\u003c/code> columns; refactoring (renames) must stay possible.\u003c/li>\u003cli>Priorities: single app now (an MDM product) with multiple modules, module-level admin + app-level admin. Multi-app later. Multi-site / multi-tenant is \u003cstrong>not\u003c/strong> a key requirement.\u003c/li>\u003c/ul>\n\u003ch2 id=\"1-three-orthogonal-axes\">1. Three orthogonal axes\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>Axis A — Organization &amp; delegation.\u003c/strong> Who administers what: apps, modules, scoped metadata authoring, scoped data visibility.\u003c/li>\u003cli>\u003cstrong>Axis B — Storage.\u003c/strong> Decomposed (v2) into three independent parts: which \u003cstrong>backend driver\u003c/strong> stores a DocType's rows, which \u003cstrong>ownership mode\u003c/strong> we hold over that store, and which \u003cstrong>sync bindings\u003c/strong> connect it to other systems.\u003c/li>\u003cli>\u003cstrong>Axis C — Physical naming &amp; augmentation.\u003c/strong> Naming policy, reflection, opt-in audit columns, refactoring.\u003c/li>\u003cli>\u003cstrong>Axis D — Extensibility &amp; distribution (v3).\u003c/strong> How functionality is packaged, contributed, composed, and upgraded: contribution points, micro/macro granularity, upgrade-safe customization, trust tiers.\u003c/li>\u003cli>\u003cstrong>Axis E — Time (v4).\u003c/strong> How \u003cem>data\u003c/em> changes over time and how the past is seen: versioning, audit trail, effectivity dating, as-of reads.\u003c/li>\u003cli>\u003cstrong>Axis F — Change lifecycle (v4).\u003c/strong> How \u003cem>metadata/config\u003c/em> change moves safely: environments, promotion, preview/diff, rollback.\u003c/li>\u003cli>\u003cstrong>Axis G — Actors &amp; identity (v4).\u003c/strong> Who or what is acting — internal humans, portal users, machines, AI agents — and how identity propagates across storage backends and sync boundaries.\u003c/li>\u003c/ul>\n\u003cp>Each axis answers one question: A \u003cem>who administers what\u003c/em>; B \u003cem>where data lives and who owns it\u003c/em>; C \u003cem>what we impose on physical stores\u003c/em>; D \u003cem>how functionality arrives and evolves\u003c/em>; E \u003cem>how data moves through time\u003c/em>; F \u003cem>how metadata moves through environments\u003c/em>; G \u003cem>who is acting\u003c/em>. E and F are deliberate mirrors: E is time for data, F is time for definitions.\u003c/p>\n\u003cp>Multi-tenancy (\u003ca class=\"fid-link\" href=\"#/f/PLAT-008\">PLAT-008\u003c/a> sites) is parked: orthogonal to all seven, already works, not a key requirement.\u003c/p>\n\u003chr>\n\u003ch2 id=\"2-axis-a-organization-delegated-administration\">2. Axis A — Organization &amp; delegated administration\u003c/h2>\n\u003ch3 id=\"2-1-the-hierarchy\">2.1 The hierarchy\u003c/h3>\n\u003cpre>\u003ccode>App  (helpdesk, mdm, erp)          ← deployable functionality; app admin\n └─ Module (finance, legal, recon…) ← ADMIN DELEGATION BOUNDARY, not a label\n     ├─ Types (ticket types, doc subtypes)  ← module admin authors these\n     ├─ Config records (SLAs, routing, approval rules)\n     └─ Data rows (tickets…), scoped by a module/department dimension\u003c/code>\u003c/pre>\n\u003cp>Today \u003ccode>module\u003c/code> is only a sidebar grouping. The upgrade: \u003cstrong>module becomes a first-class scope\u003c/strong> with (a) an admin role per module, (b) metadata-authoring permissions checked against it, and (c) an optional row-scoping dimension on transactional DocTypes enforced by the permission layer.\u003c/p>\n\u003ch3 id=\"2-2-the-delegation-matrix\">2.2 The delegation matrix\u003c/h3>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Capability\u003c/th>\u003cth>Platform admin\u003c/th>\u003cth>App admin\u003c/th>\u003cth>Module admin\u003c/th>\u003cth>End user\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Create/alter any DocType, connections, apps\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>App-wide DocTypes, global types, cross-module routing\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>Types\u003c/strong> (field-sets) in own module, SLAs, module roles, assignment rules\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Author/act on records per role &amp; scope\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Key distinction: a module admin does \u003cstrong>not\u003c/strong> create free-standing DocTypes (no new tables); they create \u003cem>types\u003c/em> of the app's base entities — metadata that composes onto an existing storage shape. Delegated power never reaches DDL.\u003c/p>\n\u003ch3 id=\"2-3-types-base-entity-scoped-field-sets-the-helpdesk-answer\">2.3 Types: base entity + scoped field-sets (the helpdesk answer)\u003c/h3>\n\u003cp>The generic-ticket-then-routed workflow rules out one-DocType-per-ticket-type (rows would migrate between tables on routing; 100 types × N departments = metadata explosion — Frappe's weakness). Instead:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>One base DocType per domain entity\u003c/strong> (\u003ccode>Ticket\u003c/code>) with the common fields (subject, requester, status, department, SLA fields).\u003c/li>\u003cli>\u003cstrong>A Type registry DocType\u003c/strong> (\u003ccode>Ticket Type\u003c/code>): each row owned by a scope (\u003ccode>global\u003c/code> or a module), carrying a \u003cem>field-set\u003c/em> — extra field definitions, conditional layout, SLA/routing defaults, per-type permissions.\u003c/li>\u003cli>Physically: sparse columns (or a typed \u003ccode>jsonb\u003c/code> section) on the base table — the existing Custom Fields machinery (\u003ccode>custom-fields.ts\u003c/code>) already adds columns at runtime; this reuses it under module-admin control.\u003c/li>\u003cli>\u003cstrong>Routing = updating the type (and department) fields on the same row.\u003c/strong> Data and history survive; nothing migrates.\u003c/li>\u003cli>\u003ccode>global\u003c/code>-scoped types are visible everywhere; module-scoped types only inside their module. The intake form shows the generic global type.\u003c/li>\u003c/ul>\n\u003cp>Precedents: Salesforce record types + page layouts; Jira Service Management request types (project-admin-owned, mapped onto shared issue types); ServiceNow's \u003ccode>task\u003c/code> table extension. All converged on \"shared base + scoped field/presentation layer\"; none on table-per-type.\u003c/p>\n\u003ch3 id=\"2-4-generalizing-to-erp\">2.4 Generalizing to ERP\u003c/h3>\n\u003cp>Departments in ERP almost never need new \u003cem>entities\u003c/em> — Item, Vendor, Invoice, GL Entry are company-wide. Departments own:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Subtypes/variants\u003c/strong> of shared entities (order types) — the field-set mechanism above.\u003c/li>\u003cli>\u003cstrong>Configuration records\u003c/strong> (approval matrices, tolerances, number ranges) — ordinary scoped rows.\u003c/li>\u003cli>\u003cstrong>Dimension values\u003c/strong> (cost centers, chart segments) — scoped masters.\u003c/li>\u003cli>\u003cstrong>Row partitions\u003c/strong> (\"AP sees AP invoices\") — a scope dimension + permission filters, not separate storage.\u003c/li>\u003c/ol>\n\u003cp>So the helpdesk model \u003cem>is\u003c/em> the ERP model. Master data is the case where the owning scope is \u003ccode>global\u003c/code> with stewardship — i.e. the MDM product.\u003c/p>\n\u003chr>\n\u003ch2 id=\"3-axis-b-storage-driver-ownership-sync-bindings\">3. Axis B — Storage: driver × ownership × sync bindings\u003c/h2>\n\u003cp>v1 modeled five \"storage classes\" (native / adopted / external-live / mirrored / git-backed). The Convex/InstantDB/legacy requirements showed that conflates three independent choices. v2 decomposes:\u003c/p>\n\u003cpre>\u003ccode>storage descriptor (per DocType, stored in its definition)\n  driver:      postgres | sqlite | duckdb | convex | instantdb |\n               rest | git-files | …            ← HOW to talk to the store\n  connection:  named connection from the registry (env-var creds)\n  mode:        owned | adopted | foreign       ← WHAT RIGHTS we hold\n  mapping:     physical table/collection/path, pk column, field map\n\nsync bindings (per DocType, zero or more — a separate object, NOT a mode)\n  target:      named connection (any driver)\n  direction:   push | pull | bidirectional\n  trigger:     on-approve | on-write | schedule\n  key crosswalk, field-ownership map, conflict policy\u003c/code>\u003c/pre>\n\u003cp>v1's classes map onto this cleanly: native = \u003ccode>postgres/owned\u003c/code>; adopted = \u003ccode>postgres/adopted\u003c/code>; external-live (the Railway case) = \u003ccode>postgres/foreign\u003c/code> — specced in detail as \u003ccode>docs/specs/0001-external-data-sources.md\u003c/code> under ADR 0007; git-backed = \u003ccode>git-files/owned-or-adopted\u003c/code>; mirrored = a local owned/adopted DocType \u003cstrong>plus a sync binding\u003c/strong> — mirroring stops being a storage location and becomes a relationship between two stores, which is what it really is. Spec 0002 (Virtual DocTypes) slots in as the app-supplied custom driver: a controller implementing the adapter protocol for a one-off source, the escape hatch until (or instead of) a first-class driver exists.\u003c/p>\n\u003cp>\u003cstrong>The unifying invariant (unchanged, now sharper):\u003c/strong> everything above the storage layer — ListView, FormView, REST API, permissions, hooks, jobs — is storage-agnostic. The document engine dispatches through a \u003cstrong>storage adapter interface\u003c/strong> per driver. This is Frappe's Virtual DocType idea made declarative, and it is the load-bearing architectural bet.\u003c/p>\n\u003ch3 id=\"3-1-the-adapter-interface-and-the-capability-matrix\">3.1 The adapter interface and the capability matrix\u003c/h3>\n\u003cp>One interface, roughly: \u003ccode>getList(filters, sort, page)\u003c/code>, \u003ccode>getDoc(pk)\u003c/code>, \u003ccode>insert\u003c/code>, \u003ccode>update\u003c/code>, \u003ccode>delete\u003c/code>, \u003ccode>count\u003c/code>, plus optional \u003ccode>introspect()\u003c/code> (reflection), \u003ccode>transact()\u003c/code> (atomic multi-write), \u003ccode>subscribe()\u003c/code> (realtime).\u003c/p>\n\u003cp>Drivers are not equal, and pretending they are is how frameworks rot. Each driver \u003cstrong>declares capabilities\u003c/strong>, and the engine degrades features explicitly (greyed-out, not broken) — the same design as Hasura's NDC connector spec (a capabilities endpoint negotiates what each source supports; pushdown where possible) and Trino's connector SPI:\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Capability\u003c/th>\u003cth>postgres\u003c/th>\u003cth>sqlite/duckdb\u003c/th>\u003cth>convex\u003c/th>\u003cth>instantdb\u003c/th>\u003cth>rest\u003c/th>\u003cth>git-files\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Filter/sort/page pushdown\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔ (indexes)\u003c/td>\u003ctd>✔ (InstaQL)\u003c/td>\u003ctd>endpoint-dependent\u003c/td>\u003ctd>in-memory\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Transactions (multi-row lifecycle)\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔ (mutations)\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✗ (usually)\u003c/td>\u003ctd>per-commit\u003c/td>\u003c/tr>\u003ctr>\u003ctd>DDL / schema change by us\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>schema-in-code\u003c/td>\u003ctd>schema push\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>file format\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reflection (\u003ccode>introspect\u003c/code>)\u003c/td>\u003ctd>✔ (info_schema)\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✔ (schema export)\u003c/td>\u003ctd>✔ (schema)\u003c/td>\u003ctd>OpenAPI, best-effort\u003c/td>\u003ctd>header/sample\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Realtime subscriptions\u003c/td>\u003ctd>via our WS layer\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✔ native\u003c/td>\u003ctd>✔ native\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>webhook\u003c/td>\u003c/tr>\u003ctr>\u003ctd>RLS enforcement in-store\u003c/td>\u003ctd>✔\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗ (server fns)\u003c/td>\u003ctd>permissions lang\u003c/td>\u003ctd>✗\u003c/td>\u003ctd>✗\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Notes for the named backends:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Convex\u003c/strong> — a reactive transactional document store; all access goes through TypeScript queries/mutations. A driver wraps the Convex client SDK; its native reactivity can feed our websocket layer directly, making Convex-backed DocTypes \u003cem>more\u003c/em> live than Postgres ones. Schema lives in code (\u003ccode>defineSchema\u003c/code>), so \"DDL\" means generating/pushing that file — owned mode is possible but different in kind.\u003c/li>\u003cli>\u003cstrong>InstantDB\u003c/strong> — client-first sync DB (triple store over Postgres, InstaQL relational queries, offline + optimistic updates). Same story: driver wraps the SDK/Admin API, realtime is native, schema is pushable.\u003c/li>\u003cli>\u003cstrong>Legacy app DB\u003c/strong> (clinical system) — usually just \u003ccode>postgres\u003c/code>/\u003ccode>mysql\u003c/code> driver in \u003ccode>foreign\u003c/code> mode against the legacy database, or \u003ccode>rest\u003c/code> against its API — plus sync bindings (§3.3). The legacy \u003cem>app\u003c/em> keeps running; we are only another client.\u003c/li>\u003cli>\u003cstrong>rest\u003c/strong> — the fully general fallback (covers SaaS without DB access). Capabilities are per-endpoint; expect in-memory filtering caps and no transactions.\u003c/li>\u003cli>\u003cstrong>sqlite / duckdb\u003c/strong> — embedded analytical/local files; near-postgres capabilities minus RLS and concurrent writers; DuckDB notably good for read-heavy analytical DocTypes over parquet/CSV.\u003c/li>\u003c/ul>\n\u003cp>\u003cstrong>Degradation rules the engine must enforce (not per-driver, global):\u003c/strong>\u003c/p>\n\u003cul>\u003cli>Lifecycle transactionality is guaranteed only within one backend; a save touching an external backend plus local rows (audit, jobs) is two commits, surfaced honestly in the sync/log status.\u003c/li>\u003cli>\u003cstrong>Cross-backend Link fields are reference-only\u003c/strong>: store the foreign key, resolve the title on read, no joins, no cascade, no \u003ccode>EXISTS\u003c/code> filters. Full link features (join-powered list columns, cascading rename) require both DocTypes on the same connection.\u003c/li>\u003cli>Naming series, permission checks, and hooks always run on the core (Postgres) side regardless of the target backend — counters and authorization never delegate to a foreign store.\u003c/li>\u003cli>Postgres RLS applies only to local tables; for every other driver the server-side permission gate is the sole enforcement (stated as a consequence in ADR 0007).\u003c/li>\u003c/ul>\n\u003ch3 id=\"3-2-ownership-modes\">3.2 Ownership modes\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>owned\u003c/strong> — we created the store/table, full rights, framework manages schema (per driver's notion of schema).\u003c/li>\u003cli>\u003cstrong>adopted\u003c/strong> — pre-existing store we now administer: reflect first (Axis C), keep names verbatim, additive-only augmentation, outside writers tolerated (conflict detection via updated-at where available).\u003c/li>\u003cli>\u003cstrong>foreign\u003c/strong> — someone else's system of record: pass-through reads/writes, \u003cstrong>never any DDL\u003c/strong>, reflection read-only, degrade per capability matrix. (The Railway control plane; the clinical system's DB; any SaaS API.)\u003c/li>\u003c/ul>\n\u003ch3 id=\"3-3-sync-bindings-the-engine-for-mirrored-data\">3.3 Sync bindings — the engine for mirrored data\u003c/h3>\n\u003cp>One engine, three directional modes:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Push\u003c/strong> (we author → they consume; SAP master data): triggered on lifecycle events (typically on-approve/submit, not every keystroke) and/or schedule. Requires an \u003cstrong>outbox\u003c/strong> (transactional queue row per change, riding \u003ccode>tab_background_job\u003c/code>), retry with backoff, a dead-letter/error surface, per-record sync status in the UI.\u003c/li>\u003cli>\u003cstrong>Pull\u003c/strong> (they author → we mirror for reads/joins; SaaS reference data): scheduled or webhook-driven import into a local copy.\u003c/li>\u003cli>\u003cstrong>Bidirectional\u003c/strong> (SaaS master sync; legacy coexistence): requires a \u003cstrong>field-ownership/survivorship map\u003c/strong> — system of record decided \u003cem>per field\u003c/em>, not per record (\"we own payment terms, the SaaS owns billing e-mail\"); conflicts outside the map go to a review queue, never silent last-write-wins.\u003c/li>\u003cli>\u003cstrong>Key crosswalk\u003c/strong> (all modes): \u003ccode>our id ↔ external id\u003c/code> per target system. External systems assign their own keys; pretending otherwise is how syncs rot.\u003c/li>\u003cli>\u003cstrong>Reconciliation\u003c/strong> (all modes): periodic compare producing a drift report (missing here/there, field mismatches), because every sync eventually lies.\u003c/li>\u003c/ul>\n\u003ch4 id=\"analytics-egress-the-lakehouse-as-a-push-target-v6-d20\">Analytics egress: the lakehouse as a push target (v6, D20)\u003c/h4>\n\u003cp>The MDM app's strategic purpose is that master data flows \u003cem>into\u003c/em> the bronze/silver (medallion) layers — and today that flow's config is hand-written CSV. Egress to analytics is a \u003cstrong>push-mode sync binding\u003c/strong> with one special property: the target wants \u003cem>changes\u003c/em>, not state.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Transport by capability:\u003c/strong> Postgres logical replication / Debezium for local tables (zero app work — the DB emits row-level changes); the outbox for adopted/external sources without replication; periodic snapshot for small dimensions.\u003c/li>\u003cli>\u003cstrong>Auto-generation (the point):\u003c/strong> a DocType already contains everything a medallion onboarding config holds — table, fields, types, PK, \u003ccode>modified\u003c/code> (the incremental/precombine key), soft-delete, and (D16) effectivity columns. So the engine emits, as one-way D19 artifacts: the existing bronze/silver CSV config (same format, now derived), dbt \u003ccode>sources.yml\u003c/code> + staging models with tests from field metadata, and HoodieStreamer / DLT-META Dataflowspec configs where that stack runs. Regenerated on DocType change, so warehouse schema drift follows metadata promotion (Axis F) instead of surprising the pipeline.\u003c/li>\u003cli>\u003cstrong>Axis E → SCD2 free:\u003c/strong> version history + effectivity dating map directly onto slowly-changing-dimension handling; replay (\"changes since T\") is the handshake with lakehouse incremental queries (Hudi's timeline model — see \u003ccode>docs/research/studies/hudi-lakehouse.md\u003c/code>).\u003c/li>\u003cli>\u003cstrong>The loop that justifies MDM:\u003c/strong> govern customer/vendor/item upstream, \u003cem>generate\u003c/em> the warehouse's conformed dimensions from the same DocTypes downstream. One metadata source; data modeling stops being a separate discipline.\u003c/li>\u003c/ul>\n\u003ch4 id=\"layer-economics-does-a-clean-system-of-record-need-bronze-v7\">Layer economics: does a clean system of record need bronze? (v7, D21)\u003c/h4>\n\u003cp>The medallion layers exist for reasons a clean SoR mostly removes — so apply them \u003cem>per source\u003c/em>, not as dogma:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>What bronze is actually for:\u003c/strong> replay without re-extracting; an audit of what the source said at time T; decoupling ingestion from transformation; surviving source downtime; making N heterogeneous sources look uniform. For a \u003cstrong>messy foreign source (SAP)\u003c/strong> every one of those applies — full medallion justified.\u003c/li>\u003cli>\u003cstrong>Where Featherbase is the SoR, those jobs are already done\u003c/strong> by Axis E: version history \u003cem>is\u003c/em> the audit, replay (\"changes since T\") \u003cem>is\u003c/em> re-extraction, and the egress artifacts are typed. So \u003cstrong>bronze collapses to a thin CDC landing zone — or is skipped\u003c/strong> — and the D20 generator can emit \u003cem>silver directly\u003c/em>: a typed, keyed, SCD2-handled mirror needs no human modeling because the DocType already is the model. Real modeling work only genuinely exists at \u003cstrong>gold\u003c/strong> (cross-system business marts), which no generator should pretend to own.\u003c/li>\u003cli>\u003cstrong>Two reasons to keep a thin landing layer anyway:\u003c/strong> compute isolation (analytics never queries the operational database) and pipeline uniformity (when SAP-messy and Featherbase-clean sources feed the same warehouse, one landing convention keeps the orchestration simple). Both argue for \u003cem>thin and generated\u003c/em>, not absent.\u003c/li>\u003cli>\u003cstrong>Warehouse mapping/seed tables come home.\u003c/strong> The reference and mapping tables that today live as hand-edited seeds \u003cem>inside\u003c/em> the warehouse (nowhere else to put them) are exactly master data without a master: they become MDM DocTypes — governed, audited, effective-dated — and egress like everything else. This alone repays the MDM app.\u003c/li>\u003c/ul>\n\u003ch4 id=\"the-warehouse-browser-the-desk-over-motherduck-v7\">The warehouse browser: the Desk over MotherDuck (v7)\u003c/h4>\n\u003cp>The reverse direction, discovered from practice: bronze/silver/gold tables in MotherDuck currently have \u003cstrong>no UI at all\u003c/strong> beyond a SQL prompt. Featherbase's existing machinery covers this with almost nothing new — a \u003cem>Datasette-for-the-lakehouse\u003c/em>:\u003c/p>\n\u003cul>\u003cli>MotherDuck/DuckDB is a \u003cstrong>connection\u003c/strong> with the \u003ccode>duckdb\u003c/code> driver in \u003cstrong>foreign, read-only\u003c/strong> mode (spec 0001's read-only sources + table allowlists apply verbatim); reflection adopts each layer's tables as read-only DocTypes.\u003c/li>\u003cli>The topology maps directly: each source system's bronze schema (\u003ccode>bronze_sap\u003c/code>, \u003ccode>bronze_salesforce\u003c/code>) and each silver schema adopt as a group — surfaced as \u003cstrong>modules\u003c/strong> in the Desk sidebar (bronze-sap, silver, gold), giving analysts saved \u003cstrong>views\u003c/strong> (the NocoDB lesson: fields + filters + sort as shareable objects) instead of SQL-only access.\u003c/li>\u003cli>Engine laws hold unchanged: no DDL ever, no writes (read-only mode), permissions server-side, drift re-sync when dbt reshapes a table.\u003c/li>\u003cli>Payoff: Featherbase fronts \u003cem>both ends\u003c/em> of the pipe — master data authored and governed on the way in, every layer browsable on the way out — with the same generic ListView.\u003c/li>\u003c/ul>\n\u003ch4 id=\"the-legacy-coexistence-pattern-the-doctor-s-clinical-system\">The legacy-coexistence pattern (the doctor's clinical system)\u003c/h4>\n\u003cp>This is the \u003cstrong>strangler-fig migration\u003c/strong> made operational, and the field-ownership map is the migration \u003cem>dial\u003c/em>:\u003c/p>\n\u003col>\u003cli>\u003cstrong>Mirror\u003c/strong> — pull binding from the legacy DB/API into a local adopted copy; our UI is read-only. Zero risk; the doctor sees everything in the new UI on day one.\u003c/li>\u003cli>\u003cstrong>Co-write\u003c/strong> — flip ownership of specific fields/DocTypes to us (appointments notes? new custom fields that don't exist in the legacy system at all?); bidirectional binding keeps the legacy UI truthful for the rest of the team. Conflict queue guards the overlap.\u003c/li>\u003cli>\u003cstrong>Extend\u003c/strong> — new capabilities (new DocTypes, workflows, reports) are born native on our side, linked to mirrored entities; the legacy system never sees them.\u003c/li>\u003cli>\u003cstrong>Retire\u003c/strong> — ownership map ends up fully ours; the pull binding becomes an archive; the legacy system is switched off. No big-bang cutover at any step, and each step is a config change, not a build.\u003c/li>\u003c/ol>\n\u003ch3 id=\"3-4-git-files-driver-ui-without-losing-diffability\">3.4 git-files driver — UI without losing diffability\u003c/h3>\n\u003cul>\u003cli>Repo binding per DocType: repo, branch, path, format (CSV/YAML/JSON); row = record.\u003c/li>\u003cli>Reads from a local clone/cache refreshed by webhook or poll.\u003c/li>\u003cli>Writes become \u003cstrong>commits authored as the acting user\u003c/strong>; per-DocType policy: direct commit, or branch + PR (client edits arrive as reviewable PRs; agents keep editing the same files; the diff \u003cem>is\u003c/em> the history).\u003c/li>\u003cli>The DocType's validation metadata gates the UI \u003cstrong>and\u003c/strong> can run in CI on the repo, so agent edits get the same checks.\u003c/li>\u003cli>Conflicts surface as ordinary git conflicts on the PR — no framework magic. Precedents: Decap/Tina CMS, dbt-style config-as-code.\u003c/li>\u003c/ul>\n\u003ch3 id=\"3-5-storage-inside-our-own-postgres-the-non-dimension\">3.5 Storage inside our own Postgres (the non-dimension)\u003c/h3>\n\u003cp>Multiple databases in one PG instance cannot be joined or share a transaction — reject. Multiple schemas buy naming isolation we don't need once table names are free (Axis C). \u003cstrong>Default: one database, one schema for all apps and modules\u003c/strong>, with the schema-per-site machinery kept dormant for the day multi-tenancy matters.\u003c/p>\n\u003chr>\n\u003ch2 id=\"4-axis-c-naming-reflection-augmentation\">4. Axis C — Naming, reflection, augmentation\u003c/h2>\n\u003ch3 id=\"4-1-physical-name-belongs-in-metadata-not-in-a-function\">4.1 Physical name belongs in metadata, not in a function\u003c/h3>\n\u003cp>\u003ccode>tableName()\u003c/code> currently derives \u003ccode>tab_&lt;name&gt;\u003c/code> (\u003ccode>doctype-engine.ts:95\u003c/code>) — the same design smell as Frappe's prefix, and the direct blocker for adoption. To ratify:\u003c/p>\n\u003cul>\u003cli>Every DocType stores an explicit \u003cstrong>\u003ccode>table_name\u003c/code>\u003c/strong> (or collection/path — the mapping half of the storage descriptor).\u003c/li>\u003cli>New owned DocTypes default from a configurable policy (plain \u003ccode>snake_case\u003c/code>; a prefix is a policy \u003cem>option\u003c/em>, never a requirement).\u003c/li>\u003cli>Adopted stores keep their names verbatim.\u003c/li>\u003cli>Logical and physical names decouple: renaming a DocType is a metadata edit; renaming a column/table is an explicit, tracked migration the engine generates — the refactoring story Frappe never had and Directus / Prisma Migrate do well.\u003c/li>\u003c/ul>\n\u003ch3 id=\"4-2-reflection-api-a-driver-capability\">4.2 Reflection API — a driver capability\u003c/h3>\n\u003cp>\u003ccode>introspect(connection, target)\u003c/code> → proposed DocType: columns→fields with type mapping, PK detection, nullability→reqd, FKs→Link candidates. Adoption is a \u003cem>review\u003c/em> step (accept/adjust), and the same diff machinery serves later drift re-sync (shared with spec 0001's introspection and drift-detection groups). Each driver implements \u003ccode>introspect\u003c/code> per its catalog: \u003ccode>information_schema\u003c/code>, Convex/Instant schema exports, OpenAPI for REST (best-effort), header/sample inference for files — Airbyte's \"catalog discovery\" is the precedent for reflection-across-heterogeneous-sources.\u003c/p>\n\u003ch3 id=\"4-3-augmentation-ladder-opt-in-additive-bounded-by-mode\">4.3 Augmentation ladder (opt-in, additive, bounded by mode)\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Level 0 — none\u003c/strong>: as-is (the only option in \u003ccode>foreign\u003c/code> mode).\u003c/li>\u003cli>\u003cstrong>Level 1 — audit\u003c/strong>: \u003ccode>created_at/by\u003c/code>, \u003ccode>updated_at/by\u003c/code> (enables conflict detection and history).\u003c/li>\u003cli>\u003cstrong>Level 2 — full standard columns\u003c/strong>: only when a table graduates to a fully framework-managed entity.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"5-a-different-database-must-be-a-different-app-evaluation\">5. \"A different database must be a different app\" — evaluation\u003c/h2>\n\u003cp>The proposed simplification is \u003cem>almost\u003c/em> right. Where it holds and where it breaks:\u003c/p>\n\u003cp>\u003cstrong>What it gets right.\u003c/strong> An app is the natural unit of packaging and operations: one backend per app means one connection to configure, one failure domain (backend down → one app degraded, Desk fine — spec 0001's failure semantics generalized), one backup story, full-featured Links \u003cem>within\u003c/em> the app, and an install manifest that can declare its driver dependency. It also matches reality: a Convex app's DocTypes will practically all live in that Convex deployment.\u003c/p>\n\u003cp>\u003cstrong>Where a hard rule breaks, on this document's own use cases:\u003c/strong>\u003c/p>\n\u003col>\u003cli>\u003cstrong>Core doctypes are always local.\u003c/strong> Users, roles, permissions, files, jobs, audit live on core Postgres; every app links to them. So \"one backend per app\" can never mean full isolation — it can only govern the app's \u003cem>own\u003c/em> DocTypes.\u003c/li>\u003cli>\u003cstrong>The strangler pattern violates it by design\u003c/strong> (§3.3): the clinical app holds mirrored-adopted local DocTypes \u003cem>and\u003c/em> new native DocTypes \u003cem>and\u003c/em> (early on) maybe a foreign passthrough — one app, one client journey, multiple storage positions that \u003cem>change over time\u003c/em>. Forcing an app split per phase would be absurd.\u003c/li>\u003cli>\u003cstrong>Sync bindings blur it anyway\u003c/strong>: an MDM app whose rows are local but bound to SAP + two SaaS targets is already talking to four backends.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>Resolution — policy, not constraint:\u003c/strong>\u003c/p>\n\u003cul>\u003cli>\u003cstrong>D9a.\u003c/strong> The storage descriptor stays \u003cstrong>per-DocType\u003c/strong> (the framework never structurally forbids mixing), because the migration/coexistence cases demand it.\u003c/li>\u003cli>\u003cstrong>D9b.\u003c/strong> \"One \u003cem>primary\u003c/em> backend per app\" is the \u003cstrong>strongly-recommended default\u003c/strong>: the app manifest declares a default connection; a DocType deviating from it is a deliberate, flagged exception (lint/warning + visible in the app's storage summary), not a silent choice.\u003c/li>\u003cli>\u003cstrong>D9c.\u003c/strong> The hard rules that actually protect users are the degradation rules of §3.1: cross-backend links reference-only; transactions never span backends; permissions/series/hooks always evaluated on core.\u003c/li>\u003c/ul>\n\u003chr>\n\u003ch2 id=\"6-axis-d-extensibility-distribution-the-plugin-ecosystem\">6. Axis D — Extensibility &amp; distribution (the plugin ecosystem)\u003c/h2>\n\u003cp>The 25-year wish list distilled: Salesforce's \u003cem>platform\u003c/em> qualities, with WordPress's \u003cem>contribution loop\u003c/em> (a stranger fixes a bug, everyone gets it), VS Code's \u003cem>extension mechanics\u003c/em>, and one thing none of them offer — \u003cstrong>taking only parts of a bigger app\u003c/strong>.\u003c/p>\n\u003ch3 id=\"6-1-microkernel-stance-everything-is-a-plugin\">6.1 Microkernel stance: everything is a plugin\u003c/h3>\n\u003cp>The systems whose ecosystems actually thrived (VS Code, WordPress, Eclipse — and in this product category, \u003cstrong>NocoBase\u003c/strong>, whose core does only plugin lifecycle/dependency management while every feature, including its data sources and workflow engine, is a plugin) share one discipline: \u003cstrong>the platform's own features use the same public extension API that third parties use.\u003c/strong> The moment core features get private APIs, the public one rots.\u003c/p>\n\u003cp>For Featherbase: the core is the metadata engine, document engine, permission engine, storage-adapter seam (D5/D7), and the Desk shell with its extension points. Workflow, print, comments, email — and every future app (helpdesk, MDM) — are plugins over that API. The existing \u003ccode>AppManifest\u003c/code> (\u003ca class=\"fid-link\" href=\"#/f/PLAT-001\">PLAT-001\u003c/a>: doctypes, doc_events, scheduler_events, method overrides) is the seed to grow, not replace.\u003c/p>\n\u003ch3 id=\"6-2-typed-contribution-points\">6.2 Typed contribution points\u003c/h3>\n\u003cp>VS Code's key invention is that an extension \u003cem>declares\u003c/em> what it contributes, statically, in its manifest — the platform can render menus, marketplaces, and permission prompts without executing the code, and can activate lazily. Directus proves the same taxonomy works for a metadata-driven admin UI (its nine extension types: interfaces, displays, layouts, modules, panels, hooks, endpoints, operations, bundles).\u003c/p>\n\u003cp>Featherbase contribution points (initial enumeration):\u003c/p>\n\u003cdiv class=\"tablewrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Contribution\u003c/th>\u003cth>Kind\u003c/th>\u003cth>Precedent\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>DocTypes, field-sets/types, seeds\u003c/td>\u003ctd>metadata\u003c/td>\u003ctd>Frappe app doctypes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Fieldtypes: form widget + display + cell renderer\u003c/td>\u003ctd>UI\u003c/td>\u003ctd>Directus interfaces/displays\u003c/td>\u003c/tr>\u003ctr>\u003ctd>List layouts / views (kanban, calendar, map)\u003c/td>\u003ctd>UI\u003c/td>\u003ctd>Directus layouts\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pages / Desk modules, dashboard panels\u003c/td>\u003ctd>UI\u003c/td>\u003ctd>Directus modules/panels\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Workflow node &amp; trigger types\u003c/td>\u003ctd>logic\u003c/td>\u003ctd>Directus operations, n8n nodes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lifecycle hooks, scheduled jobs\u003c/td>\u003ctd>logic\u003c/td>\u003ctd>existing doc_events\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API endpoints / RPC methods\u003c/td>\u003ctd>logic\u003c/td>\u003ctd>existing overrides\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Storage drivers, sync connectors\u003c/td>\u003ctd>platform\u003c/td>\u003ctd>D7; Hasura NDC\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Roles/permission templates, reports, print formats\u003c/td>\u003ctd>metadata\u003c/td>\u003ctd>Frappe fixtures\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Metadata contributions are declarative JSON — reviewable, diffable, installable without running code. Code contributions (widgets, hooks, drivers) ride the trust tiers of §6.5. Server + client halves ship in one package (the Strapi/NocoBase pattern).\u003c/p>\n\u003ch3 id=\"6-3-package-capability-micro-macro-composability\">6.3 Package ≠ capability: micro/macro composability\u003c/h3>\n\u003cp>The \"I can't take just a part of a VS Code extension\" complaint is a real design gap in every ecosystem above, and the fix is to split two concepts those systems fuse:\u003c/p>\n\u003cul>\u003cli>\u003cstrong>Package\u003c/strong> — the distribution unit (an npm package; how code/metadata travels, is versioned, and gets bug fixes).\u003c/li>\u003cli>\u003cstrong>Capability\u003c/strong> — the enableable unit: a named group of contributions \u003cem>inside\u003c/em> a package, with its own dependency list.\u003c/li>\u003c/ul>\n\u003cp>A macro package (\"Helpdesk\") exposes capabilities — ticket base + types, SLA engine, assignment rules, portal — each installable/enableable separately, with dependencies declared \u003cstrong>capability-to-capability\u003c/strong> (SLA requires ticket base; it does not require the portal). A micro package may be a single widget. Installing a package enables a chosen subset, not everything. Precedents: \u003cstrong>Medusa's commerce modules\u003c/strong> (cart, inventory, pricing usable standalone — the closest existing realization), Odoo's \u003ccode>depends\u003c/code>/\u003ccode>auto_install\u003c/code> graph at module level; anti-precedent: VS Code's all-or-nothing extensions — the user's criticism is correct.\u003c/p>\n\u003cp>This also resolves terminology across the axes: \u003cstrong>\"app\" and \"platform extension\" are roles of the same package format\u003c/strong> (as in Frappe, where everything is an app, and NocoBase, where everything is a plugin). Axis A's \u003cem>module\u003c/em> (admin delegation scope) is untouched — a package can \u003cem>contribute\u003c/em> modules, but module ≠ package.\u003c/p>\n\u003ch3 id=\"6-4-upgrade-safe-customization-the-salesforce-lesson\">6.4 Upgrade-safe customization: the Salesforce lesson\u003c/h3>\n\u003cp>The single best idea in the user's favorite design: in a Salesforce subscriber org, \u003cstrong>managed-package metadata is not editable — it is extendable\u003c/strong>, per-component manageability rules decide what the subscriber may touch, and package upgrades therefore never collide with customizations. Frappe approximates this with Custom Field / Property Setter overlays; ADR 0003 already gave Featherbase the two-source model (\u003ccode>source: package | site\u003c/code>, drift detection, byte-identical promotion round-trip). Axis D generalizes it to a \u003cstrong>layer stack\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode>package layers (one per installed package, versioned, read-only on site)\n  └─ site overlay (custom fields, property setters, layout/permission\n     overrides — created via UI, owned by the site)\n        └─ effective metadata (deterministic merge, cached)\u003c/code>\u003c/pre>\n\u003cp>Rules: a package upgrade replaces only its own layer; the site overlay survives by construction; conflicts (package now ships a field the site had customized) are detected at upgrade time and resolved explicitly, not silently. \u003cstrong>This is what makes the WordPress loop safe\u003c/strong>: the bug fix reaches every site because updating a package cannot stomp what sites built on top of it.\u003c/p>\n\u003ch3 id=\"6-5-trust-isolation-tiers\">6.5 Trust &amp; isolation tiers\u003c/h3>\n\u003cul>\u003cli>\u003cstrong>Tier 1 — reviewed packages\u003c/strong> (npm, in-process): full API. WordPress's low contribution barrier, but gated by the conformance suites (D7 generalized: one suite per contribution type) and, when a marketplace exists, a review step — Salesforce's AppExchange security review is the model.\u003c/li>\u003cli>\u003cstrong>Tier 2 — site scripts\u003c/strong> (already exist: server-scripts.ts): sandboxed, site-authored, no package needed — the escape hatch that keeps tier 1 honest.\u003c/li>\u003cli>\u003cstrong>Tier 3 — out-of-process services\u003c/strong>: storage drivers/sync connectors may run as separate services speaking the adapter protocol (Hasura NDC shape) where isolation or another language matters.\u003c/li>\u003c/ul>\n\u003cp>UI contributions prefer \u003cstrong>declarative schema over arbitrary JS\u003c/strong> (render from metadata where possible — NocoBase's UI-schema approach); a full-code widget is a tier-1 contribution by definition.\u003c/p>\n\u003ch3 id=\"6-6-generation-vs-interpretation-v5\">6.6 Generation vs interpretation (v5)\u003c/h3>\n\u003cp>Every platform in the study series sits on one spectrum: \u003cstrong>interpret the model at runtime\u003c/strong> (Frappe, Salesforce, ServiceNow, NocoBase, Directus — users change the system live, upgrades can't collide with code nobody wrote) or \u003cstrong>generate code from the model\u003c/strong> (JHipster, ScaffoldHub, Rails scaffolding, the 2000s XML→EJB MDM generators — readable, refactorable, test-pyramid-included code you own, at the price of the \u003cstrong>round-trip problem\u003c/strong>: the moment output is edited, the model lies).\u003c/p>\n\u003cp>Featherbase's position (\u003cstrong>D19\u003c/strong>): interpretation is the source of truth — that is what makes runtime DocTypes, module admins, and upgrade-safe layers possible at all. Generation exists only as \u003cstrong>one-way derived artifacts\u003c/strong>, regenerable precisely because nobody edits them: TypeScript types, typed API clients, hook stubs, test skeletons, seed fixtures (ADR 0003 already promised this for package mode). The \u003cstrong>eject\u003c/strong> of a DocType to fully owned code is the deliberate off-ramp for a client who outgrows metadata — one-way, with re-entry only via Axis C adoption (reflect what the table became), never by merging code back into metadata. And the generator family sets the deliverable bar regardless: an entity isn't done until its tests and seeds exist (the JHipster standard), and overriding defaults means writing ordinary code through contribution points, never a second DSL (the Administrate principle).\u003c/p>\n\u003chr>\n\u003ch2 id=\"7-the-axes-v1-v3-missed-v4\">7. The axes v1–v3 missed (v4)\u003c/h2>\n\u003ch3 id=\"7-1-axis-e-time
