# Names every app whose built files moved under an unchanged version since the
# release branch (#1044). Production's deploy would stop on such an app. Its own
# workflow, so test.yml's required checks are unchanged; each run builds the
# instance's apps twice, so it runs only when an app's files could have moved.
name: app-digests

on:
  pull_request:
    paths:
      - packages/**
      - example-apps/**
      - client-apps/**
      - pnpm-lock.yaml
      - tools/check-app-digests*
      - tools/build-instance-apps.mjs
      - tools/dev.mjs
      - .github/workflows/app-digests.yml
  push:
    branches: [main]
    paths:
      - packages/**
      - example-apps/**
      - client-apps/**
      - pnpm-lock.yaml
      - tools/check-app-digests*
      - tools/build-instance-apps.mjs
      - tools/dev.mjs
      - .github/workflows/app-digests.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  digests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:app-digests --release origin/release/jeyarama-dash-prod
