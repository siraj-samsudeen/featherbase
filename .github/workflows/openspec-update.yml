# Weekly check for a newer @fission-ai/openspec release. The CLI is exactly
# pinned in root package.json (ADR 0010) rather than left on a caret range, so
# this workflow is the deliberate substitute for a human remembering to bump
# it: it compares the published version to the pin, and when there is a newer
# one it bumps the pin, regenerates the OpenSpec-generated skills and commands for the
# same tool targets the repo already uses (Claude Code's .claude/ and the
# generic .agents/ target), and opens a PR for review. It never merges
# anything itself.
#
# A local pnpm patch (patches/@fission-ai__openspec@<version>.patch, wired in
# pnpm-workspace.yaml's patchedDependencies) is keyed to the pinned version, so
# the bump carries it forward: it dry-runs the patch against the new release's
# npm tarball and, if it applies, renames the patch and its
# patchedDependencies entry to the new version. If it does not apply, the job
# fails and opens no PR; the patch must be ported by hand. The install runs
# with --no-frozen-lockfile because the bump changes the lockfile.
name: openspec-update

on:
  schedule:
    # Monday 06:00 UTC. Cron runs on the default branch only.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: pnpm

      - name: Read current pin and latest published version
        id: versions
        run: |
          current=$(node -p "require('./package.json').devDependencies['@fission-ai/openspec']")
          latest=$(npm view @fission-ai/openspec version)
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Current pin: $current"
          echo "Latest on npm: $latest"

      - name: Skip if already current
        if: steps.versions.outputs.current == steps.versions.outputs.latest
        run: echo "Already pinned to the latest published version; nothing to do." >> "$GITHUB_STEP_SUMMARY"

      - name: Skip if a PR for this version already exists
        if: steps.versions.outputs.current != steps.versions.outputs.latest
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="OpenSpec ${{ steps.versions.outputs.current }} → ${{ steps.versions.outputs.latest }}"
          count=$(gh pr list --state all --search "in:title \"$title\"" --json number --jq 'length')
          echo "exists=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Carry the local patch forward before installing: pnpm fails with
      # ERR_PNPM_UNUSED_PATCH when patchedDependencies names a version that is
      # no longer installed. --forward makes a patch the release already
      # contains count as not applying, so a human decides whether to drop it.
      - name: Bump the pin
        id: bump
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.existing.outputs.exists == 'false'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          old_patch="patches/@fission-ai__openspec@$CURRENT.patch"
          new_patch="patches/@fission-ai__openspec@$LATEST.patch"
          if [ -f "$old_patch" ]; then
            pkg="$RUNNER_TEMP/openspec-$LATEST"
            mkdir -p "$pkg"
            (cd "$pkg" && npm pack "@fission-ai/openspec@$LATEST" --silent > /dev/null && tar xzf ./*.tgz)
            if ! patch -p1 --dry-run --forward -d "$pkg/package" -i "$PWD/$old_patch"; then
              echo "::error::the local OpenSpec patch no longer applies to $LATEST; port it by hand ($old_patch)"
              exit 1
            fi
            mv "$old_patch" "$new_patch"
            sed -i "s|'@fission-ai/openspec@$CURRENT': $old_patch|'@fission-ai/openspec@$LATEST': $new_patch|" pnpm-workspace.yaml
            grep -qF "'@fission-ai/openspec@$LATEST': $new_patch" pnpm-workspace.yaml \
              || { echo "::error::could not repoint patchedDependencies in pnpm-workspace.yaml to $new_patch"; exit 1; }
            echo "patch=carried" >> "$GITHUB_OUTPUT"
          else
            echo "patch=none" >> "$GITHUB_OUTPUT"
          fi
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.devDependencies['@fission-ai/openspec'] = '${{ steps.versions.outputs.latest }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "
          pnpm install --no-frozen-lockfile

      # Regenerate the generated files in place for the repo's two tool
      # targets. The workflow set is the one the intent-driven template uses
      # (ADR 0014): the core six plus new, continue, verify and bulk-archive;
      # ff and onboard are left out. The CLI reads that set from its global
      # config, so the step writes one into a throwaway XDG_CONFIG_HOME
      # (run the same two commands locally to regenerate by hand). It never
      # touches openspec/config.yaml, openspec/schemas/ or the template's own
      # skills, which the CLI does not manage.
      - name: Regenerate OpenSpec generated files
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.existing.outputs.exists == 'false'
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/openspec-config"
          mkdir -p "$XDG_CONFIG_HOME/openspec"
          echo '{"profile":"custom","delivery":"both","workflows":["propose","explore","apply","archive","sync","update","new","continue","verify","bulk-archive"]}' > "$XDG_CONFIG_HOME/openspec/config.json"
          OPENSPEC_TELEMETRY=0 node_modules/.bin/openspec init --tools claude,agents --profile custom --force --no-animation
          git diff --stat -- openspec/config.yaml | (! grep .) || (echo "openspec/config.yaml changed unexpectedly; refusing to open a PR" && exit 1)

      - name: Validate
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.existing.outputs.exists == 'false'
        run: pnpm check:specs

      - name: Open PR
        if: steps.versions.outputs.current != steps.versions.outputs.latest && steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current='${{ steps.versions.outputs.current }}'
          latest='${{ steps.versions.outputs.latest }}'
          if [ '${{ steps.bump.outputs.patch }}' = carried ]; then
            patch_note="Carried forward: the local patch applies to $latest unchanged and is renamed to \`patches/@fission-ai__openspec@$latest.patch\` (patchedDependencies updated)"
          else
            patch_note="No local OpenSpec patch to carry forward"
          fi
          branch="openspec-update-$latest"
          git checkout -b "$branch"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "OpenSpec $current → $latest" \
                   -m "Weekly automated bump: pin @fission-ai/openspec to $latest and regenerate the OpenSpec skills and commands under .claude/ and .agents/. openspec/config.yaml is untouched." \
                   -m "$patch_note." \
                   -m "🤖 Generated by the openspec-update workflow"
          git push -u origin "$branch"
          # A PR opened with GITHUB_TOKEN does not trigger other workflows, so
          # test.yml will not run on it; the Validate step above is the check.
          {
            echo "Automated weekly check found a newer \`@fission-ai/openspec\` release."
            echo
            echo "- Pin: \`$current\` → \`$latest\`"
            echo "- Regenerated: OpenSpec skills/commands under \`.claude/\` and \`.agents/\`"
            echo "- Untouched: \`openspec/config.yaml\`"
            echo "- Patch: $patch_note"
            echo "- \`pnpm check:specs\` passed in the workflow run"
            echo
            echo "Review the generated-file diff before merging: an upstream template change can alter skill instructions."
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --title "OpenSpec $current → $latest" --body-file "$RUNNER_TEMP/pr-body.md"
