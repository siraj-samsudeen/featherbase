name: Deploy Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'PROGRESS.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Explorer
        run: node site/build.mjs
      # enablement: true turns Pages on via the API if it is not enabled yet,
      # so this workflow provisions itself instead of failing every docs push
      # with "Get Pages site failed" until someone flips a settings toggle.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
