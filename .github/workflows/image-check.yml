# Builds and checks the server images on pull requests that change how they
# are built (#587). Its own workflow, so test.yml's required checks are
# unchanged. It pushes nothing and logs in to no registry.
#
# It builds both targets of apps/server/Dockerfile, then checks that:
#   - the `platform` target (what publish-image.yml publishes) holds no app
#     and sets no FEATHERBASE_APP_PATHS;
#   - the default target (what Railway builds) still holds Tasker, with
#     today's FEATHERBASE_APP_PATHS;
#   - the platform image runs the release and passes `cli boot-check`
#     against a throwaway Postgres;
#   - a throwaway client image FROM it, adding the `other` fixture app with
#     FEATHERBASE_APP_PATHS, discovers `other`.
#
# Scope is limited by `paths:` to the build inputs: the Dockerfile, the
# lockfiles and manifests, the image workflows and this check's own files.
# Source changes under apps/ are covered by test.yml, not here.
name: image-check

on:
  pull_request:
    paths:
      - apps/server/Dockerfile
      - .dockerignore
      - pnpm-lock.yaml
      - '**/package.json'
      - '**/package-lock.json'
      - .github/workflows/publish-image.yml
      - .github/workflows/image-check.yml
      - .github/image-check/**
      - runtime-apps/other/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Throwaway values for a database created and destroyed with this job.
  FEATHERBASE_ENV: staging
  JWT_SECRET: image-check-throwaway-secret-not-used-anywhere-else-000000000000
  INSTANCE_ADDRESSES: '[{"address":"https://featherbase.example.test","opens":"admin","emails":true}]'
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/featherbase

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featherbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      # Reads the cache publish-image.yml writes on main; never writes one, so
      # pull requests cannot change what main's publish builds from.
      - name: Build the platform target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: platform
          load: true
          push: false
          tags: featherbase-platform:ci
          cache-from: type=gha,scope=platform-image

      - name: Build the default target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          push: false
          tags: featherbase-default:ci
          cache-from: type=gha,scope=platform-image

      # `app_paths` prints the image's FEATHERBASE_APP_PATHS, or `unset`.
      - name: The platform image holds no app
        run: |
          app_paths=$(docker image inspect featherbase-platform:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^FEATHERBASE_APP_PATHS=//p')
          [ -z "$app_paths" ] || { echo "platform image sets FEATHERBASE_APP_PATHS=$app_paths"; exit 1; }
          if docker run --rm featherbase-platform:ci test -e /app/runtime-apps; then
            echo "platform image has /app/runtime-apps"; exit 1
          fi
          echo "platform image: no /app/runtime-apps, no FEATHERBASE_APP_PATHS"

      - name: The default image still holds Tasker
        run: |
          app_paths=$(docker image inspect featherbase-default:ci --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^FEATHERBASE_APP_PATHS=//p')
          expected='["/app/runtime-apps/tasker"]'
          [ "$app_paths" = "$expected" ] || { echo "FEATHERBASE_APP_PATHS=$app_paths, expected $expected"; exit 1; }
          for app in tasker; do
            for file in package.json featherbase.json dist; do
              docker run --rm featherbase-default:ci test -e "/app/runtime-apps/$app/$file" || { echo "missing /app/runtime-apps/$app/$file"; exit 1; }
            done
          done
          echo "default image: Tasker present; FEATHERBASE_APP_PATHS=$app_paths"

      # --network host: the Postgres service listens on the runner's 5432.
      - name: The platform image releases and passes boot-check
        run: |
          run() { docker run --rm --network host -e FEATHERBASE_ENV -e JWT_SECRET -e INSTANCE_ADDRESSES -e DATABASE_URL "$@"; }
          run featherbase-platform:ci pnpm --filter server release
          run featherbase-platform:ci pnpm --filter server cli boot-check

      - name: A client image FROM the platform image discovers its app
        run: |
          context="$RUNNER_TEMP/client-image"
          mkdir -p "$context"
          cp .github/image-check/Dockerfile .github/image-check/discover-check.mts "$context/"
          cp -R runtime-apps/other "$context/other"
          # The `default` builder (the Docker engine's own) sees the image
          # loaded above; the container builder setup-buildx made current
          # would look for it in a registry instead.
          docker buildx build --builder default --load --build-arg PLATFORM_IMAGE=featherbase-platform:ci -t featherbase-client:ci "$context"
          docker run --rm --network host -e FEATHERBASE_ENV -e JWT_SECRET -e INSTANCE_ADDRESSES -e DATABASE_URL -e EXPECT_APPS=other \
            featherbase-client:ci pnpm --filter server exec tsx /app/discover-check.mts
