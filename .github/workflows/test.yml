# CI: static checks, the unit/component suites and the Playwright e2e suite,
# in parallel jobs.
#
# Each job that touches a database gets its own Postgres service container
# (17; the preflight job, 18). The service's POSTGRES_DB/POSTGRES_USER env
# replaces the role/database bootstrap that init.sh performs on a developer
# machine (init.sh assumes brew or pg_ctlcluster, neither of which applies
# here). Everything else the app needs in the database is created by
# `pnpm --filter server migrate`, exactly as init.sh runs it;
# the RLS suite creates its own login role for the run. The e2e specs seed
# their own documents.
#
# Shape of the gate. `changes` (tools/ci-scope.mjs) picks the suites a PR needs
# from its paths; everything runs on main and on whatever it cannot place:
#
#   changes ──> checks ───────────────────────┐
#           ──> unit-server 1/3, 2/3, 3/3 ────┤
#           ──> release-preflight-pg18 ───────┼──> unit
#           ──> unit-web ─────────────────────┤
#           ──> app-tests ────────────────────┤
#           ──> e2e ──> coverage-merged ──────┘
#
#   docs and prose      checks' fast half only
#   client-apps/**      app-tests: the app's tests and platform tests
#   example-apps/**     app-tests: Tasker's own layers
#   apps/server/**      platform checks, server suite, preflight, client platform tests
#   apps/web/**         platform checks, web suite, e2e, merged coverage
#   anything else       everything
#
# `unit` and `e2e` are required by the ruleset on main, so they must report on
# every PR: never put a workflow-level `paths` filter here. A job skipped by its
# own `if` counts as passing. If `changes` fails its outputs are empty, and every
# `!= 'false'` below then runs its suite: that is how this fails closed.
#
# Coverage gates apply only where what they measure ran. The server gate merges
# the three shards and the preflight, which share one switch, and is skipped with
# them. coverage-merged needs both unit-web and e2e. Each suite's own floor stays
# inside its job. Labels: `run-all` for everything, `run-e2e` for e2e alone.
name: test

on:
  pull_request:
    # `labeled` so that adding `run-e2e` to a PR re-runs CI with e2e. A
    # re-run of an older run would not see the label: it replays that run's
    # original event payload.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # A new push to a PR supersedes the old run. On main every commit is a
  # deploy (prod auto-deploys from main), so every commit gets its own full
  # run, e2e included. A shared group would not guarantee that even without
  # cancel-in-progress: GitHub keeps one PENDING run per group, so a third
  # quick merge would replace the second's queued run. Hence the run id.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Matches the default in apps/server/src/config.ts and init.sh.
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/featherbase
  # The mock OAuth provider is opt-in and fails closed: absence of
  # configuration must never enable it, because /api/oauth/mock/consent is
  # pre-auth and mints a session for any email, `Administrator` included.
  # The e2e specs drive that mock, so CI opts in explicitly — exactly as
  # init.sh does for a developer machine. Never set this in a deployment.
  ALLOW_MOCK_OAUTH: '1'

jobs:
  # Decides what runs: tools/ci-scope.mjs holds the rules and their tests.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform_checks: ${{ steps.decide.outputs.platform_checks }}
      server: ${{ steps.decide.outputs.server }}
      web: ${{ steps.decide.outputs.web }}
      e2e: ${{ steps.decide.outputs.e2e }}
      client_apps: ${{ steps.decide.outputs.client_apps }}
      tasker_tests: ${{ steps.decide.outputs.tasker_tests }}
      coverage_merged: ${{ steps.decide.outputs.coverage_merged }}
    steps:
      # A PR checks out its merge commit, whose first parent is the base
      # branch tip — so HEAD^1..HEAD is exactly what merging would change.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # --no-renames: a move out of apps/ must count against apps/ as well.
      - name: Decide what runs
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          git diff --no-renames --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          node tools/ci-scope.mjs < "$RUNNER_TEMP/changed"

  # Everything that needs no database: spec/catalog/guard validations and
  # both typechecks. The fast half runs on every PR; building the apps and the
  # typechecks only when the platform changed.
  checks:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The whole history: the version check needs where the PR forked from main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `version` input: pnpm/action-setup reads the `packageManager`
      # field from package.json, so the CI pnpm always matches the repo.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repository-pinned OpenSpec validates both main capabilities and
      # active changes strictly.
      - name: Validate behavior specifications
        run: pnpm check:specs

      - name: Validate E2E suite uses DSL fixtures
        run: pnpm check:e2e-dsl

      # This repository is public. Covers tracked text files only: Aadhaar-like
      # numbers (Verhoeff-valid), Indian mobile numbers and client-domain
      # emails. It does NOT catch names, employee codes, statistics or binary
      # files (pdf/xlsx/docx/images) — those rely on review. Synthetic values
      # are listed in tools/check-sensitive.allow.
      - name: Check for personal data in tracked files
        run: pnpm check:sensitive

      # Retired product words (e.g. "Desk" for the Admin screen) must not creep
      # back into app sources, specs or docs. The list lives at the top of
      # tools/check-vocabulary.mjs.
      - name: Check for retired vocabulary
        run: pnpm check:vocabulary

      # The platform never imports app code (ADR 0011, ADR 0014): source under
      # apps/server/src, apps/web/src and packages/*/src must not load anything
      # from example-apps/, client-apps/ or test-apps/. Tests may.
      - name: Platform source imports no app code
        run: pnpm check:platform-imports

      - name: The dev command's rules
        run: pnpm check:dev

      # publish-image.yml labels the platform image with these versions.
      - name: Platform versions read from the code
        run: node --test tools/platform-versions.test.mjs

      - name: What runs in CI, by path
        run: node --test tools/ci-scope.test.mjs

      - name: The version check's rules
        run: node --test tools/check-app-versions.test.mjs

      # ADR 0014 section 4. On main there is nothing to compare with.
      - name: An app version change goes above main's
        if: ${{ github.event_name == 'pull_request' }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/check-app-versions.mjs --main origin/main --head "$HEAD_SHA"

      - name: Build independent runtime test packages
        if: ${{ needs.changes.outputs.platform_checks != 'false' }}
        run: pnpm apps:prepare

      - name: Typecheck server
        if: ${{ needs.changes.outputs.platform_checks != 'false' }}
        run: pnpm --filter server typecheck

      # src/env.ts is the only server module that reads process.env, and the
      # DEPLOY.md variable table and apps/server/.env.example are generated
      # from it (instance-settings-as-code D6, #465).
      - name: Only env.ts reads process.env
        run: pnpm --filter server lint:env

      - name: Generated variable docs are current
        run: pnpm --filter server check:env

      - name: Typecheck web
        if: ${{ needs.changes.outputs.platform_checks != 'false' }}
        run: pnpm --filter web typecheck

  # The server suite, split by file across three runners. Each shard has its
  # own Postgres and MySQL, so the reasons the suite runs files one at a time
  # (one shared database, one `background_job` queue) do not cross shards.
  #
  # Coverage thresholds are zeroed HERE because a shard only sees its share
  # of the files and would fail the floor on partial coverage. Each shard
  # writes a Vitest blob report carrying its raw coverage; the `unit` job
  # merges them and enforces the real thresholds from vitest.config.ts.
  unit-server:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      # sources-mysql.test.ts runs only when this is set (checkouts without a
      # MySQL skip it); CI provides one so the mysql driver is exercised.
      MYSQL_TEST_URL: mysql://root@127.0.0.1:3306
      # Every database records the environment that migrated it, and a run
      # whose environment disagrees is refused (src/db-environment.ts). The
      # migrate step below and the suites must therefore agree, and Vitest
      # sets NODE_ENV=test for the suites on its own — so the MIGRATION is
      # what needs telling. Without this it would stamp 'development' and the
      # very next step would (correctly) refuse to run against it.
      #
      # The service database is named `featherbase` rather than
      # `featherbase_test`, which does not matter here: this container is
      # created for this job and destroyed with it, so it IS the test
      # database. The name-based separation exists to protect a developer's
      # long-lived machine, where the two live side by side.
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featherbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # The version the motivating deployment runs on RDS (8.4).
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build independent runtime test packages
        run: pnpm apps:prepare

      # The server suite renders real PDFs (test/print-pdf.test.ts →
      # src/print.ts), which launches Chromium through the server's own
      # `playwright` dependency. CHROMIUM_PATH stays unset so Playwright
      # resolves the browser it installed itself (docs/DEPLOY.md, `CHROMIUM_PATH`).
      - name: Install Chromium for server-side PDF tests
        run: pnpm --filter server exec playwright install --with-deps chromium

      - name: Migrate database
        run: |
          pnpm --filter server migrate

      # The suite's config pins fileParallelism: false and a shared
      # globalSetup that empties tab_background_job — do not parallelize
      # around them within a shard.
      - name: Run server suite shard ${{ matrix.shard }}/3 with coverage
        run: >-
          pnpm --filter server exec vitest run --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
          --shard=${{ matrix.shard }}/3
          --reporter=default --reporter=blob
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json

      # upload-artifact skips dot-directories unless told otherwise.
      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-blob-${{ matrix.shard }}
          path: apps/server/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Prove app authorization across real commit and lock waits
        if: matrix.shard == 1
        run: |
          createdb --maintenance-db="$DATABASE_URL" featherbase_issue279_access_commit_e2e
          export DATABASE_URL="${DATABASE_URL%/*}/featherbase_issue279_access_commit_e2e"
          pnpm --filter server migrate
          APP_ACCESS_COMMIT_PROOF=1 pnpm --filter server test test/app-access-commit.test.ts

      # #544: the other committed-concurrency proofs, each on its own
      # disposable database (vitest.config.ts refuses any other name). The
      # workflow proof is not here: its guard requires a database server on
      # the loopback address, and CI's runs in a service container (#544).
      - name: Prove runtime actions, the Tasker upgrade and the settings lock across real commits
        if: matrix.shard == 3
        run: |
          for db in featherbase_ci_actions_commit_e2e featherbase_ci2_actions_commit_e2e featherbase_ci_settings_commit_e2e; do
            createdb --maintenance-db="$DATABASE_URL" "$db"
            DATABASE_URL="${DATABASE_URL%/*}/$db" pnpm --filter server migrate
          done
          DATABASE_URL="${DATABASE_URL%/*}/featherbase_ci_actions_commit_e2e" RUNTIME_ACTION_COMMIT_PROOF=1 pnpm --filter server test test/runtime-actions-commit.test.ts
          DATABASE_URL="${DATABASE_URL%/*}/featherbase_ci2_actions_commit_e2e" TASKER_UPGRADE_ACTION_PROOF=1 pnpm --filter server test test/tasker-upgrade-action-commit.test.ts
          DATABASE_URL="${DATABASE_URL%/*}/featherbase_ci_settings_commit_e2e" SETTINGS_LOCK_COMMIT_PROOF=1 pnpm --filter server test test/managed-settings-commit.test.ts

  # The web component suite (it runs the server in-process against its own
  # database) and the shared package, each against its own coverage floor.
  unit-web:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featherbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The design-system ratchet (test/design-guards.test.ts) compares the
      # pending pins with origin/main's; without this ref it silently skips.
      - name: Fetch main for the design-system ratchet
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build independent runtime test packages
        run: pnpm apps:prepare

      - name: Migrate database
        run: |
          pnpm --filter server migrate

      # `test:coverage` REPLACES the plain `test` rather than being added
      # beside it: instrumenting a suite once costs about 15% of wall clock
      # (measured back to back — web 18s→22s, shared under a second either
      # way), where running it twice would cost 100%. Each config carries a
      # `coverage.thresholds` floor that only ever rises (#226); Vitest exits
      # non-zero when a suite falls below its floor, so a coverage regression
      # fails this job exactly like a failing test does.
      - name: Run shared and web suites with coverage
        run: |
          pnpm --filter shared test:coverage
          pnpm --filter web test:coverage
          npm run test:coverage --prefix example-apps/tasker

      - name: Collect runtime component coverage against the real server
        run: pnpm --filter web exec vitest run --config ../../tools/vitest.runtime-components.config.ts

      - name: Upload component and runtime unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: component-coverage
          path: |
            apps/web/.nyc_output/jsdom.json
            coverage/tasker/unit/coverage-final.json
            coverage/tasker/components/coverage-final.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The verdict for the unit layer, under the name the ruleset requires. A job
  # may be skipped only if `changes` said so. Merging needs no database: Vitest
  # replays the shards' results and coverage from their blob reports without
  # running globalSetup.
  unit:
    needs: [changes, checks, unit-server, unit-web, release-preflight-pg18, app-tests, coverage-merged]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fail if a check or suite failed, or skipped when it should have run
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT_SERVER: ${{ needs.unit-server.result }}/${{ needs.changes.outputs.server }}
          PREFLIGHT: ${{ needs.release-preflight-pg18.result }}/${{ needs.changes.outputs.server }}
          UNIT_WEB: ${{ needs.unit-web.result }}/${{ needs.changes.outputs.web }}
          APP_TESTS: ${{ needs.app-tests.result }}/${{ needs.changes.outputs.client_apps == 'false' && needs.changes.outputs.tasker_tests == 'false' && 'false' || 'true' }}
          COVERAGE_MERGED: ${{ needs.coverage-merged.result }}/${{ needs.changes.outputs.coverage_merged }}
        run: |
          status=0
          for name in UNIT_SERVER PREFLIGHT UNIT_WEB APP_TESTS COVERAGE_MERGED; do
            value=${!name}; result=${value%%/*}; wanted=${value#*/}
            echo "$name: $result (wanted: ${wanted:-unknown, so yes})"
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$wanted" = false ]; }; then continue; fi
            status=1
          done
          echo "CHECKS: $CHECKS"
          [ "$CHECKS" = success ] || status=1
          exit $status

      # Only a run of the server suite has shards to merge. The preflight's report
      # alone would read as far below the floor.
      - uses: actions/checkout@v4
        if: ${{ needs.unit-server.result == 'success' }}

      - uses: pnpm/action-setup@v4
        if: ${{ needs.unit-server.result == 'success' }}

      - uses: actions/setup-node@v4
        if: ${{ needs.unit-server.result == 'success' }}
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: ${{ needs.unit-server.result == 'success' }}
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        if: ${{ needs.unit-server.result == 'success' }}
        with:
          pattern: server-blob-*
          path: apps/server/.vitest-reports
          merge-multiple: true

      # Fails below the server's coverage.thresholds, exactly as the
      # unsharded `test:coverage` did.
      - name: Merge server shards and enforce coverage thresholds
        if: ${{ needs.unit-server.result == 'success' }}
        env:
          # Keep the driver in the denominator. Merging never connects.
          MYSQL_TEST_URL: mysql://root@127.0.0.1:3306
        run: pnpm --filter server exec vitest run --merge-reports=.vitest-reports --coverage

  # Production runs PostgreSQL 18.6, where the release preflight has checks
  # that only exist there (publish_generated_columns, #399). The full suite
  # stays on 17 above; this job runs the release preflight on 18. Its coverage
  # joins the server gate, so it shares the server suite's switch.
  release-preflight-pg18:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featherbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build independent runtime test packages
        run: pnpm apps:prepare

      - name: Migrate database
        run: |
          pnpm --filter server migrate

      - name: Run the release preflight suite on PostgreSQL 18 with coverage
        run: >-
          pnpm --filter server exec vitest run test/release-preflight.test.ts --coverage
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
          --reporter=default --reporter=blob
          --outputFile.blob=.vitest-reports/release-pg18.json

      - name: Upload PostgreSQL 18 coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-blob-pg18
          path: apps/server/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The apps' own tests, apart from the platform's suites. Client apps: their
  # tests and platform tests, on the PostgreSQL production runs. Tasker: its unit
  # tests, the server and web tests that name it, its runtime components and its
  # packaged journeys; on main and on web PRs the full suites run those instead.
  app-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.client_apps != 'false' || needs.changes.outputs.tasker_tests == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featherbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build independent runtime test packages
        run: pnpm apps:prepare

      - name: Migrate database
        env:
          NODE_ENV: test
        run: pnpm --filter server migrate

      - name: Run Feather Dash's tests (client-apps/jeyarama/dash)
        if: ${{ needs.changes.outputs.client_apps != 'false' }}
        run: npm test --prefix client-apps/jeyarama/dash

      - name: Run Feather Dash's platform tests (client-apps/jeyarama/dash)
        if: ${{ needs.changes.outputs.client_apps != 'false' }}
        env:
          NODE_ENV: test
        run: npm run test:platform --prefix client-apps/jeyarama/dash

      - name: Run Tasker's unit tests with coverage
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        run: npm run test:coverage --prefix example-apps/tasker

      - name: Run the server and web tests that name an example app
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        env:
          NODE_ENV: test
        run: |
          (cd apps/server && pnpm exec vitest run $(git grep -lE 'example-apps|tasker-client' -- 'test/*.test.ts'))
          (cd apps/web && pnpm exec vitest run $(git grep -lE 'example-apps' -- 'test/*.test.ts' 'test/*.test.tsx'))

      - name: Run Tasker's runtime components against the real server
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        env:
          NODE_ENV: test
        run: pnpm --filter web exec vitest run --config ../../tools/vitest.runtime-components.config.ts

      # Its collector refuses a build without coverage; apps:prove below rebuilds.
      - name: Run Tasker's HTTP tests
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        run: |
          VITE_COVERAGE=true npm run build --prefix example-apps/tasker
          pnpm --filter server exec vitest run --config ../../example-apps/tasker/vitest.integration.config.ts

      - name: Install Playwright Chromium
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        run: pnpm --filter web exec playwright install --with-deps chromium

      # As in e2e: the development seed needs a truly loopback PostgreSQL.
      - name: Start loopback PostgreSQL for the packaged seed proof
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          PG_BIN=$(dirname "$(find /usr/lib/postgresql -name initdb | sort -V | tail -1)")
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/runtime-proof-pg" -U postgres --auth=trust
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/runtime-proof-pg" -l "$RUNNER_TEMP/runtime-proof-pg.log" -o "-h 127.0.0.1 -p 5433 -k $RUNNER_TEMP" -w start

      - name: Prove packaged runtime journeys
        if: ${{ needs.changes.outputs.tasker_tests == 'true' }}
        env:
          RUNTIME_PROOF_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/featherbase_runtime_proof_e2e
        run: pnpm apps:prove

  # Fails closed: if `changes` itself failed, e2e runs rather than reporting
  # a passing `skipped`.
  e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.e2e != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: featherbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build independent runtime test packages
        run: pnpm apps:prepare

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      # No migrate step and no boot step: in isolated mode
      # (E2E_ISOLATED=1, set by the `e2e` script) Playwright owns the whole
      # stack. It resets its own database, migrates it, then
      # starts the API and web servers on their own ports and tears them down
      # after. Booting a second stack here would only race with that one.

      # playwright.config.ts pins workers: 1 (specs share one server and
      # database) — keep it. The trace flag is CI-only so failures leave
      # something inspectable in test-results/ for the artifact below.
      - name: Run e2e suite with coverage
        run: pnpm --filter web coverage:e2e --trace retain-on-failure

      # The specs' fenced Gherkin, run by cucumber-js (#738). It boots its own
      # stack on its own database and ports (acceptance-tests/support/stack.js),
      # so it runs after the e2e suite rather than beside it.
      - name: Run acceptance suite
        run: |
          npm --prefix acceptance-tests ci
          npm --prefix acceptance-tests test

      - name: Upload acceptance report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-report
          path: acceptance-tests/reports/
          if-no-files-found: ignore

      - name: Collect runtime HTTP coverage
        run: >-
          pnpm --filter server exec vitest run
          --config ../../example-apps/tasker/vitest.integration.config.ts

      # The development seed checks PostgreSQL's actual server address.
      # Docker port forwarding is not loopback from PostgreSQL's perspective.
      - name: Start loopback PostgreSQL for the packaged seed proof
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql
          PG_BIN=$(dirname "$(find /usr/lib/postgresql -name initdb | sort -V | tail -1)")
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/runtime-proof-pg" -U postgres --auth=trust
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/runtime-proof-pg" -l "$RUNNER_TEMP/runtime-proof-pg.log" -o "-h 127.0.0.1 -p 5433 -k $RUNNER_TEMP" -w start

      - name: Prove packaged runtime journeys with coverage
        env:
          VITE_COVERAGE: 'true'
          RUNTIME_PROOF_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/featherbase_runtime_proof_e2e
        run: pnpm apps:prove

      - name: Upload runtime integration coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-integration-coverage
          path: |
            coverage/tasker/integration/
            coverage/tasker/packaged/
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-coverage
          path: apps/web/.nyc_output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # #642: frame policies are response headers, which only the API server
      # serving the BUILT web app sets (the stack above serves pages from the
      # Vite dev server). playwright.served.config.ts builds the app and owns
      # its own database, port and local embed stand-in.
      - name: Run served e2e (frame policy on real response headers)
        run: pnpm --filter web e2e:served --trace retain-on-failure

      # No server-log step: Playwright pipes the API server's stdout/stderr
      # into its own output (webServer stdout: 'pipe'), so a boot failure is
      # already in the log above. The old step tailed /tmp files that this job
      # no longer creates.

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # One source-level web report, not separate component/browser percentages.
  # It reads artifacts from both suites, so `changes` only asks for it when both
  # run; main always runs both.
  coverage-merged:
    needs: [changes, unit-web, e2e]
    if: ${{ !cancelled() && needs.changes.outputs.coverage_merged != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful component and browser suites
        if: needs.unit-web.result != 'success' || needs.e2e.result != 'success'
        run: exit 1

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: component-coverage
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: browser-coverage
          path: apps/web/.nyc_output

      - uses: actions/download-artifact@v4
        with:
          name: runtime-integration-coverage
          path: coverage/tasker

      - name: Install runtime coverage reporter
        run: npm ci --prefix example-apps/tasker --no-audit --no-fund

      - name: Merge component and browser coverage
        run: pnpm --filter web coverage:merged

      - name: Merge runtime unit, HTTP, browser and packaged coverage
        run: >-
          npm run coverage:merged --prefix example-apps/tasker --
          --browser-dir "$PWD/apps/web/.nyc_output"
          "$PWD"/coverage/tasker/components/coverage-final.json
          "$PWD"/coverage/tasker/integration/*.json
          "$PWD"/coverage/tasker/packaged/*.json

      - name: Upload merged source coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: merged-source-coverage
          path: |
            apps/web/coverage-merged/
            coverage/tasker/merged/
          if-no-files-found: error
          retention-days: 7
