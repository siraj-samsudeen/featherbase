# Area labels, applied from file paths (ADR 0014 section 6).
area:platform:
  - changed-files:
      - any-glob-to-any-file: ['apps/**', 'packages/**']

area:example-apps:
  - changed-files:
      - any-glob-to-any-file: ['example-apps/**']

client:jeyarama:
  - changed-files:
      - any-glob-to-any-file: ['client-apps/jeyarama/**']
