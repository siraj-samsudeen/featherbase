schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform
context: |
  Featherbase is a metadata-driven low-code app platform (TypeScript monorepo:
  apps/server, apps/web, runtime apps such as Tasker). Specs are read by
  product people and new contributors, not just programmers.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
rules:
  specs:
    - Write for a product person. Plain words, short sentences. No code, table, column, endpoint, file or function names.
    - Describe what the user can do and what they see, not how the system does it.
    - Promise only what the user cares about. Do not list field defaults, every field, or values that could change without the user noticing.
    - One requirement per promise to the user. Keep scenarios to the few that show the promise, usually one to three.
    - Scenarios say "the user". Use a concrete example only where it makes the promise clearer.
    - Explain a term the first time it is used.
    - Name requirements and scenarios in plain words, for example "Capture a task", not identifiers.
    - Use only OpenSpec's own structure (Purpose, Requirements, WHEN/THEN scenarios). No status, evidence, ID or legacy labels.
  proposal:
    - Keep it short and say why in terms of what users get.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
