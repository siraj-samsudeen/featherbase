# The one schema for new changes, whatever mode they are built in: pnpm exec openspec new change <name>.
# The mode (autopilot, build, learning) is session state, never recorded in the change (the
# change-modes skill). Changes created before this template keep their spec-driven schema.
schema: intent-driven-with-human-control
stack: javascript

# Injected into every artifact's instructions, subagents included.
context: |
  Featherbase is a metadata-driven low-code app platform (TypeScript monorepo:
  apps/server, apps/web, runtime apps such as Tasker). Specs are read by
  product people and new contributors, not just programmers.

  Every change is built in one of three modes, chosen in the session and
  switchable at any time; the mode is never written into the change. In every
  mode a spec's scenarios are fenced Gherkin that
  cucumber-js runs as the acceptance tests (spec-as-source skill); the mode
  decides only who builds and where the human stops. Autopilot (subagents
  build), build (the default: one stop per test for the human's
  prediction, red/green/refactor as separate commits, outside-in-tdd skill)
  and learning (build, plus every command shown and explained before it
  runs). Load the change-modes skill for how to choose and switch a
  mode, the defaults that are never asked (Mermaid diagrams, MADR-minimal
  ADRs in docs/adr/, the javascript acceptance stack), and the git flow: a
  change is one branch and one PR from proposal to archive - the PR opens once
  the planning artifacts are approved, the build continues on the same branch,
  and the change is archived as the branch's last step before it merges. Do not stop just to ask whether to continue to the next artifact.

  Where a schema template or a generic skill conflicts with the rules below
  (for example ADRs being immutable), the rules
  below win.

# Per-artifact rules. They apply to every change, whatever its schema. A line that applies to
# one mode only says so first ("Autopilot only - ...") and applies when the session is in that
# mode.
rules:
  proposal:
    - Keep it short and say why in terms of what users get.
    - List the capabilities (New, then Modified) in the order a person meets them in the user journey. The acceptance suite runs the change's scenarios, and records review videos, in that order.
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    # - Must use adversarial-authoring skill - only with the owner's consent (CLAUDE.md § Review guidelines)
  design:
    - Holds only design decisions. A decision has a real alternative a good engineer might pick, and picking wrong is costly (data shape, an API contract, security, or hard to undo once shipped). The spec restated goes nowhere; plain implementation goes in tasks; agreed UI details go in the UI checklist. Each decision names the alternative rejected and why.
    - Present each decision to the owner on its own, for approval, before committing the design.
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    - Must use c4-diagrams skill - Mermaid, lightweight C4-inspired; do not ask
  adr:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    - Must use architectural-decision-records skill
    - ADRs live in docs/adr/ and are not append-only (ADR 0014) - an ADR that stops matching the code is corrected in place with a dated note, and deleted once its content lives somewhere better. This wins over the skill's "never rewrite" advice.
  specs:
    - Write for a product person. Plain words, short sentences. No code, table, column, endpoint, file or function names.
    - Write from the user's side. Say what the user can do and what they get.
    - Tell the user what they benefit from knowing, including what the system does for them, in their words. Leave out incidental detail such as field defaults, every field, or internal mechanics.
    - "Example: 'Typing a title and pressing Enter is all it takes to record a task. The task gets added to the Inbox for later processing.' Not a list of the fields a new task starts with."
    - One requirement makes one promise, in one or two short sentences. If it needs more, it holds several promises (split them) or repeats what the Purpose already says (cut it). Keep scenarios to the few that show the promise, usually one or two.
    - Don't state the obvious, such as "looking at a list changes nothing".
    - A scenario gives a concrete example the reader can try; it does not repeat the requirement. Scenarios say "the user".
    - No screen labels, button text or placeholder text; they change with the UI.
    - Don't write out lists that can grow, such as every page in the navigation. State the promise and name one or two examples.
    - No layout detail, such as where a panel opens or a pixel width. Product-wide promises (works on a phone, works by keyboard, nothing shown by colour alone, controls clearly named) live in the usable-on-any-device spec; don't repeat them in feature specs.
    - Explain a term the first time it is used.
    - Name requirements and scenarios in plain words, for example "Capture a task", not identifiers. A capability with one requirement names it after the capability.
    - Use only OpenSpec's own structure (Purpose, Requirements, Scenarios). Each scenario's steps go in a fenced gherkin block (Given/When/Then); the requirement text stays outside it. No status, evidence, ID or legacy labels.
    - Order requirements as a person meets them. Within a requirement, the common case comes first, then the edge cases.
    - Run one example (one table, one person) through every scenario of a change, so each scenario differs from the last by one fact.
    - Name a scenario by what the user sees, for example "Remarks shows only for me", not by the action taken.
    - Before the specs are approved, an independent reviewer (a subagent given the specs and the issue, not the author's view) checks they are MECE - no promise made twice, within the change or against the main specs, and none missing.
    - A spec written for existing behavior describes what it does today. Changing that behavior is a separate change.
    - Main specs describe what is built. A promise that isn't built yet belongs in an OpenSpec change.
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    - Must use spec-as-source skill
  tasks:
    - Must use grill-me skill - one decision per question, showing the text it will write into the artifact (paraphrased is fine), with the alternatives
    - Must use spec-as-source skill - each scenario's outer test is its fenced Gherkin, run by cucumber-js
    - Every mode - keep the schema's test-list format; autopilot runs the same list. The acceptance-tests/ setup and each step definition arrive in the red/green of the first outer test that needs them, not as setup tasks

# Per-operation guidance for apply and archive.
operations:
  apply:
    guidance:
      - Must use test-driven-development skill
      - Autopilot only - use the senior-qa sub-agent for the outer (acceptance) tests and the senior-dev sub-agent for inner tests and all src work, working down the test list. Do not batch the tasks to save calls; call them as many times as needed in small batches, as dev and qa work may interleave. Several changes may run in parallel worktrees with the openspec-bulk-apply-change skill
      - Build and learning only - follow the schema's apply instruction (outside-in-tdd skill); do the work in the main session, never hand it to sub-agents
      - Apply on the change's own branch, in the same PR as its planning artifacts (one PR per change, the change-modes skill)
  archive:
    guidance:
      - Must run OpenSpec Sync before archiving
      - Archive on the change's branch, as its last step before the PR merges
